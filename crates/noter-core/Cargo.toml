[package]
name = "noter-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Noter core's composition root: implements CoreApi, owns the app state, whole-state versions, the stream hub and the local log. Tauri-free."
publish = false

[features]
# For noter-core-harness only (`noter_core::testing`); src-tauri never enables it.
harness = []

[dependencies]
noter-db = { path = "../noter-db" }
noter-protocol = { path = "../noter-protocol" }
serde = "1"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt"] }
ulid = "3"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
