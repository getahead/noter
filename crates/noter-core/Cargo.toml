[package]
name = "noter-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Noter core's composition root: implements CoreApi, owns the app state, whole-state versions, the stream hub and the local log. Tauri-free."
publish = false

[features]
# For noter-core-harness only (`noter_core::testing`); src-tauri never enables it.
harness = []

[dependencies]
noter-db = { path = "../noter-db" }
noter-engine-client = { path = "../noter-engine-client" }
noter-llm = { path = "../noter-llm" }
noter-protocol = { path = "../noter-protocol" }
serde = "1"
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt"] }
ulid = "3"

[dev-dependencies]
# The localhost-only fetcher for the model-source tests; never in a release build.
noter-llm = { path = "../noter-llm", features = ["local-tests"] }
# The harness hooks (`noter_core::testing`) are tested here too.
noter-core = { path = ".", features = ["harness"] }
tempfile = "3"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

# Perf scenarios (harness/perf.toml); `test = true` runs their one-round tests in `cargo test`.
[[example]]
name = "perf_cold_start"
test = true
