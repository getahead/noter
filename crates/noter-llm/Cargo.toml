[package]
name = "noter-llm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The egress gate and the LLM runtimes: the only crate allowed to reach the network. The model-download allow-list and range fetcher, the LlmRuntime router, redaction and the audit-before-send gate."
publish = false

[dependencies]
noter-db = { path = "../noter-db" }
noter-protocol = { path = "../noter-protocol" }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
ulid = "3"

[features]
# `RangeFetcher::for_local_tests` for other crates' tests (dev-dependencies only).
local-tests = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util", "time"] }
