[package]
name = "noter-llm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The egress gate and, later, the LLM runtimes: the only crate allowed to reach the network. In M0, the model-download allow-list and an HTTP range fetcher."
publish = false

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
