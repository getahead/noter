[package]
name = "noter-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "noter-mcp: the MCP stdio server one runtime run starts. It forwards tool calls to the core over its 0600 Unix socket; no database, no network port."
publish = false

[dependencies]
noter-protocol = { path = "../noter-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "net"] }

[dev-dependencies]
noter-core = { path = "../noter-core", features = ["harness"] }
noter-db = { path = "../noter-db" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time", "process", "io-util", "net"] }
