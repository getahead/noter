[package]
name = "noter-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "macOS services for the core: permission states and prompts, the environment (displays, output route, notifications, reachability, free disk) and the login item. Plain functions over noter-protocol types; on other systems they report nothing granted."
publish = false

[dependencies]
noter-protocol = { path = "../noter-protocol" }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = "0.3"
objc2-core-audio = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-event-kit = "0.3"
objc2-foundation = "0.3"
objc2-service-management = "0.3"
objc2-user-notifications = "0.3"
system-configuration = "0.8"
