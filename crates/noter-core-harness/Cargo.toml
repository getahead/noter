[package]
name = "noter-core-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Test binary: the Noter core without Tauri over JSON Lines on stdio, for the conformance suite and the UI E2E flows (docs/HARNESS.md). Never shipped."
publish = false

[dependencies]
noter-core = { path = "../noter-core", features = ["harness"] }
noter-engine-client = { path = "../noter-engine-client" }
noter-protocol = { path = "../noter-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["time"] }
