# Quality gates on every pull request and on main (docs/ADR/0003, docs/HARNESS.md).
# Branch protection requires the single `gate` job; it fails if any gate fails.
#
# A pull request runs only the jobs that check what it changes (`changes`, rules in
# harness.toml [ci]); main, the nightly and dispatched runs of main run every job.
# Labels never re-run this workflow: the label-gated checks live in pr.yml (`hygiene`).
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call:
    secrets:
      CF_STUDIO_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A new push to a PR replaces its run; runs on main queue instead, so every merge is
  # checked in full (one run waits, a newer one replaces it) and main's caches get saved.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NOTER_BASE_REF: origin/main
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble

jobs:
  changes:
    name: What this change runs
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.c.outputs.jobs }}
      engine: ${{ steps.c.outputs.engine }}
      tauri: ${{ steps.c.outputs.tauri }}
      core_harness: ${{ steps.c.outputs.core_harness }}
      native_tests: ${{ steps.c.outputs.native_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: c
        run: python3 scripts/harness/ci_changes.py --workflow ci

  lint-rust:
    name: Rust format and lints
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['lint-rust']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - run: just lint-rust

  lint-ui:
    name: TypeScript type check
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['lint-ui']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - run: just lint-ui

  contract:
    name: Contract
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['contract']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just contract

  arch:
    name: Architecture checks and trace coverage
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['arch']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node: "false"
          cache: "false" # only `cargo metadata --no-deps`; nothing to build
      - run: just arch
      - name: Trace coverage (never lower than main)
        run: just trace

  unit:
    name: Unit tests and coverage (80%)
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['unit']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          tools: just,cargo-llvm-cov
      - run: just cov-unit
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: |
            coverage/unit
            apps/desktop/coverage/unit
          if-no-files-found: ignore

  e2e:
    name: End-to-end tests
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['e2e']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the core harness (real core over stdio)
        if: needs.changes.outputs.core_harness == 'true'
        run: |
          cargo build --locked -p noter-core-harness
          echo "NOTER_CORE_CMD=$PWD/target/debug/noter-core-harness --fixture world" >> "$GITHUB_ENV"
      - name: Browsers for the UI flows
        run: pnpm --dir apps/desktop exec playwright install --with-deps webkit
      - run: just e2e-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: coverage/e2e
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/desktop/playwright-report
          if-no-files-found: ignore

  e2e-coverage:
    name: E2E coverage (60%)
    # Judged over the Linux run and the macos job's XCUITest run together (stories and commands
    # proven against the built app count too, HARNESS.md); the two test jobs run in parallel.
    needs: [changes, e2e, macos]
    if: >-
      !cancelled() && fromJSON(needs.changes.outputs.jobs)['e2e-coverage'] && needs.e2e.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-logs
          path: coverage/e2e
      - name: XCUITest results from the macos job
        if: needs.changes.outputs.native_tests == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-native
          path: coverage/native
      - run: python3 scripts/harness/e2e_coverage.py

  visual:
    name: Screenshots (98% per pixel)
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['visual']
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      NOTER_IN_PW_CONTAINER: "1"
      HOME: /root
    steps:
      - run: command -v git >/dev/null || (apt-get update -q && apt-get install -y -q git)
      # Baseline changes need the owner's `visual-change-approved` label: pr.yml › approvals.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm pinned to the packageManager version; the container has no corepack-free alternative
      - run: npm install -g --silent pnpm@10.28.0 && pnpm install --frozen-lockfile # zizmor: ignore[adhoc-packages]
      - run: pnpm --dir apps/desktop test:visual
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          if-no-files-found: ignore

  perf:
    name: Performance (60% scenarios, <= 10% regression)
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['perf']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - run: sudo apt-get update -q && sudo apt-get install -y -q valgrind
      - run: just perf
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf
          path: target/perf
          if-no-files-found: ignore

  docs:
    name: Constructor Studio validate
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['docs']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch the pinned Constructor Studio core
        env:
          CF_STUDIO_TOKEN: ${{ secrets.CF_STUDIO_TOKEN }}
        run: scripts/ci/fetch-cf-studio.sh
      - run: python3 .cf-studio/.core/skills/studio/scripts/studio.py validate --local-only

  macos:
    name: macOS (engine, Tauri host, native UI tests)
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['macos']
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just,cargo-llvm-cov
      - name: Engine tests (WAV fixtures through the pipeline)
        if: needs.changes.outputs.engine == 'true'
        run: swift test --package-path engine --enable-code-coverage
      - name: Tauri host tests (handler parity, window capabilities)
        if: needs.changes.outputs.tauri == 'true'
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Native UI tests (XCUITest)
        if: needs.changes.outputs.tauri == 'true'
        run: just native
      - if: always() && needs.changes.outputs.tauri == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-native
          path: coverage/native
          if-no-files-found: ignore

  gate:
    name: gate
    if: always()
    needs: [changes, lint-rust, lint-ui, contract, arch, unit, e2e, e2e-coverage, visual, perf, docs, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every gate this change needs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EXPECTED: ${{ needs.changes.outputs.jobs }}
        run: python3 scripts/harness/ci_changes.py verdict
