# Refresh screenshot baselines for a PR, rendered in the same pinned container
# as the visual gate. Trigger: add the label `update-screenshots` to the PR.
# The bot commits the new baselines to the PR branch; review every changed
# image, then add `visual-change-approved` so the visual gate accepts them.
name: Update screenshots

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    if: github.event.label.name == 'update-screenshots' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - run: command -v git >/dev/null || (apt-get update -q && apt-get install -y -q git)
      # Checkout the immutable PR head commit; do not persist credentials from checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: npm install -g --silent pnpm@10.28.0 && pnpm install --frozen-lockfile # zizmor: ignore[adhoc-packages]
      - run: pnpm --dir apps/desktop test:visual:update
      - name: Commit changed baselines
        id: commit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "noter-ci"
          git config user.email "noter-ci@users.noreply.github.com"
          git add -A -- '**/__screenshots__/**'
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "test(visual): refresh screenshot baselines" -m "Rendered by the update-screenshots workflow in $HEAD_SHA."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Remove the label and re-run CI on the new commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          api -X DELETE "https://api.github.com/repos/$REPO/issues/$PR/labels/update-screenshots" >/dev/null || true
          # Pushes made with GITHUB_TOKEN do not start workflows; a dispatch does.
          if [ "$CHANGED" = "true" ]; then
            api -X POST "https://api.github.com/repos/$REPO/actions/workflows/ci.yml/dispatches" -d "{\"ref\":\"$BRANCH\"}" \
              || echo "::warning::Could not dispatch CI (it must exist on main first). Push any commit to the branch to re-run the checks."
          fi
