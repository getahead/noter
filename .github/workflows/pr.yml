# Pull request hygiene (docs/DELIVERY.md). Separate from the harness gate in
# ci.yml: these checks are about the change as a delivery unit, not about the
# product's quality bars, plus the checks that depend on the owner's labels.
# The `Default ruleset` requires the `hygiene` job.
#
# Everything here is cheap, so a title edit or a label re-runs it instead of CI:
# the dependency, cargo-deny and workflow checks run only when the files they
# check changed (`changes`, rules in harness.toml [ci]).
name: PR hygiene

on:
  pull_request:
    branches: [main]
    # edited: the title is checked again; labeled/unlabeled: an approval label takes effect without a push
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  # The Release PR: release.yml dispatches this on its branch (the workflow token starts no runs).
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  changes:
    name: What this change runs
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.c.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: c
        run: python3 scripts/harness/ci_changes.py --workflow hygiene

  title:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      # The squash commit takes the PR title, and release-please reads those commits
      # to choose the next version and write the changelog.
      - if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >-
            Start the subject in lower case, for example "feat(ui): add the call list".
      - name: PR title (dispatched run)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          title=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json title -q .title)
          echo "PR #$PR: $title"
          echo "$title" | grep -qE '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([^)]+\))?!?: [^A-Z]' \
            || { echo "::error::PR title is not a Conventional Commit: $title"; exit 1; }

  approvals:
    name: Owner approvals (gate config, lanes, screenshot baselines)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gate config guard and lane check
        env:
          EVENT_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ github.token }}
        run: PR_LABELS="$(scripts/ci/pr-labels.sh)" python3 scripts/harness/config_guard.py --base origin/main --lane-check
      - name: Baselines change only with the owner's approval
        env:
          EVENT_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_LABELS="$(scripts/ci/pr-labels.sh)"
          git rev-parse --verify --quiet origin/main >/dev/null || { echo "::error::origin/main not fetched"; exit 1; }
          changed=$(git diff --name-only "origin/main...HEAD" -- '**/__screenshots__/**')
          if [ -n "$changed" ] && ! echo ",$PR_LABELS," | grep -q ',visual-change-approved,'; then
            echo "::error::Screenshot baselines changed without the 'visual-change-approved' label:"; echo "$changed"; exit 1
          fi

  dependencies:
    name: Dependency review
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['dependencies']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails only on what this PR adds, so a new advisory against an old dependency
      # never turns an unrelated PR red (that is the nightly security job's business).
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || 'main' }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fail-on-severity: high
          fail-on-scopes: runtime, development
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0

  rust-deps:
    name: Rust licenses, bans and sources (cargo-deny)
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['rust-deps']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # Advisories change daily; they are checked nightly (security.yml) and by Dependabot.
          command: check
          command-arguments: licenses bans sources

  workflows:
    name: Workflow lint (actionlint, zizmor)
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['workflows']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: zizmor@1.31.0
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - run: zizmor --offline --min-severity low --format github .github

  hygiene:
    name: hygiene
    if: always()
    needs: [changes, title, approvals, dependencies, rust-deps, workflows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every hygiene check this change needs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EXPECTED: ${{ needs.changes.outputs.jobs }}
        run: python3 scripts/harness/ci_changes.py verdict
