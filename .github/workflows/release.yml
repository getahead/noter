# Releases (docs/DELIVERY.md › Releases). release-please reads the Conventional
# Commit subjects on main and keeps a Release PR open with the next version and
# its changelog. Merging that PR tags vX.Y.Z and creates the GitHub release; the
# jobs below then attach the macOS packages, the contracts and an SBOM, each
# with build provenance.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write   # dispatch the Release PR's checks
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # What the workflow token pushes starts no workflows, so the Release PR would get no checks.
      # workflow_dispatch is the exception: run the required ones on its branch from here, once
      # per head commit. No personal access token is needed (docs/DELIVERY.md › Releases).
      - name: Run the required checks on the Release PR
        if: steps.rp.outputs.releases_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --json number,headRefName,headRefOid \
                 -q '[.[] | select(.headRefName | startswith("release-please--"))][0] // empty | "\(.number) \(.headRefName) \(.headRefOid)"')
          if [ -z "$pr" ]; then echo "No open Release PR."; exit 0; fi
          read -r n branch sha <<< "$pr"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=gate" -q .total_count)
          if [ "$runs" != "0" ]; then echo "Release PR #$n already has checks on $sha."; exit 0; fi
          gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run codeql.yml -R "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run pr.yml -R "$GITHUB_REPOSITORY" --ref "$branch" -f pr="$n"
          gh workflow run review.yml -R "$GITHUB_REPOSITORY" --ref "$branch" -f pr="$n"
          echo "Dispatched gate, CodeQL, hygiene and review for Release PR #$n ($sha)." >> "$GITHUB_STEP_SUMMARY"

  assets:
    name: Contracts and SBOM
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The release is tagged on the commit this run was triggered by (the Release PR's merge).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Contracts bundle
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          mkdir -p dist
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf "dist/noter-contracts-${VERSION}.tar.gz" contracts
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/noter-${{ needs.release-please.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  macos:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/package-macos.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      release-tag: ${{ needs.release-please.outputs.tag }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  macos-upload:
    name: macOS packages to the release
    needs: [release-please, macos]
    if: needs.macos.outputs.artifact != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.macos.outputs.artifact }}
          path: dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
