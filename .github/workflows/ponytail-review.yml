# Advisory code-quality review of every pull request by the ponytail plugin (/ponytail-review).
# Not part of the required `gate` check: the review is a model's judgment, not a deterministic gate.
# A "Must fix" finding still blocks a FEATURE's definition of done (.cf-studio/config/AGENTS.md).
# Needs the ANTHROPIC_API_KEY repository secret.
name: Ponytail review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ponytail-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Ponytail review
    # Fork PRs get no secrets; drafts are not ready to review.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: https://github.com/DietrichGebert/ponytail.git
          plugins: ponytail@ponytail
          prompt: |
            /ponytail-review the changes of pull request #${{ github.event.pull_request.number }}
            (git diff origin/${{ github.event.pull_request.base.ref }}...HEAD).
            Post the full report as one PR comment with
            `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file <file>`.
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
