# Nightly: the full gate on main, plus the measurements that need real Apple
# Silicon (wall-clock performance, golden-set latency, real-app E2E) on the
# self-hosted runner (the development MacBook Pro since 18 Oct 2026; docs/DEVELOPMENT.md ›
# The Mac runner), while the repository variable NOTER_MAC_RUNNER is true.
name: Nightly

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  full-gate:
    uses: ./.github/workflows/ci.yml
    # A called workflow can only lower the caller's token, never raise it: grant what ci.yml's
    # jobs ask for (changes and e2e read runs, the coverage report comments), or the run never starts.
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write # flaky-register opens issues for retried native tests
    secrets:
      CF_STUDIO_TOKEN: ${{ secrets.CF_STUDIO_TOKEN }}
