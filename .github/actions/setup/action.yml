name: Noter toolchains
description: Rust (pinned by rust-toolchain.toml), just, Node 22 with pnpm, and the workspace dependencies.
inputs:
  rust:
    description: Install the Rust toolchain and cache
    default: "true"
  node:
    description: Install Node, pnpm and the workspace dependencies
    default: "true"
  tools:
    description: Extra cargo tools for taiki-e/install-action (comma separated)
    default: just
  cache:
    description: Restore build caches (off for release builds, so a poisoned cache cannot reach a shipped binary)
    default: "true"
runs:
  using: composite
  steps:
    - if: inputs.rust == 'true'
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    - if: inputs.rust == 'true' && inputs.cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # No shared-key: the key carries the job id, so each job restores its own build (clippy,
        # llvm-cov, perf...); one shared key was saved once by whichever job finished first.
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: ${{ inputs.tools }}
    - if: inputs.node == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
    - if: inputs.node == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
