name: Noter toolchains
description: Rust (pinned by rust-toolchain.toml), just, Node 22 with pnpm, and the workspace dependencies.
inputs:
  rust:
    description: Install the Rust toolchain and cache
    default: "true"
  node:
    description: Install Node, pnpm and the workspace dependencies
    default: "true"
  tools:
    description: Extra cargo tools for taiki-e/install-action (comma separated)
    default: just
  workspaces:
    description: Cargo workspaces to cache, rust-cache syntax ("path -> target"); empty means the root workspace only
    default: ""
  cache:
    description: Restore build caches (off for release builds, so a poisoned cache cannot reach a shipped binary)
    default: "true"
runs:
  using: composite
  steps:
    - if: inputs.rust == 'true'
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    - if: inputs.rust == 'true' && inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ inputs.workspaces }}
        # No shared-key: the key carries the job id, so each job restores its own build (clippy,
        # llvm-cov, perf...); one shared key was saved once by whichever job finished first.
        save-if: ${{ github.ref == 'refs/heads/main' }}
    # The release downloads install-action relies on can be down (8 Nov 2026: github.com 504 for
    # cargo-llvm-cov): then the same tools are built from crates.io, cached so that happens once.
    - id: tools-cache
      if: inputs.cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin
        key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-${{ inputs.tools }}
    - id: install
      continue-on-error: true
      uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
      with:
        tool: ${{ inputs.tools }}
    - if: steps.install.outcome == 'failure'
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        echo "::warning title=install-action failed::building $TOOLS from crates.io"
        for t in ${TOOLS//,/ }; do
          name="${t%@*}"
          command -v "$name" >/dev/null && continue
          if [ "$name" = "$t" ]; then cargo install --locked "$name"; else cargo install --locked "$name" --version "${t#*@}"; fi
        done
    - if: steps.install.outcome == 'failure' && inputs.cache == 'true' && github.ref == 'refs/heads/main' && steps.tools-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin
        key: ${{ steps.tools-cache.outputs.cache-primary-key }}
    - if: inputs.node == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
    - if: inputs.node == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
