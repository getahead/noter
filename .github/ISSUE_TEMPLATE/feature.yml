name: Feature request
description: Something Noter should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: refs
    attributes:
      label: Related PRD / DESIGN IDs
      description: "e.g. cpt-noter-seq-… (optional)"
