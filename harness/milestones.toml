# What each milestone delivers, for the E2E coverage gate (docs/ADR/0003).
# Source: PRD › Roadmap and milestones (DESIGN-core 4.1 points here; its old
# "Core implementation order" table was moved out of the design on 17 Oct).
#
# Every IPC command in contracts/ipc.manifest.json and every story
# (`cpt-noter-seq-*`) in docs/DESIGN.md is listed exactly once; the harness
# self-tests fail otherwise, so a new command or story must be placed here.
# The gate counts milestones up to and including harness.toml [milestone].current.

[M0]
why = "IPC host, app snapshot, settings, first run and permissions"
commands = [
  "app_snapshot", "stream_unsubscribe", "stream_ack", "banner_dismiss", "log_ui",
  "setup_status", "models_download", "permission_request", "self_test_run",
  "setup_set_call_display", "setup_set_audio_storage", "setup_set_step",
  "settings_get", "settings_update", "settings_unignore_app", "hotkeys_list", "hotkey_set", "hotkeys_reset",
  "glossary_list", "glossary_upsert", "glossary_remove", "update_install",
]
stories = [
  "cpt-noter-seq-first-run-complete-setup",
  "cpt-noter-seq-first-run-download-models",
  "cpt-noter-seq-settings-set-hotkeys",
]

