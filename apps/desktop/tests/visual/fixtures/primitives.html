<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harness self-test</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f7; --fg: #1d1d1f; --card: #ffffff; --accent: #007aff; --sep: #d2d2d7; --muted: #6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1e1e; --fg: #f5f5f7; --card: #2c2c2e; --accent: #0a84ff; --sep: #3a3a3c; --muted: #98989d; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: var(--bg); color: var(--fg); font: 13px/1.4 "DejaVu Sans", system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--sep); border-radius: 12px; padding: 16px; width: 520px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  button { font: inherit; border-radius: 6px; padding: 4px 12px; border: 1px solid var(--sep); background: var(--card); color: var(--fg); }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .meter { height: 6px; width: 200px; background: var(--sep); border-radius: 3px; overflow: hidden; }
  .meter > i { display: block; height: 100%; width: 62%; background: #34c759; }
  .muted { color: var(--muted); }
  .tag { border-radius: 999px; padding: 1px 8px; background: var(--sep); }
</style>
</head>
<body>
  <h1>Noter harness — screenshot self-test</h1>
  <div class="card">
    <div class="row"><button class="primary">Record</button><button>Not Now</button><span class="muted">Teams call detected</span></div>
    <div class="row"><span>Microphone</span><div class="meter"><i></i></div><span class="tag">Hearing you</span></div>
    <div class="row"><strong>Speaker 2</strong><span>Давайте обсудим drawer в Sprint 42 — und dann die Retro.</span></div>
  </div>
  <div class="card">
    <div class="row"><input type="checkbox" checked> <span>Send the spec to the backend team</span><span class="muted">· due Fri</span></div>
    <div class="row"><input type="checkbox"> <span>Book the design review</span></div>
  </div>
</body>
</html>
