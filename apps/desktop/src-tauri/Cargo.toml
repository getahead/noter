[package]
name = "noter-desktop"
version = "0.2.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.80"
description = "The thin Tauri host: one handler per contract command, window capabilities, events; no product logic."
publish = false

# Its own workspace: only the macOS job builds Tauri (ci.yml › macos), the Linux jobs never do.
[workspace]

[lib]
name = "noter_desktop"

[build-dependencies]
noter-protocol = { path = "../../../crates/noter-protocol" }
tauri-build = { version = "2", features = [] }

[dependencies]
noter-core = { path = "../../../crates/noter-core" }
noter-engine-client = { path = "../../../crates/noter-engine-client" }
noter-native = { path = "../../../crates/noter-native" }
noter-protocol = { path = "../../../crates/noter-protocol" }
# The status item's VoiceOver label (tray-icon's NSStatusItem); both are in tray-icon's tree.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
# NB10 (D-34): tag v2.1.1, pinned by rev; deny.toml allows this git source only.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "ef6e3090a6083c653955ca0b6e7f6c6ae1453d40" }

[dev-dependencies]
# A throwaway key signs the local feed's update in tests; no key is ever committed.
base64 = "0.22"
minisign = "0.7"
tauri = { version = "2", features = ["test"] }
tempfile = "3"
