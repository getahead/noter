    },
    banners: (ctx) => {
      const call = callOf(ctx);
      const out = [];
      const n = suggestedOf(call).length;
      if (n && viewOf(ctx) !== 'history' && ctx.demo !== 'writing') out.push({ id: 'review', severity: 'info', dismissible: false, text: `${plural(n, 'suggested item')} to review before sharing`, actions: [{ label: 'Start Review', action: ['pc.startReview', { callId: call.id }] }, { label: 'Accept All', variant: 'primary', action: ['item.acceptMany', { ids: suggestedOf(call).map((i) => i.id), message: 'Accepted ' + plural(n, 'suggested item'), where: 'call-page' }] }] });
      if (ctx.demo === 'local-model') out.push({ id: 'local', severity: 'degraded', text: 'Summary written by the local model', actions: [{ label: 'Regenerate with Claude Code…', action: ['dlg.regenerate', { callId: call.id }] }] });
      if (ctx.demo === 'transcript-upgraded') out.push({ id: 'upgraded', severity: 'info', text: 'Transcript upgraded · the archive pass changed 41 words and 2 speaker labels; summary regenerated', actions: [{ label: 'Show Diff', action: ['pc.showArchiveDiff', { callId: call.id }] }] });
      if (ctx.demo === 'archive-pending') out.push({ id: 'pending', severity: 'info', dismissible: false, text: 'Archive transcript pending' });
      if (isSensitive(call, ctx)) out.push({ id: 'sensitive', severity: 'info', dismissible: false, text: 'Sensitive call · processed on this Mac only' });
      if (ctx.demo === 'first-call') out.push({ id: 'notify', severity: 'info', text: 'Get a notification when a call’s summary is ready.', actions: [{ label: 'Notify Me When Summaries Are Ready', action: ['proto.flash', { key: 'proto', text: 'macOS asks: “Noter” would like to send you notifications' }] }] });
      if (ctx.demo === 'writing' && writingStep(ctx) < 5) out.push({ id: 'writing', severity: 'info', dismissible: false, text: 'Writing the outputs · the transcript is ready to read', actions: [{ label: 'Read Transcript', action: ['pc.view', { value: 'transcript' }] }] });
      return out;
    },
    defaultInspector: (ctx) => ({ kind: 'call-info', props: { callId: callOf(ctx).id } }),
    states: [
      { id: 'default', label: 'Normal · suggested items waiting' },
      { id: 'writing', label: 'Outputs being written (section by section)' },
      { id: 'section-failed', label: 'A section failed' },
      { id: 'local-model', label: 'Written by the local model' },
      { id: 'empty-section', label: 'Empty sections' },
      { id: 'regenerated', label: 'Regenerated with edits kept' },
      { id: 'nothing-to-review', label: 'Nothing to review' },
      { id: 'audio-gone', label: 'Audio no longer kept' },
      { id: 'transcript-upgraded', label: 'Transcript upgraded' },
      { id: 'archive-pending', label: 'Archive transcript pending' },
      { id: 'sensitive', label: 'Sensitive call' },
      { id: 'first-call', label: 'First recorded call (notifications)' },
      { id: 'history-empty', label: 'History · no changes yet' },
      { id: 'handoff-generating', label: 'Handoff · prompt being written' },
      { id: 'handoff-failed', label: 'Handoff · prompt failed' },
      { id: 'handoff-others', label: 'Handoff · item owned by someone else' },
      { id: 'handoff-no-mapping', label: 'Handoff · no repository mapped' },
      { id: 'handoff-no-handler', label: 'Handoff · no link handler' },
      { id: 'handoff-open-failed', label: 'Handoff · automation denied' },
      { id: 'handoff-sensitive', label: 'Handoff · sensitive call' },
    ],
    onDemo: (id, ctx) => {
      const l = L();
      // restore the example data first
      D.items.forEach((it) => { if (ORIG[it.id]) Object.assign(it, ORIG[it.id]); });
      Object.assign(l, { writeStep: 99, retried: null, added: [], adding: false, sumDiff: false, archive: false, playing: false, regenerating: false });
      NP.state.inspector = null; NP.state.undo = null;
      if (l.writeTimer) { clearInterval(l.writeTimer); l.writeTimer = null; }
      if (id === 'writing') {
        l.writeStep = 0;
        l.writeTimer = setInterval(() => { l.writeStep++; if (l.writeStep >= 6) { clearInterval(l.writeTimer); l.writeTimer = null; } NP.render(); }, 1600);
      }
      if (id === 'nothing-to-review') D.items.forEach((it) => { if (it.callId === 'c-live' && it.review === 'suggested') it.review = 'accepted'; });
      if (id === 'audio-gone' || id === 'transcript-upgraded') NP.state.route.params = Object.assign({}, NP.state.route.params, { view: id === 'audio-gone' ? 'transcript' : 'summary' });
      if (id === 'history-empty') NP.state.route.params = Object.assign({}, NP.state.route.params, { view: 'history' });
      if (id.startsWith('handoff-')) {
        const hs = id.replace('handoff-', '');
        const itemId = hs === 'others' ? 'i-replay' : 'i-virt';
        const H = NP.local('c-handoff', {});
        H[itemId] = { state: hs === 'generating' ? 'generating' : hs === 'failed' ? 'failed' : hs === 'open-failed' ? 'open-failed' : 'ready', noMapping: hs === 'no-mapping', noHandler: hs === 'no-handler', sensitive: hs === 'sensitive' };
        NP.state.inspector = { kind: 'handoff', props: { itemId } };
      }
    },
    render: (ctx) => {
      const call = callOf(ctx);
      const v = viewOf(ctx);
      const body = v === 'transcript' ? transcriptView(call, ctx) : v === 'reviews' ? reviewsView(call, ctx) : v === 'history' ? historyView(call, ctx) : summaryView(call, ctx);
      return html`<div class="pc pc--${v}">${body}</div>`;
    },
  });

  NP.onAfterRender(() => {
    const l = NP.state.local['call-page'];
    if (l && l.focusPending && l.focus) { const el = document.getElementById('row-' + l.focus); if (el) { el.focus({ preventScroll: false }); el.scrollIntoView({ block: 'center' }); } l.focusPending = false; }
  });

  /* ---------- actions ---------- */
  NP.onMany({
    'pc.view': (a) => { NP.go('call-page', Object.assign({}, NP.state.route.params, { view: a.value }), { replace: true, keepInspector: true }); return false; },
    'pc.inspectorToggle': () => {
      const l = L();
      const open = !!NP.state.inspector || !l.hideInspector;
      if (open) { NP.state.inspector = null; l.hideInspector = true; } else l.hideInspector = false;
    },
    'pc.startReview': (a) => {
      const l = L(); const first = suggestedOf(D.call(a.callId)).find((i) => i.kind === 'action') || suggestedOf(D.call(a.callId))[0];
      if (NP.state.route.params.view && NP.state.route.params.view !== 'summary') NP.state.route.params = Object.assign({}, NP.state.route.params, { view: 'summary' });
      l.focus = first ? first.id : null; l.focusPending = true;
    },
    'pc.sumEdit': () => { const l = L(); l.editingSummary = NP.state.route.params.callId || 'c-live'; l.summaryDraft = null; },
    'pc.sumCancel': () => { L().editingSummary = null; },
    'pc.sumSave': (a) => {
      const l = L(); const s = summaryFor(D.call(a.callId));
      l.summaryEdit[a.callId] = l.summaryDraft != null ? l.summaryDraft : (s.v2 || s.v1);
      l.versions = l.versions || {}; (NP.local('c-items').versions = NP.local('c-items').versions || {})['sum-' + a.callId] = 'edit';
      l.editingSummary = null; NP.flash('copy-sum', 'Saved', 2000);
    },
    'pc.sumDiff': () => { L().sumDiff = !L().sumDiff; },
    'pc.regenerate': () => { const l = L(); l.regenerating = true; l.namesUpdated = false; setTimeout(() => { l.regenerating = false; NP.flash('copy-sum', 'Regenerated', 2000); NP.render(); }, 1500); },
    'pc.retry': (a) => {
      const l = L();
      if (a.how === 'retry') { NP.flash('retrying', 'Retrying', 1200); setTimeout(() => { l.retried = 'retry'; NP.render(); }, 1200); return; }
      l.retried = 'local';
    },
    'pc.addStart': () => { L().adding = true; L().addText = ''; },
    'pc.addItem': (a) => {
      const l = L(); const text = (a.value || l.addText || '').trim(); if (!text) return;
      const id = 'i-new-' + Date.now();
      D.items.push({ id, kind: 'action', text, owner: 'p-you', due: '', status: 'open', review: 'accepted', callId: a.callId || 'c-live', lang: 'en' });
      l.added = (l.added || []).concat([id]); l.adding = false; l.addText = '';
    },
    'pc.pp': (a) => { const l = L(); l.pp[a.p] = !l.pp[a.p]; },
    'pc.play': () => { L().playing = !L().playing; },
    'pc.archive': () => { L().archive = !L().archive; },
    'pc.showArchiveDiff': () => { L().archive = true; NP.go('call-page', Object.assign({}, NP.state.route.params, { view: 'transcript' }), { replace: true, keepInspector: true }); return false; },
    'pc.thumb': (a) => { const l = L(); l.thumbs[a.id] = l.thumbs[a.id] === a.v ? null : a.v; },
    'pc.sensitive': (a) => { const l = L(); l.sensitive = l.sensitive || {}; l.sensitive[a.callId] = !l.sensitive[a.callId]; },
  });

  /* =========================================================
     Call info inspector (PC-R4, 280)
     ========================================================= */
  NP.inspector('call-info', {
    width: 280,
    render: (props, ctx) => {
      const call = D.call(props.callId);
      const l = L(); l.tags = l.tags || {};
      const tags = l.tags[call.id] || (l.tags[call.id] = call.tags.slice());
      const sens = isSensitive(call, ctx || { demo: NP.demo('call-page') });
      const audioGone = NP.demo('call-page') === 'audio-gone' || (l.audioDeleted && l.audioDeleted[call.id]);
      const unnamed = (D.unnamedSpeakers[call.id] || []).filter((s) => !((NP.local('c-items').naming || {})[call.id] || { named: {} }).named[s.id]);
      return html`<div class="pc-info" data-variant="call-info">
        <header class="it-ins__head"><span class="t-headline">Call info</span><span class="np-tb__spacer"></span>${P.iconButton('x', { label: 'Close inspector', size: 'inline', action: ['shell.closeInspector'] })}</header>
        <div class="pc-info__sec"><h3 class="pc-info__h">Participants</h3>
          <div class="pc-info__people">${call.people.map((p) => C.personChip(p))}${unnamed.map((s) => C.personChip(s.id, { variant: 'unnamed', callId: call.id, key: 'ci' }))}</div></div>
        <div class="pc-info__sec"><h3 class="pc-info__h">Call</h3>
          <dl class="np-kv"><dt>Type</dt><dd>${P.popup(['Planning', '1:1', 'Design review', 'Backend sync', 'Vendor', 'QA sync'], call.type, { variant: 'inline', label: 'Call type', id: 'ci-type' })}</dd>
          <dt>App</dt><dd>${call.platform}</dd><dt>When</dt><dd>${call.dateLong} · ${call.time}</dd><dt>Length</dt><dd class="np-tnum">${call.length}</dd>
          <dt>Languages</dt><dd>${call.languages.map((c) => C.languageTag(c, { variant: 'call' }))}</dd></dl></div>
        <div class="pc-info__sec"><h3 class="pc-info__h">Tags</h3>
          ${P.searchField({ variant: 'token-field', id: 'ci-tags', placeholder: 'Add tag…', tokens: tags.map((t) => ({ label: t, kind: 'tag' })), tokenAction: 'pc.tagRemove', bind: 'local.call-page.tagDraft', enter: 'pc.tagAdd', ariaLabel: 'Tags' })}
          ${NP.flashed('tag') ? C.inlineStatus(NP.flashed('tag'), { variant: 'trailing', actionLabel: 'Undo', action: ['pc.tagUndo', { callId: call.id }] }) : ''}</div>
        <div class="pc-info__sec"><h3 class="pc-info__h">Privacy</h3>
          <div class="pc-info__row">${C.modeIndicator({ variant: 'call-info', mode: sens ? 'Sensitive · local' : call.mode, key: 'ci' })}</div>
          ${P.toggle('Sensitive', !!sens, { size: 'small', id: 'ci-sens', action: ['pc.sensitive', { callId: call.id }] })}

(function () {
  const { html, raw, attrs, act, icon, P, C, data: D, region } = NP;
  const KEY = 'ask';

    { value: 'planning', label: 'Planning calls · last 30 days' },
    { value: 'anna', label: 'Calls with Anna K.' },
    { value: 'topic', label: 'Topic: Websocket notifications' },

  const keyFor = (q) => {
    const s = String(q).toLowerCase();
    if (/websocket|уведомл|notification|reconnect|decide|decision|open from the planning|drawer/.test(s)) return 'websocket';
    if (/anna|аня|1:1/.test(s)) return 'anna';
    if (/openstack/.test(s)) return 'openstack';
    if (/\bqa\b|handover|checklist|übergab|schnittstell/.test(s)) return 'qa';
    if (/retention|vendor|monitor/.test(s)) return 'retention';
    return null;
  };
  const answerFor = (k, opts) => {
    opts = opts || {};
    if (k === 'retention') {
      if (opts.local) return Object.assign(clone(D.askAnswers.retentionLocal), { status: 'ready' });
      return { notFound: true, scopeNote: '1 sensitive source was not searched because this answer uses a cloud model', status: 'ready' };
    }
    if (!k || !D.askAnswers[k]) return { notFound: true, status: 'ready' };
    const a = Object.assign(clone(D.askAnswers[k]), { status: 'ready' });
    if (opts.local) { a.local = true; a.meta = 'Answered by the local model · ' + a.meta.replace(/^Answered /, 'answered ').replace(/^answered from/, 'from'); }
    return a;
  };
  const seedThread = (k) => {
    const r = D.askRecent.find((x) => x.key === k) || D.askRecent[0];
    return { id: 'th-' + k + '-' + Date.now(), q: r.q, turns: [{ q: r.q, a: answerFor(r.key) }] };
  };
  const L = () => NP.dLocal(KEY, () => {
    const threads = D.askRecent.map((r, i) => ({ id: 'th-' + i, q: r.q, group: r.group, turns: [{ q: r.q, a: answerFor(r.key) }] }));
    return { threads, cur: threads[0].id, draft: '', scope: 'all', hl: null, playing: null, rate: {}, local: false };
  });
  const curThread = () => { const l = L(); return l.threads.find((t) => t.id === l.cur) || null; };
  const runtimeMode = () => (L().local ? { runtime: 'Local model', mode: 'Local only' } : { runtime: 'Claude Code', mode: 'Cloud, redacted' });

  const send = (q) => {
    q = String(q || '').trim();
    if (!q) return;
    const l = L();
    let t = curThread();
    if (!t || t.empty) { t = { id: 'th-n' + Date.now(), q, group: 'Today', turns: [] }; l.threads.unshift(t); l.cur = t.id; }
    const k = keyFor(q);
    const turn = { q, a: { status: 'searching', paras: (D.askAnswers[k] || D.askAnswers.websocket).paras, citations: [] } };
    t.turns.push(turn);
    l.draft = '';
    l.answering = turn;
    const idx = t.turns.length - 1;
    setTimeout(() => { if (turn.a.status === 'searching') { turn.a.status = 'reading'; NP.render(); } }, 900);
    setTimeout(() => {
      if (turn.a.status !== 'reading' && turn.a.status !== 'searching') return;
      if (NP.demo(KEY) === 'unreachable' && !l.local) turn.a = { error: true, q };
      else turn.a = answerFor(k, { local: l.local });
      if (idx > 0) turn.a.followUp = true;
      l.answering = null;
      NP.render();
    }, 2100);
  };

  const turnView = (t, turn, i, ctx) => {
    const key = t.id + '-' + i;
    const narrowed = L().scope !== 'all';
    return html`<article class="ak-turn" aria-label="Question ${i + 1}">
      <h3 class="ak-q t-headline">${turn.q}</h3>
      ${C.citedAnswer(turn.a, { key, variant: i > 0 ? 'follow-up' : 'answer', narrowed })}
    </article>`;
  };

  const threadView = (ctx) => {
    const l = L();
    const t = curThread();
    const mode = runtimeMode();
    const empty = !t || t.empty || !t.turns.length;
    const infoLines = html`
      ${ctx.demo === 'keyword-only' ? html`<div class="ak-note">${icon('info', { size: 13 })}<span>Searching by keyword only while the index rebuilds · 64 %</span>${P.progress({ value: 64, label: 'Index rebuild' })}</div>` : ''}
      ${ctx.demo === 'sensitive' && !l.local ? html`<div class="ak-note">${icon('info', { size: 13 })}<span>2 sensitive sources were not searched because this answer uses a cloud model</span>${P.button('Use Local Model', { size: 'small', action: ['ask.useLocal'] })}</div>` : ''}`;
    const composer = region('AK-R4', { label: 'Ask a question', cls: 'ak-composer' + (empty ? ' is-first' : '') }, html`
      ${P.textField({ id: 'ask-composer', variant: 'multi', rows: empty ? 3 : 2, placeholder: empty ? 'Ask about your calls and documents…' : 'Ask a follow-up…', bind: 'local.ask.draft', value: l.draft, ariaLabel: 'Question', cls: 'ak-composer__field' })}
      ${l.answering ? P.button('Stop', { kbd: '⌘.', action: ['ask.stop'] }) : P.button('Ask', { variant: 'primary', action: ['ask.send'], shortcut: 'Enter' })}`);
    if (empty) {
      return region('AK-R3', { label: 'Thread', cls: 'ak-thread' }, html`
        <h2 class="t-title2 ak-first__h">Ask anything about your calls and documents</h2>
        ${infoLines}
        ${composer}
        <div class="ak-suggs">${D.askSuggestions.map((s) => P.button(s, { variant: 'quiet', cls: 'ak-sugg', action: ['ask.suggest', { q: s }] }))}</div>`);
    }
    return region('AK-R3', { label: 'Thread', cls: 'ak-thread' }, html`
      ${infoLines}
      ${t.turns.map((turn, i) => turnView(t, turn, i, ctx))}
      ${composer}
      ${l.playing ? region('AK-R5', { label: 'Playback', cls: 'ak-playbar' }, NP.c('playbackBar', { variant: 'result', callId: l.playing.callId, at: l.playing.t, speaker: l.playing.speaker, key: KEY })) : ''}`);
  };

  const recentView = () => {
    const l = L();
    const real = l.threads.filter((t) => !t.empty);
    if (!real.length) return region('AK-R2', { label: 'Recent questions', cls: 'ak-recent' }, html`<div class="ak-recent__empty np-muted">Your questions appear here</div>`);
    const groups = [];
    real.forEach((t) => { const g = t.group || 'Today'; let G = groups.find((x) => x.g === g); if (!G) groups.push(G = { g, items: [] }); G.items.push(t); });
    return region('AK-R2', { label: 'Recent questions', cls: 'ak-recent' }, html`<div role="list"${attrs({ 'data-component': P.PRIM, 'data-primitive': 'source-list', 'data-variant': 'recent-questions' })}>${groups.map((G) => html`<div class="np-srclist__group" data-variant="group-header">${G.g}</div>${G.items.map((t) => html`<a href="#" role="listitem" class="ak-recent__item${t.id === l.cur ? ' is-sel' : ''}" data-variant="item" data-state="${t.id === l.cur ? 'selected' : 'default'}" data-proto-anchor="ak-r-${t.id}" ${act('ask.open', { id: t.id })} title="${t.q}">${t.q}</a>`)}`)}</div>`);
  };

  NP.screen(KEY, {
    title: 'Ask',
    subtitle: () => (L().answering ? 'Answering…' : ''),
    search: true,
    toolbarActions: (ctx) => {
      const m = runtimeMode();
      return html`${P.button('New Question', { icon: 'plus', action: ['ask.new'], shortcut: 'Meta+N', help: 'New Question (⌘N)' })}
        ${P.popup(SCOPES, L().scope, { id: 'ask-scope', label: 'Scope', variant: 'toolbar', action: ['ask.scope'] })}
        ${C.modeIndicator({ variant: 'ask', runtime: m.runtime, mode: m.mode, key: 'ask' })}`;
    },
    states: [
      { id: 'default', label: 'Answer ready' },
      { id: 'first', label: 'First question' },
      { id: 'answering', label: 'Answering (streams)' },
      { id: 'not-found', label: 'Not found' },
      { id: 'unreachable', label: 'Claude Code unreachable' },
      { id: 'local', label: 'Answered locally' },
      { id: 'sensitive', label: 'Sensitive sources skipped' },
      { id: 'keyword-only', label: 'Keyword-only index' },
      { id: 'weak', label: 'Only weak evidence' },
      { id: 'deleted', label: 'Cited source deleted' },
    ],
    onDemo: (id) => {
      const keep = NP.state.local[KEY] ? NP.state.local[KEY].lastParams : null;
      delete NP.state.local[KEY];
      const l = L();
      l.lastParams = keep;
      l.local = id === 'local';
      l.playing = null; l.hl = null; l.answering = null;
      const set = (t) => { l.threads = l.threads.filter((x) => !x.empty && x.q !== t.q); l.threads.unshift(t); l.cur = t.id; };
      if (id === 'first') { l.threads = [{ id: 'th-empty', empty: true, turns: [] }]; l.cur = 'th-empty'; l.draft = ''; }
      if (id === 'answering') { set({ id: 'th-new' + Date.now(), empty: true, turns: [] }); send('What did we agree with backend about the websocket notifications, and what is open?'); }
      if (id === 'not-found') set({ id: 'th-nf', q: 'When is the Lizenzprüfung im Installer due?', group: 'Today', turns: [{ q: 'When is the Lizenzprüfung im Installer due?', a: { notFound: true, status: 'ready' } }] });
      if (id === 'unreachable') set({ id: 'th-err', q: 'What did we decide about the notification service?', group: 'Today', turns: [{ q: 'What did we decide about the notification service?', a: { error: true } }] });
      if (id === 'local') set({ id: 'th-loc', q: 'What did the monitoring vendor promise about data retention?', group: 'Today', turns: [{ q: 'What did the monitoring vendor promise about data retention?', a: answerFor('retention', { local: true }) }] });
      if (id === 'sensitive') set({ id: 'th-sens', q: 'What did the monitoring vendor promise about data retention?', group: 'Today', turns: [{ q: 'What did the monitoring vendor promise about data retention?', a: answerFor('retention') }] });
      if (id === 'keyword-only') { const t = seedThread('websocket'); t.turns[0].a.keywordOnly = true; set(t); }
      if (id === 'weak') { l.scope = 'planning'; set(seedThread('qa')); }
      if (id === 'deleted') { const t = seedThread('websocket'); t.turns[0].a.deleted = true; t.turns[0].a.citations[0] = { n: 1, kind: 'call', deleted: true }; set(t); }
    },
    render: (ctx) => {
      const l = L();
      // arriving from Library › Ask Instead / Ask About This: ask once
      const p = ctx.params;
      const sig = JSON.stringify(p);
      if ((p.q || p.scopeTopic) && l.lastParams !== sig) {
        l.lastParams = sig;
        if (p.scopeTopic) l.scope = 'topic';
        const topic = p.scopeTopic ? (D.topics.find((x) => x.id === p.scopeTopic) || {}).name : null;
        l.threads.unshift({ id: 'th-in' + Date.now(), empty: true, turns: [] }); l.cur = l.threads[0].id;
        setTimeout(() => { send(p.q || `What was decided and what is still open about ${topic}?`); NP.render(); }, 0);
      }
      return html`<div class="ak-split">${recentView()}${threadView(ctx)}</div>`;
    },
  });

  NP.onMany({
    'ask.new': () => { const l = L(); l.threads = l.threads.filter((t) => !t.empty); l.threads.unshift({ id: 'th-e' + Date.now(), empty: true, turns: [] }); l.cur = l.threads[0].id; l.draft = ''; l.playing = null; setTimeout(() => { const f = document.getElementById('ask-composer'); if (f) f.focus(); }, 30); },
    'ask.open': (a) => { const l = L(); l.cur = a.id; l.playing = null; l.hl = null; },
    'ask.scope': (a) => { L().scope = a.value; },
    'ask.send': () => { const f = document.getElementById('ask-composer'); const v = f ? f.value : L().draft; if (f) f.value = ''; send(v); },
    'ask.suggest': (a) => { send(a.q); },
    'ask.stop': () => { const l = L(); const turn = l.answering; if (turn) { const k = keyFor(turn.q); turn.a = Object.assign(answerFor(k), { status: 'stopped' }); if (turn.a.paras) turn.a.paras = turn.a.paras.slice(0, 1); turn.a.citations = (turn.a.citations || []).filter((c) => String(turn.a.paras[0]).includes('[' + c.n + ']')); l.answering = null; } },
    'ask.cite': (a) => {
      const l = L(); l.hl = a.key + ':' + a.n;
      setTimeout(() => { const el = document.getElementById('ak-cite-' + a.key + '-' + a.n); if (el) { el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); el.setAttribute('tabindex', '-1'); el.focus({ preventScroll: true }); } }, 30);
      setTimeout(() => { if (l.hl === a.key + ':' + a.n) { l.hl = null; NP.render(); } }, 3000);
    },
    'ask.copy': (a) => {
      const t = curThread(); const turn = t && t.turns[+String(a.key).split('-').pop()];
      const text = turn && turn.a.paras ? turn.a.paras.join('\n\n') + '\n\n' + (turn.a.citations || []).map((c) => `${c.n}. ${c.callId ? D.call(c.callId).title + ', ' + D.call(c.callId).date + ', ' + c.t : c.title}`).join('\n') : '';
      try { navigator.clipboard && navigator.clipboard.writeText(text).catch(() => {}); } catch (e) { /* the viewer may refuse */ }
      NP.flash('ask-copy-' + a.key, 'Copied', 2000);
    },
    'ask.rate': (a) => { const r = L().rate; r[a.key] = r[a.key] === a.v ? null : a.v; },
    'ask.keyword': (a) => { const t = curThread(); NP.go('library', { view: 'search', q: t ? t.turns[t.turns.length - 1].q : '' }); return false; },
    'ask.widen': () => { const l = L(); l.scope = 'all'; const t = curThread(); if (t) { const q = t.turns[t.turns.length - 1].q; send(q); } },
    'ask.retry': () => { const t = curThread(); if (!t) return; const turn = t.turns[t.turns.length - 1]; NP.state.demo[KEY] = 'default'; turn.a = { status: 'searching', paras: D.askAnswers.websocket.paras, citations: [] }; const k = keyFor(turn.q); setTimeout(() => { turn.a = answerFor(k); NP.render(); }, 1400); },
    'ask.local': () => { const l = L(); l.local = true; const t = curThread(); if (!t) return; const turn = t.turns[t.turns.length - 1]; turn.a = { status: 'reading', paras: D.askAnswers.websocket.paras, citations: [] }; const k = keyFor(turn.q); setTimeout(() => { turn.a = answerFor(k, { local: true }); NP.render(); }, 1600); },
    'ask.useLocal': () => { const l = L(); l.local = true; NP.state.demo[KEY] = 'local'; const t = curThread(); if (t) { const turn = t.turns[t.turns.length - 1]; turn.a = answerFor(keyFor(turn.q), { local: true }); } },
    'ask.again': () => { const t = curThread(); if (t) { const turn = t.turns[t.turns.length - 1]; turn.a = answerFor(keyFor(turn.q)); turn.a.citations = turn.a.citations.slice(1).map((c, i) => Object.assign(c, { n: i + 1 })); turn.a.paras = ['Dmitri S. reaffirmed in today\'s planning call that drawer events go through the notification service [1] and will add a replay buffer for reconnects, tracked as VSTOR-9912 [2].', 'Still open: who owns the acceptance criteria for the reconnect handling [3]. The Drawer spec describes event delivery over the websocket with replay after a reconnect [4].']; turn.a.meta = 'Answered from 1 call and 1 document · 1 lookup · 5.0 s · nothing from the model\'s own knowledge'; } },
  });

  /* Return sends, ⇧Return adds a line (the core only wires Return on single-line inputs) */
  NP.onAfterRender(() => {
    const f = document.getElementById('ask-composer');
    if (f && !f._d) {
      f._d = true;
      f.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); const v = f.value; f.value = ''; send(v); NP.render(); }
        if (ev.key === '.' && ev.metaKey) { ev.preventDefault(); NP.actions['ask.stop'](); NP.render(); }
      });
    }
  });
})();

;
/* =====================================================================
   Screen — People and Person page (cpt-noter-component-screen-people)
   'people' = People list (PL-R1..R3); 'person' = Person page (PE-R1..R6, Calls, History)
   ===================================================================== */
(function () {
  const { html, raw, attrs, act, comp, icon, P, C, data: D, region } = NP;
  const fold = (s) => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/ß/g, 'ss');
  const PL = () => NP.dLocal('people', () => ({ q: '', sel: {}, named: {}, extra: [], removed: {} }));
  const PE = () => NP.dLocal('person', () => ({ voice: {}, merged: false }));
  const facts = (id) => D.peopleFacts[id] || { theirOpen: 0, youOwe: 0, lastCall: '—', sub: '', langs: '' };
  const peopleList = () => D.people.filter((p) => !p.you && !PL().removed[p.id]);
  const matches = (p, q) => !q || [p.name, p.short].concat(p.aliases || []).some((n) => fold(n).includes(fold(q)));

  /* ---------- New person form (person-picker popover, D92) ---------- */
  NP.overlay('ppl-new', {
    width: 320,
    render: (p) => {
      const f = NP.local('pplnew');
      const name = (f.name || '').trim();
      const dup = name && D.people.find((x) => !x.you && fold(x.name).split(' ')[0] === fold(name).split(' ')[0] && fold(name).split(' ').length === 1);
      return comp('person-picker', { variant: 'new-person-form', state: dup ? 'name-exists' : 'default', cls: 'np-pop__body' }, html`
        <div class="np-pop__title">${p.speaker ? 'New person for ' + (p.label || p.speaker) : 'New person'}</div>
        ${P.textField({ id: 'ppl-new-name', label: 'Name', showLabel: true, value: f.name || p.name || '', bind: 'local.pplnew.name', live: true })}
        ${P.textField({ id: 'ppl-new-email', label: 'Email', showLabel: true, value: f.email || '', bind: 'local.pplnew.email' })}
        ${P.textField({ id: 'ppl-new-role', label: 'Role', showLabel: true, value: f.role || '', bind: 'local.pplnew.role' })}
        ${dup ? html`<div class="pe-dup">${icon('info', { size: 13 })}<span>A person called “${name}” already exists: ${dup.short} (${dup.role})</span></div><div class="np-pop__actions">${P.button('Use ' + dup.short, { size: 'small', action: ['ppl.useExisting', { id: dup.id, speaker: p.speaker }] })}${P.button('Create Anyway', { size: 'small', variant: 'primary', action: ['ppl.create', p] })}</div>`
          : html`<div class="np-pop__actions">${P.button(p.speaker ? 'Create and Name' : 'Create', { variant: 'primary', size: 'small', disabled: !name, action: ['ppl.create', p] })}</div>`}`);
    },
  });

  /* ---------- Name an unnamed speaker (speaker-label popover with person picker) ---------- */
  NP.overlay('ppl-name-speaker', {
    width: 320,
    render: (p) => {
      const f = NP.local('pplname');
      const q = f.q || '';
      const list = peopleList().filter((x) => matches(x, q)).slice(0, 5);
      return comp('speaker-label', { variant: 'unresolved', state: 'popover-open', cls: 'np-pop__body' }, html`
        <div class="np-pop__title">Name ${p.label}</div>
        <div class="np-dim t-callout" lang="${p.lang}">${p.sample}</div>
        ${comp('person-picker', { variant: 'field', state: q ? 'typing' : 'default', cls: 'pe-picker' }, html`
          ${P.textField({ id: 'ppl-name-q', placeholder: 'Name…', value: q, bind: 'local.pplname.q', live: true, ariaLabel: 'Name' })}
          <div class="pe-picker__list" role="listbox">${list.map((x) => html`<button type="button" role="option" class="pe-picker__opt" ${act('ppl.name', { speaker: p.id, person: x.id })}><span class="np-person__ini">${x.initials}</span><span>${x.short}</span><span class="np-dim">${x.role}</span></button>`)}
          ${q && !list.length ? html`<div class="np-dim pe-picker__none">No one called “${q}”</div>` : ''}
          ${q ? html`<button type="button" class="pe-picker__opt pe-picker__new" ${act('ppl.newFor', { speaker: p.id, name: q, anchor: p.anchor })}>${icon('plus', { size: 12 })}<span>New Person “${q}”…</span></button>` : ''}</div>`)}
        <div class="np-dim t-callout">Names ${p.label} in all ${p.calls} calls as one change you can undo.</div>`);
    },
  });

  /* ---------- People list ---------- */
  NP.screen('people', {
    idKey: 'people',
    section: 'people',
    variant: () => 'people-list',
    title: 'People',
    subtitle: (ctx) => (ctx.demo === 'empty' ? 'No people yet' : `${peopleList().length} people`),
    search: false,
    toolbarActions: (ctx) => html`${P.searchField({ id: 'pl-search', placeholder: 'Search people', bind: 'local.people.q', value: PL().q, live: true, cls: 'pe-search' })}${P.iconButton('plus', { label: 'Add Person', anchor: 'pl-add', action: ['ppl.addPop', { anchor: 'pl-add' }] })}`,
    states: [
      { id: 'default', label: 'Normal' },
      { id: 'empty', label: 'No people yet' },
      { id: 'no-match', label: 'No match for “Lena”' },
      { id: 'named', label: 'Speaker named (undo strip)' },
      { id: 'new-person', label: 'New person form · name exists' },
    ],
    onDemo: (id) => {
      const l = PL();
      l.q = id === 'no-match' ? 'Lenara' : '';
      if (id === 'named') { l.named = { 'u-2': 'p-dmitri' }; NP.undo('Named Speaker 2 as Dmitri S. in 3 calls', { where: 'people', action: 'ppl.unname', args: { speaker: 'u-2' } }); }
      if (id === 'default') l.named = {};
      if (id === 'new-person') { NP.local('pplnew').name = 'Lena'; NP.state.popover = { id: 'ppl-new', anchor: 'pl-add', props: {} }; }
    },
    render: (ctx) => {
      const l = PL();
      if (ctx.demo === 'empty') {
        return region('PL-R2', { label: 'People' }, C.emptyState({ icon: 'people', title: 'No people yet', body: 'People appear when you record calls or add them.', actionLabel: 'Add Person', action: ['ppl.addPop', { anchor: 'pl-add' }] }));
      }
      const q = ctx.demo === 'no-match' ? 'Lenara' : l.q;
      const list = peopleList().filter((p) => matches(p, q)).sort((a, b) => a.short.localeCompare(b.short));
      const unnamed = D.unnamedVoices.filter((u) => !l.named[u.id] && matches({ name: u.label, short: u.label }, q));
      const nSel = Object.keys(l.sel).filter((k) => l.sel[k]).length;
      return html`
        ${C.undoStrip({ where: 'people' })}
        ${region('PL-R2', { label: 'People' }, list.length ? P.table({ variant: 'sortable', label: 'People', cls: 'lb-table pe-table' }, html`<thead><tr>${P.th('Name', { sort: 'asc' })}${P.th('Role · org')}${P.th('Their open items', { width: '130px' })}${P.th('You owe', { width: '90px' })}${P.th('Last call', { width: '100px' })}${P.th('Voice profile', { width: '110px' })}</tr></thead>
          <tbody>${list.map((p) => { const f = facts(p.id); const sel = !!l.sel[p.id]; return html`<tr class="pe-row${sel ? ' is-sel' : ''}" aria-selected="${String(sel)}" data-proto-anchor="pl-${p.id}" data-pe-row="${p.id}" ${act('ppl.select', { id: p.id })}>
            <td>${C.personChip(p.id)}</td><td class="np-muted">${p.role}${p.org ? ' · ' + p.org : ''}</td><td class="np-tnum">${f.theirOpen || ''}</td><td class="np-tnum">${f.youOwe || ''}</td><td>${f.lastCall}</td>
            <td>${p.voiceProfile ? html`<span title="Voice profile on">${icon('wave', { size: 14, label: 'Voice profile on' })}</span>` : ''}</td></tr>`; })}</tbody>`)
          : C.emptyState({ variant: 'filtered', title: `No people match “${q}”`, actionLabel: 'Clear Search', action: ['ppl.clearQ'] }))}
        ${nSel >= 2 ? html`<p class="lb-hint" data-proto-chrome>${nSel} selected · right-click for Merge 2 People…</p>` : list.length ? html`<p class="lb-hint" data-proto-chrome>Click selects (⌘-click adds) · double-click or a name opens the Person page</p>` : ''}
        ${unnamed.length ? region('PL-R3', { label: 'Unnamed speakers', cls: 'pe-unnamed' }, html`<h2 class="np-section-h">Unnamed speakers <span class="np-dim">· ${unnamed.length}</span></h2>
          <div class="pe-unnamed__list">${unnamed.map((u) => html`<div class="pe-urow">${C.speakerLabel(u.label, { static: true })}<span class="np-muted">· ${u.calls} call${u.calls === 1 ? '' : 's'} · last on ${u.last}</span><span class="np-dim pe-urow__sample" lang="${u.lang}">${u.sample}</span><span class="np-tb__spacer"></span>${P.button('Name…', { size: 'small', anchor: 'pl-name-' + u.id, action: ['ppl.namePop', { anchor: 'pl-name-' + u.id, id: u.id }] })}</div>`)}</div>`) : ''}`;
    },
  });

  /* ---------- Person page ---------- */
  const personOf = (ctx) => D.person(ctx.params.id || 'p-anna');
  const tab = (ctx) => ctx.params.tab || 'overview';
  const callsWith = (p) => D.calls.filter((c) => c.people.includes(p.id)).sort((a, b) => D.callSortKey(b) - D.callSortKey(a));
  const voiceOn = (p, ctx) => {
    const v = PE().voice[p.id];
    if (ctx.demo === 'voice-off') return v === true;
    return v == null ? !!p.voiceProfile : v;
  };
  const historyFor = (p) => {
    const nm = p.short.split(' ')[0];
    const own = D.changes.filter((c) => (c.what + c.target).includes(nm));
    const calls = callsWith(p).map((c) => c.title);
    return own.concat(D.changes.filter((c) => !own.includes(c) && calls.includes(c.target)));

      if (decided) return '';
      return comp('proposal-row', { variant: 'compact', state: rs || 'waiting', cls: 'e-prop e-prop--compact', attrs: { 'data-kind': kindVariant } },
        html`<div class="e-prop__main"><div class="e-prop__title" title="${title}">${title}</div><div class="e-prop__reason">${p.reason}</div></div>
        <div class="e-prop__actions">${P.button('Reject', { size: 'small', action: ['proposal.reject', { id: p.id, where }] })}${P.button('Accept', { size: 'small', action: ['proposal.accept', { id: p.id, where }], loading: rs === 'applying' })}</div>`);
    }

    // full
    const open = !!L.expanded[p.id];
    let st = rs || 'waiting';
    if (decided) st = decided.outcome;
    if (open && st === 'waiting') st = 'expanded';
    let tail;
    if (decided) {
      tail = C.inlineStatus(decided.outcome === 'accepted' ? 'Accepted' : 'Rejected', { variant: 'row-outcome', actionLabel: 'Undo', action: ['proposal.undoDecision', { id: p.id, where }] });
    } else if (rs === 'failed') {
      tail = html`<span class="e-prop__err">${icon('error', { size: 12 })}Couldn't apply</span>${P.button('Try Again', { size: 'small', action: ['proposal.retry', { id: p.id, where }] })}`;
    } else if (rs === 'out-of-date') {
      tail = html`<span class="e-prop__warn">${icon('warning', { size: 12 })}The item changed since</span>${P.button('Dismiss', { size: 'small', action: ['proposal.dismiss', { id: p.id }] })}`;
    } else {
      tail = html`${det.term ? P.button('Always for This Term…', { size: 'small', variant: 'quiet', action: ['proposal.always', { id: p.id }] }) : ''}${P.button('Reject', { size: 'small', action: ['proposal.reject', { id: p.id, where }], disabled: rs === 'applying' })}${P.button('Accept', { size: 'small', action: ['proposal.accept', { id: p.id, where }], loading: rs === 'applying' })}`;
    }
    return comp('proposal-row', { variant: 'full', state: st, cls: 'e-prop e-prop--full' + (open ? ' is-open' : ''), attrs: { 'data-kind': kindVariant } },
      html`<div class="e-prop__line">
        ${P.disclosure('', open, { variant: 'row', action: ['proposal.expand', { id: p.id }], cls: 'e-prop__disc', attrs: { 'aria-label': (open ? 'Hide' : 'Show') + ' details' } })}
        <span class="e-prop__time np-tnum">${det.time || ''}</span>
        <span class="e-prop__actor">${det.actor || 'job'}</span>
        <div class="e-prop__main"><div class="e-prop__title">${title}</div><div class="e-prop__reason">${det.reason || p.reason} · confidence ${det.confidence || '0.80'}</div></div>
        <div class="e-prop__actions">${tail}</div>
      </div>
      ${open ? html`<div class="e-prop__detail">
        ${det.evidence ? html`<div class="e-prop__ev">${icon('link', { size: 12 })} ${det.evidence}</div>` : ''}
        ${rs === 'out-of-date' ? html`<div class="e-prop__ev">${icon('warning', { size: 12 })} Current text: <b>Replay buffer and backoff for websocket reconnects</b> · edited by you at 11:20</div>` : ''}
        <div class="e-prop__spans">${(det.spans || []).map((s) => html`<div class="e-prop__span"><div class="e-prop__where">${s.where}</div>${NP.c('diffView', { before: s.before, after: s.after, variant: 'inline', lang: s.lang })}</div>`)}</div>
        ${det.term && L.always && L.always[p.id] ? html`<div class="e-prop__rule">${icon('wand', { size: 13 })}<span>Glossary rule: always write <b>ostor</b> for “o-store”, “o store”, “O-Store”. New calls use it at once.</span>${P.button('Save Rule', { size: 'small', variant: 'primary', action: ['proposal.saveRule', { id: p.id }] })}</div>` : ''}
      </div>` : ''}`);
  };

  const decide = (outcome) => (a) => {
    const L = actLocal();
    const p = D.proposals.find((x) => x.id === a.id);
    if (!p) return;
    const det = D.proposalDetail[a.id] || {};
    L.decided[a.id] = { outcome, at: Date.now() };
    delete L.rowState[a.id];
    L.expanded[a.id] = false;
    const where = a.where || 'activity';
    if (where !== 'activity') {
      NP.undo((outcome === 'accepted' ? 'Accepted: ' : 'Rejected: ') + (det.title || p.title), { context: p.reason, where, action: 'proposal.undoDecision', args: { id: a.id, where } });
    }
    const at = L.decided[a.id].at;
    setTimeout(() => { const d = actLocal().decided[a.id]; if (d && d.at === at) NP.render(); }, 10050);
  };
  NP.on('proposal.accept', (a) => {
    const L = actLocal();
    if (NP.demo('activity') === 'couldnt-apply' && a.id === 'pr-1' && !L.retried) { L.rowState[a.id] = 'failed'; return; }
    decide('accepted')(a);
  });
  NP.on('proposal.reject', decide('rejected'));
  NP.on('proposal.undoDecision', (a) => { const L = actLocal(); delete L.decided[a.id]; if (state.undo && state.undo.args && state.undo.args.id === a.id && state.undo.label === 'Undo') state.undo = null; });
  NP.on('proposal.retry', (a) => {
    const L = actLocal(); L.retried = true; L.rowState[a.id] = 'applying';
    setTimeout(() => { delete L.rowState[a.id]; decide('accepted')(a); NP.render(); }, 900);
  });
  NP.on('proposal.dismiss', (a) => { const L = actLocal(); L.decided[a.id] = { outcome: 'dismissed', at: 0 }; delete L.rowState[a.id]; });
  NP.on('proposal.expand', (a) => { const L = actLocal(); L.expanded[a.id] = !L.expanded[a.id]; });
  NP.on('proposal.always', (a) => { const L = actLocal(); L.always = L.always || {}; L.always[a.id] = true; L.expanded[a.id] = true; });
  NP.on('proposal.saveRule', (a) => { decide('accepted')(Object.assign({}, a, { where: 'activity' })); NP.flash('ac-rule', 'Saved the glossary rule for “ostor”', 3000); });

  /* ---------------- 41. Status row ----------------
     statusRow(row, {variant:'source'|'job'|'evidence'|'runtime'|'model'|'share-test', where})
     row: {id, name, status:'ok'|'running'|'stale'|'error'|'expired'|'not-configured'|'disabled'|'waiting',
           statusWord, subtitle, message, tag, progress, progressText, enabled, actions:[{label, action, variant}]} */
  const STATUS = {
    ok: { icon: 'checkCircle', word: 'Up to date', cls: 'ok' },
    running: { icon: null, word: 'Running…', cls: 'run' },
    stale: { icon: 'warning', word: 'Out of date', cls: 'warn' },
    error: { icon: 'error', word: 'Failed', cls: 'err' },
    expired: { icon: 'warning', word: 'Sign-in expired', cls: 'warn' },
    'not-configured': { icon: 'info', word: 'Not configured', cls: 'off' },
    disabled: { icon: null, word: 'Off', cls: 'off' },
    waiting: { icon: 'clock', word: 'Waiting', cls: 'off' },
    hidden: { icon: 'checkCircle', word: 'Hidden', cls: 'ok' },
    visible: { icon: 'warning', word: 'Visible', cls: 'warn' },
  };
  C.statusRow = (row, o) => {
    o = o || {};
    const variant = o.variant || 'source';
    const live = NP.local('e-status', {})[row.id];
    const status = (live && live.status) || row.status || 'ok';
    const s = STATUS[status] || STATUS.ok;
    const word = row.statusWord || s.word;
    const running = status === 'running';
    return comp('status-row', { variant, state: status, cls: 'e-status e-status--' + s.cls },
      html`${variant === 'job' ? P.toggle('', status !== 'disabled', { size: 'small', ariaLabel: 'Run ' + row.name, action: ['st.jobToggle', { id: row.id }] }) : ''}
      <span class="e-status__icon">${running ? P.progress({ variant: 'spinner', label: 'Running' }) : s.icon ? icon(s.icon, { size: 14 }) : ''}</span>
      <div class="e-status__main">
        <div class="e-status__name"><span class="e-status__word">${word}</span><span class="e-status__title" title="${row.name}">${row.name}</span>${row.tag ? P.badge(row.tag, { kind: 'kind' }) : ''}</div>
        ${row.subtitle ? html`<div class="e-status__sub">${row.subtitle}</div>` : ''}
        ${status !== 'ok' && row.message && !running ? html`<div class="e-status__msg">${row.message}</div>` : ''}
        ${running ? html`<div class="e-status__prog">${P.progress({ value: live && live.progress != null ? live.progress : null, label: row.progressText || 'Running' })}<span>${row.progressText || 'Running again…'}</span></div>` : ''}
      </div>
      <div class="e-status__actions">${running ? '' : (row.actions || []).map((a) => P.button(a.label, { size: 'small', variant: a.variant || 'secondary', action: a.action }))}</div>`);
  };
  NP.on('st.retry', (a) => {
    const L = NP.local('e-status', {});
    L[a.id] = { status: 'running', progress: null };
    setTimeout(() => { L[a.id] = { status: a.then || 'ok', fixed: true }; if (a.flash) NP.flash(a.flash, a.flashText || 'Fixed', 2500); NP.render(); }, a.ms || 1400);
  });
  NP.on('st.jobToggle', (a) => { const L = NP.local('e-status', {}); const cur = L[a.id] && L[a.id].status === 'disabled'; L[a.id] = { status: cur ? 'ok' : 'disabled' }; });

  /* ---------------- 42. Credential row ----------------
     credentialRow(cred, {variant:'row'|'field', where})
     cred: {id, name, use, state:'not-set'|'configured'|'rejected'|'verifying'|'locked', reason, optional} */
  C.credentialRow = (cred, o) => {
    o = o || {};
    const variant = o.variant || 'row';
    const L = NP.local('e-cred', {});
    const st = (L[cred.id] && L[cred.id].state) || cred.state || 'not-set';
    if (variant === 'field') {
      const f = L['f-' + cred.id] || {};
      const fst = f.state || 'empty';
      return comp('credential-row', { variant: 'field', state: fst === 'empty' ? 'not-set' : fst, cls: 'e-cred e-cred--field' },
        html`<div class="e-cred__name">${cred.name}${cred.optional ? html` <span class="np-dim">· optional</span>` : ''}</div>
        <div class="e-cred__use">${cred.use}</div>
        <div class="e-cred__form">${P.textField({ id: 'cred-' + cred.id, variant: 'secure', placeholder: 'Paste your key', ariaLabel: cred.name, bind: 'local.e-cred.f-' + cred.id + '.value', value: f.value || '', invalid: fst === 'invalid', message: 'Anthropic rejected this key (invalid key)' })}${P.button('Verify', { loading: fst === 'verifying', action: ['cred.verifyField', { id: cred.id }] })}</div>
        ${fst === 'verified' ? html`<div class="e-cred__ok">${icon('checkCircle', { size: 13 })} Verified · stored in the Keychain</div>` : ''}`);
    }
    const tags = {
      'not-set': P.badge('Not set', { tone: 'neutral' }),
      configured: P.badge('Configured', { tone: 'success', icon: 'check' }),
      rejected: P.badge('Rejected', { tone: 'error', icon: 'error' }),
      verifying: html`<span class="e-cred__verifying">${P.progress({ variant: 'spinner', label: 'Verifying' })} Verifying…</span>`,
      locked: P.badge('Configured', { tone: 'success', icon: 'check' }),
    };
    if (L.pending === cred.id && !state.sheet) {
      L.pending = null;
      if ((NP.local('c-dialogs', {}).key || '') === 'ok') { L[cred.id] = { state: 'configured' }; NP.flash('cred-' + cred.id, 'Saved', 2000); return C.credentialRow(cred, o); }
    }
    const locked = st === 'locked' || o.locked;
    const flash = NP.flashed('cred-' + cred.id);
    return comp('credential-row', { variant: 'row', state: locked ? 'keychain-locked' : st, cls: 'e-cred e-cred--row' },
      html`<div class="e-cred__main">
        <div class="e-cred__head"><span class="e-cred__name">${cred.name}</span>${tags[st]}${flash ? C.inlineStatus(flash, { variant: 'trailing' }) : ''}</div>
        <div class="e-cred__use">${cred.use}</div>
        ${st === 'rejected' ? html`<div class="e-cred__reason">${icon('error', { size: 12 })} ${cred.reason || 'Anthropic rejected this key (invalid key)'}</div>` : ''}
        ${st === 'configured' || st === 'locked' ? html`<div class="e-cred__kc"><span class="np-mono">••••••••</span> Stored in the Keychain</div>` : ''}
      </div>
      <div class="e-cred__actions">
        ${st === 'not-set' ? P.button('Add…', { size: 'small', disabled: locked, action: ['cred.sheet', { id: cred.id, mode: 'add' }] }) : html`${P.button('Replace…', { size: 'small', disabled: locked || st === 'verifying', action: ['cred.sheet', { id: cred.id, mode: 'replace' }] })}${P.button('Remove…', { size: 'small', disabled: locked || st === 'verifying', action: ['cred.remove', { id: cred.id, name: cred.name }] })}`}
      </div>`);
  };
  NP.on('cred.verifyField', (a) => {
    const L = NP.local('e-cred', {}); const f = L['f-' + a.id] = L['f-' + a.id] || {};
    f.state = 'verifying';
    setTimeout(() => { f.state = (f.value || '').trim().length < 8 ? 'invalid' : 'verified'; NP.render(); }, 900);
  });
  NP.on('cred.remove', (a) => NP.openAlert({ title: `Remove the ${a.name}?`, body: 'Noter can no longer use this runtime until you add a key again. The key is deleted from the Keychain.', variant: 'destructive', buttons: [{ label: 'Cancel', variant: 'primary', action: 'alert.close' }, { label: 'Remove', variant: 'destructive', action: 'cred.removeConfirm', args: { id: a.id } }] }));
  NP.on('cred.removeConfirm', (a) => { NP.local('e-cred', {})[a.id] = { state: 'not-set' }; state.alert = null; });
  NP.on('cred.sheet', (a) => {
    // The key sheet is group C's dialog (dlg-api-key); remember which row asked so the row updates after Save.
    const L = NP.local('e-cred', {}); L.pending = a.id;
    const cd = NP.local('c-dialogs', {}); cd.key = 'idle';
    if (NP.overlays['dlg-api-key']) NP.openSheet('dlg-api-key', { id: a.id, mode: a.mode });
    else { L[a.id] = { state: 'configured' }; NP.flash('cred-' + a.id, 'Saved', 2000); }
    return false;
  });

  /* ---------------- 43. Agent list row ----------------
     agentListRow(agent, {variant:'built-in'|'added'|'new', selected}) */
  const agLocal = () => NP.eloc('agents', { selected: 'council', view: 'settings', enabled: {}, turnedOn: {}, order: null, added: [] });
  C.agentListRow = (agent, o) => {
    o = o || {};
    const L = agLocal();
    const variant = o.variant || (agent.isNew ? 'new' : agent.builtIn === false ? 'added' : 'built-in');
    const on = L.enabled[agent.id] != null ? L.enabled[agent.id] : agent.enabled;
    const selected = o.selected != null ? o.selected : L.selected === agent.id;
    const runtimeDown = NP.auth ? NP.auth.runtimeDown(agent) : agent.status === 'unavailable';
    const switchedOff = agent.switchedOff && !L.turnedOn[agent.id];
    const st = runtimeDown ? 'runtime-unavailable' : switchedOff ? 'switched-itself-off' : on ? 'enabled' : 'disabled';
    const hit = variant === 'new' || !agent.cards7d ? 'No data yet' : agent.useful + ' %';
    return comp('agent-list-row', { variant, state: (selected ? 'selected ' : '') + st, cls: 'e-agrow' + (selected ? ' is-sel' : '') + (on ? '' : ' is-off'), attrs: { 'data-proto-action': 'ag.select', 'data-proto-args': JSON.stringify({ id: agent.id }), role: 'option', 'aria-selected': String(selected), tabindex: '0' } },
      html`<span class="e-agrow__grip" title="Drag to reorder">${icon('grip', { size: 13 })}</span>
      ${P.toggle('', on, { size: 'small', ariaLabel: (on ? 'Turn off ' : 'Turn on ') + agent.name, action: ['ag.toggle', { id: agent.id }] })}
      <div class="e-agrow__main">
        <div class="e-agrow__top">${C.agentBadge(agent.name)}<span class="e-agrow__hit">${hit}</span></div>
        <div class="e-agrow__sub">${NP.auth ? NP.auth.runtimeText(agent) : agent.runtime} · ${String(agent.model).toLowerCase()} · ${String(agent.effort).toLowerCase()}</div>
        ${runtimeDown ? html`<div class="e-agrow__warn">${icon('warning', { size: 12 })}<span>${NP.auth ? NP.auth.downReason(agent) : 'Codex key not set'}</span>${NP.auth && NP.auth.quickFix(agent) ? P.link(NP.auth.quickFix(agent).label, { action: ['auth.setRuntime', { agent: agent.id, value: NP.auth.quickFix(agent).to }] }) : P.link('Open Settings', { action: ['settings.open', { pane: 'models' }] })}</div>` : ''}
        ${switchedOff ? html`<div class="e-agrow__warn">${icon('warning', { size: 12 })}<span>Switched itself off for 1:1 calls</span>${P.link('Turn On', { action: ['ag.turnOn', { id: agent.id }] })}</div>` : ''}
      </div>`);
  };

  /* ---------------- 44. Agent editor ----------------
     agentEditor(agent, {live}) */
  C.agentEditor = (agent, o) => {
    o = o || {};
    const L = agLocal();
    const f = L['f-' + agent.id] = L['f-' + agent.id] || { name: agent.name, runtime: agent.runtime, model: agent.model, effort: agent.effort, budget: agent.budget, tools: { library: true, jira: true, confluence: false }, runs: { '1:1': false, Planning: true, 'Cross-team': true, Interview: false, Incident: true } };
    const total = D.agents.reduce((s, a) => s + (a.id === agent.id ? Number(f.budget) : Number((L['f-' + a.id] || {}).budget != null ? L['f-' + a.id].budget : a.budget)), 0) + (L.added || []).reduce((s, a) => s + (a.id === agent.id ? 0 : Number((L['f-' + a.id] || {}).budget || 0)), 0);
    const over = total > 100;
    const runtimeDown = NP.auth ? NP.auth.runtimeDown(agent) : agent.status === 'unavailable';
    const row = (label, control, note) => html`<div class="e-form__row"><div class="e-form__label">${label}</div><div class="e-form__ctl">${control}${note || ''}</div></div>`;
    const stance = { Architect: 'Reads for boundaries, coupling, versioning and what breaks when a component changes.', 'Product manager': 'Asks who owns what, by when, and what the user gets out of it.', Designer: 'Looks for states nobody drew: empty, loading, error, long German strings.', 'QA lead': 'Asks how a change is tested and what the acceptance criteria are.', 'Security reviewer': 'Flags data leaving the company, retention and access to credentials.', Scribe: 'Keeps decisions, owners and dates straight.', "Devil's advocate": 'Argues the other side of every decision once.' }[agent.name] || 'Reads the call from its role and raises one point at a time.';
    return comp('agent-editor', { variant: agent.builtIn === false ? 'added-agent' : 'built-in-agent', state: over ? 'validation-error' : runtimeDown ? 'runtime-unavailable' : o.live ? 'live-call' : 'default', cls: 'e-form' },
      html`${row('Name', P.textField({ id: 'ag-name-' + agent.id, value: f.name, bind: 'local.agents.f-' + agent.id + '.name', ariaLabel: 'Name' }))}
      ${row('Skill', html`<span class="np-mono e-form__path">~/Library/Application Support/Noter/skills/${agent.skill}</span>`)}
      ${row('Runtime', NP.auth ? NP.auth.runtimeField(agent) : '')}
      ${row('Effort', P.segmented(['Low', 'Medium', 'High', 'Max'], f.effort, { variant: 'option', label: 'Effort', action: ['ag.field', { id: agent.id, field: 'effort' }] }))}
      ${row('Budget share', P.slider({ id: 'ag-budget-' + agent.id, value: f.budget, min: 0, max: 100, unit: '%', label: 'Budget share', action: ['ag.field', { id: agent.id, field: 'budget' }] }),
        over ? html`<div class="e-form__err">${icon('error', { size: 12 })} Shares add up to ${total} %. Lower one to save.</div>` : '')}
      ${row('Tools', html`<div class="e-form__checks">${P.checkbox('Noter library', f.tools.library, { bind: 'local.agents.f-' + agent.id + '.tools.library' })}${P.checkbox('Jira', f.tools.jira, { bind: 'local.agents.f-' + agent.id + '.tools.jira' })}${P.checkbox('Confluence source', f.tools.confluence, { bind: 'local.agents.f-' + agent.id + '.tools.confluence' })}</div>`,
        html`<div class="e-form__note">Parallel mode only; agents never call tools during a live call.</div>`)}
      ${row('Runs on', html`<div class="e-form__checks">${Object.keys(f.runs).map((k) => P.checkbox(k, f.runs[k], { bind: 'local.agents.f-' + agent.id + '.runs.' + k }))}</div>`)}
      ${row('Stance', html`<div class="e-form__stance">${stance}</div>`)}`);
  };
  NP.on('ag.field', (a) => { const L = agLocal(); const f = L['f-' + a.id]; if (f) f[a.field] = a.field === 'budget' ? Number(a.value) : a.value; });
  NP.on('ag.toggle', (a) => { const L = agLocal(); const ag = D.agents.find((x) => x.id === a.id) || L.added.find((x) => x.id === a.id); const cur = L.enabled[a.id] != null ? L.enabled[a.id] : ag && ag.enabled; L.enabled[a.id] = a.value != null ? !!a.value : !cur; });
  NP.on('ag.select', (a) => { agLocal().selected = a.id; });
  NP.on('ag.turnOn', (a) => { agLocal().turnedOn[a.id] = true; NP.flash('ag-status', 'Turned on for 1:1 calls', 2500); });

  /* ---------------- 45. Council mode table ---------------- */
  C.councilModeTable = (o) => {
    o = o || {};
    const L = agLocal();
    L.council = L.council || [
      { type: '1:1', live: 'Fused', after: 'Parallel', agents: 'Teamlead, Product manager' },
      { type: 'Planning', live: 'Fused', after: 'Parallel', agents: '6 agents' },
      { type: 'Cross-team', live: 'Fused', after: 'Parallel', agents: '5 agents' },
      { type: 'Interview', live: 'Fused', after: 'Fused', agents: '2 agents' },
      { type: 'Incident', live: 'Parallel', after: 'Parallel', agents: 'Backend engineer, Architect, Teamlead' },
    ];
    const opts = [{ value: 'Fused', label: 'Fused' }, { value: 'Parallel', label: 'Parallel (opt-in)' }];
    return comp('council-mode-table', { variant: o.variant || 'wide', state: L.council.some((r) => r.live === 'Parallel') ? 'parallel-live-chosen' : 'default', cls: 'e-council' },
      P.table({ variant: 'sortable', label: 'Council mode per call type' }, html`<thead><tr>${P.th('Call type')}${P.th('Live')}${P.th('After the call')}${P.th('Agents')}</tr></thead>
      <tbody>${L.council.map((r, i) => html`<tr>
        <td>${r.type}</td>
        <td><span class="e-council__cell">${P.popup(opts, r.live, { label: 'Live mode for ' + r.type, action: ['ag.council', { i, field: 'live' }] })}${r.live === 'Parallel' ? P.badge('Opt-in', { tone: 'info' }) : ''}</span></td>
        <td>${P.popup(['Fused', 'Parallel'], r.after, { label: 'After the call for ' + r.type, action: ['ag.council', { i, field: 'after' }] })}</td>
        <td>${P.link(r.agents, { action: ['ag.filterType', { type: r.type }] })}</td>
      </tr>`)}</tbody>`));
  };
  NP.on('ag.council', (a) => { const L = agLocal(); L.council[a.i][a.field] = a.value; });
  NP.on('ag.filterType', (a) => { const L = agLocal(); L.filterType = L.filterType === a.type ? null : a.type; });

  /* ---------------- 46. Metric tile ----------------
     metricTile(m, {variant, selected})  m: {id, name, value, target, p50, status:'ok'|'near'|'over'|'more-data', trend:[], trendWord, blocker, rate} */
  const TILE = { ok: ['checkCircle', 'On budget'], near: ['warning', 'Near'], over: ['error', 'Over'], 'more-data': ['info', 'Not enough data'] };
  const spark = (vals) => {
    if (!vals || !vals.length) return '';
    const w = 96, h = 22, max = Math.max(...vals), min = Math.min(...vals);
    const pts = vals.map((v, i) => `${(i * (w / (vals.length - 1))).toFixed(1)},${(h - 2 - ((v - min) / ((max - min) || 1)) * (h - 4)).toFixed(1)}`);
    const last = pts[pts.length - 1].split(',');
    return raw(`<svg class="e-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="1.4" points="${pts.join(' ')}"/><circle cx="${last[0]}" cy="${last[1]}" r="2.2" fill="currentColor"/></svg>`);
  };
  C.metricTile = (m, o) => {
    o = o || {};
    const st = m.status || 'ok';
    const [ic, word] = TILE[st];
    const variant = m.blocker ? 'release-blocker' : m.rate ? 'rate-metric' : 'timing-metric';
    return comp('metric-tile', { variant, state: (o.selected ? 'selected ' : '') + (st === 'ok' ? 'on-budget' : st === 'more-data' ? 'needs-more-data' : st), tag: 'button', cls: 'e-tile e-tile--' + st + (o.selected ? ' is-sel' : ''), attrs: { type: 'button', 'data-proto-action': 'pf.tile', 'data-proto-args': JSON.stringify({ id: m.id }), 'aria-pressed': String(!!o.selected) } },
      html`<span class="e-tile__status">${icon(ic, { size: 13 })}${word}</span>
      <span class="e-tile__name">${m.name}</span>

      <span class="e-tile__trend">${spark(m.trend)}<span>${m.trendWord || 'Trend: unchanged'}</span></span>`}

  };

  /* ---------------- 47. Stage timeline ----------------
     stageTimeline({stages, variant:'aggregate'|'mini', selected, label})  stage: {id,label,p95,budget,unit,p50} */
  const stStatus = (s) => (s.p95 == null ? 'no-data' : s.p95 > s.budget * 1.05 ? 'over' : s.p95 > s.budget * 0.9 ? 'near' : 'on-budget');  /* Settings › Performance defaults: Near above 90 %, Over above 105 % of budget, as the tiles */

    o = o || {};
    const stages = o.stages || D.perfStages;
    if (o.variant === 'mini') {
      const total = stages.reduce((s, x) => s + (x.p95 || 0), 0);

    }
    const max = Math.max(...stages.map((x) => Math.max(x.p95 || 0, x.budget))) * 1.08;
    return comp('stage-timeline', { variant: 'aggregate', state: stages.some((s) => stStatus(s) === 'over') ? 'over' : 'on-budget', cls: 'e-stl', attrs: { role: 'list', 'aria-label': 'Stage timeline' } },
      stages.map((s) => {
        const st = stStatus(s);
        const sel = o.selected === s.id;
        return html`<button type="button" class="e-stl__row e-stl__row--${st}${sel ? ' is-sel' : ''}" role="listitem" data-state="${st}" ${act('pf.stage', { id: s.id })} title="${s.label}: p50 ${s.p50 != null ? s.p50 : '–'} ${s.unit || 's'} · p95 ${s.p95 != null ? s.p95 : '–'} ${s.unit || 's'} · budget ${s.budget} ${s.unit || 's'}">
          <span class="e-stl__label">${s.label}</span>
          <span class="e-stl__track">${s.p95 != null ? html`<span class="e-stl__fill" style="width:${((s.p95 / max) * 100).toFixed(1)}%"></span>` : ''}<span class="e-stl__budget" style="left:${((s.budget / max) * 100).toFixed(1)}%" aria-hidden="true"></span></span>
          <span class="e-stl__val np-tnum">${s.p95 != null ? s.p95 + ' ' + (s.unit || 's') : '–'} / ${s.budget}</span>
          <span class="e-stl__st">${st === 'over' ? icon('error', { size: 13, label: 'Over budget' }) : st === 'near' ? icon('warning', { size: 13, label: 'Near budget' }) : ''}</span>
        </button>`;
      }));
  };

  /* ---------------- 48. Bottleneck row ----------------
     bottleneckRow(b, {variant:'over'|'near'|'informational'}) */
  C.bottleneckRow = (b, o) => {
    o = o || {};
    const variant = o.variant || b.status || 'over';
    const ic = { over: 'error', near: 'warning', informational: 'info' }[variant];
    return comp('bottleneck-row', { variant, state: 'default', cls: 'e-bn e-bn--' + variant },
      html`<span class="e-bn__icon">${icon(ic, { size: 14 })}</span>
      <div class="e-bn__main">

        <div class="e-bn__sugg">${icon('wand', { size: 12 })} ${b.suggestion}</div>
      </div>`);
  };
})();

  const L = () => NP.eloc('performance', { period: '7d', type: 'all', tile: null, stage: null, overOnly: false });

  const brief = '# Bring the answer card back under 9 s\n\nGoal: answer cards reach the user within 9 s at p95 (now 9.8 s over 7 days).\n\nEvidence\n- Claude first token: 4.4 s p95 against a budget of 1.5 s, worst right after a session reset (7 of 11 calls).\n- Cards streamed and validated: 1.1 s against 1.0 s.\n\nAsk\n1. Keep the live Claude Code session warm during long calls.\n2. Start partial display as soon as the first card line validates.\n\nFiles: apps/core/src/copilot/session.rs, apps/core/src/copilot/stream.rs';

  const callPerf = (ctx) => {
    const l = L();
    const call = D.call(ctx.params.callId);
    let ticks = D.perfTicks;
    if (l.overOnly) ticks = ticks.filter((t) => t.over);

      <div class="pf-cp-head">${P.checkbox('Over budget only', l.overOnly, { id: 'pf-over-only', bind: 'local.performance.overOnly' })}</div>
      ${ticks.length ? P.table({ variant: 'sortable', label: 'Copilot ticks in this call' }, html`<thead><tr>${P.th('Tick')}${P.th('Time')}${P.th('Trigger')}${P.th('Total')}${P.th('Stages', { width: '34%' })}${P.th('Card')}</tr></thead>
        <tbody>${ticks.map((t) => html`<tr class="${t.over ? 'pf-tick--over' : ''}"><td class="np-tnum">${t.n}</td><td class="np-tnum">${t.t}</td><td>${t.trigger}</td><td class="np-tnum">${t.total}</td>
          <td>${C.stageTimeline({ variant: 'mini', stages: D.perfStages.map((s, i) => Object.assign({}, s, { p95: t.stages[i] })) })}${t.over ? html` <span class="pf-overword">${icon('error', { size: 12 })} over budget</span>` : ''}</td><td>${t.card}</td></tr>`)}</tbody>`)
        : C.emptyState({ variant: 'filtered', title: 'No ticks over budget in this call', actionLabel: 'Show All Ticks', action: ['pf.showAll'] })}
      <p class="np-dim">${call.title} · ${call.date} · ${call.length} · ${D.perfTicks.length} ticks with a card or a drop.</p>
    </div>`;
  };

  NP.screen('performance', {
    section: 'performance',
    title: (ctx) => (ctx.params.callId ? D.call(ctx.params.callId).title : 'Performance'),
    subtitle: (ctx) => (ctx.params.callId ? `${D.call(ctx.params.callId).date} · ${D.call(ctx.params.callId).length} · Call performance` : 'MacBook Pro M5 · 24 GB · macOS 15'),
    toolbarCenter: (ctx) => (ctx.params.callId ? '' : P.segmented([{ value: 'last', label: 'Last Call' }, { value: '7d', label: '7 Days' }, { value: '30d', label: '30 Days' }], L().period, { label: 'Period', action: ['pf.period'] })),
    toolbarActions: (ctx) => (ctx.params.callId
      ? P.button('Open Call', { action: ['nav.go', { screen: 'call-page', params: { callId: ctx.params.callId } }] })
      : html`${P.popup([{ value: 'all', label: 'All calls · 11' }, { value: 'planning', label: 'Planning · 4' }, { value: '1on1', label: '1:1 · 3' }, { value: 'sync', label: 'Backend sync · 2' }], L().type, { label: 'Call type', variant: 'toolbar', bind: 'local.performance.type' })}${P.button('Export Improvement Brief…', { action: ['pf.export'] })}`),
    search: false,
    banners: (ctx) => (ctx.demo === 'rollup-failed' ? [{ id: 'pf-rollup', severity: 'error', text: 'Last night’s roll-up failed', actions: [{ label: 'Run Now', action: ['pf.rollup'] }] }] : []),
    states: [
      { id: 'default', label: 'Normal' },
      { id: 'no-calls', label: 'No calls yet' },
      { id: 'not-enough', label: 'Not enough data' },
      { id: 'loading', label: 'Loading' },
      { id: 'rollup-failed', label: 'Roll-up failed' },
      { id: 'no-repo', label: 'Noter repository not mapped' },
      { id: 'brief-fails', label: 'Brief does not open' },
      { id: 'no-late-ticks', label: 'Call performance: no tick over budget' },
    ],
    onDemo: (id) => { const l = L(); l.tile = null; l.stage = null; l.overOnly = id === 'no-late-ticks'; if (id === 'no-late-ticks') NP.go('performance', { callId: 'c-backend' }, { replace: true }); },
    render: (ctx) => {
      if (ctx.params.callId) return callPerf(ctx);
      const l = L();
      if (ctx.demo === 'no-calls') return C.emptyState({ variant: 'large', icon: 'gauge', title: 'Performance appears after your first call.', body: 'Noter measures every stage of each call on this Mac and compares it with the targets in the PRD.' });
      if (ctx.demo === 'loading') return html`<div class="pf-tiles">${[1, 2, 3, 4, 5, 6].map(() => raw('<div class="e-skel e-skel--tile"></div>'))}</div>`;
      const tiles = D.perfTiles.map((t) => (ctx.demo === 'not-enough' && (t.id === 'post' || t.id === 'confirmed') ? Object.assign({}, t, { status: 'more-data', needed: 3 }) : t));
      const tile = tiles.find((t) => t.id === l.tile);
      let bns = D.perfBottlenecks;
      if (tile) bns = bns.filter((b) => b.metric === tile.id || tile.stages.includes(b.stage));
      if (l.stage) bns = bns.filter((b) => b.stage === l.stage);
      const copied = NP.flashed('pf-copy');
      return html`<div class="pf-wrap">
        ${NP.region('PF-R2', { cls: 'pf-sec', label: 'Targets' }, html`<h2 class="np-section-h">Targets · p95 over the period${tile ? html` <span class="np-dim">· filtered to ${tile.name}</span> ${P.button('Clear', { size: 'small', variant: 'quiet', action: ['pf.tile', { id: tile.id }] })}` : ''}</h2>
          <div class="pf-tiles">${tiles.map((t) => C.metricTile(t, { selected: l.tile === t.id }))}</div>`)}
        <div class="pf-mid">
          ${NP.region('PF-R3', { cls: 'pf-sec pf-card', label: 'Stage timeline' }, html`<h2 class="np-section-h">Stage timeline · copilot tick · p95 against budget</h2>${C.stageTimeline({ stages: D.perfStages, selected: l.stage })}<div class="pf-legend"><span class="pf-legend__b"></span> budget · <span class="pf-legend__h"></span> over budget</div>`)}
          ${NP.region('PF-R4', { cls: 'pf-sec pf-card', label: 'Bottlenecks' }, html`<h2 class="np-section-h">Bottlenecks · ranked by overrun${l.stage ? html` ${P.button('Show All', { size: 'small', variant: 'quiet', action: ['pf.stage', { id: l.stage }] })}` : ''}</h2>
            ${bns.length ? html`<div class="e-list">${bns.map((b) => C.bottleneckRow(b))}</div>` : C.emptyState({ variant: 'section', title: 'No bottleneck for this filter.' })}`)}
        </div>
        ${NP.region('PF-R5', { cls: 'pf-bottom', label: 'Quality, cost and brief' }, html`
          <div class="pf-card"><h2 class="np-section-h">Quality</h2><dl class="np-kv pf-kv">
            <dt>Words corrected</dt><dd class="np-tnum">41</dd><dt>Speaker relabels</dt><dd class="np-tnum">6</dd><dt>Language-ID flips</dt><dd class="np-tnum">3</dd><dt>Cards pinned per card shown</dt><dd class="np-tnum">0.24</dd><dt>Cards dismissed in under 3 s</dt><dd class="np-tnum">9 %</dd></dl></div>
          <div class="pf-card"><h2 class="np-section-h">Cost · 7 days</h2><dl class="np-kv pf-kv">
            <dt>Claude Code</dt><dd class="np-tnum">$4.12</dd><dt>Codex</dt><dd class="np-tnum">$1.06</dd><dt>Local share</dt><dd class="np-tnum">18 %</dd><dt>Total</dt><dd class="np-tnum"><b>$5.18</b></dd><dt>Per call</dt><dd class="np-tnum">$0.47 of $1.00 budget</dd></dl></div>
          <div class="pf-card pf-brief"><h2 class="np-section-h">Improvement brief · preview</h2>
            ${NP.c('promptEditor', { value: brief, variant: 'read-only', key: 'pf-brief' })}
            ${ctx.demo === 'no-repo' ? html`<div class="pf-line">${icon('warning', { size: 12 })} No repository mapped for Noter ${P.button('Add Mapping…', { size: 'small', action: ['settings.open', { pane: 'repositories' }] })}</div>` : ''}
            ${NP.flashed('pf-open-fail') ? html`<div class="pf-line pf-line--err">${icon('error', { size: 12 })} Couldn’t open Claude Code · use Copy as Prompt</div>` : ''}
            <div class="pf-brief__actions">${P.button('Preview', { size: 'small', action: ['pf.export'] })}${P.button('Copy as Prompt', { size: 'small', flashKey: 'pf-copy', action: ['pf.copy'] })}${P.button('Open in Claude Code', { size: 'small', disabled: ctx.demo === 'no-repo', action: ['pf.open', { tool: 'Claude Code' }] })}${P.button('Open in Codex', { size: 'small', disabled: ctx.demo === 'no-repo', action: ['pf.open', { tool: 'Codex' }] })}</div>
          </div>`)}
      </div>`;
    },
  });

  NP.on('pf.period', (a) => { L().period = a.value; });
  NP.on('pf.tile', (a) => { const l = L(); l.tile = l.tile === a.id ? null : a.id; l.stage = null; });
  NP.on('pf.stage', (a) => { const l = L(); l.stage = l.stage === a.id ? null : a.id; });
  NP.on('pf.showAll', () => { L().overOnly = false; });
  NP.on('pf.copy', () => { NP.flash('pf-copy', 'Copied', 2000); });
  NP.on('pf.rollup', () => { state.dismissed = state.dismissed || {}; state.dismissed['pf-rollup'] = true; NP.flash('proto', 'Roll-up runs now · Performance updates when it finishes', 2500); });
  NP.on('pf.open', (a) => {
    if (NP.demo('performance') === 'brief-fails') { NP.flash('pf-open-fail', 'fail', 6000); return; }
    NP.flash('proto', `Opens ${a.tool} in your usual terminal in ~/projects/noter with the brief filled in; nothing runs until you press Return.`, 3500);
  });
  NP.on('pf.export', () => { if (NP.overlays['dlg-brief']) NP.openSheet('dlg-brief', {}); else NP.flash('proto', 'Export Improvement Brief sheet lives in the dialogs module'); return false; });

})();
