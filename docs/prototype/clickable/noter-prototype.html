.fr-cred__stored { display: inline-flex; align-items: center; gap: 6px; color: var(--success); flex: 1 1 auto; }
.fr-runtime { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fr-ok { color: var(--success); }
.fr-privacy { display: grid; gap: 8px; }
.fr-sublabel { font-weight: 600; }

/* ---------- Hotkey recorder ---------- */
.hk-row { display: grid; grid-template-columns: minmax(160px, 1fr) auto; gap: 4px 12px; align-items: center; padding: 6px 0; }
.hk-row.is-disabled { opacity: .5; }
.hk-label { min-width: 0; }
.hk-ctl { display: inline-flex; align-items: center; gap: 6px; justify-self: end; }
.hk-field { min-width: 110px; height: 26px; border: 1px solid var(--ctrl-border-soft); border-radius: var(--r-control); background: var(--ctrl-bg); display: inline-flex; align-items: center; justify-content: center; padding: 0 8px; cursor: pointer; color: var(--label); }
.hk-field.is-rec { outline: 2px solid var(--accent); outline-offset: 0; }
.hk-field.is-ro { cursor: default; background: transparent; }
.hk-field .np-kbd { font-size: 12px; color: var(--label); border: 0; }
.hk-err { grid-column: 1 / -1; display: inline-flex; gap: 5px; align-items: center; color: var(--warning); font-size: 12px; }

/* ---------- Notifications ---------- */
.nt-stack { position: absolute; top: 12px; right: 12px; display: grid; gap: 8px; width: 360px; max-width: calc(100% - 24px); z-index: 3; }
.nt-banner { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; border: 0; background: var(--card-bg); border-radius: var(--r-panel); box-shadow: var(--shadow-pop); padding: 10px 12px; cursor: pointer; color: var(--label); font: inherit; }
.nt-banner:hover { filter: brightness(.98); }
.nt-banner__icon { width: 32px; height: 32px; border-radius: var(--r-row); background: var(--sel-accent); color: var(--accent-text); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.nt-banner__text { display: grid; gap: 2px; min-width: 0; flex: 1 1 auto; }
.nt-banner__top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.nt-banner__body { color: var(--label-2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.nt-centre { position: absolute; right: 12px; top: 120px; width: 360px; max-width: calc(100% - 24px); display: grid; gap: 10px; }
.nt-centre__h { font-weight: 600; font-size: 12px; color: var(--label-2); }
.nt-thread { display: grid; gap: 4px; }
.nt-thread__h { font-size: 11px; color: var(--label-3); }
.nt-thread .nt-banner { box-shadow: none; border: 1px solid var(--sep); }
.nt-scene .a-note { left: 24px; right: auto; top: 280px; }
@media (max-width: 760px) { .nt-centre, .nt-scene .a-note { position: static; width: auto; margin-top: 12px; } .rp-pos { position: static; margin-top: 12px; } .rp-panel { min-width: 0; width: 100%; } }

/* =====================================================================
   Group B — Call window: Call screen (dedicated), Floating panel,
   collapsed strip, and the call components.
   ===================================================================== */

/* prototype controls on the desk (not product UI) */
.cw-proto { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: 0 0 12px; font-size: 11px; }
.cw-proto__lbl { color: var(--label-3); margin-left: 8px; font-weight: 600; }
.cw-proto__lbl:first-child { margin-left: 0; }
.cw-proto__btn { border: 1px solid var(--ctrl-border-soft); background: var(--card-bg); color: var(--label-2); border-radius: var(--r-tag); padding: 2px 7px; cursor: pointer; font-size: 11px; }
.cw-proto__btn.is-on { background: var(--chrome-bg); color: var(--chrome-fg); border-color: var(--chrome-bg); }
.cw-proto-note { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--label-2); background: var(--card-bg); border: 1px dashed var(--ctrl-border-soft); border-radius: var(--r-control); padding: 6px 10px; margin: 0 0 10px; }
.cw-hidden { max-width: 520px; margin: 40px auto; display: grid; justify-items: center; gap: 8px; text-align: center; padding: 32px; border: 1px dashed var(--ctrl-border-soft); border-radius: var(--r-panel); color: var(--label-2); background: var(--card-bg); }
.cw-hidden .t-headline { color: var(--label); }
.cw-hidden__btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }

/* window frames */
.cw-frame--dedicated { overflow-x: auto; }
.cw-win--dedicated { width: 100%; min-width: 1120px; max-width: 1600px; height: calc(100vh - 200px); min-height: 640px; max-height: 1000px; border-radius: var(--r-control); }
.cw-desktop { display: flex; gap: 20px; align-items: flex-start; min-width: 0; }
.cw-callapp { flex: 1 1 0; min-width: 0; max-width: 820px; height: 560px; border-radius: var(--r-card); background: var(--sel-unemph); border: 1px dashed var(--ctrl-border-soft); display: flex; flex-direction: column; overflow: hidden; }
.cw-callapp__bar { padding: 8px 12px; font-size: 12px; color: var(--label-3); border-bottom: 1px dashed var(--ctrl-border-soft); }
.cw-callapp__grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; }
.cw-callapp__grid span { display: flex; align-items: flex-end; padding: 8px; border-radius: var(--r-row); background: var(--sel-unemph); color: var(--label-3); font-size: 12px; }
.cw-floatwrap { flex: none; width: 420px; max-width: 100%; }
.cw-win--floating { width: 420px; max-width: 100%; border-radius: var(--r-panel); }
.cw-win--floating.is-collapsed { height: 56px; }
@media (max-width: 760px) { .cw-desktop { flex-direction: column; } .cw-callapp { display: none; } }

/* ---------------- Call screen (dedicated) ---------------- */
.cs { display: flex; flex-direction: column; height: 100%; min-height: 0; background: var(--content-bg); }
.cs-r0 { flex: none; }
.cs-cols { flex: 1 1 auto; min-height: 0; display: flex; }
.cs-left { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--sep); }
.cs.is-copilot-off .cs-left { border-right: 0; }
.cs-right { flex: 0 0 34%; min-width: 420px; max-width: 640px; display: flex; flex-direction: column; min-height: 0; background: var(--win-bg); }
.cs-r1, .cs-r4a { flex: none; min-height: 64px; padding: 10px 18px; border-bottom: 1px solid var(--sep); display: grid; gap: 6px; background: var(--content-bg); }
.cs-r4a { background: var(--win-bg); }
.cs-r1__line { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.cs-r1__people { gap: 10px; }
.cs-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cs-latency { font-size: 12px; }
.cs-r3 { flex: none; padding: 8px 18px 0; }
.cs-r2 { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; position: relative; }
.cs-r2b { flex: none; border-top: 1px solid var(--sep); }
.cs-r4b { flex: none; padding: 8px 18px; border-bottom: 1px solid var(--sep); display: grid; }
.cs-r4d { flex: none; padding: 8px 14px 0; }
.cs-r4c { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 12px 14px; }
.cs-r4e { flex: none; border-top: 1px solid var(--sep); padding: 10px 14px; display: grid; gap: 8px; max-height: 45%; overflow: auto; }
.cs-r4e__chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.cs-earlier__list { display: grid; gap: 8px; margin-top: 8px; }
.cs-earlier__row { display: flex; gap: 8px; align-items: flex-start; }
.cs-earlier__row > .cw-card { flex: 1 1 auto; min-width: 0; }
.cs--closing { align-items: center; justify-content: center; }

/* ---------------- Floating panel ---------------- */
.fp { display: flex; flex-direction: column; min-height: 300px; background: var(--content-bg); }
.fp-r1 { flex: none; height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--sep); background: var(--win-bg); cursor: grab; }
.fp-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
.fp-clock { color: var(--label-2); font-size: 12px; }
.fp-r0 { flex: none; max-height: 70%; overflow: auto; }
.fp-r2 { flex: none; padding: 6px 12px; border-bottom: 1px solid var(--sep); display: grid; gap: 2px; }
.fp-r2__line { display: flex; align-items: center; gap: 6px; min-height: 22px; }
.fp-r2__legend { font-size: 11px; }
.fp-r3 { flex: none; padding: 8px 10px 0; display: grid; gap: 6px; }
.fp-r4 { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px; }
.fp-ask { margin-bottom: 8px; display: grid; }
.fp-r5 { flex: none; border-top: 1px solid var(--sep); padding: 4px 10px; }
.fp-r5--full { flex: 1 1 auto; overflow: auto; border-top: 0; }
.fp-r6 { flex: none; border-top: 1px solid var(--sep); }

/* ---------------- 2. Capture notice ---------------- */
.cw-notice { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px 16px; background: var(--card-bg); border-bottom: 1px solid var(--sep); flex-wrap: wrap; }
.cw-notice__icon { color: var(--accent-text); padding-top: 1px; display: inline-flex; }
.cw-notice--warning .cw-notice__icon { color: var(--warning); }
.cw-notice--success .cw-notice__icon { color: var(--success); }
.cw-notice__main { flex: 1 1 280px; min-width: 0; display: grid; gap: 4px; }
.cw-notice__title { font: 600 15px/20px var(--font); text-wrap: balance; }
.cw-notice__body { color: var(--label-2); }
.cw-notice__actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.cw-notice__confirm { font-weight: 600; color: var(--error); margin-right: 4px; }
.cw-notice__bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--sel-unemph); }
.cw-notice__bar span { display: block; height: 100%; background: var(--warning); transition: width 1s linear; }
.cw-notice.is-floating { padding: 12px; gap: 10px; }
.cw-notice.is-floating .cw-notice__main { flex: 1 1 0; }
.cw-notice.is-floating .cw-notice__actions { flex-direction: column; align-items: stretch; width: 100%; }
.cw-notice.is-floating .cw-notice__title { font-size: 13px; line-height: 18px; }
.cw-meters { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--label-2); }
.cw-closing { width: min(760px, 100%); margin: 40px auto; border: 1px solid var(--sep); border-radius: var(--r-card); overflow: hidden; }
.cw-closing.is-floating { margin: 0; border: 0; border-radius: 0; width: 100%; }
.cw-closing .cw-notice { border-bottom: 0; }
.cw-closing__hint { padding: 0 18px 14px; font-size: 12px; }

/* ---------------- 5. Call status strip ---------------- */
.cw-strip { display: flex; align-items: center; gap: 12px; min-width: 0; }
.cw-strip--dedicated { flex: none; height: 60px; padding: 0 18px; border-top: 1px solid var(--sep); background: var(--win-bg); }
.cw-strip__clock { min-width: 84px; }
.cw-strip__budget { color: var(--label-2); font-size: 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.cw-strip__budget.is-warn { color: var(--warning); }
.cw-strip__fb { min-width: 0; overflow: hidden; display: inline-flex; }
.cw-strip__gap { width: 8px; flex: none; }
.cw-strip--dedicated .np-btn { height: 32px; }
.cw-strip--compact { flex-direction: column; align-items: stretch; gap: 0; padding: 0 10px; }
.cw-strip__row { display: flex; align-items: center; gap: 6px; height: 44px; }
.cw-strip--compact .cw-strip__fb { padding-top: 6px; }
.cw-stop { color: var(--rec); }

/* ---------------- 6. Collapsed strip ---------------- */
.cw-cstrip { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; background: var(--card-bg); min-width: 300px; }
.cw-cstrip__state { display: flex; align-items: center; gap: 6px; flex: none; font-size: 12px; }
.cw-cstrip__card { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; border-left: 1px solid var(--sep); padding-left: 10px; }
.cw-cstrip__card > [data-component] { min-width: 0; flex: 1 1 auto; }
.cw-cstrip__hover { display: none; flex: none; }
.cw-cstrip:hover .cw-cstrip__hover, .cw-cstrip:focus-within .cw-cstrip__hover { display: inline-flex; }
.cw-cstrip__ctl { display: flex; align-items: center; gap: 4px; flex: none; }

/* ---------------- 8/9. Transcript ---------------- */
.cw-tv { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; position: relative; }
.cw-tv__scroll { flex: 1 1 auto; overflow: auto; padding: 10px 18px 52px; scroll-behavior: smooth; }
.cw-tv--tail .cw-tv__scroll, .cw-tv--post-call .cw-tv__scroll { padding: 4px 0; overflow: visible; }
.cw-tv--post-call .cw-tv__scroll { padding: 6px 0 40px; }
.cw-tv__find { display: flex; align-items: center; gap: 8px; padding: 0 0 10px; flex-wrap: wrap; }
.cw-tv__find .np-search { width: 260px; }
.cw-tv__header { font-size: 12px; padding: 0 0 6px; }
.cw-tv__jump { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; pointer-events: none; }
.cw-jump { pointer-events: auto; box-shadow: var(--shadow-pop); border-radius: var(--r-capsule); }
.cw-tv__waiting { flex: 1; display: grid; place-content: center; justify-items: center; gap: 10px; padding: 40px; }
.cw-seg { display: grid; grid-template-columns: 64px 128px minmax(0, 1fr) auto; gap: 0 12px; align-items: baseline; padding: 5px 6px; border-radius: var(--r-control); font: 400 15px/22px var(--font); }
.cw-seg:hover { background: var(--sel-unemph); }
.cw-tv--post-call .cw-seg { font: 400 13px/19px var(--font); grid-template-columns: 64px 120px minmax(0, 1fr) auto; }
.cw-seg__time { font: 400 12px/22px var(--font); color: var(--label-3); font-variant-numeric: tabular-nums; }
.cw-seg[data-variant="crosstalk"] .cw-seg__spk .np-spk { white-space: normal; }
.cw-seg__spk { min-width: 0; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.cw-seg__text { min-width: 0; overflow-wrap: anywhere; hyphens: auto; }
.cw-seg__text.is-lowconf { text-decoration: underline dotted var(--label-3); text-underline-offset: 3px; }
.cw-seg__trans { display: block; font-size: 12px; color: var(--label-3); }
.cw-seg__end { display: inline-flex; align-items: center; gap: 6px; align-self: center; }
.cw-seg__acts { display: inline-flex; gap: 2px; align-items: center; visibility: hidden; }
.cw-seg:hover .cw-seg__acts, .cw-seg:focus-within .cw-seg__acts, .cw-seg.is-playing .cw-seg__acts { visibility: visible; }
.cw-seg--hyp { color: var(--label-2); }
.cw-seg--mark { color: var(--accent-text); font-size: 13px; }
.cw-seg__marktext { grid-column: 2 / -1; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.cw-seg--gap .cw-seg__gaptext { grid-column: 2 / -1; font-size: 12px; color: var(--label-3); border-top: 1px dashed var(--sep); border-bottom: 1px dashed var(--sep); padding: 2px 0; }
.cw-seg--tail { grid-template-columns: 52px 72px minmax(0, 1fr) auto; font: 400 12px/17px var(--font); padding: 2px 0; }
.cw-seg--tail .cw-seg__time { font-size: 11px; line-height: 17px; }
.cw-seg--tail .cw-seg__text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cw-seg.is-playing { background: var(--sel-accent); }
.cw-term { border: 0; background: transparent; padding: 0; font: inherit; color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; cursor: pointer; }
.cw-term__sugg { font-size: 11px; }

/* ---------------- 13. Playback bar ---------------- */
.cw-pb { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; background: var(--win-bg); min-width: 0; flex-wrap: nowrap; }
.cw-pb--post-call { height: 44px; border-top: 1px solid var(--sep); }
.cw-pb__scrub { width: 160px; min-width: 60px; flex: 0 1 160px; accent-color: var(--accent-fill); }
.cw-pb__time { font-size: 12px; color: var(--label-2); }
.cw-pb__spk { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.cw-pb__line { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fp-r5 .cw-pb { padding: 0; background: transparent; }
.fp-r5 .cw-pb__scrub { width: 80px; flex-basis: 80px; }
.fp-r5 .cw-pb__line { display: none; }

/* ---------------- 14/15. Cards ---------------- */
.cw-stack { display: grid; gap: 10px; }
.cw-stack__held { display: flex; justify-content: center; }
.cw-stack__listen { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 18px 6px; text-wrap: balance; }
.cw-stack__more { display: flex; justify-content: center; }
.cw-legend { font-size: 12px; color: var(--label-2); display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.cw-legend b { font-weight: 600; color: var(--label); }
.cw-card { background: var(--card-bg); border: 1px solid var(--sep); border-radius: var(--r-card); padding: 10px 12px; display: grid; gap: 6px; }
.cw-card.is-new { animation: cw-arrive 200ms ease-out; }
@keyframes cw-arrive { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
.cw-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cw-card__head { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; }
.cw-card__kind { font-weight: 600; white-space: nowrap; }
.cw-card__age { white-space: nowrap; }
.cw-num { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; border-radius: var(--r-tag); border: 1px solid var(--ctrl-border-soft); font: 600 11px/1 var(--font); color: var(--label-2); font-variant-numeric: tabular-nums; flex: none; }
.cw-card__body { font: 400 15px/21px var(--font); cursor: pointer; }
.cw-card--floating .cw-card__body { font: 400 13px/19px var(--font); }
.cw-card--read-only .cw-card__body { font: 400 13px/18px var(--font); cursor: default; }
.cw-card--read-only { animation: none; padding: 8px 10px; }
.cw-card.is-aged .cw-card__body { color: var(--label-2); }
.cw-card__q { color: var(--label-2); font-style: italic; margin-bottom: 2px; }
.cw-card__asked { margin-top: 6px; font-size: 13px; }
.cw-card__writing { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.cw-card__foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.cw-card__prov { min-width: 0; max-width: 100%; display: inline-flex; }
.cw-card__exp { display: grid; gap: 4px; border-top: 1px solid var(--sep); padding-top: 6px; font-size: 12px; }
.cw-card__quote { font-style: italic; }
.cw-card__fb { display: flex; gap: 4px; align-items: center; }
.cw-peek { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; }
.cw-peek__kind { flex: none; }
.cw-peek__text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-size: 12px; }

/* ---------------- 18. Context chip ---------------- */
.cw-cchip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: var(--r-capsule); border: 1px solid var(--sep); background: var(--card-bg); color: var(--label); font-size: 12px; cursor: pointer; max-width: 220px; }
.cw-cchip:hover { background: var(--sel-unemph); }
.cw-cchip__label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cw-cchip.is-dropped { cursor: default; color: var(--label-3); border-style: dashed; }

/* ---------------- 35. Person picker + popovers ---------------- */
.cw-pp { display: grid; gap: 6px; }
.cw-pp .np-field { width: 100%; }
.cw-pp__list { display: grid; max-height: 240px; overflow: auto; border: 1px solid var(--sep); border-radius: var(--r-row); padding: 4px; }
.cw-pp__hdr { font: 600 11px/14px var(--font); color: var(--label-3); padding: 6px 6px 2px; }
.cw-pp__opt { display: flex; align-items: center; gap: 8px; text-align: left; border: 0; background: transparent; padding: 4px 6px; border-radius: var(--r-control); cursor: pointer; color: var(--label); }
.cw-pp__opt:hover { background: var(--sel-unemph); }
.cw-pp__opt.is-sel { background: var(--accent-fill); color: var(--on-accent); }
.cw-pp__opt.is-sel .cw-pp__role { color: inherit; opacity: .85; }
.cw-pp__optmain { display: grid; min-width: 0; }
.cw-pp__name { font-weight: 600; }
.cw-pp__role { font-size: 11px; color: var(--label-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cw-pp__new { color: var(--accent-text); border-top: 1px solid var(--sep); border-radius: 0 0 6px 6px; margin-top: 2px; }
.cw-pp__none { padding: 6px; color: var(--label-2); }
.cw-pp__lbl { display: grid; gap: 3px; font-size: 12px; color: var(--label-2); }
.cw-pp__lbl .np-field, .cw-pp__lbl .np-popup { width: 100%; }
.cw-pp__lbl .np-popup select { width: 100%; }
.cw-pp__dup { display: grid; grid-template-columns: auto 1fr; gap: 4px 6px; font-size: 12px; color: var(--label-2); background: var(--info-tint); border-radius: var(--r-control); padding: 6px 8px; }
.cw-pp__dupacts { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.cw-pp__foot { display: flex; gap: 8px; align-items: center; }
.cw-span { display: grid; gap: 4px; font-size: 12px; }
.cw-span__row { padding: 3px 6px; border-radius: var(--r-tag); }
.cw-pinrow { display: flex; align-items: center; gap: 6px; }
.cw-pinrow__text { flex: 1 1 auto; min-width: 0; font-size: 12px; }
.cw-shield { display: inline-flex; color: var(--label-2); padding: 0 4px; }

/* compact banners keep the icon beside the sentence */
.fp-r3 .np-banner.is-compact .np-banner__main { flex: 1 1 0; }
.cw-stack__listen > span:not([data-component]) { flex: 1 1 0; min-width: 160px; }
.cw-closing .cw-notice__main { flex-basis: 360px; }
/* field variant of the person picker: suggestions drop below the field */
.cw-pp--field { position: relative; display: block; min-width: 180px; }
.cw-pp--field .np-field { width: 100%; }
.cw-pp__list--drop { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 6; background: var(--card-bg); box-shadow: var(--shadow-pop); }

/* Group C — Call page, inspectors, handoff drawer, dialogs */
.pc { max-width: 960px; }
.pc-col { display: grid; gap: 22px; max-width: 760px; }
.pc--summary > .np-undo, .pc--summary > .pc-name { max-width: 760px; margin-bottom: 18px; }

/* Output section */
.pc-sec { display: grid; gap: 6px; }
.pc-sec__head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-height: 28px; }
.pc-sec__title { font: 600 13px/18px var(--font); display: inline-flex; align-items: center; gap: 6px; flex: 1 1 auto; min-width: 0; }
.pc-sec__count { font-weight: 400; color: var(--label-2); }
.pc-sec__actions { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.pc-sec__meta { font: 400 12px/16px var(--font); color: var(--label-3); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pc-sec__notice { font-size: 12px; color: var(--label-2); background: var(--sel-unemph); border-radius: var(--r-control); padding: 4px 8px; justify-self: start; display: inline-flex; gap: 4px; flex-wrap: wrap; }
.pc-sec__body { min-width: 0; }
.pc-sec--summary .pc-sec__body { padding-top: 2px; }
.pc-prose { max-width: 68ch; line-height: 1.5; text-wrap: pretty; }
.pc-sec__rejected { padding-top: 4px; }
.pc-sec__rejlist { list-style: none; margin: 6px 0 0; padding: 0 0 0 18px; display: grid; gap: 6px; }
.pc-sec__rejlist li { display: flex; align-items: center; gap: 10px; }
.pc-rows { display: grid; border-top: 1px solid var(--sep); }
.pc-skel { display: grid; gap: 8px; padding: 6px 0; }
.pc-skel__line { height: 11px; border-radius: var(--r-tag); background: linear-gradient(90deg, var(--sel-unemph), var(--sep), var(--sel-unemph)); background-size: 200% 100%; animation: pc-shimmer 1.4s linear infinite; }
@keyframes pc-shimmer { to { background-position: -200% 0; } }
.pc-edit { display: grid; gap: 8px; }
.pc-edit .np-field { width: 100%; }
.pc-edit__acts { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.pc-add { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.pc-add .np-field { flex: 1 1 auto; }
.pc-pp { display: grid; gap: 4px; }
.pc-pp__list { margin: 2px 0 6px 18px; padding-left: 14px; color: var(--label-2); }
.pc-mark { display: flex; align-items: center; gap: 8px; color: var(--label-2); }
.pc-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.pc-cards__c { display: grid; gap: 4px; min-width: 0; }
.pc-cards__out { font-size: 11px; color: var(--label-3); }

/* Item rows */
.it-row { min-width: 0; }
.it-row--full { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 4px 8px; padding: 9px 4px; border-bottom: 1px solid var(--sep); align-items: start; border-radius: var(--r-tag); }
.it-row--full:focus, .it-row--full.is-focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.it-row__check { padding-top: 2px; }
.it-row__glyph { color: var(--label-3); display: inline-flex; }
.it-row__main { min-width: 0; display: grid; gap: 3px; }
.it-row__line1 { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.it-row__line1 .np-person { flex: none; }
.it-row__text { min-width: 0; }
.it-row--full .it-row__text { overflow-wrap: anywhere; }
.it-row__line2 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12px; color: var(--label-2); }
.it-row__actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.it-row__review { display: flex; gap: 4px; }
.it-row__review .np-btn .np-kbd { display: none; }
.it-row__due.is-overdue { color: var(--warning); display: inline-flex; gap: 3px; align-items: center; }
.it-row__meta { color: var(--label-3); font-size: 12px; }
.it-row__closed { color: var(--success); font-size: 12px; }
.it-row.is-done .it-row__text { text-decoration: line-through; color: var(--label-2); }
.it-row--compact { padding: 4px 0; }
.it-row__line { display: flex; align-items: center; gap: 8px; min-width: 0; }
.it-row--compact .it-row__text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
.it-row--compact .it-row__due, .it-row--compact .np-badge, .it-row--compact .np-prov { flex: none; }
.it-row__call { flex: none; font-size: 12px; }
.it-row__outcome { padding: 2px 0 0 24px; }
.it-row.is-outcome { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--sep); }
.it-row__ghost { color: var(--label-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.it-row__ghost.is-rej { text-decoration: line-through; }
.it-row__landed { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px; margin-top: 4px; background: var(--info-tint); border-radius: var(--r-control); }
.it-row__bullet { color: var(--label-3); }
.it-row--editing { grid-template-columns: 1fr; }
.it-row__edit { display: grid; gap: 8px; }
.it-row__edit-text { width: 100%; }
.it-row__edit-fields { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.it-field { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--label-2); }
.it-field__due { width: 120px; }

/* Speaker naming panel */
.pc-name { border: 1px solid var(--sep); border-radius: var(--r-card); background: var(--card-bg); padding: 10px 14px; display: grid; gap: 8px; }
.pc-name--compact { display: flex; align-items: center; gap: 10px; padding: 6px 12px; color: var(--label-2); justify-self: start; }
.pc-name__head { display: flex; align-items: center; gap: 8px; }
.pc-name__list { list-style: none; margin: 0; padding: 0; display: grid; }
.pc-name__row { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 6px 12px; padding: 10px 0; border-top: 1px solid var(--sep); align-items: start; }
.pc-name__label { display: grid; gap: 2px; font-size: 12px; }
.pc-name__body { display: grid; gap: 6px; min-width: 0; }
.pc-name__quote { color: var(--label-2); font-style: italic; }
.pc-name__pick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.pc-name__chips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.pc-name__chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--ctrl-border-soft); background: var(--ctrl-bg); border-radius: var(--r-capsule); padding: 2px 8px 2px 3px; cursor: pointer; font-size: 12px; color: var(--label); }
.pc-name__chip:hover { background: var(--sel-unemph); }
.pc-name__chip.is-sel { border-color: var(--accent); background: var(--sel-accent); }
.pc-name__acts { display: flex; gap: 6px; }
.pc-name__done { padding: 8px 0; border-top: 1px solid var(--sep); }
.pc-name__skipped ul { margin: 4px 0 0 18px; padding: 0; list-style: none; display: grid; gap: 4px; }
@media (max-width: 1180px) { .pc-name__row { grid-template-columns: minmax(0, 1fr); } }

/* Transcript view host */
.pc-tr { display: grid; gap: 12px; max-width: 960px; }
.pc-tr__head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; }
.pc-play { position: sticky; bottom: -40px; }

/* Diff, prompt editor, history */
.pc-diff { display: grid; gap: 6px; border: 1px solid var(--sep); border-radius: var(--r-row); padding: 8px 10px; background: var(--card-bg); }
.pc-diff__head { font-size: 12px; color: var(--label-2); display: flex; align-items: center; gap: 5px; }
.pc-diff__text { white-space: pre-wrap; line-height: 1.5; }
.pc-diff ins, .pc-diff del { color: inherit; }
.pc-diff__cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pc-diff__colh { font: 600 11px/14px var(--font); color: var(--label-3); margin-bottom: 4px; }
.pc-prompt { display: grid; gap: 6px; }
.pc-prompt__head { display: flex; align-items: center; gap: 6px; min-width: 0; }
.pc-prompt__cap { color: var(--label-2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-prompt__area { width: 100%; min-height: 240px; border: 1px solid var(--ctrl-border-soft); border-radius: var(--r-row); background: var(--ctrl-bg); padding: 8px 10px; color: var(--label); resize: vertical; white-space: pre-wrap; margin: 0; }
.pc-prompt__area:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.pc-prompt__area.is-diff { padding: 6px; }
.pc-prompt__area.is-ro { min-height: 160px; overflow: auto; }
.pc-prompt__diffnote { font-size: 11px; color: var(--label-3); padding: 0 4px 4px; }
.pc-ver .np-popup select { font-size: 12px; height: 22px; }
.pc-hist { display: grid; gap: 12px; }
.pc-hist__filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pc-hist__group { display: grid; gap: 4px; }
.pc-hist__day { font: 600 11px/14px var(--font); color: var(--label-3); position: sticky; top: -20px; background: var(--content-bg); padding: 4px 0; z-index: 1; }
.pc-hist__list { list-style: none; margin: 0; padding: 0; display: grid; }
.pc-chg { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 10px; padding: 8px 4px; border-bottom: 1px solid var(--sep); align-items: start; }
.pc-chg:hover { background: var(--sel-unemph); }
.pc-chg__time { color: var(--label-3); font-size: 12px; padding-top: 1px; }
.pc-chg__main { min-width: 0; display: grid; gap: 4px; }
.pc-chg__line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.pc-chg__actor { font-size: 12px; color: var(--label-2); background: var(--sel-unemph); border-radius: var(--r-tag); padding: 0 5px; }
.pc-chg__err { color: var(--error); }
.pc-chg__meta { font-size: 12px; color: var(--label-3); }
.pc-chg__actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.pc-chg.is-undone .pc-chg__what { color: var(--label-3); text-decoration: line-through; }
.pc-chg__recs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12px; }
.pc-chg__recs .pc-diff { display: inline-grid; padding: 2px 6px; margin-left: 4px; }
.pc-chg__recs .pc-diff__head { display: none; }
.pc-hist--item .pc-chg { grid-template-columns: 38px minmax(0, 1fr); }
.pc-hist--item .pc-chg__actions { grid-column: 2; justify-content: flex-start; }

/* Inspectors */
.pc-info, .it-ins { display: grid; gap: 0; font-size: 13px; }
.it-ins__head { display: flex; align-items: center; gap: 6px; padding: 12px 14px 8px; position: sticky; top: 0; background: var(--content-bg); z-index: 2; }
.pc-info__sec { padding: 10px 14px; border-top: 1px solid var(--sep); display: grid; gap: 8px; justify-items: start; }
.pc-info__sec .np-kv, .pc-info__sec .np-search { width: 100%; }
.pc-info__h { font: 600 11px/14px var(--font); color: var(--label-3); margin-top: 4px; }
.pc-info__people { display: flex; flex-wrap: wrap; gap: 6px 12px; }
.pc-info__row { display: flex; align-items: center; gap: 6px; }
.it-ins__tabs { padding: 0 14px 8px; }
.it-ins__body { padding: 4px 14px 16px; display: grid; gap: 12px; }
.it-ins__body > .np-field { width: 100%; }
.it-ins__kv { grid-template-columns: 82px minmax(0, 1fr); }
.it-ins__kv .np-field { width: 100%; }
.it-ins__help { font-size: 11px; color: var(--label-3); margin-top: 3px; }
.it-ins__due .np-field__input { padding-right: 26px; }
.it-ins__due { position: relative; }
.it-ins__due .np-ibtn { position: absolute; right: 3px; top: 3px; }
.it-ins__review, .it-ins__closed { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
.it-ins__closed { color: var(--success); }
.it-ins__ev { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12px; }
.it-ins__ev li { display: flex; gap: 6px; align-items: center; min-width: 0; color: var(--label-2); }
.it-ins__quote { margin: 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--evidence); border-radius: 0 6px 6px 0; font-size: 12px; }
.it-ins__rec { font-size: 12px; color: var(--label-2); display: flex; gap: 6px; align-items: center; }
.it-ins__save { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }

/* Handoff drawer */
.hd { display: flex; flex-direction: column; min-height: 100%; }
.hd__head { display: flex; align-items: center; gap: 6px; padding: 10px 12px; min-height: 44px; border-bottom: 1px solid var(--sep); position: sticky; top: 0; background: var(--content-bg); z-index: 2; }
.hd__titles { display: grid; min-width: 0; flex: 1 1 auto; }
.hd__item { font-size: 12px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hd__body { display: grid; gap: 12px; padding: 12px 14px; flex: 1 1 auto; align-content: start; }
.hd__row { display: flex; align-items: center; gap: 10px; }
.hd__row .np-popup { flex: 1 1 auto; min-width: 0; }
.hd__row .np-popup select { width: 100%; }
.hd__lab { font-size: 12px; color: var(--label-2); width: 76px; flex: none; }
.hd__launch { font-size: 12px; color: var(--label-2); display: flex; gap: 6px; align-items: flex-start; }
.hd__launch .np-ic { margin-top: 2px; }
.hd__warn { color: var(--warning); font-size: 12px; display: flex; gap: 5px; align-items: flex-start; flex-wrap: wrap; }
.hd__err { color: var(--error); font-size: 12px; display: flex; gap: 5px; align-items: center; }
.hd__rec { color: var(--success); font-size: 12px; display: flex; gap: 5px; align-items: center; }
.hd__accept { font-size: 12px; color: var(--label-2); background: var(--sel-unemph); padding: 6px 8px; border-radius: var(--r-control); }
.hd__foot { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--sep); background: var(--content-bg); }
.hd-gen { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--label-2); margin-bottom: 6px; }

/* Dialogs */
.dlg-field { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 12px; align-items: start; }
.dlg-field__lab { font-size: 13px; color: var(--label-2); padding-top: 5px; text-align: right; }
.dlg-field__ctl { display: grid; gap: 4px; justify-items: start; min-width: 0; }
.dlg-field__ctl > .np-field, .dlg-field__ctl > .np-search { width: 100%; }
.dlg-field__note { font-size: 11px; color: var(--label-3); }
@media (max-width: 640px) { .dlg-field { grid-template-columns: 1fr; } .dlg-field__lab { text-align: left; padding: 0; } }
.dlg-checks { display: grid; gap: 8px; }
.dlg-note { font-size: 12px; color: var(--label-2); display: flex; gap: 6px; align-items: center; }
.dlg-preview { font-size: 13px; background: var(--sel-unemph); border-radius: var(--r-row); padding: 8px 10px; display: flex; gap: 8px; align-items: flex-start; }
.dlg-inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; width: 100%; }
.dlg-inline > .np-field { flex: 1 1 200px; }
.dlg-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dlg-row2 .dlg-field { grid-template-columns: 1fr; }
.dlg-row2 .dlg-field__lab { text-align: left; padding: 0; }
.dlg-warn { color: var(--warning); display: inline-flex; gap: 4px; align-items: center; }
.dlg-capture { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dlg-capture__h { font: 600 11px/14px var(--font); color: var(--label-3); margin-bottom: 4px; }
.dlg-capture__img { height: 110px; border: 1px solid var(--sep); border-radius: var(--r-row); background: var(--win-bg); display: grid; place-content: center; justify-items: center; gap: 6px; color: var(--label-3); font-size: 12px; }
.dlg-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.dlg-cal__h { font-size: 11px; color: var(--label-3); padding: 2px 0; }
.dlg-cal__d { border: 0; background: transparent; height: 28px; border-radius: var(--r-control); cursor: pointer; font-variant-numeric: tabular-nums; color: var(--label); }
.dlg-cal__d:hover { background: var(--sel-unemph); }
.dlg-cal__d.is-today { color: var(--accent-text); font-weight: 600; }
.dlg-cal__d.is-sel { background: var(--accent-fill); color: var(--on-accent); }
.pc-info dl, .it-ins dl { margin: 0; }
.dlg-perm { display: flex; align-items: center; gap: 8px; margin: 10px 0; padding: 8px 10px; border-radius: var(--r-row, 9px); background: var(--fill-2, rgba(0,0,0,.04)); font-size: 12px; }

/* Group D — Library, Ask, People (prefixes lb-, ak-, pe-) */

/* ---------- Library: filter bar, search, tables ---------- */
.lb-r-filter { margin: -20px -24px 14px; padding: 6px 24px; border-bottom: 1px solid var(--sep); background: var(--content-bg); position: sticky; top: -20px; z-index: 4; }
.lb-fb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 24px; }
.lb-fb__btn.is-set { color: var(--accent-text); border-color: var(--accent-text); }
.lb-fb__toggle.is-set { background: var(--sel-accent); }
.lb-searchwrap { position: relative; display: inline-flex; flex: 0 1 360px; min-width: 200px; }
.lb-search { width: 100%; }
.lb-tsearch, .pe-search { width: 240px; }
.lb-sugg { position: absolute; top: 32px; left: 0; right: 0; z-index: 30; background: var(--card-bg); border-radius: var(--r-row); box-shadow: var(--shadow-pop); padding: 5px; display: grid; }
.lb-table td { vertical-align: middle; }
.lb-month th { position: static; background: var(--win-bg); color: var(--label-2); font: 600 11px/14px var(--font); padding: 5px 10px; }
.lb-crow { height: 44px; }
.lb-crow td { padding-top: 5px; padding-bottom: 5px; }
.lb-crow.is-sel { background: var(--sel-accent); }
.lb-crow__when { white-space: nowrap; color: var(--label-2); }
.lb-crow__call { min-width: 0; max-width: 480px; }
.lb-crow__l1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.lb-crow__title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-crow__l2 { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--label-2); margin-top: 2px; min-width: 0; flex-wrap: nowrap; overflow: hidden; }
.lb-crow__people { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-langs { display: inline-flex; gap: 3px; flex: none; }
.lb-tag { font-weight: 400; color: var(--label-2); height: 16px; }
.lb-more { font-size: 11px; }
.lb-crow__type, .lb-crow__len { white-space: nowrap; color: var(--label-2); }
.lb-crow__status { white-space: nowrap; }
.lb-status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--label-2); max-width: 180px; overflow: hidden; }
.lb-status span { overflow: hidden; text-overflow: ellipsis; }
.lb-status--error { color: var(--error); }
.lb-audiodel { display: inline-flex; position: relative; color: var(--label-3); margin-left: 6px; vertical-align: middle; }
.lb-audiodel__x { position: absolute; left: -1px; top: 6px; width: 15px; height: 1.5px; background: currentColor; transform: rotate(-35deg); }
.lb-hint { margin: 8px 2px 0; font-size: 11px; color: var(--label-3); }
.lb-skel { display: grid; gap: 1px; border: 1px solid var(--sep); border-radius: var(--r-row); overflow: hidden; }
.lb-skel__row { display: grid; grid-template-columns: 110px 1fr 120px; gap: 16px; padding: 14px 12px; background: var(--card-bg); }
.lb-skel__row span { height: 10px; border-radius: var(--r-tag); background: var(--sel-unemph); }
.lb-ttable .lb-trow { cursor: pointer; }
.lb-trow__name { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.lb-merge { color: var(--accent-text); }

/* ---------- Library: search results ---------- */
.lb-info { display: grid; gap: 8px; margin-bottom: 14px; max-width: 960px; }
.lb-info__line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; }
.lb-info__kw { display: inline-flex; align-items: center; gap: 8px; color: var(--label-2); }
.lb-results { display: grid; gap: 22px; max-width: 960px; padding-bottom: 60px; }
.lb-topicsugg { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.lb-sec { display: grid; gap: 6px; }
.lb-items { display: grid; gap: 2px; }
.lb-group { border: 1px solid var(--sep); border-radius: var(--r-row); background: var(--card-bg); margin-bottom: 8px; overflow: hidden; }
.lb-grouph { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 12px; background: var(--win-bg); border-bottom: 1px solid var(--sep); }
.lb-grouph__title { font-weight: 600; color: var(--label); text-decoration: none; }
.lb-grouph__title:hover { text-decoration: underline; }
.lb-grouph__meta { font-size: 12px; color: var(--label-2); }
.lb-group__more { padding: 6px 12px 8px 146px; font-size: 12px; }
.lb-res { display: grid; grid-template-columns: 96px 64px minmax(0, 1fr) auto 26px 26px; align-items: center; gap: 8px; padding: 7px 8px 7px 12px; border-bottom: 1px solid var(--sep); }
.lb-group > .lb-res:last-of-type { border-bottom: 0; }
.lb-res:hover { background: var(--sel-unemph); }
.lb-res.is-playing { background: var(--evidence); }
.lb-res__spk { min-width: 0; overflow: hidden; font-weight: 600; }
.lb-res__spk .np-person { font-weight: 600; }
.lb-res__t { color: var(--label-3); font-size: 12px; }
.lb-res__text { min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lb-mark { font-weight: 600; color: inherit; padding: 0 1px; }
.lb-weaktag { margin-left: 4px; vertical-align: 1px; font-weight: 400; }
.lb-res--doc { display: block; padding: 10px 12px; border: 1px solid var(--sep); border-radius: var(--r-row); background: var(--card-bg); margin-bottom: 8px; }
.lb-res__doc { display: grid; gap: 3px; }
.lb-res__doctitle { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-weight: 600; }
.lb-res__src { display: inline-flex; align-items: center; gap: 4px; font-weight: 400; font-size: 12px; color: var(--label-2); }
.lb-res__path { font-size: 12px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-res__fresh { font-size: 11px; }
.lb-weakdiv { padding: 8px 12px 4px; font: 600 11px/14px var(--font); color: var(--label-3); border-top: 1px dashed var(--sep); }
.lb-askbridge { font-size: 13px; }
.lb-sv { min-height: calc(100vh - 230px); display: flex; flex-direction: column; }
.lb-playbar { position: sticky; bottom: -40px; margin: auto -24px -40px; padding: 8px 24px; background: var(--win-bg); border-top: 1px solid var(--sep); z-index: 5; }
.lb-results + .lb-playbar { margin-top: auto; }
.lb-nomatch__acts { display: flex; justify-content: center; gap: 8px; }
.lb-thmonth { margin-bottom: 18px; max-width: 860px; }
.lb-thmonth__h { font: 600 11px/14px var(--font); color: var(--label-3); margin: 0 0 6px; }
.lb-thentry { border-bottom: 1px solid var(--sep); padding: 4px 0; }
.lb-thmerge { margin-bottom: 14px; max-width: 860px; }
.lb-thread { max-width: 860px; }
.lb-movelist { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.np-screen--library > .np-undo, .np-screen--library .np-undo { margin-bottom: 12px; max-width: 760px; }

/* ---------- Ask ---------- */
.np-screen--ask { max-width: none; height: 100%; }
.np-content:has(> .np-screen--ask) { padding: 0; overflow: hidden; }
.ak-split { display: flex; height: 100%; min-height: 0; }
.ak-recent { width: 260px; flex: none; border-right: 1px solid var(--sep); overflow: auto; padding: 8px 10px 16px; background: var(--side-bg); }
.ak-recent__item { display: block; padding: 6px 8px; border-radius: var(--r-control); color: var(--label); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ak-recent__item:hover { background: var(--sel-unemph); }
.ak-recent__item.is-sel { background: var(--sel-accent); font-weight: 600; }
.ak-recent__empty { padding: 20px 8px; text-align: center; }
.ak-thread { flex: 1 1 auto; min-width: 0; overflow: auto; padding: 22px 28px 0; display: flex; flex-direction: column; gap: 22px; }
.ak-thread > * { max-width: 860px; width: 100%; }
.ak-first__h { margin-top: 24px; }
.ak-turn { display: grid; gap: 10px; }
.ak-q { font-size: 15px; line-height: 20px; }
.ak-ans { display: grid; gap: 10px; }
.ak-ans__body { display: grid; gap: 8px; }
.ak-ans__p { max-width: 70ch; line-height: 1.5; }
.ak-sup { border: 0; background: var(--sel-accent); color: var(--accent-text); font: 600 10px/14px var(--font); border-radius: var(--r-tag); min-width: 16px; height: 15px; padding: 0 3px; margin: 0 1px; vertical-align: 4px; cursor: pointer; }
.ak-sup:hover, .ak-sup.is-hl { background: var(--accent-fill); color: var(--on-accent); }
.ak-sup[disabled] { color: var(--label-dis); background: var(--sel-unemph); cursor: default; }
.ak-status { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.ak-note { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: var(--label-2); }
.ak-note .np-ic { color: var(--accent-text); }
.ak-meta { font-size: 12px; color: var(--label-2); }
.ak-ans__acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ak-cites { display: grid; gap: 2px; border-top: 1px solid var(--sep); padding-top: 10px; }
.ak-cites__h { font: 600 12px/16px var(--font); color: var(--label-2); margin-bottom: 4px; }
.ak-cite { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 6px 8px; border-radius: var(--r-control); transition: background 200ms; }
.ak-cite.is-deleted { color: var(--label-3); }
.ak-cite__n { font: 600 12px/18px var(--font); color: var(--label-3); text-align: right; }
.ak-cite__main { min-width: 0; display: grid; gap: 3px; }
.ak-cite__head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-width: 0; }
.ak-cite__sugg { font-size: 11px; }
.ak-cite__quote { color: var(--label-2); font-size: 12px; }
.ak-cite__fresh { font-size: 11px; }
.ak-composer { position: sticky; bottom: 0; display: flex; gap: 8px; align-items: flex-end; padding: 12px 0 18px; background: var(--content-bg); border-top: 1px solid var(--sep); margin-top: auto; }
.ak-composer.is-first { position: static; border-top: 0; margin-top: 0; padding-top: 0; }
.ak-composer__field { flex: 1 1 auto; }
.ak-suggs { display: grid; justify-items: start; gap: 4px; }
.ak-sugg { white-space: normal; text-align: left; height: auto; min-height: 28px; }
.ak-playbar { position: sticky; bottom: 0; background: var(--win-bg); border-top: 1px solid var(--sep); padding: 6px 0; }

/* ---------- People ---------- */
.pe-row { cursor: default; }
.pe-row.is-sel { background: var(--sel-accent); }
.pe-unnamed { margin-top: 20px; max-width: 900px; }
.pe-unnamed__list { border: 1px solid var(--sep); border-radius: var(--r-row); background: var(--card-bg); }
.pe-urow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 12px; border-bottom: 1px solid var(--sep); }
.pe-urow:last-child { border-bottom: 0; }
.pe-urow__sample { font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
.pe-picker { display: grid; gap: 6px; }
.pe-picker__list { display: grid; gap: 1px; max-height: 220px; overflow: auto; }
.pe-picker__opt { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 5px 6px; border-radius: var(--r-control); cursor: pointer; text-align: left; }
.pe-picker__opt:hover { background: var(--sel-accent); }
.pe-picker__opt .np-dim { margin-left: auto; font-size: 12px; }
.pe-picker__new { color: var(--accent-text); }
.pe-picker__none { font-size: 12px; padding: 4px 6px; }
.pe-dup { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; color: var(--label-2); }
.pe-cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; max-width: 1180px; }
@media (max-width: 1250px) { .pe-cols { grid-template-columns: minmax(0, 1fr); } }
.pe-col { display: grid; gap: 22px; align-content: start; min-width: 0; }
.pe-block { display: grid; gap: 6px; min-width: 0; }
.pe-topics { display: flex; flex-wrap: wrap; gap: 6px; }
.pe-identity .np-kv { padding: 12px 14px; border: 1px solid var(--sep); border-radius: var(--r-card); background: var(--card-bg); }
.pe-kvact { margin-top: 6px; }
.pe-sel { user-select: text; }
.pe-calls { border: 1px solid var(--sep); border-radius: var(--r-row); background: var(--card-bg); overflow: hidden; }
.lb-crow-c { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto auto auto 14px; align-items: center; gap: 10px; height: 30px; padding: 0 10px; color: var(--label); text-decoration: none; border-bottom: 1px solid var(--sep); }
.lb-crow-c:last-child { border-bottom: 0; }
.lb-crow-c:hover { background: var(--sel-unemph); }
.lb-crow-c__when { font-size: 12px; color: var(--label-2); }
.lb-crow-c__title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-crow-c__type, .lb-crow-c__len { font-size: 12px; white-space: nowrap; }
.pe-form { display: grid; gap: 10px; }
.pe-form .np-field { width: 100%; }
.pe-form__2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pe-form__row { display: grid; gap: 4px; }
.np-screen--people .np-undo, .np-screen--person .np-undo { margin-bottom: 12px; max-width: 760px; }

.pe-form__row .np-popup { justify-self: start; }

/* =====================================================================
   Group E — Activity, Agents, Performance, Settings window
   ===================================================================== */
.e-list { display: grid; border: 1px solid var(--sep); border-radius: var(--r-card); background: var(--card-bg); overflow: hidden; }
.e-list > * + * { border-top: 1px solid var(--sep); }
.e-skel { height: 44px; border-radius: var(--r-row); background: linear-gradient(90deg, var(--sel-unemph), transparent, var(--sel-unemph)); background-size: 200% 100%; animation: e-skel 1.4s linear infinite; margin-bottom: 8px; }
.e-skel--tile { height: 132px; margin: 0; }
@keyframes e-skel { to { background-position: -200% 0; } }

/* ---------- proposal row ---------- */
.e-prop { padding: 10px 12px; }
.e-prop:hover { background: var(--sel-unemph); }
.e-prop--compact { display: flex; align-items: center; gap: 10px; border: 1px solid var(--sep); border-radius: var(--r-row); background: var(--card-bg); }
.e-prop--compact + .e-prop--compact { margin-top: 6px; }
.e-prop__line { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.e-prop__disc { padding-top: 1px; }
.e-prop__time { color: var(--label-3); font-size: 12px; width: 38px; padding-top: 1px; flex: none; }
.e-prop__actor { color: var(--label-2); font-size: 12px; width: 92px; padding-top: 1px; flex: none; }
.e-prop__main { flex: 1 1 260px; min-width: 0; }
.e-prop__title { font-weight: 600; }
.e-prop--compact .e-prop__title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.e-prop__reason { color: var(--label-2); font-size: 12px; }
.e-prop--compact .e-prop__reason { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.e-prop__actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
.e-prop__err { color: var(--error); display: inline-flex; gap: 4px; align-items: center; font-size: 12px; }
.e-prop__warn { color: var(--warning); display: inline-flex; gap: 4px; align-items: center; font-size: 12px; }
.e-prop__detail { margin: 10px 0 2px 150px; display: grid; gap: 8px; }
.e-prop__ev { color: var(--label-2); font-size: 12px; display: flex; gap: 6px; align-items: center; }
.e-prop__spans { display: grid; gap: 6px; }
.e-prop__span { display: grid; gap: 4px; }
.ac-kept .e-prop__span { border-top: 1px solid var(--sep); padding-top: 6px; }
.e-prop__where { font-size: 11px; color: var(--label-3); }
.e-prop__rule { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r-row); background: var(--info-tint); flex-wrap: wrap; }
@media (max-width: 1100px) { .e-prop__detail { margin-left: 0; } }

/* ---------- status row ---------- */
.e-status { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; flex-wrap: wrap; }
.e-status__icon { width: 16px; display: inline-flex; padding-top: 1px; flex: none; }
.e-status--ok .e-status__icon { color: var(--success); }
.e-status--warn .e-status__icon { color: var(--warning); }
.e-status--err .e-status__icon { color: var(--error); }
.e-status--off .e-status__icon { color: var(--label-3); }
.e-status__main { flex: 1 1 240px; min-width: 0; display: grid; gap: 2px; }
.e-status__name { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.e-status__word { font-size: 12px; color: var(--label-2); }
.e-status--err .e-status__word { color: var(--error); font-weight: 600; }
.e-status--warn .e-status__word { color: var(--warning); font-weight: 600; }
.e-status__title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.e-status__sub { font-size: 12px; color: var(--label-2); }
.e-status--off .e-status__title { color: var(--label-2); }
.e-status__msg { font-size: 12px; color: var(--error); }
.e-status--warn .e-status__msg { color: var(--warning); }
.e-status__prog { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--label-2); }
.e-status__actions { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; align-items: center; }
.e-status .np-toggle { margin-top: 1px; }

/* ---------- credential row ---------- */
.e-cred { padding: 10px 12px; }
.e-cred--row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.e-cred--row + .e-cred--row { border-top: 1px solid var(--sep); }
.e-cred__main { flex: 1 1 260px; min-width: 0; display: grid; gap: 3px; }
.e-cred__head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.e-cred__name { font-weight: 600; }
.e-cred__use { font-size: 12px; color: var(--label-2); }
.e-cred__reason { font-size: 12px; color: var(--error); display: flex; gap: 4px; align-items: center; }
.e-cred__kc { font-size: 12px; color: var(--label-2); }
.e-cred__actions { display: flex; gap: 8px; margin-left: auto; }
.e-cred__verifying { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--label-2); }
.e-cred--field { display: grid; gap: 6px; }
.e-cred__form { display: flex; gap: 8px; align-items: flex-start; }
.e-cred__form .np-field { flex: 1 1 auto; }
.e-cred__ok { color: var(--success); font-size: 12px; display: flex; gap: 4px; align-items: center; }

/* ---------- agents ---------- */
.ag-split { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 0; border: 1px solid var(--sep); border-radius: var(--r-card); background: var(--card-bg); min-height: 560px; overflow: hidden; }
@media (max-width: 1100px) { .ag-split { grid-template-columns: 240px minmax(0, 1fr); } .e-agrow__hit { display: none; } }
.ag-list { border-right: 1px solid var(--sep); padding: 10px 8px; display: grid; align-content: start; gap: 6px; background: var(--side-bg); }
.ag-council { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; border-radius: var(--r-control); padding: 8px; cursor: pointer; text-align: left; color: var(--label); font-weight: 600; }
.ag-council .np-dim { font-weight: 400; font-size: 12px; margin-left: auto; }
.ag-council:hover { background: var(--sel-unemph); }
.ag-council.is-sel { background: var(--sel-accent); }
.ag-filter { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--label-2); padding: 0 8px; }
.ag-group__h { font: 600 11px/14px var(--font); color: var(--label-3); padding: 8px 8px 0; }
.ag-group__cap { font-size: 11px; color: var(--label-3); padding: 0 8px 4px; }
.ag-foot { font-size: 11px; color: var(--label-3); padding: 8px; margin-top: 6px; border-top: 1px solid var(--sep); }
.e-agrow { display: flex; align-items: flex-start; gap: 8px; padding: 8px; border-radius: var(--r-row); cursor: pointer; }
.e-agrow:hover { background: var(--sel-unemph); }
.e-agrow.is-sel { background: var(--sel-accent); }
.e-agrow__grip { color: var(--label-3); padding-top: 3px; cursor: grab; }
.e-agrow .np-toggle { margin-top: 2px; }
.e-agrow__main { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
.e-agrow__top { display: flex; align-items: center; gap: 6px; }
.e-agrow__hit { margin-left: auto; font-size: 12px; color: var(--label-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.e-agrow__sub { font-size: 12px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.e-agrow.is-off .np-agent, .e-agrow.is-off .e-agrow__sub { color: var(--label-3); }
.e-agrow__warn { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--warning); }
.ag-pane { padding: 16px 20px 24px; min-width: 0; }
.ag-editor { display: grid; gap: 14px; max-width: 760px; }
.ag-editor__head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ag-banners { display: grid; gap: 8px; }
.ag-skill { display: grid; gap: 10px; }
.ag-skill__bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ag-skill__h { margin-top: 6px; }
.ag-money { width: 110px; }

/* forms shared by agent editor, sheets */
.e-form { display: grid; gap: 0; border: 1px solid var(--sep); border-radius: var(--r-card); overflow: hidden; }
.e-form__row { display: grid; grid-template-columns: 40% minmax(0, 1fr); gap: 12px; padding: 9px 12px; align-items: start; }
.e-form .e-form__row + .e-form__row { border-top: 1px solid var(--sep); }
.e-form__label { color: var(--label); padding-top: 5px; }
.e-form__ctl { display: grid; gap: 6px; min-width: 0; justify-items: start; }
.e-form__ctl > .np-field { width: 100%; max-width: 360px; }
.e-form__inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.e-form__sublabel { color: var(--label-2); }
.e-form__path { color: var(--label-2); word-break: break-all; }
.e-form__checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.e-form__note { font-size: 12px; color: var(--label-3); }
.e-form__warn { font-size: 12px; color: var(--warning); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.e-form__err { font-size: 12px; color: var(--error); display: flex; gap: 4px; align-items: center; }
.e-form__stance { color: var(--label-2); max-width: 52ch; }
@media (max-width: 1000px) { .e-form__row { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.e-council .np-table td { white-space: nowrap; }
.e-council__cell { display: inline-flex; gap: 6px; align-items: center; }

/* ---------- activity ---------- */
.ac-wrap { display: grid; gap: 22px; max-width: 1100px; }
.ac-undo:empty { display: none; }
.ac-undo { position: sticky; top: -20px; z-index: 4; }
.ac-sec { display: grid; gap: 8px; }
.ac-legend { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--label-3); display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.ac-day { display: grid; gap: 6px; }
.ac-day + .ac-day { margin-top: 12px; }
.ac-day__h { font: 600 12px/16px var(--font); color: var(--label-2); }
.ac-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--sep); border-radius: var(--r-card); background: var(--card-bg); }
.ac-list > li + li { border-top: 1px solid var(--sep); }
.ac-kept { border: 1px solid var(--sep); border-radius: var(--r-card); padding: 10px 12px; display: grid; gap: 6px; background: var(--card-bg); justify-items: start; }
.ac-kept .e-prop__span { width: 100%; }

/* ---------- performance ---------- */
.pf-wrap { display: grid; gap: 22px; max-width: 1180px; }
.pf-sec { display: grid; gap: 8px; align-content: start; min-width: 0; }
.pf-tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1300px) { .pf-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) { .pf-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.e-tile { text-align: left; border: 1px solid var(--sep); border-radius: var(--r-card); background: var(--card-bg); padding: 10px 12px; display: grid; gap: 4px; align-content: start; cursor: pointer; color: var(--label); min-width: 0; }
.e-tile:hover { background: var(--sel-unemph); }
.e-tile.is-sel { outline: 2px solid var(--accent); outline-offset: -1px; }
.e-tile__status { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; font-weight: 600; }
.e-tile--ok .e-tile__status { color: var(--success); }
.e-tile--near .e-tile__status { color: var(--warning); }
.e-tile--over .e-tile__status { color: var(--error); }
.e-tile--more-data .e-tile__status { color: var(--label-3); }
.e-tile__name { font-weight: 600; font-size: 13px; line-height: 17px; }
.e-tile__value { font: 600 17px/22px var(--font-display); }
.e-tile__target { font-size: 12px; color: var(--label-2); }
.e-tile__trend { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--label-3); flex-wrap: wrap; }
.e-tile__trend .e-spark { color: var(--label-2); }
.e-tile--over .e-spark { color: var(--error); }
.e-tile__need { font-size: 12px; color: var(--label-2); padding: 6px 0; }
.e-tile__blocker { font-size: 11px; font-weight: 600; color: var(--label-2); }
.pf-mid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .pf-mid { grid-template-columns: minmax(0, 1fr); } }
.pf-card { border: 1px solid var(--sep); border-radius: var(--r-card); background: var(--card-bg); padding: 12px 14px; min-width: 0; }
.pf-mid .e-list { border: 0; border-radius: 0; background: transparent; }
.pf-bottom { display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .pf-bottom { grid-template-columns: minmax(0, 1fr); } }
.pf-kv { font-size: 13px; }
.pf-kv dd { text-align: right; }
.pf-brief { display: grid; gap: 10px; }
.pf-brief__actions { display: flex; flex-wrap: wrap; gap: 8px; }
.pf-line { font-size: 12px; color: var(--warning); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pf-line--err { color: var(--error); }
.pf-legend { margin-top: 8px; font-size: 11px; color: var(--label-3); display: flex; align-items: center; gap: 6px; }
.pf-legend__b { width: 2px; height: 12px; background: var(--label); display: inline-block; }
.pf-legend__h { width: 18px; height: 8px; display: inline-block; background: repeating-linear-gradient(135deg, var(--error) 0 3px, transparent 3px 6px); border-radius: 2px; }
.pf-cp-head { display: flex; justify-content: flex-end; }
.pf-tick--over td { background: var(--error-tint); }
.pf-overword { color: var(--error); font-size: 12px; display: inline-flex; gap: 3px; align-items: center; }

.e-stl { display: grid; gap: 2px; }
.e-stl__row { display: grid; grid-template-columns: 170px minmax(80px, 1fr) 92px 18px; gap: 10px; align-items: center; border: 0; background: transparent; padding: 5px 6px; border-radius: var(--r-control); text-align: left; color: var(--label); cursor: pointer; }
.e-stl__row:hover { background: var(--sel-unemph); }
.e-stl__row.is-sel { background: var(--sel-accent); }
.e-stl__label { font-size: 12px; line-height: 15px; }
.e-stl__track { position: relative; height: 12px; background: var(--sel-unemph); border-radius: 3px; }
.e-stl__fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent-fill); }
.e-stl__row--near .e-stl__fill { background: var(--warning); }
.e-stl__row--over .e-stl__fill { background: repeating-linear-gradient(135deg, var(--error) 0 3px, var(--error-tint) 3px 6px); box-shadow: inset 0 0 0 1px var(--error); }
.e-stl__budget { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--label); border-radius: 1px; }
.e-stl__val { font-size: 12px; color: var(--label-2); text-align: right; }
.e-stl__st { display: inline-flex; }
.e-stl__row--over .e-stl__st { color: var(--error); }
.e-stl__row--near .e-stl__st { color: var(--warning); }
@media (max-width: 700px) { .e-stl__row { grid-template-columns: 110px minmax(60px, 1fr) 80px 16px; } }
.e-mini { position: relative; display: flex; gap: 1px; width: 100%; max-width: 260px; height: 10px; vertical-align: middle; }
.e-mini__seg { height: 100%; background: var(--accent-fill); opacity: .75; border-radius: 1px; }
.e-mini__seg:nth-child(even) { opacity: .45; }
.e-mini__seg.is-over { background: repeating-linear-gradient(135deg, var(--error) 0 2px, var(--error-tint) 2px 4px); opacity: 1; }
.e-mini__budget { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--label); }

.e-bn { display: flex; gap: 10px; padding: 10px 4px; }
.e-bn + .e-bn { border-top: 1px solid var(--sep); }
.e-bn__icon { padding-top: 1px; }
.e-bn--over .e-bn__icon { color: var(--error); }
.e-bn--near .e-bn__icon { color: var(--warning); }
.e-bn--informational .e-bn__icon { color: var(--accent-text); }
.e-bn__main { display: grid; gap: 3px; min-width: 0; }
