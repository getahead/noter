      return html`${NP.shell.caption('Menu bar extra', ' · native status item and menu, drawn by macOS')}
        <div data-component="cpt-noter-component-screen-menu-bar" data-state="${m.d === 'default' ? m.mode : m.d}" class="mb-scene">
          ${desk({ h: 640, app: 'Microsoft Teams', menubar: statusItem, body: callAppWindow() })}
        </div>${glyphLegend}`;
    },
  });

  NP.onMany({
    'mb.toggle': () => { const L = NP.local('menubar'); L.open = !L.open; L.muteOpen = false; },
    'mb.start': () => {
      const L = NP.local('menubar');
      const wasHidden = !!L.hidden || state.demo.menubar === 'hidden';
      NP.freshCall(); NP.startRecording({ offsetMs: 12000 }); L.closing = false;
      /* hidden for presenting: recording starts, nothing is drawn, the menu keeps the eye-slash glyph */
      if (wasHidden) { L.hidden = false; state.demo.menubar = 'hidden'; NP.flash('proto', 'Recording started; nothing opens while Noter is hidden for presenting', 2500); return; }
      state.demo.menubar = 'default'; state.surface = 'call';
    },
    'mb.finishSetup': () => { const F = NP.local('firstrun'); F.step = 2; state.surface = 'firstrun'; },
    'mb.stop': () => { state.rec.status = 'idle'; const L = NP.local('menubar'); L.closing = true; state.lastStop = { auto: false }; state.demo.menubar = 'default'; },
    'mb.keep': () => { state.demo.menubar = 'recording'; },
    'mb.continue': () => { NP.startRecording({ offsetMs: 48 * 60000 }); NP.local('menubar').closing = false; state.demo.menubar = 'default'; state.surface = 'call'; NP.flash('call-status', 'Continued · gap row Stopped 11:02–11:04', 4000); },
    'mb.pause': () => { if (state.rec.status === 'paused') { state.rec.startedAt += Date.now() - state.rec.pausedAt; state.rec.status = 'recording'; } else { state.rec.status = 'paused'; state.rec.pausedAt = Date.now(); } if (state.demo.menubar === 'paused-5') state.demo.menubar = 'default'; },
    'mb.mark': () => { NP.flash('proto', 'Marked ' + NP.fmtClock(NP.elapsedMs()) + ' · a mark row is added; nothing opens', 2500); },
    'mb.toCall': (a) => { state.surface = 'call'; NP.local('call').askOpen = a.what === 'ask'; if (a.what === 'catch-up') NP.flash('call-status', 'Catch-up card added on top of the stack', 3000); },
    'mb.muteMenu': () => { const L = NP.local('menubar'); L.muteOpen = !L.muteOpen; },
    'mb.mute': (a) => { const L = NP.local('menubar'); L.muted = a.v; L.muteOpen = false; },
    'mb.unmute': () => { const L = NP.local('menubar'); L.muted = null; L.muteOpen = false; if (state.demo.menubar === 'muted') state.demo.menubar = 'recording'; },
    'mb.openCall': () => { state.rec.layout = state.rec.layout === 'collapsed' ? 'floating' : state.rec.layout; NP.local('menubar').hidden = false; state.surface = 'call'; },
    'mb.floating': () => { state.rec.layout = state.rec.layout === 'floating' ? 'dedicated' : 'floating'; state.surface = 'call'; },
    'mb.lastSummary': () => { NP.go('call-page', { callId: 'c-design', view: 'summary' }); return false; },
    'mb.hide': () => { const L = NP.local('menubar'); const d = state.demo.menubar; if (d === 'hidden' || d === 'hidden-ended') { state.demo.menubar = 'default'; L.hidden = false; } else L.hidden = !L.hidden; },
    'mb.openNoter': () => { NP.local('menubar').hidden = false; NP.go('today'); return false; },
    'mb.settings': () => { NP.actions['settings.open']({}); return false; },
    'mb.quit': () => {
      /* same alert as Dialogs › Quit while recording: Cancel is the default button */
      if (isRec()) NP.openAlert({ title: 'Noter is recording “Planning: VHI 8.0 drawer redesign”', body: 'Quitting stops the recording. The transcript so far is kept.', variant: 'warning', buttons: [{ label: 'Cancel', variant: 'primary', action: 'alert.close' }, { label: 'Stop and Quit', variant: 'secondary', action: 'mb.quitConfirm' }] });
      else NP.flash('proto', 'Noter quits (prototype stays open)');
    },
    'mb.quitConfirm': () => { state.alert = null; state.rec.status = 'idle'; NP.flash('proto', 'Noter quit; the recording was saved', 2500); },
  });

  /* =================================================================
     First-run wizard (cpt-noter-component-screen-first-run)
     ================================================================= */
  const STEPS = ['Welcome', 'Models', 'Permissions', 'Call display', 'Audio storage', 'Assistants'];
  const FR_STATES = [
    { id: 'default', label: 'Welcome' },
    { id: 'models', label: 'Models downloading' },
    { id: 'no-connection', label: 'No connection' },
    { id: 'disk', label: 'Not enough disk space' },
    { id: 'checksum', label: 'Checksum failed' },
    { id: 'speech-wait', label: 'Speech model not ready' },
    { id: 'perm-not-asked', label: 'Permission not asked' },
    { id: 'mic-denied', label: 'Microphone denied' },
    { id: 'sys-missing', label: 'System audio permission missing' },
    { id: 'passed', label: 'Self-test passed' },
    { id: 'one-silent', label: 'One stream silent' },
    { id: 'skipped', label: 'Self-test skipped' },
    { id: 'display', label: 'Call display, two displays' },
    { id: 'one-display', label: 'One display' },
    { id: 'storage', label: 'Audio storage' },
    { id: 'assistants', label: 'Assistants' },
    { id: 'key-rejected', label: 'Key rejected' },
    { id: 'no-assistant', label: 'No key and no local runtime' },
  ];
  const freshFR = () => ({ step: 0, marks: {}, models: { speech: 34, speaker: 100, search: 58 }, paused: false, noConnection: false, disk: false, checksum: false, perms: { mic: 'not-asked', sys: 'missing' }, display: 'auto', oneDisplay: false, autoOpen: true, retention: '30', privacy: 'redacted', keys: { anthropic: '', codex: '' }, keyState: { anthropic: 'empty', codex: 'empty' }, ollama: 'detected', failNext: false });
  const F = () => { const L = NP.local('firstrun'); if (L.models == null) Object.assign(L, freshFR(), { step: L.step || 0 }); return L; };

  NP.surface('firstrun', {
    label: 'First run',
    states: FR_STATES,
    onDemo: (id) => {
      const L = NP.local('firstrun');
      Object.keys(L).forEach((k) => delete L[k]);
      Object.assign(L, freshFR());
      NP.local('selftest-fr').state = null;
      const at = (n) => { L.step = n; for (let i = 0; i < n; i++) L.marks[i] = L.marks[i] || 'done'; };
      const grant = () => { L.perms = { mic: 'granted', sys: 'granted' }; };
      switch (id) {
        case 'models': at(1); break;
        case 'no-connection': at(1); L.noConnection = true; break;
        case 'disk': at(1); L.disk = true; L.models = { speech: 0, speaker: 0, search: 0 }; break;
        case 'checksum': at(1); L.checksum = true; break;
        case 'speech-wait': at(2); grant(); L.models.speech = 62; NP.local('selftest-fr').state = 'waiting'; break;
        case 'perm-not-asked': at(2); break;
        case 'mic-denied': at(2); L.perms = { mic: 'denied', sys: 'missing' }; break;
        case 'sys-missing': at(2); L.perms = { mic: 'granted', sys: 'missing' }; break;
        case 'passed': at(2); grant(); L.models.speech = 100; NP.local('selftest-fr').state = 'passed'; break;
        case 'one-silent': at(2); grant(); L.models.speech = 100; NP.local('selftest-fr').state = 'failed'; break;
        case 'skipped': at(3); L.marks[2] = 'skipped'; L.models.speech = 100; break;
        case 'display': at(3); grant(); L.models.speech = 100; break;
        case 'one-display': at(3); grant(); L.oneDisplay = true; break;
        case 'storage': at(4); grant(); break;
        case 'assistants': at(5); grant(); break;
        case 'key-rejected': at(5); grant(); L.keys.anthropic = 'sk-ant-api03-wrong'; L.keyState.anthropic = 'rejected'; break;
        case 'no-assistant': at(5); grant(); L.ollama = 'missing'; L.noAssistantWarn = true; break;
        default: break;
      }
    },
    render: () => {
      const L = F();
      const steps = STEPS.map((label, i) => ({ label, state: L.marks[i] || 'upcoming', running: i === 1 && L.step > 1 && Object.values(L.models).some((v) => v < 100) && !L.disk, progress: Math.round((L.models.speech + L.models.speaker + L.models.search) / 3) }));
      if (L.checksum || L.disk) steps[1].state = L.step === 1 ? steps[1].state : 'error';
      const isSkippable = L.step === 2 || L.step === 3;
      const body = html`<div class="fr">
        ${NP.region('FR-R1', { tag: 'aside', cls: 'fr-r1', label: 'Steps' }, html`
          <div class="fr-r1__lights">${NP.shell.lights({ noZoom: true })}</div>
          <h2 class="fr-r1__h">Set up Noter</h2>
          ${C.wizardStepper({ steps, current: L.step, variant: L.resumed ? 'resumed' : 'first-pass' })}
          <p class="fr-r1__note">Everything here runs on this Mac. Nothing leaves it until you connect an assistant in step 6.</p>`)}
        <div class="fr-main">
          ${NP.region('FR-R2', { tag: 'div', cls: 'fr-r2', label: STEPS[L.step], attrs: { 'data-proto-scroll': 'fr-r2' } }, stepBody(L))}
          ${NP.region('FR-R3', { tag: 'footer', cls: 'fr-r3' }, html`
            <span class="fr-r3__env">macOS 15 · Core Audio process tap</span><span class="np-tb__spacer"></span>
            ${isSkippable ? P.button('Skip for Now', { variant: 'quiet', action: ['fr.skip'] }) : ''}
            ${P.button('Back', { action: ['fr.back'], disabled: L.step === 0 })}
            ${L.step === 5 ? P.button('Finish', { variant: 'primary', action: ['fr.finish'] }) : P.button('Continue', { variant: 'primary', action: ['fr.next'] })}`)}
        </div></div>`;
      return html`${NP.shell.caption('First-run wizard', ' · separate window, 760 × 560, opens before the first call')}
        ${NP.shell.window({ component: 'cpt-noter-component-screen-first-run', variant: 'step-' + (L.step + 1), state: STEPS[L.step].toLowerCase().replace(/ /g, '-'), title: 'Set up Noter', w: 760, h: 560, titlebar: false, cls: 'fr-win', body })}`;
    },
  });

  const credField = (L, id, label) => {
    const st = L.keyState[id];
    return NP.comp('credential-row', { variant: 'field-form', state: st, cls: 'fr-cred' }, html`
      <span class="fr-cred__label">${label}</span>
      <span class="fr-cred__ctl">${st === 'stored' ? html`<span class="fr-cred__stored"><span class="np-mono">••••••••</span>  ${icon('lock', { size: 12 })} Stored in the Keychain</span>${P.button('Remove', { size: 'small', variant: 'quiet', action: ['fr.keyRemove', { id }] })}`
        : html`${P.textField({ id: 'fr-key-' + id, variant: 'secure', placeholder: id === 'anthropic' ? 'sk-ant-…' : 'sk-…', value: L.keys[id], bind: 'local.firstrun.keys.' + id, invalid: st === 'rejected', message: 'Anthropic rejected this key (invalid key)', ariaLabel: label, cls: 'fr-cred__field' })}${P.button('Verify', { size: 'regular', action: ['fr.keyVerify', { id }], loading: st === 'verifying' })}`}</span>`);
  };

  const modelRow = (L, id, name, size) => {
    const v = L.models[id];
    const failed = L.checksum && id === 'speech';
    const st = failed ? 'failed' : v >= 100 ? 'finished' : L.paused || L.noConnection ? 'paused' : 'running';
    return html`<div class="fr-model" data-state="${st}"><div class="fr-model__name">${name}<span class="np-dim"> · ${size}</span></div>
      <div class="fr-model__bar">${P.progress({ value: v, state: st, label: name })}<span class="np-tnum fr-model__pct">${v >= 100 ? 'Ready' : failed ? 'Check failed' : v + ' %'}</span>${failed ? P.button('Try Again', { size: 'small', action: ['fr.retryModel'] }) : ''}</div></div>`;
  };

  const stepBody = (L) => {
    const title = (t) => html`<h1 class="fr-title" tabindex="-1">${t}</h1>`;
    switch (L.step) {
      case 0: return html`${html`<h1 class="fr-title t-large" tabindex="-1">Welcome to Noter</h1>`}
        <p class="fr-p">Noter records your online calls, transcribes them on this Mac and turns them into summaries, decisions and action items. Setup takes a few minutes; the models download while you carry on.</p>
        <ul class="fr-list"><li>${icon('globe', { size: 15 })}English, Russian and German, also mixed in one call</li><li>${icon('laptop', { size: 15 })}Audio and transcripts stay on this Mac</li><li>${icon('mic', { size: 15 })}Two permissions, both asked in step 3</li></ul>`;
      case 1: return html`${title('Models')}
        <p class="fr-p">Noter downloads its speech, speaker and search models once. You can continue while they download.</p>
        ${L.disk ? C.inlineBanner({ severity: 'error', text: 'Needs 2.1 GB, 1.4 GB free', actions: [{ label: 'Try Again', action: ['fr.diskRetry'] }] }) : ''}
        ${L.noConnection ? html`<div class="fr-waitline">${icon('clock', { size: 13 })}Waiting for a connection — downloads resume automatically</div>` : ''}
        <div class="fr-models np-card">
          ${modelRow(L, 'speech', 'Speech model · WhisperKit Large v3 Turbo', '1.5 GB')}
          ${modelRow(L, 'speaker', 'Speaker model', '0.1 GB')}
          ${modelRow(L, 'search', 'Search model', '0.4 GB')}
          <div class="fr-models__foot"><span>About 2 GB</span><span class="np-tb__spacer"></span>${L.disk ? '' : P.button(L.paused ? 'Resume' : 'Pause', { size: 'small', action: ['fr.pause'] })}</div>
        </div>`;
      case 2: {
        const speechReady = L.models.speech >= 100;
        const stState = NP.local('selftest-fr').state || (L.perms.sys !== 'granted' ? 'permission-missing' : !speechReady ? 'waiting' : 'idle');
        return html`${title('Microphone and system audio')}
        <p class="fr-p">Noter captures your voice from the microphone and the other participants from whatever app plays them.</p>
        <div class="fr-perms">
          ${C.permissionCheckRow({ id: 'mic', label: 'Microphone', status: L.perms.mic, detail: 'MacBook Pro Microphone', why: 'Records your side of the call.' }, { variant: 'setup' })}
          ${C.permissionCheckRow({ id: 'sys', label: 'System audio recording', status: L.perms.sys, why: 'Records the other participants from the call app.', howto: 'How to allow it: System Settings › Privacy & Security › Screen & System Audio Recording › System Audio Recording Only › turn on Noter.' }, { variant: 'setup' })}
        </div>
        ${NP.local('selftest-fr').state ? C.selfTestPanel({ variant: 'wizard', key: 'fr' }) : C.selfTestPanel({ variant: 'wizard', key: 'fr', state: stState })}`;
      }
      case 3: return html`${title('Call display')}
        <p class="fr-p">Choose where the call screen opens. Noter remembers the display, not its position, so it finds it again after you reconnect.</p>
        ${C.displayPicker({ key: 'fr', value: L.display, variant: L.oneDisplay ? 'one' : 'several' })}
        <div class="fr-row">${P.toggle('Open the call screen automatically', L.autoOpen, { id: 'fr-autoopen', bind: 'local.firstrun.autoOpen' })}</div>
        <p class="fr-hint">When this is on, the call window opens as recording starts, and moves to a display that connects during the call.</p>`;
      case 4: return html`${title('Audio storage')}
        <p class="fr-p">Transcripts, summaries and items are always kept. Choose how long the audio itself stays on this Mac.</p>
        ${P.radioGroup('fr-retention', [
          { value: '30', label: 'Keep audio for 30 days', note: 'Lets you replay recent calls and correct transcripts' },
          { value: '7', label: '7 days' }, { value: '90', label: '90 days' }, { value: 'forever', label: 'Forever' },
          { value: 'never', label: 'Never store audio', note: 'Replay and the archive pass are not available' },
        ], L.retention, { label: 'Audio retention', bind: 'local.firstrun.retention' })}
        <p class="fr-hint">You can change this later in Settings › Privacy › Audio retention.</p>`;
      default: {
        const noAssist = L.ollama === 'missing' && L.keyState.anthropic !== 'stored' && L.keyState.codex !== 'stored' && !(NP.auth && (NP.auth.signedIn('claude') || NP.auth.signedIn('chatgpt')));
        return html`${title('Assistants')}
        <p class="fr-p">Summaries, cards and answers come from an assistant. Add an API key, sign in with your own Claude or ChatGPT account, use a local model, or combine them. Keys go to the Keychain.</p>
        <div class="fr-creds np-card">${credField(L, 'anthropic', 'Anthropic API key')}${credField(L, 'codex', 'Codex API key')}</div>
        <div class="fr-sublabel">Or use your own account</div>
        <div class="fr-creds np-card f-accts">${C.accountRow ? html`${C.accountRow('claude', { variant: 'wizard' })}${C.accountRow('chatgpt', { variant: 'wizard' })}` : ''}</div>
        <div class="fr-runtime">${L.ollama === 'detected' ? html`${icon('checkCircle', { size: 14, cls: 'fr-ok' })}<span><strong>Local runtime:</strong> Ollama detected</span>` : L.ollama === 'installing' ? html`${P.progress({ variant: 'spinner' })}<span><strong>Local runtime:</strong> Installing Ollama…</span>` : html`<span><strong>Local runtime:</strong> none found</span>${P.button('Install Ollama…', { size: 'small', action: ['fr.installOllama'] })}${P.button('Not Now', { size: 'small', variant: 'quiet', action: ['fr.ollamaNotNow'] })}`}</div>
        <div class="fr-privacy"><div class="fr-sublabel">Privacy mode</div>${P.radioGroup('fr-privacy', [
          { value: 'redacted', label: 'Cloud with redaction', note: 'Names and PII are replaced before anything leaves this Mac' },
          { value: 'cloud', label: 'Cloud allowed' },
          { value: 'local', label: 'Local only', note: 'Everything stays on this Mac' },
        ], L.privacy, { label: 'Privacy mode', bind: 'local.firstrun.privacy' })}</div>
        ${noAssist || L.noAssistantWarn ? C.inlineBanner({ severity: 'warning', text: 'Without an assistant Noter still records and transcribes; summaries wait until one is connected.' }) : ''}`;
      }
    }
  };

  NP.onMany({
    'fr.step': (a) => { F().step = a.index; },
    'fr.next': () => { const L = F(); if (L.marks[L.step] !== 'skipped') L.marks[L.step] = 'done'; L.step = Math.min(5, L.step + 1); },
    'fr.back': () => { const L = F(); L.step = Math.max(0, L.step - 1); },
    'fr.skip': () => { const L = F(); L.marks[L.step] = 'skipped'; L.step += 1; },
    'fr.finish': () => {
      const L = F();
      L.marks[5] = 'done';
      const stS = NP.local('selftest-fr').state;
      state.setup.audioGranted = L.perms.mic === 'granted' && L.perms.sys === 'granted';
      state.setup.selfTestPassed = stS === 'passed' || stS === 'exclusion-off' || stS === 'exclusion-failed';
      state.setup.assistant = (L.keyState.anthropic === 'stored' || L.keyState.codex === 'stored' || L.ollama === 'detected' || (NP.auth && (NP.auth.signedIn('claude') || NP.auth.signedIn('chatgpt')))) ? 'api-key' : 'none';
      state.demo.today = 'default';
      NP.go('today');
      return false;
    },
    'fr.pause': () => { const L = F(); L.paused = !L.paused; },
    'fr.diskRetry': () => { const L = F(); L.disk = false; L.models = { speech: 3, speaker: 8, search: 2 }; },
    'fr.retryModel': () => { const L = F(); L.checksum = false; L.models.speech = 0; },
    'fr.permAllow': (a) => {
      const what = a.id === 'mic' ? 'the microphone' : 'record this computer\'s screen and audio';
      NP.openAlert({ title: `“Noter” would like to access ${what}.`, body: a.id === 'mic' ? 'Noter records your voice in calls and transcribes it on this Mac.' : 'Noter uses it only for this test and never records your screen.', variant: 'system', buttons: [{ label: "Don't Allow", action: 'fr.permAnswer', args: { id: a.id, ok: false } }, { label: 'Allow', variant: 'primary', action: 'fr.permAnswer', args: { id: a.id, ok: true } }] });
    },
    'fr.permAnswer': (a) => { state.alert = null; F().perms[a.id] = a.ok ? 'granted' : 'denied'; },
    'fr.permSettings': (a) => {
      const L = F(); L.perms[a.id] = 'checking';
      NP.flash('proto', 'System Settings opens at Privacy & Security; the row checks again when Noter is active', 2200);
      setTimeout(() => { L.perms[a.id] = 'granted'; const st = NP.local('selftest-fr'); if (st.state === 'permission-missing') st.state = null; NP.render(); }, 1300);
    },
    'fr.display': (a) => { NP.local('dp-' + (a.key || 'default')).value = a.value; if (a.key === 'fr') F().display = a.value; },
    'fr.stDetails': (a) => { const L = NP.local('selftest-' + a.key); L.details = !L.details; },
    'fr.stClip': (a) => runSelfTest(a.key, true),
    'fr.stRun': (a) => runSelfTest(a.key, false),
    'fr.keyVerify': (a) => {
      const L = F(); L.keyState[a.id] = 'verifying';
      setTimeout(() => { const v = (L.keys[a.id] || '').trim(); L.keyState[a.id] = !v || /wrong|bad/.test(v) ? 'rejected' : 'stored'; NP.render(); }, 800);
    },
    'fr.keyRemove': (a) => { const L = F(); L.keyState[a.id] = 'empty'; L.keys[a.id] = ''; },
    'fr.installOllama': () => { const L = F(); L.ollama = 'installing'; setTimeout(() => { L.ollama = 'detected'; L.noAssistantWarn = false; NP.render(); }, 1600); },
    'fr.ollamaNotNow': () => { const L = F(); L.ollama = 'missing'; },
    'fr.hkRecord': (a) => { const H = NP.local('hotkeys'); H.recording = H.recording === a.id ? null : a.id; delete H['err-' + a.id]; },
    'fr.hkClear': (a) => { const H = NP.local('hotkeys'); H[a.id] = ''; delete H['err-' + a.id]; },
  });

  const runSelfTest = (key, clip) => {
    const L = NP.local('selftest-' + key);
    if (key === 'fr' && F().models.speech < 100) { L.state = 'waiting'; return; }
    L.state = clip ? 'clip' : 'running';
    setTimeout(() => {
      if (clip) L.state = 'running';
      NP.render();
      setTimeout(() => {
        const failNext = NP.demo('firstrun') === 'one-silent' && key === 'fr' && !L.retried;
        L.retried = true;
        L.state = failNext ? 'failed' : 'passed';
        if (!failNext) state.setup.selfTestPassed = true;
        NP.render();
      }, 1300);
    }, clip ? 1400 : 0);
  };

  /* background downloads while the wizard is visible */
  setInterval(() => {
    if (state.surface !== 'firstrun') return;
    const L = NP.local('firstrun');
    if (!L.models || L.paused || L.noConnection || L.disk || !(L.step >= 1)) return;
    let changed = false;
    ['speech', 'speaker', 'search'].forEach((k) => {
      if (k === 'speech' && L.checksum) return;
      if (L.models[k] < 100) { L.models[k] = Math.min(100, L.models[k] + (k === 'speech' ? 3 : 5)); changed = true; }
    });
    const st = NP.local('selftest-fr');
    if (st.state === 'waiting' && L.models.speech >= 100) { runSelfTest('fr', false); }
    if (changed && (L.step === 1 || L.step === 2 || L.step > 1)) NP.render();
  }, 900);

  /* hotkey recording: physical keys, so Russian and German layouts work */
  document.addEventListener('keydown', (ev) => {
    const H = NP.local('hotkeys');
    if (!H.recording) return;
    ev.preventDefault(); ev.stopPropagation();
    const id = H.recording;
    if (ev.key === 'Escape') { H.recording = null; NP.render(); return; }
    if (['Control', 'Alt', 'Shift', 'Meta'].includes(ev.key)) return;
    const k = ev.code.startsWith('Key') ? ev.code.slice(3) : ev.code.startsWith('Digit') ? ev.code.slice(5) : ev.key.length === 1 ? ev.key.toUpperCase() : ev.code;
    const chord = (ev.ctrlKey ? '⌃' : '') + (ev.altKey ? '⌥' : '') + (ev.shiftKey ? '⇧' : '') + (ev.metaKey ? '⌘' : '') + k;
    H.recording = null;
    if (!ev.ctrlKey && !ev.altKey && !ev.metaKey) { H['err-' + id] = 'Add Command, Option or Control'; }
    else if (ev.metaKey && !ev.ctrlKey && !ev.altKey && k === 'M') { H['err-' + id] = 'Used by macOS for Minimize'; }
    else if (ev.ctrlKey && ev.altKey && !ev.metaKey) { H['err-' + id] = 'Used by VoiceOver'; }
    else { H[id] = chord; delete H['err-' + id]; }
    NP.render();
  }, true);

  /* =================================================================
     Notifications (cpt-noter-component-screen-notifications)
     ================================================================= */
  const NT_STATES = [
    { id: 'default', label: 'Outputs ready (NT-1)' },
    { id: 'failed', label: 'Outputs failed (NT-2)' },
    { id: 'capture', label: 'Capture problem, call window hidden (NT-3)' },
    { id: 'several', label: 'Several calls in a row' },
    { id: 'not-asked', label: 'Permission not asked yet' },
    { id: 'denied', label: 'Permission denied' },
    { id: 'window-front', label: 'Main window already shows the call' },
    { id: 'held', label: 'Hidden for presenting / next call recording' },
  ];
  const banner = (id, title, body, action, args, thread) => NP.comp('cpt-noter-component-screen-notifications', { variant: id, state: 'delivered', tag: 'button', cls: 'nt-banner', attrs: { type: 'button', 'data-proto-action': action, 'data-proto-args': JSON.stringify(args || {}), 'aria-label': title + '. ' + body, 'data-thread': thread } },
    html`<span class="nt-banner__icon" aria-hidden="true">${icon('noter', { size: 22 })}</span><span class="nt-banner__text"><span class="nt-banner__top"><strong>${title}</strong><span class="np-dim">now</span></span><span class="nt-banner__body" lang="en">${body}</span></span>`);
  const NT1 = () => banner('nt-1', 'Summary ready', 'Planning: VHI 8.0 drawer redesign · 4 action items, 2 decisions', 'ntf.open', { callId: 'c-live' }, 'c-live');
  const NT2 = () => banner('nt-2', "Couldn't write the summary", 'Planning: VHI 8.0 drawer redesign · open the call to try again', 'ntf.open', { callId: 'c-live', failed: true }, 'c-live');
  const NT3 = () => banner('nt-3', 'System audio lost', 'Recording continues with your microphone.', 'ntf.call', {}, 'capture');

  NP.surface('notifications', {
    label: 'Notifications',
    states: NT_STATES,
    render: (ctx) => {
      const d = ctx.demo;
      let banners = [];
      let note = '';
      if (d === 'default') banners = [NT1()];
      if (d === 'failed') banners = [NT2()];
      if (d === 'capture') banners = [NT3()];
      if (d === 'several') banners = [NT1(), banner('nt-1', 'Summary ready', 'Backend sync · 2 action items, 1 decision', 'ntf.open', { callId: 'c-backend' }, 'c-backend')];
      if (d === 'not-asked') note = html`<p>No notification is sent before you allow them. After the first recorded call the Call page shows this banner:</p>${C.inlineBanner({ severity: 'info', text: 'Get a notification when a summary is ready.', actions: [{ label: 'Notify Me When Summaries Are Ready', action: ['ntf.allow'] }], dismissible: true })}`;
      if (d === 'denied') note = html`<p>No notification after the next call. The Call page still loads without taking focus, the menu bar offers <strong>Open Last Summary — Design review · 09:30</strong>, and Settings › General shows:</p>${C.inlineBanner({ severity: 'warning', text: 'Notifications are off for Noter', actions: [{ label: 'Open System Settings…', action: ['proto.flash', { key: 'proto', text: 'Opens System Settings › Notifications › Noter' }] }] })}`;
      if (d === 'window-front') note = html`<p>No notification: the main window already shows this call. The page announces <strong>Summary ready</strong> politely to VoiceOver.</p>`;
      if (d === 'held') note = html`<p>Nothing arrives while a call records or while Noter is hidden for presenting. When capture stops or Noter is shown again, the held notifications arrive, one per call.</p><div class="a-note__btns"><button type="button" class="np-hbar__btn" ${act('proto.setDemo', { key: 'notifications', id: 'several' })}>Deliver held notifications</button></div>`;
      const centre = html`<div class="nt-centre" aria-label="Notification Centre"><div class="nt-centre__h">Notification Centre · Noter</div>
        <div class="nt-thread"><div class="nt-thread__h">Planning: VHI 8.0 drawer redesign</div>${NT1()}${d === 'failed' ? NT2() : ''}</div>
        <div class="nt-thread"><div class="nt-thread__h">Backend sync</div>${banner('nt-1', 'Summary ready', 'Backend sync · 2 action items, 1 decision', 'ntf.open', { callId: 'c-backend' }, 'c-backend')}</div></div>`;
      return html`${NP.shell.caption('Notifications', ' · native macOS banners without buttons; titles and counts only, no sound')}
        <div data-component="cpt-noter-component-screen-notifications" data-state="${d}" class="nt-scene">
        ${desk({ h: 520, app: 'Finder', body: html`<div class="nt-stack" data-region="NT">${banners}</div>${note ? html`<div class="a-note" data-proto-chrome>${note}</div>` : ''}${d === 'default' || d === 'several' || d === 'failed' ? centre : ''}` })}
        </div>`;
    },
  });
  NP.onMany({
    'ntf.open': (a) => { NP.go('call-page', { callId: a.callId, view: 'summary', failed: a.failed || null }); return false; },
    'ntf.call': () => { state.surface = 'call'; if (!isRec()) NP.startRecording(); },
    'ntf.allow': () => { NP.openAlert({ title: '“Noter” would like to send you notifications.', body: 'Notifications may include alerts and badges.', variant: 'system', buttons: [{ label: "Don't Allow", action: 'ntf.answer', args: { ok: false } }, { label: 'Allow', variant: 'primary', action: 'ntf.answer', args: { ok: true } }] }); },
    'ntf.answer': (a) => { state.alert = null; state.demo.notifications = a.ok ? 'default' : 'denied'; },
  });

  /* fallback sheet for Delete Old Audio… (group C's Dialogs module may register the real one) */
  if (!NP.overlays['delete-old-audio']) {
    NP.overlay('delete-old-audio', {
      width: 480,
      title: () => 'Delete old audio',
      render: () => html`<div class="np-sheet__head"><div class="np-sheet__title">Delete audio older than 30 days?</div><div class="np-sheet__sub">Frees 6.2 GB. Transcripts and summaries stay.</div></div>
        <div class="np-sheet__foot">${P.button('Cancel', { action: ['sheet.close'] })}${P.button('Delete Audio', { variant: 'primary', cls: 'np-btn--destructive', action: ['a.deleteAudio'] })}</div>`,
    });
  }
  NP.on('a.deleteAudio', () => { state.sheet = null; state.demo.menubar = 'call-detected'; state.demo.record = 'closed'; NP.flash('proto', 'Deleted 6.2 GB of old audio · the menu bar offers Call Detected · Start Recording', 3000); });
})();

;
/* =====================================================================
   Screen — Today (cpt-noter-component-screen-today), DESIGN 3.2
   Regions TD-R1 (toolbar), TD-R2 (MW-R5 banner), TD-R8, TD-R3..TD-R7
   ===================================================================== */
(function () {
  const { html, raw, act, icon, P, C, data: D, state } = NP;

  const STATES = [
    { id: 'default', label: 'Normal' },
    { id: 'first-use', label: 'First use, nothing recorded' },
    { id: 'calendar-not-asked', label: 'Calendar not asked yet' },
    { id: 'calendar-denied', label: 'Calendar access denied' },
    { id: 'no-calls', label: 'No calls today' },
    { id: 'loading', label: 'Loading' },
    { id: 'calendar-failed', label: 'Calendar read failed' },
    { id: 'self-test', label: 'Self-test not passed' },
    { id: 'quit-recording', label: 'Noter quit during a recording' },
    { id: 'nothing-to-review', label: 'Nothing to review' },
    { id: 'live', label: 'Live call' },
    { id: 'unmatched-live', label: 'Live call with no calendar match' },
    { id: 'open-handoff', label: 'Open handoff' },
    { id: 'evidence-failed', label: 'Evidence check failed' },
  ];

  const decided = () => ((state.local.activity && state.local.activity.decided) || {});
  const isRec = () => state.rec.status === 'recording' || state.rec.status === 'paused';

  /* fallback proposal row when group E is absent */
  const proposalRow = (p) => {
    if (typeof C.proposalRow === 'function') return C.proposalRow(p, { variant: 'compact', key: 'today', where: 'today' });
    return NP.comp('proposal-row', { variant: 'compact', state: 'waiting', cls: 'td-prop' },
      html`<div class="td-prop__text"><div class="td-prop__title">${p.title}</div><div class="td-prop__why">${p.reason}</div></div>
      <div class="td-prop__btns">${P.button('Reject', { size: 'small', action: ['proposal.reject', { id: p.id, where: 'today' }] })}${P.button('Accept', { size: 'small', variant: 'primary', action: ['proposal.accept', { id: p.id, where: 'today' }] })}</div>`);
  };

  const reviewLine = (demo) => {
    if (demo === 'nothing-to-review' || demo === 'first-use') return '';
    const sugg = D.items.filter((i) => i.review === 'suggested' && i.status !== 'done');
    if (!sugg.length) return '';
    const calls = [...new Set(sugg.map((i) => i.callId))];
    if (!calls.includes('c-backend')) calls.push('c-backend');
    const total = sugg.length + 2;
    return NP.region('TD-R8', { cls: 'td-review', label: 'To review' }, html`
      <div><strong>To review:</strong> ${total} suggested items from ${calls.length} calls · 2 unnamed speakers</div>
      <div class="td-review__links">${calls.map((cid) => P.link(html`${D.call(cid).title} ›`, { action: ['nav.go', { screen: 'call-page', params: { callId: cid, view: 'summary', review: true } }], lang: 'en' }))}</div>`);
  };

  const todayCards = (ctx) => {
    const demo = ctx.demo;
    const L = ctx.local;
    if (demo === 'calendar-not-asked') {
      return C.emptyState({ icon: 'calendar', title: "See today's calls here", body: 'Noter reads your macOS Calendar to line up open items before each call.', actionLabel: 'Allow Calendar Access', action: ['today.allowCalendar'] });
    }
    if (demo === 'calendar-denied') return '';
    if (demo === 'loading') return html`<div class="td-skelcard np-card"><div class="td-skel w60"></div><div class="td-skel"></div><div class="td-skel"></div></div><div class="td-skelcard np-card"><div class="td-skel w60"></div><div class="td-skel"></div></div>`;
    if (demo === 'calendar-failed') return html`<div class="td-errline" role="alert">${icon('error', { size: 14 })}<span>Couldn't read today's calendar.</span>${P.button('Try Again', { size: 'small', action: ['today.retryCalendar'] })}</div>`;
    if (demo === 'no-calls') return C.emptyState({ variant: 'section', title: 'No calls today' });
    let events = D.events.slice();
    const out = [];
    if (demo === 'unmatched-live' && isRec()) out.push(C.upcomingCallCard({}, { variant: 'unmatched' }));
    else if (isRec()) {
      const live = events.find((e) => e.callId === state.rec.callId);
      if (live) { events = events.filter((e) => e !== live); out.push(C.upcomingCallCard(live, { variant: 'live' })); }
    }
    const expanded = L.expanded || {};
    events.forEach((e, i) => {
      const isFirst = i === 0 && !out.length;
      const exp = expanded[e.id] != null ? expanded[e.id] : isFirst;
      out.push(C.upcomingCallCard(demo === 'first-use' ? Object.assign({}, e, { items: [], questions: [] }) : e, { variant: 'today', expanded: exp, collapsible: !isFirst && exp }));
    });
    return out;
  };

  const render = (ctx) => {
    const demo = ctx.demo;
    const L = ctx.local;
    const dueNoCall = D.items.filter((i) => i.noCall && i.status !== 'done');
    const done = D.items.filter((i) => i.status === 'done' && i.doneToday);
    const props = D.proposals.filter((p) => !decided()[p.id]);
    const calendarGone = demo === 'calendar-denied';
    const nEvents = demo === 'no-calls' ? 0 : D.events.length;

    const r3 = NP.region('TD-R3', { cls: 'td-r3', label: 'Today' }, html`
      <h2 class="np-section-h">Today${demo === 'calendar-not-asked' || calendarGone ? '' : html` <span class="np-dim">· ${nEvents} call${nEvents === 1 ? '' : 's'}</span>`}</h2>
      <div class="td-cards">${todayCards(ctx)}</div>`);
    const r4 = calendarGone || demo === 'calendar-not-asked' ? '' : NP.region('TD-R4', { cls: 'td-r4', label: 'This week' }, html`
      <h2 class="np-section-h">This week</h2>
      <div class="td-weeklist np-card">${D.week.map((w) => C.upcomingCallCard(w, { variant: 'week' }))}</div>`);
    const r5 = NP.region('TD-R5', { cls: 'td-r5', label: 'Due this week, no call' }, html`
      <h2 class="np-section-h">Due this week, no call</h2>
      ${demo === 'first-use' ? C.emptyState({ icon: 'inbox', title: 'Nothing open yet', body: 'Items from your calls appear here. Noter offers to record when a call starts.' })
        : html`<div class="td-list np-card">${dueNoCall.length ? dueNoCall.map((i) => NP.A.itemRow(i)) : C.emptyState({ variant: 'section', title: 'Nothing due without a call' })}</div>`}`);
    const r6 = NP.region('TD-R6', { cls: 'td-r6', label: 'Proposals waiting' }, html`
      <h2 class="np-section-h">Proposals waiting <span class="np-dim">· ${props.length}</span></h2>
      ${C.undoStrip({ where: 'today' })}
      <div class="td-props np-card">${props.length ? props.slice(0, 3).map(proposalRow) : C.emptyState({ variant: 'section', title: 'Nothing waiting. Noter asks before it changes older records.' })}</div>
      ${P.link('Show All in Activity', { action: ['nav.go', { screen: 'activity', params: { focus: props[3] ? props[3].id : null } }] })}`);
    const r7 = NP.region('TD-R7', { cls: 'td-r7', label: 'Done today' }, html`
      ${P.disclosure(html`Done today <span class="np-dim">· ${done.length}</span>`, !!L.doneOpen, { action: ['today.doneToggle'] })}
      ${L.doneOpen ? html`<div class="td-list np-card">${done.length ? done.map((i) => C.actionItemRow ? C.actionItemRow(i, { variant: 'done', key: 'today-done' }) : NP.comp('action-item-row', { variant: 'done', state: 'ticked', cls: 'td-row is-done' }, html`${P.checkbox('', true, { ariaLabel: 'Done: ' + i.text, action: ['today.untick', { id: i.id }], id: 'done-' + i.id })}${C.personChip(i.owner)}<span class="td-row__text">${i.text}</span><span class="np-tb__spacer"></span>${P.button('Undo', { size: 'small', variant: 'quiet', action: ['today.untick', { id: i.id }] })}`)) : C.emptyState({ variant: 'section', title: 'Nothing ticked today' })}</div>` : ''}`);

    return html`<div class="td">
      ${reviewLine(demo)}
      ${r3}
      <div class="td-cols">
        <div class="td-col">${r4}${r5}${r7}</div>
        <div class="td-col">${r6}</div>
      </div>
    </div>`;
  };

  NP.screen('today', {
    section: 'today',
    title: 'Today',
    subtitle: () => D.today.label,
    states: STATES,
    toolbarActions: () => {
      if (isRec()) return C.recordingIndicator({ variant: 'button', status: state.rec.status === 'paused' ? 'paused' : 'recording' });
      if (!state.setup.audioGranted) return P.button('Finish Setup…', { action: ['today.finishSetup'], help: 'Microphone or system audio access was never granted' });
      return P.button('Record', { icon: 'record', cls: 'td-recbtn', action: ['today.record'], help: 'Start recording (⌃⌥⌘R)' });
    },
    banners: (ctx) => {
      const d = ctx.demo;
      const b = [];
      if (d === 'calendar-denied') b.push({ id: 'cal-denied', severity: 'warning', text: 'Calendar access is off', actions: [{ label: 'Open System Settings…', action: ['today.openCalSettings'] }] });
      if (d === 'self-test' || !state.setup.selfTestPassed) b.push({ id: 'selftest-today', severity: 'warning', text: 'Call detection is off until the audio self-test passes', actions: [{ label: 'Run Audio Self-Test…', action: ['dialogs.selfTest'] }] });
      if (d === 'quit-recording') b.push({ id: 'quit-rec', severity: 'warning', text: 'Noter quit during “Planning: VHI 8.0 drawer redesign” · saved up to 00:47:12', actions: [{ label: 'Open Call', action: ['nav.go', { screen: 'call-page', params: { callId: 'c-live', view: 'transcript' } }] }, { label: 'Resume Recording', variant: 'primary', action: ['today.resume'] }] });
      return b;
    },
    onDemo: (id, ctx) => {
      const L = ctx.local;
      L.handoffAsk = id === 'open-handoff' ? 'i-virt' : null;
      L.evidenceFailed = id === 'evidence-failed' ? 'i-replay' : null;
      L.loadingItems = false;
      if (id === 'live' || id === 'unmatched-live') { if (!isRec()) NP.startRecording(); }
      if (id === 'self-test') state.setup.selfTestPassed = false;
      if (id === 'default') state.setup.selfTestPassed = true;
      if (state.dismissed) { delete state.dismissed['cal-denied']; delete state.dismissed['quit-rec']; }
    },
    render,
  });

  /* ---------------- actions ---------------- */
  NP.onMany({
    'today.record': () => { NP.freshCall(); NP.startRecording({ offsetMs: 0 }); state.surface = 'call'; },
    'today.finishSetup': () => { const F = NP.local('firstrun'); F.step = 2; state.surface = 'firstrun'; },
    'today.resume': () => { NP.startRecording({ offsetMs: 47 * 60000 + 12000 }); state.surface = 'call'; },
    'today.openCalSettings': () => { NP.flash('proto', 'Opens System Settings › Privacy & Security › Calendars'); },
    'today.allowCalendar': () => { NP.openAlert({ title: '“Noter” would like to access your calendars.', body: 'Noter reads your calendar events to line up open items before each call.', variant: 'system', buttons: [{ label: "Don't Allow", action: 'today.calAnswer', args: { ok: false } }, { label: 'Allow Full Access', variant: 'primary', action: 'today.calAnswer', args: { ok: true } }] }); },
    'today.calAnswer': (a) => { state.alert = null; state.demo.today = a.ok ? 'default' : 'calendar-denied'; },
    'today.retryCalendar': () => { state.demo.today = 'loading'; setTimeout(() => { if (state.demo.today === 'loading') { state.demo.today = 'default'; NP.render(); } }, 900); },
    'today.expand': (a) => { const L = NP.local('today'); L.expanded = L.expanded || {}; const cur = L.expanded[a.id]; L.expanded[a.id] = cur == null ? !(D.events[0].id === a.id) : !cur; },
    'today.showAll': (a) => { const L = NP.local('today'); L.showAll = L.showAll || {}; L.showAll[a.id] = true; },
    'today.weekToggle': (a) => { const L = NP.local('today'); L.weekOpen = L.weekOpen || {}; L.weekOpen[a.id] = !L.weekOpen[a.id]; },
    'today.doneToggle': () => { const L = NP.local('today'); L.doneOpen = !L.doneOpen; },
    'today.sensitive': (a) => { const L = NP.local('today'); L.sensitive = L.sensitive || {}; L.sensitive[a.id] = !L.sensitive[a.id]; NP.flash('proto', L.sensitive[a.id] ? 'Marked as sensitive · Local only' : 'No longer sensitive'); },
    'today.tick': (a) => {
      const it = D.item(a.id); if (!it) return;
      if (it.status === 'done') { NP.actions['today.untick'](a); return; }
      if (it.status === 'handed-off') { NP.local('today').handoffAsk = it.id; return; }
      const wasSugg = it.review === 'suggested';
      it.status = 'done'; it.doneToday = true; it.review = 'accepted';
      NP.flash('row-' + it.id, wasSugg ? 'Accepted and done' : 'Done', 10000);
    },
    'today.untick': (a) => {
      const it = D.item(a.id); if (!it) return;
      it.status = it.handoff ? 'handed-off' : 'open'; it.doneToday = false;
      delete state.flash['row-' + it.id];
    },
    'today.handoffAnswer': (a) => {
      const L = NP.local('today'); L.handoffAsk = null;
      const it = D.item(a.id);
      if (a.a === 'keep') return;
      it.status = 'done'; it.doneToday = true;
      NP.flash('row-' + it.id, a.a === 'landed' ? 'Done · handoff landed' : 'Done another way', 10000);
    },
  });
  /* fallbacks for actions owned by other groups (registered only if absent after all modules load) */
  const fallback = (name, fn) => { if (!NP.actions[name]) NP.on(name, fn); };
  setTimeout(() => {
    fallback('item.tick', (a) => NP.actions['today.tick'](a));
    fallback('item.inspect', (a) => { NP.flash('proto', 'Item inspector for “' + (D.item(a.id) || {}).text + '” (group C)'); });
    fallback('item.handoff', (a) => { NP.flash('proto', 'Handoff drawer for “' + (D.item(a.id) || {}).text + '” (group C)'); });
    fallback('dialogs.selfTest', () => { NP.openSheet('a-selftest', {}); });
    fallback('proposal.accept', (a) => {
      const L = NP.local('activity'); L.decided = L.decided || {}; L.decided[a.id] = 'accepted';
      const p = D.proposals.find((x) => x.id === a.id);
      NP.undo('Accepted: ' + p.title, { context: p.reason, where: a.where || 'today', action: 'a.proposalUndo', args: { id: a.id } });
    });
    fallback('proposal.reject', (a) => {
      const L = NP.local('activity'); L.decided = L.decided || {}; L.decided[a.id] = 'rejected';
      const p = D.proposals.find((x) => x.id === a.id);
      NP.undo('Rejected: ' + p.title, { context: p.reason, where: a.where || 'today', action: 'a.proposalUndo', args: { id: a.id } });
    });
  }, 0);
  NP.on('a.proposalUndo', (a) => { const L = NP.local('activity'); if (L.decided) delete L.decided[a.id]; });

  /* fallback self-test sheet (group C owns the real Dialogs entry) */
  NP.overlay('a-selftest', {
    width: 560,
    title: () => 'Audio self-test',
    render: () => html`<div class="np-sheet__head"><div class="np-sheet__title">Audio self-test</div><div class="np-sheet__sub">Play the test clip or any sound in another app, and say a few words.</div></div>
      <div class="np-sheet__body">${C.selfTestPanel({ variant: 'sheet', key: 'sheet' })}</div>
      <div class="np-sheet__foot">${P.button('Done', { variant: 'primary', action: ['sheet.close'] })}</div>`,
  });
})();

;
/* =====================================================================
   Group B — call window components (DESIGN 3.2, table B):
   capture-notice (2), call-status-strip (5), collapsed-call-strip (6),
   transcript-view (8), transcript-segment-row (9), term-fix-popover (12),
   playback-bar (13), copilot-card-stack (14), copilot-card (15),
   context-chip (18), person-picker (35)
   Popover overlays: speaker-rename, person-picker, term-fix, span-preview
   ===================================================================== */
(function () {
  const { html, raw, attrs, act, comp, icon, P, data: D, state } = NP;
  const C = NP.C;
  const PRIM = P.PRIM;

  /* ---------- extra example data ---------- */
  D.cwHeldCards = [
    { id: 'k4', kind: 'Pin', agent: 'Scribe', merged: [], age: 'now', text: 'Anna delivers the drawer redesign spec by Friday 17 Oct.', lang: 'en', pinAs: { owner: 'p-anna', due: 'Fri 17 Oct' }, prov: { kind: 'this-call', label: 'This call · 00:19:58' } },
  ];
  D.cwMoreEarlier = [
    { id: 'k0d', kind: 'Ask', agent: 'Product manager', text: 'Is the 480-pt drawer width final for VHI 8.0?', prov: { kind: 'this-call', label: 'This call · 00:08:12' }, outcome: 'Expired' },
    { id: 'k0e', kind: 'Context', agent: 'Designer', text: 'Lena K. asked for empty-state copy on 8 Oct.', prov: { kind: 'past-call', label: 'Design review · 8 Oct · 00:31:40', callId: 'c-design' }, outcome: 'Dismissed' },
    { id: 'k0f', kind: 'Answer', agent: 'QA lead', text: 'The drawer has 14 open UI tests in VSTOR.', prov: { kind: 'jira', label: 'Jira · looked up 10:09' }, outcome: 'Used' },
    { id: 'k0g', kind: 'Context', agent: 'Architect', text: 'The notification service already buffers 30 s of events.', prov: { kind: 'doc', label: 'Notification service (Confluence) · Buffering' }, outcome: 'Expired' },
  ];
  D.cwCarryForward = { id: 'kcf', kind: 'Context', carry: 'handoff', agent: 'Scribe', age: 'now', text: 'Last time you handed off “Virtualise the 10k-row table” to Claude Code.', prov: { kind: 'past-call', label: 'Planning · 2 Oct · 00:31:12', callId: 'c-backend' } };
  D.cwPinned = [
    { id: 'pin-1', text: 'Dmitri adds a replay buffer for websocket reconnects', owner: 'p-dmitri' },
    { id: 'pin-2', text: 'Ask backend about reconnect acceptance criteria', owner: 'p-you' },
  ];

  const personShort = (s) => (typeof s === 'string' && s.startsWith('p-') ? D.person(s).short : s);
  const routeHelp = {
    headphones: 'Play this line',
    speakers: 'Replay is off while recording on speakers: the call would hear it. Use headphones, or replay after the call.',
    unknown: "Noter can't tell whether this output is headphones. Choose Headphones in Settings › Audio & Transcription to replay while recording.",
    'not-excluded': "Replay would be recorded. Turn on Exclude Noter's own sounds in Settings › Audio & Transcription.",
  };

  /* ---------- 9. Transcript segment row ---------- */
  C.segmentRow = (seg, o) => {
    o = o || {};
    const key = o.key || 'tr';
    const live = o.variant === 'live' || o.variant === 'tail';
    const tail = o.variant === 'tail';
    if (seg.mark) {
      return comp('transcript-segment-row', { variant: 'mark', cls: 'cw-seg cw-seg--mark' }, html`<span class="cw-seg__time np-tnum">${tail ? '' : seg.t}</span><span class="cw-seg__marktext">${icon('flag', { size: 12 })} ${seg.text}</span>`);
    }
    if (seg.gap) {
      return comp('transcript-segment-row', { variant: 'gap', cls: 'cw-seg cw-seg--gap' }, html`<span class="cw-seg__time"></span><span class="cw-seg__gaptext">${seg.text}</span>`);
    }
    if (seg.hypothesis) {
      return comp('transcript-segment-row', { variant: 'hypothesis', state: 'hypothesis', cls: 'cw-seg cw-seg--hyp' + (tail ? ' cw-seg--tail' : ''), attrs: { lang: (seg.lang || 'en').toLowerCase() } },
        html`<span class="cw-seg__time"></span><span class="cw-seg__spk">${C.speakerLabel(seg.speaker, { static: true })}</span><span class="cw-seg__text">${seg.text}</span><span></span>`);
    }
    const you = seg.speaker === 'p-you';
    const variant = tail ? 'tail' : Array.isArray(seg.speaker) ? 'crosstalk' : you ? 'you' : seg.conf != null && seg.conf < 0.75 ? 'low-confidence' : 'confirmed';
    const corrected = seg.term && seg.term.fixed !== false;
    const hl = o.highlight || (o.highlightSpan && o.highlightSpan === seg.t);
    const playing = o.playingAt === seg.t;
    const route = o.route || 'headphones';
    const canPlay = !live || route === 'headphones';
    const playHelp = live ? routeHelp[route] : 'Play this line';
    const anchorFix = 'fix-' + key + '-' + seg.t.replace(/:/g, '');
    // text with corrected term
    let text = seg.text;
    let textHtml;
    if (corrected && text.includes(seg.term.word)) {
      const [a, b] = text.split(seg.term.word);
      textHtml = html`${a}<button type="button" class="cw-term" title="Heard as “${seg.term.orig}”" data-proto-anchor="${anchorFix}t" ${act('cw.termFix', { anchor: anchorFix + 't', t: seg.t, word: seg.term.word, orig: seg.term.orig, lang: seg.lang })}>${seg.term.word}</button>${b}`;
    } else if (o.find) {
      const q = o.find.toLowerCase(); const i = text.toLowerCase().indexOf(q);
      textHtml = i >= 0 ? html`${text.slice(0, i)}<mark class="np-hl-match">${text.slice(i, i + q.length)}</mark>${text.slice(i + q.length)}` : text;
    } else textHtml = text;
    const lowConf = seg.conf != null && seg.conf < 0.75;
    return comp('transcript-segment-row', { variant, state: playing ? 'playing' : hl ? 'highlighted' : corrected ? 'corrected' : 'default', cls: 'cw-seg' + (tail ? ' cw-seg--tail' : '') + (hl ? ' np-hl-evidence' : '') + (playing ? ' is-playing' : ''), attrs: { lang: (seg.lang || 'en').toLowerCase(), tabindex: '0' } },
      html`<span class="cw-seg__time np-tnum">${seg.t}</span>
      <span class="cw-seg__spk">${C.speakerLabel(seg.speaker, { key: key + seg.t.replace(/:/g, ''), where: live ? 'call-window' : 'main' })}${variant === 'crosstalk' ? html` ${P.badge('Crosstalk', { kind: 'kind' })}` : ''}</span>
      <span class="cw-seg__text${lowConf ? ' is-lowconf' : ''}"${attrs({ title: lowConf ? 'Low confidence' : null })}>${textHtml}${seg.trans && o.showTranslation ? html`<span class="cw-seg__trans">${seg.trans}</span>` : ''}</span>
      <span class="cw-seg__end">
        ${tail ? '' : html`<span class="cw-seg__acts">${P.button('Fix Term…', { size: 'small', variant: 'quiet', anchor: anchorFix, action: ['cw.termFix', { anchor: anchorFix, t: seg.t, word: seg.term ? seg.term.word : seg.text.split(' ').slice(-2).join(' ').replace(/[.,?]$/, ''), orig: seg.term ? seg.term.orig : null, lang: seg.lang }] })}${P.iconButton(playing ? 'pause' : 'play', { label: playing ? 'Pause' : 'Play this line', size: 'inline', disabled: !canPlay, help: playHelp, attrs: !canPlay ? { 'data-state': 'disabled', 'aria-disabled': 'true' } : null, action: canPlay ? ['cw.play', { t: seg.t, speaker: seg.speaker, key, callId: o.callId }] : null })}</span>`}
        ${C.languageTag(seg.lang || 'EN', { conf: seg.conf })}
      </span>`);
  };

  /* ---------- 8. Transcript view ----------
     opts: {callId, segments, variant: live|post-call|tail, key, highlightSpan, waiting, detached, newLines, route, playingAt, find, findBar, header, rows} */
  C.transcriptView = (o) => {
    o = o || {};
    const variant = o.variant || 'live';
    const key = o.key || 'tr-' + variant;
    let segs = (o.segments || D.segments).slice();
    if (variant === 'tail') {
      const confirmed = segs.filter((s) => !s.mark && !s.gap);
      segs = confirmed.slice(-(o.tailLines || 3));
    }
    if (o.waiting) {
      return comp('transcript-view', { variant: variant === 'post-call' ? 'stored' : variant, state: 'waiting-for-speech', cls: 'cw-tv cw-tv--' + variant },
        html`<div class="cw-tv__waiting"><div class="cw-meters"><span>You</span>${P.levelMeter({ level: 3, label: 'Microphone level' })}<span>Others</span>${P.levelMeter({ level: 0, label: 'Call audio level' })}</div><div class="np-muted">Waiting for speech…</div></div>`);
    }
    const stored = variant === 'post-call';
    const findQ = o.find != null ? o.find : null;
    const matches = findQ ? segs.filter((s) => s.text && s.text.toLowerCase().includes(findQ.toLowerCase())).length : 0;
    const rowOpts = { variant: stored ? 'post-call' : variant, key, callId: o.callId, highlightSpan: o.highlightSpan, route: o.route, playingAt: o.playingAt, find: findQ, showTranslation: o.showTranslation };
    return comp('transcript-view', { variant: stored ? 'stored' : variant, state: o.detached ? 'detached' : findQ ? 'find-active' : stored ? 'default' : 'following', cls: 'cw-tv cw-tv--' + variant, attrs: { role: 'log', 'aria-live': 'off', 'aria-label': 'Transcript' } },
      html`${stored && o.findBar ? html`<div class="cw-tv__find">${P.searchField({ id: key + '-find', placeholder: 'Find in transcript', bind: 'local.' + key + '.find', value: findQ || '', live: true })}<span class="np-dim np-tnum">${findQ ? `${matches} of ${segs.length} lines` : ''}</span>${P.iconButton('chevronUp', { label: 'Previous Match', size: 'inline' })}${P.iconButton('chevronDown', { label: 'Next Match', size: 'inline' })}<span class="np-tb__spacer"></span>${P.toggle('Show Archive Changes', false, { size: 'small', labelAfter: true })}</div>` : ''}
      ${o.header ? html`<div class="cw-tv__header np-dim">${o.header}</div>` : ''}
      <div class="cw-tv__scroll" data-proto-scroll="${key}" data-cw-transcript="${key}">
        ${segs.map((s) => C.segmentRow(s, rowOpts))}
      </div>
      ${o.detached && variant === 'live' ? html`<div class="cw-tv__jump">${P.button('Jump to Live · ' + (o.newLines || 12) + ' new lines', { size: 'small', icon: 'chevronDown', action: ['cw.jumpLive'], cls: 'cw-jump' })}</div>` : ''}`);
  };

  /* ---------- 13. Playback bar ----------
     variant: live-headphones | post-call (stored) | result */
  C.playbackBar = (o) => {
    o = o || {};
    const variant = o.variant || 'post-call';
    const playing = o.playing !== false;
    const at = o.at || '00:19:58';
    const stopped = o.stopped;
    if (stopped) {
      return comp('playback-bar', { variant, state: 'stopped-by-route', cls: 'cw-pb cw-pb--' + variant }, html`${icon('info', { size: 13 })}<span>Replay stopped: output switched to speakers</span>`);
    }
    return comp('playback-bar', { variant: variant === 'post-call' ? 'stored' : variant === 'result' ? 'search-and-ask' : variant, state: playing ? 'playing' : 'paused', cls: 'cw-pb cw-pb--' + variant },
      html`${P.iconButton(playing ? 'pause' : 'play', { label: playing ? 'Pause' : 'Play', size: 'inline', action: ['cw.pbToggle', { key: o.key }] })}
      ${P.iconButton('back', { label: 'Back 5 Seconds', size: 'inline', action: ['proto.noop'] })}
      ${P.iconButton('forward', { label: 'Forward 5 Seconds', size: 'inline', action: ['proto.noop'] })}
      <input type="range" class="cw-pb__scrub" min="0" max="60" value="30" aria-label="Position"${attrs({ 'data-component': PRIM, 'data-primitive': 'slider', 'data-variant': 'scrubber' })}>
      <span class="np-tnum cw-pb__time">${at}</span>
      <span class="cw-pb__spk">${o.speaker ? personShort(o.speaker) : ''}</span>
      ${variant === 'live-headphones' ? html`<span class="cw-pb__line">${icon('headphones', { size: 13 })} Replaying while recording · headphones</span>` : ''}
      <span class="np-tb__spacer"></span>
      ${P.popup(['1×', '1.5×', '2×'], '1×', { variant: 'inline', label: 'Speed' })}
      ${P.iconButton('x', { label: 'Close Playback', size: 'inline', action: ['cw.pbClose', { key: o.key }] })}`);
  };

  /* ---------- 18. Context chip ---------- */
  const CHIP_ICON = { call: 'history', doc: 'doc', jira: 'ticket', item: 'list', screen: 'display' };
  C.contextChip = (chip, o) => {
    o = o || {};
    const L = NP.local('cw');
    const id = chip.label;
    const dropped = (L.droppedChips || {})[id];
    const pinned = (L.pinnedChips || {})[id];
    const variant = o.variant || { call: 'past-call', doc: 'document-section', jira: 'carried-forward-item', item: 'carried-forward-item', screen: 'screen' }[chip.kind] || 'past-call';
    if (dropped) return comp('context-chip', { variant, state: 'dropped', tag: 'span', cls: 'cw-cchip is-dropped' }, html`Dropped · ${P.link('Undo', { action: ['cw.chipUndo', { id }] })}`);
    const anchor = 'cchip-' + id.replace(/\W+/g, '');
    NP._menus[anchor] = [{ label: pinned ? 'Unpin' : 'Pin', action: ['cw.chipPin', { id }] }, { label: 'Drop from Context', action: ['cw.chipDrop', { id }] }];
    return comp('context-chip', { variant, state: pinned ? 'pinned' : 'default', tag: 'button', cls: 'cw-cchip', attrs: { type: 'button', title: chip.label, 'data-proto-anchor': anchor, 'data-proto-action': 'proto.menu', 'data-proto-args': JSON.stringify({ anchor }), 'aria-haspopup': 'menu' } },
      html`${icon(CHIP_ICON[chip.kind] || 'doc', { size: 11 })}<span class="cw-cchip__label">${chip.label}</span>${pinned ? icon('pin', { size: 11, label: 'Pinned' }) : ''}${chip.notReviewed ? P.badge('Not reviewed', { tone: 'warning' }) : ''}`);
  };

  /* ---------- 15. Copilot card ----------
     variant: call | floating | compact | read-only | peek */
  C.copilotCard = (card, o) => {
    o = o || {};
    const variant = o.variant === 'compact' ? 'floating' : (o.variant || 'call');
    const L = NP.local('cw');
    const expanded = (L.expanded || {})[card.id];
    const aged = card.aged || /min/.test(card.age || '');
    const kindVariant = card.carry ? 'carry-forward' : card.question ? 'solicited-answer' : String(card.kind || 'Context').toLowerCase();
    const showNum = !o.noNumbers && card.num && variant !== 'read-only';
    const lang = (card.lang || 'en');
    if (variant === 'peek') {
      return comp('copilot-card', { variant: 'peek', cls: 'cw-peek', attrs: { title: card.text, lang } }, html`${card.num ? html`<span class="cw-num">${card.num}</span>` : ''}<b class="cw-peek__kind">${card.kind}</b><span class="cw-peek__text">${card.question || card.text}</span>`);
    }
    const state = card.writing ? 'partial' : card.partial ? 'partial' : expanded ? 'expanded' : aged ? 'aged' : 'fresh';
    const provSpan = 'prov-' + card.id;
    const header = html`<div class="cw-card__head">
      ${o.single ? '' : C.agentBadge(card.agent, { variant: variant === 'read-only' ? 'static' : 'interactive', merged: card.merged, key: card.id })}
      <span class="cw-card__kind">${card.kind === 'Catch-up' ? 'Catch-up' : card.kind}</span>
      ${card.age ? html`<span class="cw-card__age np-dim">· ${card.age}</span>` : ''}
      <span class="np-tb__spacer"></span>
      ${showNum ? html`<span class="cw-num" title="Pin ⌃⌥⌘${card.num}${L.dismissKeys ? ' · Dismiss ⌃⌥⌘⇧' + card.num : ''}"${attrs({ 'data-component': PRIM, 'data-primitive': 'key-cap', 'data-variant': 'number-badge' })}>${card.num}</span>` : ''}
      ${variant === 'read-only' && card.outcome ? P.badge(card.outcome, { tone: card.outcome === 'Pinned' || card.outcome === 'Used' ? 'success' : 'neutral' }) : ''}
    </div>`;
    let body;
    if (card.writing) {
      body = html`<div class="cw-card__body np-muted">${(card.lastLines || []).map((l) => html`<div>${l}</div>`)}<div class="cw-card__writing">${P.progress({ variant: 'spinner', label: 'Writing catch-up' })} Writing catch-up…</div></div>`;
    } else {
      body = html`<div class="cw-card__body"${attrs({ lang })} ${variant === 'read-only' ? '' : act('cw.cardExpand', { id: card.id })}>${card.question ? html`<div class="cw-card__q">“${card.question}”</div>` : ''}${card.text}${card.beingAsked ? html`<div class="cw-card__asked"><b>Being asked now:</b> ${card.beingAsked}</div>` : ''}</div>`;
    }
    const prov = card.prov ? html`<span class="cw-card__prov" data-proto-anchor="${provSpan}">${C.provenanceChip(card.partial ? { loading: true } : card.prov, { inCallWindow: variant !== 'read-only' })}</span>` : '';
    let actions = '';
    if (variant !== 'read-only' && !card.writing) {
      if (card.carry === 'handoff') actions = html`${P.button('Yes, Landed', { size: 'small', action: ['cw.cardDismiss', { id: card.id, text: 'Marked as landed' }] })}${P.button('Keep Open', { size: 'small', variant: 'quiet', action: ['cw.cardDismiss', { id: card.id, text: 'Kept open' }] })}`;
      else if (card.carry === 'closed') actions = html`${P.button('Reopen', { size: 'small', action: ['cw.cardDismiss', { id: card.id, text: 'Reopened' }] })}`;
      else actions = html`${card.kind === 'Catch-up' ? '' : P.button(card.kind === 'Pin' ? 'Pin as Action Item' : 'Pin', { size: 'small', action: ['cw.pin', { id: card.id }] })}${P.button('Dismiss', { size: 'small', variant: 'quiet', action: ['cw.cardDismiss', { id: card.id }] })}`;
    }
    const exp = expanded && variant !== 'read-only' ? html`<div class="cw-card__exp">
      <div class="cw-card__quote np-muted">${card.prov && card.prov.kind === 'this-call' ? '“Then who writes the acceptance criteria for the reconnect handling?” — Pavel, 00:21:40' : '“Drawer events go through the notification service.” — Dmitri S., 00:41:10'}</div>
      <div class="np-dim">Why now: ${card.why || 'the topic came up again in the last 30 seconds'}</div>
      ${card.merged && card.merged.length ? html`<div class="np-dim">Merged with ${card.merged.join(', ')}</div>` : ''}
      <div class="cw-card__fb">${P.iconButton('thumbUp', { label: 'Useful', size: 'inline', action: ['proto.flash', { key: 'call-status', text: 'Thanks · marked useful', ms: 2000 }] })}${P.iconButton('thumbDown', { label: 'Not Useful', size: 'inline', action: ['proto.flash', { key: 'call-status', text: 'Marked unhelpful', ms: 2000 }] })}${card.kind === 'Answer' ? P.button('Copy', { size: 'small', variant: 'quiet', icon: 'copy', flashKey: 'cw-copy-' + card.id, action: ['proto.flash', { key: 'cw-copy-' + card.id, text: 'Copied' }] }) : ''}</div>
    </div>` : '';
    return comp('copilot-card', { variant: variant === 'read-only' ? 'read-only' : kindVariant, state, cls: 'cw-card cw-card--' + variant + (aged ? ' is-aged' : '') + (card.isNew && Date.now() - card.isNew < 350 ? ' is-new' : '') + (expanded ? ' is-expanded' : ''), attrs: { 'data-layout': variant, tabindex: '0', 'aria-label': `${card.kind} card ${card.num || ''}: ${card.text}` } },
      html`${header}${body}${card.carry === 'closed' ? html`<div class="np-dim">Closed: PR #448 merged on 14 Oct</div>` : ''}<div class="cw-card__foot">${prov}<span class="np-tb__spacer"></span>${actions}</div>${exp}`);
  };

  /* ---------- 14. Copilot card stack ----------
     opts: {cards, variant: dedicated|compact|single-agent, maxVisible, held, listening, muted, more, legend} */
  C.copilotCardStack = (o) => {
    o = o || {};
    const variant = o.variant || 'dedicated';
    const cards = o.cards || [];
    const max = o.maxVisible || 3;
    const shown = o.showAll ? cards : cards.slice(0, max);
    const more = cards.length - shown.length;
    const st = o.muted ? 'muted' : o.off ? 'off' : o.state || (cards.length ? (o.held ? 'held' : 'active') : 'listening');
    const cardVariant = variant === 'compact' ? 'floating' : 'call';
    return comp('copilot-card-stack', { variant, state: st, cls: 'cw-stack cw-stack--' + variant, attrs: { 'aria-label': 'Copilot cards' } },
      html`${o.held ? html`<div class="cw-stack__held">${P.button(o.held + ' new card' + (o.held === 1 ? '' : 's') + ' ▴', { size: 'small', action: ['cw.insertHeld'] })}</div>` : ''}
      ${o.off ? html`<div class="cw-stack__listen np-muted">Copilot off for this sensitive call (no local model)</div>` : !cards.length ? html`<div class="cw-stack__listen np-muted">${icon('wave', { size: 14 })}<span>Listening. Cards appear when there is something worth asking</span>${o.showMode ? C.modeIndicator({ variant: 'floating', key: 'listen' }) : ''}</div>` : ''}
      ${shown.map((c) => C.copilotCard(c, { variant: cardVariant, single: variant === 'single-agent' || o.single, noNumbers: o.muted }))}
      ${more > 0 ? html`<div class="cw-stack__more">${P.button(more + ' more', { size: 'small', variant: 'quiet', action: ['cw.showAllCards'] })}</div>` : ''}`);
  };
  /** Key legend line — part of the copilot card stack (anatomy 1) */
  C.cardLegend = (o) => {
    o = o || {};
    const L = NP.local('cw');
    if (L.muted || L.hidden) return '';
    const key = L.panelKey;
    const nums = L.keyTaken ? '1–2' : 'number';
    const pin = key ? html`<b>Pin</b> ${P.kbd('⌘')} + ${nums}` : html`<b>Pin</b> ${P.kbd('⌃⌥⌘')} + ${nums}`;
    const dis = L.dismissKeys || key ? html` · <b>Dismiss</b> ${P.kbd(key ? '⌘⇧' : '⌃⌥⌘⇧')} + ${nums}` : '';
    return comp('copilot-card-stack', { variant: 'key-legend', state: key ? 'key' : 'not-key', tag: 'span', cls: 'cw-legend' }, html`${pin}${dis}`);
  };

  /* ---------- 2. Capture notice ----------
     variant: call-ended | new-meeting | nothing-heard | stopped-automatically | stopped-by-you ; layout dedicated | floating */
  C.captureNotice = (o) => {
    o = o || {};
    const L = NP.local('cw');
    const variant = o.variant || 'call-ended';
    const fl = o.layout === 'floating';
    const size = fl ? 'regular' : 'large';
    let iconName = 'info', tone = 'info', title = '', body = '', actions = '', extra = '';
    if (variant === 'call-ended') {
      iconName = 'stop'; tone = 'warning';
      title = 'The call seems to have ended';
      body = L.countdownPaused ? html`Microsoft Teams stopped using audio and the microphone 20 s ago. <b>Paused while you're here</b>` : html`Microsoft Teams stopped using audio and the microphone 20 s ago. Stopping in <span class="np-tnum">${L.countdown}</span> s.`;
      actions = html`${P.button('Keep Recording', { variant: 'primary', size, action: ['cw.keepRecording'] })}${P.button('Stop Now', { size, action: ['cw.stop', { how: 'manual' }] })}`;
      extra = html`<div class="cw-notice__bar" aria-hidden="true"><span style="width:${(L.countdown / 10) * 100}%"></span></div>`;
    } else if (variant === 'new-meeting') {
      iconName = 'calendar';
      title = 'A new meeting may have started: 1:1 with Anna K.';
      body = 'Microsoft Teams joined a new meeting at 14:30.';
      actions = html`${P.button('Start as New Call', { variant: 'primary', size, action: ['cw.newCall'] })}${P.button('Keep in This Call', { size, action: ['cw.noticeClose'] })}`;
    } else if (variant === 'nothing-heard') {
      iconName = 'warning'; tone = 'warning';
      title = 'Nothing heard yet';
      body = html`<span class="cw-meters"><span>You</span>${P.levelMeter({ level: 0, label: 'Microphone level' })}<span>Others</span>${P.levelMeter({ level: 0, label: 'Call audio level' })}</span>`;
      actions = L.discardConfirm
        ? html`<span class="cw-notice__confirm">Discard this recording? This can't be undone.</span>${P.button('Discard', { variant: 'destructive', size, action: ['cw.discard'] })}${P.button('Back', { size, action: ['cw.discardBack'] })}`
        : html`${P.button('Discard Recording', { size, action: ['cw.discardAsk'] })}${P.button('Keep Recording', { size, variant: 'quiet', action: ['cw.noticeClose'] })}`;
    } else if (variant === 'stopped-automatically') {
      iconName = 'checkCircle'; tone = 'success';
      title = 'Stopped at 11:02 · the call had ended · 48 min saved';
      actions = html`${P.button('Continue Recording', { size, action: ['cw.continue'] })}${P.button('Open in Noter', { size, variant: 'primary', action: ['cw.openInNoter'] })}`;
    } else if (variant === 'stopped-by-you') {
      iconName = 'checkCircle'; tone = 'success';
      title = 'Saved · 48 min · Summary in about 2 minutes';
      actions = html`${P.button('Continue Recording', { size, action: ['cw.continue'] })}${P.button('Open in Noter', { size, variant: 'primary', action: ['cw.openInNoter'] })}${P.button('Close', { size, action: ['cw.closePanel'] })}`;
    }
    return comp('capture-notice', { variant, state: L.discardConfirm && variant === 'nothing-heard' ? 'confirming-discard' : variant === 'call-ended' ? (L.countdownPaused ? 'countdown-paused' : 'countdown-running') : 'default', cls: 'cw-notice cw-notice--' + tone + (fl ? ' is-floating' : ''), attrs: { role: 'alertdialog', 'aria-label': title, 'data-cw-notice': variant } },
      html`<span class="cw-notice__icon">${icon(iconName, { size: 18 })}</span>
      <div class="cw-notice__main"><div class="cw-notice__title">${title}</div>${body ? html`<div class="cw-notice__body">${body}</div>` : ''}</div>
      <div class="cw-notice__actions">${actions}</div>${extra}`);
  };

  /* ---------- 5. Call status strip ---------- variant: dedicated | compact | copilot-off */
  C.callStatusStrip = (o) => {
    o = o || {};
    const L = NP.local('cw');
    const rec = state.rec;
    const variant = o.variant || 'dedicated';
    const paused = rec.status === 'paused';
    const stopped = !!L.closing;
    const copilotOff = variant === 'copilot-off' || L.copilot === 'off';
    const budgetWarn = L.budget === 'near' || L.budget === 'cap';
    const budgetText = L.budget === 'cap' ? '$1.00 of $1.00' : L.budget === 'near' ? '$0.92 of $1.00' : '$0.31 of $1.00';
    const feedback = NP.flashed('call-status');
    const fb = L.keyTaken && !L.keyTakenSeen
      ? C.inlineStatus(raw('Card key ' + P.kbd('⌃⌥⌘3') + ' is used by another app'), { variant: 'notice', actionLabel: 'Change…', action: ['settings.open', { pane: 'hotkeys' }] })
      : feedback ? C.inlineStatus(feedback, { variant: /^No card/.test(feedback) ? 'notice' : 'blind', actionLabel: L.lastCardAction ? 'Undo' : null, action: ['cw.undoCard'], kbd: L.lastCardAction ? '⌃⌥⌘Z' : null }) : '';
    const recInd = C.recordingIndicator({ variant: 'dot-text', status: stopped ? 'stopped' : paused ? 'paused' : L.micOnly ? 'mic-only' : 'recording', clock: false });
    const pinnedBtn = copilotOff ? '' : P.button(L.pinned.length + ' Pinned', { size: 'small', anchor: 'cw-pinned', action: ['cw.pinnedPopover'], icon: 'pin' });
    if (variant === 'compact') {
      const anchor = 'cw-fp-more';
      NP._menus[anchor] = [
        paused ? { label: 'Resume', kbd: '⌃⌥⌘P', action: ['cw.pause'] } : { label: 'Pause', kbd: '⌃⌥⌘P', action: ['cw.pause'] },
        { label: 'Stop Recording', kbd: '⌃⌥⌘R', action: ['cw.stop', { how: 'manual' }] },
        { divider: true },
        { label: 'Ask…', kbd: '⌃⌥⌘A', action: ['cw.ask'] },
      ];
      return comp('call-status-strip', { variant: copilotOff ? 'copilot-off' : 'compact', state: stopped ? 'stopped' : paused ? 'paused' : budgetWarn ? 'budget-near-cap' : 'recording', cls: 'cw-strip cw-strip--compact' },
        html`${fb ? html`<div class="cw-strip__fb">${fb}</div>` : ''}<div class="cw-strip__row">
        ${P.button('Mark Moment', { size: 'small', flashKey: 'cw-mark', action: ['cw.mark'], help: 'Mark Moment (⌃⌥⌘M)' })}
        ${copilotOff ? '' : P.button('Catch Me Up', { size: 'small', action: ['cw.catchUp'], help: 'Catch Me Up (⌃⌥⌘C)' })}
        ${P.pulldown('More', NP._menus[anchor], { iconOnly: true, anchorId: anchor, ariaLabel: 'More', size: 'inline' })}
        <span class="np-tb__spacer"></span>
        ${copilotOff ? '' : html`<span class="cw-strip__budget np-tnum${budgetWarn ? ' is-warn' : ''}" title="Copilot budget for this call">${budgetWarn ? icon('warning', { size: 11 }) : ''}${budgetText.replace(' of ', ' / ')}</span>`}
        </div>`);
    }
    return comp('call-status-strip', { variant: copilotOff ? 'copilot-off' : 'dedicated', state: stopped ? 'stopped' : paused ? 'paused' : budgetWarn ? 'budget-near-cap' : 'recording', cls: 'cw-strip cw-strip--dedicated', region: 'CS-R5' },
      html`<span class="cw-strip__clock t-title2 np-tnum">${NP.clock(false)}</span>
      ${recInd}
      ${copilotOff ? '' : html`<span class="cw-strip__budget np-tnum${budgetWarn ? ' is-warn' : ''}">${budgetWarn ? icon('warning', { size: 12 }) : ''}Budget ${budgetText}</span>`}
      ${pinnedBtn}
      <span class="cw-strip__fb">${fb}</span>
      <span class="np-tb__spacer"></span>
      ${stopped ? '' : html`${P.button('Mark Moment', { kbd: '⌃⌥⌘M', flashKey: 'cw-mark', action: ['cw.mark'] })}
      ${copilotOff ? '' : P.button('Catch Me Up', { kbd: '⌃⌥⌘C', action: ['cw.catchUp'] })}
      ${P.button(paused ? 'Resume' : 'Pause', { kbd: '⌃⌥⌘P', variant: paused ? 'primary' : 'secondary', action: ['cw.pause'] })}
      <span class="cw-strip__gap"></span>
      ${P.button('Stop Recording', { kbd: '⌃⌥⌘R', icon: 'stop', action: ['cw.stop', { how: 'manual' }], cls: 'cw-stop' })}`}`);
  };

  /* ---------- 6. Collapsed call strip ---------- */
  C.collapsedCallStrip = (o) => {
    o = o || {};
    const L = NP.local('cw');
    const paused = state.rec.status === 'paused';
    const off = L.copilot === 'off';
    const top = L.cards[0];
    const variant = paused ? 'paused' : off ? 'copilot-off' : L.muted ? 'copilot-muted' : !top ? 'listening' : 'recording';
