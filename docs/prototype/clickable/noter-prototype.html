<div id="np-root"></div>
<script>
/* =====================================================================
   Noter clickable prototype — core runtime
   Prototype-only plumbing. Nothing in this file is product UI.
   Handoff contract: see README.md (data-component, data-primitive,
   data-variant, data-state, data-region). Attributes prefixed
   data-proto-* belong to the prototype runtime and must be ignored
   by development.
   ===================================================================== */
(function () {
  'use strict';

  /* ---------- Raw HTML + auto-escaping template tag ---------- */
  class Raw { constructor(s) { this.s = s; } toString() { return this.s; } }
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
  const val = (v) => {
    if (v == null || v === false || v === true) return '';
    if (v instanceof Raw) return v.s;
    if (Array.isArray(v)) return v.map(val).join('');
    return esc(v);
  };
  /** html`...` — interpolated strings are escaped, Raw/arrays pass through. */
  const html = (strings, ...vals) => {
    let out = strings[0];
    for (let i = 0; i < vals.length; i++) out += val(vals[i]) + strings[i + 1];
    return new Raw(out);
  };
  const raw = (s) => new Raw(String(s == null ? '' : s));
  const join = (arr, sep) => raw(arr.filter((x) => x != null && x !== false && x !== '').map(val).join(sep ? val(sep) : ''));

  /** attrs({a:1, b:true, c:null}) -> ' a="1" b' (Raw). */
  const attrs = (obj) => {
    if (!obj) return raw('');
    let s = '';
    for (const k of Object.keys(obj)) {
      const v = obj[k];
      if (v == null || v === false) continue;
      if (v === true) s += ' ' + k;
      else s += ' ' + k + '="' + esc(typeof v === 'object' ? JSON.stringify(v) : v) + '"';
    }
    return raw(s);
  };

  /* ---------- Component ids ---------- */
  const cid = (key) => (key.startsWith('cpt-') ? key : 'cpt-noter-component-ui-' + key);
  const sid = (key) => (key.startsWith('cpt-') ? key : 'cpt-noter-component-screen-' + key);

  /**
   * comp('copilot-card', {variant, state, region, tag, cls, attrs}, inner)
   * Root element of a DESIGN complex component (index table B).
   */
  const comp = (key, o, inner) => {
    o = o || {};
    const tag = o.tag || 'div';
    return html`<${raw(tag)}${attrs(Object.assign({
      'data-component': cid(key),
      'data-variant': o.variant,
      'data-state': o.state,
      'data-region': o.region,
      class: o.cls,
    }, o.attrs || {}))}>${inner}</${raw(tag)}>`;
  };
  /** region('TD-R3', {cls, tag, label}, inner) — a layout region of a screen. */
  const region = (code, o, inner) => {
    o = o || {};
    const tag = o.tag || 'section';
    return html`<${raw(tag)}${attrs(Object.assign({ 'data-region': code, class: o.cls, 'aria-label': o.label }, o.attrs || {}))}>${inner}</${raw(tag)}>`;
  };

  /* ---------- State ---------- */
  const loadPref = (k, d) => { try { const v = localStorage.getItem('noter-proto:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const savePref = (k, v) => { try { localStorage.setItem('noter-proto:' + k, JSON.stringify(v)); } catch (e) { /* ignore */ } };

  const state = {
    theme: loadPref('theme', 'system'),         // system | light | dark
    contrast: null,                              // null (follow macOS) | 'more' (Increase Contrast)
    inspect: false,                              // handoff inspector overlay
    handoffPanel: false,                         // component list panel
    surface: 'main',                             // main | call | record | menubar | firstrun | settings | notifications
    route: { screen: 'today', params: {} },
    history: [{ screen: 'today', params: {} }],
    hIndex: 0,
    sidebar: true,
    inspector: null,                             // {kind, props}
    sheet: null,                                 // {id, props}
    alert: null,                                 // {title, body, buttons:[{label, variant, action, args}]}
    popover: null,                               // {id, anchor, props}
    menu: null,                                  // {anchor, items}
    undo: null,                                  // {message, context, label, action, args, at}
    flash: {},                                   // key -> {text, until}
    demo: {},                                    // screen/surface key -> demo state id
    local: {},                                   // screen key -> local state object
    banners: [],                                 // app-level banners for MW-R5 (set by screens' demo states)
    setup: { audioGranted: true, selfTestPassed: true, assistant: 'api-key' },
    rec: {                                       // live capture scenario
      status: 'idle',                            // idle | recording | paused | closing
      callId: 'c-live',
      startedAt: 0,
      pausedAt: 0,
      mode: 'Cloud, redacted',
      layout: 'dedicated',                       // dedicated | floating | collapsed
    },
  };

  /* ---------- Registries ---------- */
  const screens = {};      // main-window pages
  const surfaces = {};     // top-level windows/surfaces
  const overlays = {};     // sheets / popovers by id
  const inspectors = {};   // MW-R4 inspector renderers by kind
  const actions = {};      // action name -> fn(args, ev, el) ; return false to skip re-render
  const galleries = { dialogs: [] };

  const screen = (key, def) => { def.key = key; def.id = def.id || sid(def.idKey || key); screens[key] = def; return def; };
  const surface = (key, def) => { def.key = key; surfaces[key] = def; return def; };
  const overlay = (id, def) => { overlays[id] = def; return def; };
  const inspector = (kind, def) => { inspectors[kind] = def; return def; };
  const on = (name, fn) => { actions[name] = fn; };
  const on_ = (obj) => Object.keys(obj).forEach((k) => on(k, obj[k]));

  /** act('name', args) -> attribute string for a clickable element. */
  const act = (name, args) => attrs({ 'data-proto-action': name, 'data-proto-args': args == null ? null : JSON.stringify(args) });

  /** Per-screen local view state (in-memory only, like the real window store's view state). */
  const local = (key, init) => {
    if (!state.local[key]) state.local[key] = typeof init === 'function' ? init() : Object.assign({}, init || {});
    else if (init) {
      const defs = typeof init === 'function' ? init() : init;
      if (defs && typeof defs === 'object') Object.keys(defs).forEach((k) => { if (!(k in state.local[key])) state.local[key][k] = defs[k]; });
    }
    return state.local[key];
  };
  const demo = (key) => state.demo[key] || 'default';

  /* ---------- Navigation ---------- */
  const go = (screenKey, params, opts) => {
    opts = opts || {};
    state.surface = 'main';
    const r = { screen: screenKey, params: params || {} };
    if (!opts.replace) {
      state.history = state.history.slice(0, state.hIndex + 1);
      state.history.push(r);
      state.hIndex = state.history.length - 1;
    } else {
      state.history[state.hIndex] = r;
    }
    state.route = r;
    if (!opts.keepInspector) state.inspector = null;
    state.popover = null; state.menu = null;
    window.scrollTo && document.querySelector('[data-proto-scroll="content"]') && (document.querySelector('[data-proto-scroll="content"]').scrollTop = 0);
    render();
  };
  const back = () => { if (state.hIndex > 0) { state.hIndex--; state.route = state.history[state.hIndex]; state.inspector = null; render(); } };
  const forward = () => { if (state.hIndex < state.history.length - 1) { state.hIndex++; state.route = state.history[state.hIndex]; state.inspector = null; render(); } };
  const show = (surfaceKey) => { state.surface = surfaceKey; state.popover = null; state.menu = null; render(); };

  /* ---------- Overlays ---------- */
  const openSheet = (id, props) => { state.sheet = { id, props: props || {} }; state.popover = null; state.menu = null; render(); };
  const closeSheet = () => { state.sheet = null; render(); };
  const openAlert = (a) => { state.alert = a; state.popover = null; state.menu = null; render(); };
  const closeAlert = () => { state.alert = null; render(); };
  const openPopover = (id, anchor, props) => { state.popover = { id, anchor, props: props || {} }; state.menu = null; render(); };
  const closePopover = () => { state.popover = null; render(); };
  const openMenu = (anchor, items) => { state.menu = { anchor, items }; state.popover = null; render(); };
  const openInspector = (kind, props) => { state.inspector = { kind, props: props || {} }; render(); };
  const closeInspector = () => { state.inspector = null; render(); };

  /** Undo strip (cpt-noter-component-ui-undo-strip). */
  const undo = (message, opts) => {
    opts = opts || {};
    state.undo = { message, context: opts.context, label: opts.label || 'Undo', action: opts.action, args: opts.args, redoAction: opts.redoAction, redoMessage: opts.redoMessage, at: Date.now(), where: opts.where || 'main' };
    const at = state.undo.at;
    setTimeout(() => { if (state.undo && state.undo.at === at && !state.undo.hover) { state.undo = null; render(); } }, opts.ms || 10000);
  };
  /** Inline status (cpt-noter-component-ui-inline-status): flash(key, text, ms). */
  const flash = (key, text, ms) => {
    const until = Date.now() + (ms || 2000);
    state.flash[key] = { text, until };
    setTimeout(() => { const f = state.flash[key]; if (f && f.until === until) { delete state.flash[key]; render(); } }, (ms || 2000) + 20);
  };
  const flashed = (key) => (state.flash[key] ? state.flash[key].text : null);

  /* ---------- Recording clock ---------- */
  const elapsedMs = () => {
    const r = state.rec;
    if (r.status === 'idle') return 0;
    const now = r.status === 'paused' ? r.pausedAt : Date.now();
    return Math.max(0, now - r.startedAt);
  };
  const fmtClock = (ms, short) => {
    const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    const p = (n) => String(n).padStart(2, '0');
    return short && h === 0 ? `${p(m)}:${p(s)}` : `${p(h)}:${p(m)}:${p(s)}`;
  };
  /** A live-updating clock span. */
  const clock = (short) => html`<span class="np-tnum"${attrs({ 'data-proto-clock': short ? 'short' : 'long' })}>${fmtClock(elapsedMs(), short)}</span>`;
  /** A new capture from Today, the record prompt or the menu bar: default layout, normal call-window state. */
  const freshCall = () => { state.rec.layout = 'dedicated'; delete state.demo.call; delete state.local.cw; };
  const startRecording = (opts) => {
    opts = opts || {};
    Object.assign(state.rec, { status: 'recording', startedAt: Date.now() - (opts.offsetMs != null ? opts.offsetMs : 23 * 60000 + 14000), pausedAt: 0 });
    if (opts.callId) state.rec.callId = opts.callId;
    if (opts.layout) state.rec.layout = opts.layout;
  };

  /* ---------- Rendering ---------- */
  let root = null;
  let scheduled = false;
  const afterRender = [];
  const onAfterRender = (fn) => afterRender.push(fn);

  const render = () => {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => { scheduled = false; renderNow(); });
  };
  const renderNow = () => {
    if (!root) return;
    // keep focus + selection + scroll positions
    const ae = document.activeElement;
    const focusId = ae && ae.id && root.contains(ae) ? ae.id : null;
    let selStart = null, selEnd = null;
    try { if (focusId && 'selectionStart' in ae) { selStart = ae.selectionStart; selEnd = ae.selectionEnd; } } catch (e) { /* */ }
    const scrolls = {};
    root.querySelectorAll('[data-proto-scroll]').forEach((el) => { scrolls[el.getAttribute('data-proto-scroll')] = [el.scrollTop, el.scrollLeft]; });

    applyTheme();
    root.innerHTML = String(NP.shell.harness());

    root.querySelectorAll('[data-proto-scroll]').forEach((el) => {
      const s = scrolls[el.getAttribute('data-proto-scroll')];
      if (s) { el.scrollTop = s[0]; el.scrollLeft = s[1]; }
    });
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) { try { el.focus({ preventScroll: true }); if (selStart != null) el.setSelectionRange(selStart, selEnd); } catch (e) { /* */ } }
    }
    positionFloating();
    afterRender.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });
    if (state.inspect) NP.inspectTool && NP.inspectTool.refresh();
  };

  const applyTheme = () => {
    const d = document.documentElement;
    if (state.theme === 'system') d.removeAttribute('data-theme'); else d.setAttribute('data-theme', state.theme);
    if (state.contrast) d.setAttribute('data-contrast', state.contrast); else d.removeAttribute('data-contrast');
  };

  /** Position popovers and menus next to their anchors (data-proto-anchor). */
  const positionFloating = () => {
    root.querySelectorAll('[data-proto-float]').forEach((fl) => {
      const id = fl.getAttribute('data-proto-float');
      const anchor = root.querySelector('[data-proto-anchor="' + id + '"]');
      const layer = fl.offsetParent || document.body;
      const lr = layer.getBoundingClientRect();
      let top = layer.scrollTop + 80, left = Math.max(8, (layer.clientWidth - fl.offsetWidth) / 2 + layer.scrollLeft);
      if (anchor) {
        const r = anchor.getBoundingClientRect();
        const fw = fl.offsetWidth, fh = fl.offsetHeight;
        left = r.left - lr.left + layer.scrollLeft;

    'Switched to local': 'Claude Code did not answer, so Noter switched to the local model. It tries Claude again in 10 min.',

  NP.overlay('mode-info', {
    kind: 'popover',

  });

  /* ---------- 10. Speaker label ----------
     speaker: person id | 'Speaker 2' | 'Guest (your side)' | ['p-anna','Speaker 3'] (crosstalk) */
  C.speakerLabel = (speaker, o) => {
    o = o || {};

  };

  /* ---------- 16. Agent badge ---------- variant: static | interactive */

  /* ---------- 17. Provenance chip ----------
     prov: {kind: this-call|past-call|jira|doc|lookup|guess|screen, label, callId, span, external}
     variant: chip | inline | timestamp | unverified */
  const PROV_ICON = { 'this-call': 'wave', 'past-call': 'history', jira: 'ticket', doc: 'doc', lookup: 'search', guess: 'warning', screen: 'display' };

    if (prov.loading) return comp('provenance-chip', { variant: o.variant || 'chip', state: 'loading', tag: 'span', cls: 'np-prov is-loading' }, 'Finding the source…');
    if (prov.deleted) return comp('provenance-chip', { variant: o.variant || 'chip', state: 'source-deleted', tag: 'span', cls: 'np-prov is-disabled' }, 'Source deleted');

  C.personChip = (who, o) => {

      html`${icon(variant === 'notice' ? 'info' : 'check', { size: 12 })}<span class="np-istatus__text">${text}</span>${o.actionLabel ? P.link(o.actionLabel, { action: o.action }) : ''}${o.kbd ? P.kbd(o.kbd) : ''}`);

  const currentSection = () => {
    const r = state.route;
    const def = NP.screens[r.screen];
    if (def && typeof def.section === 'function') return def.section(ctxFor(r.screen));

    if (r.screen === 'library') return r.params.view === 'topics' || r.params.view === 'thread' ? 'topics' : 'library';
    if (r.screen === 'person') return 'people';
    return r.screen;
  };

  const sidebarBadges = () => ({
    activity: { count: NP.data.proposals.length - ((state.local.activity && state.local.activity.decided) ? Object.keys(state.local.activity.decided).length : 0), warn: true, aria: 'problem' },
    agents: { warn: NP.data.agents.some((a) => a.enabled && a.status === 'unavailable') },
    performance: { warn: NP.data.metrics.some((m) => m.status === 'off') },
  });

  const sidebar = () => {
    const sec = currentSection();
    const badges = sidebarBadges();
    const rec = state.rec.status === 'recording' || state.rec.status === 'paused';

      <nav class="np-srclist" role="list"${attrs({ 'data-component': P.PRIM, 'data-primitive': 'source-list' })}>
        ${rec ? html`<div class="np-srclist__live" data-variant="live-row">${C.recordingIndicator({ variant: 'live-row', status: state.rec.status === 'paused' ? 'paused' : 'recording' })}</div>` : ''}
        ${SECTIONS.map((s) => {
          if (s.group) return html`<div class="np-srclist__group" data-variant="group-header">${s.group}</div>`;
          const b = badges[s.key] || {};
          const sel = sec === s.key;
          const outputsWriting = s.key === 'library' && state.outputsWriting;
          return html`<a href="#" role="listitem" class="np-srclist__item${sel ? ' is-sel' : ''}${s.screen && !NP.screens[s.screen] ? ' is-missing' : ''}" data-variant="item" data-state="${sel ? 'selected' : 'default'}" aria-current="${sel ? 'page' : 'false'}" ${act('nav.section', { key: s.key })} title="${s.label} (⌘${s.kc})">
            ${icon(s.icon, { size: 15 })}<span class="np-srclist__label">${s.label}</span>
            ${outputsWriting ? P.progress({ variant: 'spinner', label: 'Writing outputs' }) : ''}
            ${b.count ? html`<span class="np-srclist__badge" data-variant="badge">${b.count}</span>` : ''}
            ${b.warn ? html`<span class="np-srclist__warn" title="Needs attention">${icon('warning', { size: 12, label: 'problem' })}</span>` : ''}
          </a>`;
        })}
      </nav>
      <div class="np-sidebar__footer" data-variant="footer">${C.modeIndicator({ variant: 'sidebar', mode: state.setup.assistant === 'none' ? 'No assistant' : rec ? state.rec.mode : 'Cloud, redacted', text: footerMode })}</div>
    </aside>`;
  };
  NP.on('shell.toggleSidebar', () => { state.sidebar = !state.sidebar; });

  const ctxFor = (key) => {
    const r = state.route;
    return { key, route: r, params: r.params || {}, demo: NP.demo(key), local: NP.local(key), state };
  };
  S.ctx = ctxFor;

  const toolbar = (def, ctx) => {
    const title = def && def.title ? (typeof def.title === 'function' ? def.title(ctx) : def.title) : 'Not built';
    const sub = def && def.subtitle ? (typeof def.subtitle === 'function' ? def.subtitle(ctx) : def.subtitle) : '';
    const center = def && def.toolbarCenter ? def.toolbarCenter(ctx) : '';
    const actions = def && def.toolbarActions ? def.toolbarActions(ctx) : '';
    const search = def && def.search === false ? '' : P.searchField({ id: 'mw-search', placeholder: (def && def.searchPlaceholder) || 'Search calls, people, documents', bind: 'local.shell.search', value: (state.local.shell || {}).search || '', enter: 'shell.search', cls: 'np-toolbar__search' });
    return html`<header class="np-toolbar" data-region="MW-R1"${attrs({ 'data-component': P.PRIM, 'data-primitive': 'toolbar' })}>
      ${state.sidebar ? '' : html`${S.lights()}${P.iconButton('sidebar', { label: 'Show Sidebar', action: ['shell.toggleSidebar'], help: 'Show Sidebar (⌃⌘S)' })}`}
      <span class="np-toolbar__nav">${P.iconButton('back', { label: 'Back', action: ['nav.back'], disabled: state.hIndex === 0, help: 'Back (⌘[)' })}${P.iconButton('forward', { label: 'Forward', action: ['nav.forward'], disabled: state.hIndex >= state.history.length - 1, help: 'Forward (⌘])' })}</span>
      <div class="np-toolbar__titles"><h1 class="np-toolbar__title" title="${title}">${title}</h1>${sub ? html`<span class="np-toolbar__sub">${sub}</span>` : ''}</div>
      ${center ? html`<div class="np-toolbar__center">${center}</div>` : ''}
      <span class="np-tb__spacer"></span>
      ${actions ? html`<div class="np-toolbar__actions">${actions}</div>` : ''}
      ${search}
    </header>`;
  };
  NP.on('shell.search', (a) => { const q = (a.value || '').trim(); NP.go('library', { view: 'search', q }); return false; });

  const bannerSlot = (def, ctx) => {
    let list = (def && def.banners ? def.banners(ctx) : []) || [];
    list = list.filter((b) => b && !(state.dismissed && b.id && state.dismissed[b.id]));
    if (state.setup.selfTestPassed === false && ctx.key !== 'today') list.push({ id: 'selftest', severity: 'warning', text: 'Call detection is off until the audio self-test passes', actions: [{ label: 'Run Audio Self-Test…', action: ['dialogs.selfTest'] }] });
    if (!list.length) return '';
    const order = { error: 0, warning: 1, degraded: 2, info: 3, success: 4 };
    list.sort((a, b) => (order[a.severity] || 9) - (order[b.severity] || 9));
    const first = list[0];
    const rest = list.slice(1);
    return html`<div class="np-bannerslot" data-region="MW-R5">${C.inlineBanner(Object.assign({}, first, { more: !state.bannersExpanded && rest.length ? rest.length : null }))}${state.bannersExpanded ? rest.map((b) => C.inlineBanner(b)) : ''}</div>`;
  };

  const inspectorSlot = (def, ctx) => {
    let ins = state.inspector;
    if (!ins && def && def.defaultInspector && !ctx.local.hideInspector) ins = def.defaultInspector(ctx);
    if (!ins) return '';
    const idef = NP.inspectors[ins.kind];
    const w = (idef && idef.width) || 320;
    return html`<aside class="np-inspector" data-region="MW-R4" style="width:${w}px" aria-label="Inspector">
      ${idef ? idef.render(ins.props || {}, ctx) : html`<div class="np-pad">Inspector “${ins.kind}” is not built yet. ${P.button('Close', { action: ['shell.closeInspector'] })}</div>`}
    </aside>`;
  };
  NP.on('shell.closeInspector', () => {
    if (state.inspector) state.inspector = null;
    else { const def = NP.screens[state.route.screen]; if (def) NP.local(def.key).hideInspector = true; }
  });

  S.mainWindow = () => {
    const key = state.route.screen;
    const def = NP.screens[key];
    const ctx = ctxFor(key);
    let body;
    try {
      body = def ? def.render(ctx) : C.emptyState({ variant: 'large', icon: 'wand', title: 'This page is not built yet', body: 'Screen “' + key + '” has no module in this build.' });
    } catch (e) { console.error(e); body = html`<pre class="np-err">${e.stack || e.message}</pre>`; }
    return html`<div class="np-win np-win--main${state.sidebar ? '' : ' no-sidebar'}" data-component="cpt-noter-component-shell-main-window" data-state="${state.rec.status === 'recording' || state.rec.status === 'paused' ? 'capturing' : 'idle'}">
      ${state.sidebar ? html`${sidebar()}${P.splitDivider()}` : ''}
      <div class="np-main">
        ${toolbar(def, ctx)}
        ${bannerSlot(def, ctx)}
        <div class="np-body">
          <div class="np-content" data-region="MW-R3" data-proto-scroll="content-${key}">
            <div${attrs({ 'data-component': def ? def.id : null, 'data-state': ctx.demo, 'data-variant': def && def.variant ? def.variant(ctx) : null, class: 'np-screen np-screen--' + key })}>${body}</div>
          </div>
          ${inspectorSlot(def, ctx)}
        </div>
      </div>
      ${S.windowOverlays()}
    </div>`;
  };

  /* ---------------- Harness (prototype chrome) ---------------- */
  const SURFACES = [
    { key: 'main', label: 'Main window' },
    { key: 'call', label: 'Call window' },
    { key: 'record', label: 'Record prompt' },
    { key: 'menubar', label: 'Menu bar' },
    { key: 'firstrun', label: 'First run' },
    { key: 'settings', label: 'Settings' },
    { key: 'notifications', label: 'Notifications' },
  ];

  const statesFor = () => {
    if (state.surface === 'main') { const d = NP.screens[state.route.screen]; return d ? { key: d.key, label: (typeof d.title === 'function' ? d.title(ctxFor(d.key)) : d.title) || d.key, states: d.states || [] } : null; }
    const s = NP.surfaces[state.surface];
    return s ? { key: s.key, label: s.label, states: s.states || [] } : null;
  };

  S.harness = () => {
    const sf = statesFor();
    const cur = sf ? NP.demo(sf.key) : 'default';
    const statesItems = sf && sf.states.length ? sf.states.map((s) => ({ label: s.label, checked: s.id === cur, action: ['proto.setDemo', { key: sf.key, id: s.id }] })) : [{ label: 'No extra states for this view', disabled: true }];
    NP._menus['h-states'] = statesItems;
    const dialogItems = (NP.galleries.dialogs || []).map((d) => ({ label: d.label, action: ['proto.openDialog', { id: d.id }] }));
    NP._menus['h-dialogs'] = dialogItems.length ? dialogItems : [{ label: 'No dialogs registered', disabled: true }];
    const surfaceBody = (() => {
      try {
        if (state.surface === 'main') return html`${S.caption('Main window', ' · 1280 × 820 default, minimum 900 × 600')}${S.mainWindow()}`;
        const s = NP.surfaces[state.surface];
        if (!s) return html`${S.caption(state.surface)}${C.emptyState({ icon: 'wand', title: 'Not built yet', body: 'Surface “' + state.surface + '” has no module.' })}`;
        return s.render(ctxForSurface(s.key));
      } catch (e) { console.error(e); return html`<pre class="np-err">${e.stack || e.message}</pre>`; }
    })();
    const recItems = [
      { label: 'Idle', checked: state.rec.status === 'idle', action: ['proto.rec', { status: 'idle' }] },
      { label: 'Recording', checked: state.rec.status === 'recording', action: ['proto.rec', { status: 'recording' }] },
      { label: 'Paused', checked: state.rec.status === 'paused', action: ['proto.rec', { status: 'paused' }] },
      { divider: true },
      { label: 'Audio access never granted', checked: !state.setup.audioGranted, action: ['proto.setup', { k: 'audioGranted' }] },
      { label: 'Self-test not passed', checked: !state.setup.selfTestPassed, action: ['proto.setup', { k: 'selfTestPassed' }] },
      { label: 'No assistant configured', checked: state.setup.assistant === 'none', action: ['proto.setup', { k: 'assistant' }] },
      { label: 'Increase contrast (macOS accessibility)', checked: state.contrast === 'more', action: ['proto.contrast'] },
      { divider: true },
      { label: 'Claude account signed in', checked: !!(NP.auth && NP.auth.signedIn('claude')), action: ['auth.toggleDemo', { p: 'claude' }] },
      { label: 'ChatGPT account signed in', checked: !!(NP.auth && NP.auth.signedIn('chatgpt')), action: ['auth.toggleDemo', { p: 'chatgpt' }] },
    ];
    NP._menus['h-scenario'] = recItems;
    const missing = NP.flashed('proto-missing') || NP.flashed('proto');
    return html`<div class="np-harness${state.inspect ? ' is-inspecting' : ''}${state.handoffPanel ? ' has-panel' : ''}">
      <header class="np-hbar" data-proto-chrome>
        <div class="np-hbar__brand">${icon('noter', { size: 16 })}<span>Noter</span><em>clickable prototype</em></div>
        <nav class="np-hbar__tabs" aria-label="Surfaces">${SURFACES.map((s) => html`<button type="button" class="np-hbar__tab${state.surface === s.key ? ' is-on' : ''}" aria-pressed="${String(state.surface === s.key)}" ${act('surface.show', { surface: s.key })}>${s.label}</button>`)}
          <button type="button" class="np-hbar__tab" data-proto-anchor="h-dialogs" ${act('proto.menu', { anchor: 'h-dialogs' })}>Dialogs ▾</button></nav>
        <div class="np-hbar__tools">
          <button type="button" class="np-hbar__btn" data-proto-anchor="h-states" ${act('proto.menu', { anchor: 'h-states' })} title="Show this view in another state from DESIGN">State: ${sf && sf.states.length ? (sf.states.find((s) => s.id === cur) || sf.states[0]).label : 'Normal'} ▾</button>
          <button type="button" class="np-hbar__btn" data-proto-anchor="h-scenario" ${act('proto.menu', { anchor: 'h-scenario' })}>Capture: ${state.rec.status === 'idle' ? 'Idle' : state.rec.status === 'paused' ? 'Paused' : 'Recording'} ▾</button>
          <span class="np-hbar__seg" role="radiogroup" aria-label="Appearance">${['system', 'light', 'dark'].map((t) => html`<button type="button" role="radio" aria-checked="${String(state.theme === t)}" class="${state.theme === t ? 'is-on' : ''}" ${act('proto.theme', { theme: t })}>${t === 'system' ? 'Auto' : t === 'light' ? 'Light' : 'Dark'}</button>`)}</span>
          <button type="button" class="np-hbar__btn${state.inspect ? ' is-on' : ''}" aria-pressed="${String(state.inspect)}" ${act('proto.inspect')} title="Hover any element to see its DESIGN component; click to pin it">Inspect</button>
          <button type="button" class="np-hbar__btn${state.handoffPanel ? ' is-on' : ''}" aria-pressed="${String(state.handoffPanel)}" ${act('proto.panel')}>Components</button>
        </div>
      </header>
      <div class="np-stage">
        <div class="np-desk" data-proto-scroll="desk">
          ${surfaceBody}
          ${S.floatingLayer()}
        </div>
        ${state.handoffPanel ? html`<aside class="np-hpanel" data-proto-chrome aria-label="Components on this view"><div class="np-hpanel__inner" id="np-hpanel"></div></aside>` : ''}
      </div>
      ${missing ? html`<div class="np-toast" data-proto-chrome role="status">${missing}</div>` : ''}
      <div class="np-inspect-tip" id="np-inspect-tip" data-proto-chrome hidden></div>
    </div>`;
  };
  const ctxForSurface = (key) => ({ key, demo: NP.demo(key), local: NP.local(key), state });
  S.surfaceCtx = ctxForSurface;

  NP.on('proto.setDemo', (a) => {
    state.demo[a.key] = a.id;
    const def = NP.screens[a.key] || NP.surfaces[a.key];
    if (def && def.onDemo) def.onDemo(a.id, a.key === state.route.screen ? ctxFor(a.key) : ctxForSurface(a.key));
  });
  NP.on('proto.theme', (a) => { state.theme = a.theme; NP.savePref('theme', a.theme); });
  NP.on('proto.contrast', () => { state.contrast = state.contrast === 'more' ? null : 'more'; });
  NP.on('proto.inspect', () => { state.inspect = !state.inspect; if (!state.inspect) S.hideTip(); });
  NP.on('proto.panel', () => { state.handoffPanel = !state.handoffPanel; });
  NP.on('proto.rec', (a) => {
    if (a.status === 'idle') state.rec.status = 'idle';
    else if (a.status === 'recording') { if (state.rec.status === 'paused') { state.rec.startedAt += Date.now() - state.rec.pausedAt; state.rec.status = 'recording'; } else NP.startRecording(); }
    else if (a.status === 'paused') { if (state.rec.status === 'idle') NP.startRecording(); state.rec.status = 'paused'; state.rec.pausedAt = Date.now(); }
  });
  NP.on('proto.setup', (a) => {
    if (a.k === 'assistant') state.setup.assistant = state.setup.assistant === 'none' ? 'api-key' : 'none';
    else state.setup[a.k] = !state.setup[a.k];
  });
  NP.on('proto.openDialog', (a) => { const d = (NP.galleries.dialogs || []).find((x) => x.id === a.id); if (d) { if (d.surface) state.surface = d.surface; d.open(); } });

  /* ---------------- Handoff tools: inspect tip + components panel ---------------- */
  const describe = (el) => {
    const out = [];
    let n = el;
    while (n && n !== document.body && out.length < 6) {
      if (n.getAttribute) {
        const c = n.getAttribute('data-component');
        if (c) {
          out.push({ el: n, component: c, primitive: n.getAttribute('data-primitive'), variant: n.getAttribute('data-variant'), state: n.getAttribute('data-state'), size: n.getAttribute('data-size') });
        } else if (n.getAttribute('data-region') && out.length < 6) {
          out.push({ el: n, region: n.getAttribute('data-region') });
        }
      }
      n = n.parentElement;
    }
    return out;
  };
  const tipHtml = (chain) => chain.map((d, i) => d.region
    ? `<div class="np-tip__row is-region"><b>region</b> ${NP.esc(d.region)}</div>`
    : `<div class="np-tip__row${i === 0 ? ' is-main' : ''}"><code>${NP.esc(d.component.replace('cpt-noter-component-', ''))}</code>${d.primitive ? ` <span>${NP.esc(d.primitive)}</span>` : ''}${d.variant ? ` <i>variant=${NP.esc(d.variant)}</i>` : ''}${d.size ? ` <i>size=${NP.esc(d.size)}</i>` : ''}${d.state ? ` <i>state=${NP.esc(d.state)}</i>` : ''}</div>`).join('');
  S.hideTip = () => { const t = document.getElementById('np-inspect-tip'); if (t) t.hidden = true; document.querySelectorAll('.np-inspect-hl').forEach((e) => e.classList.remove('np-inspect-hl')); };
  NP.inspectTool = {
    hover(ev) {
      const target = ev.target.closest('[data-component],[data-region]');
      const tip = document.getElementById('np-inspect-tip');
      if (!tip) return;
      document.querySelectorAll('.np-inspect-hl').forEach((e) => e.classList.remove('np-inspect-hl'));
      if (!target || target.closest('[data-proto-chrome]')) { tip.hidden = true; return; }
      const chain = describe(target);
      if (!chain.length) { tip.hidden = true; return; }
      const first = chain.find((d) => d.component) || chain[0];
      first.el.classList.add('np-inspect-hl');
      tip.innerHTML = tipHtml(chain);
      tip.hidden = false;
      const r = first.el.getBoundingClientRect();
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      let top = r.top - th - 6; if (top < 50) top = Math.min(window.innerHeight - th - 8, r.bottom + 6);
      let left = Math.min(Math.max(8, r.left), window.innerWidth - tw - 8);
      tip.style.top = top + 'px'; tip.style.left = left + 'px';
    },
    click(ev) {
      if (ev.target.closest('[data-proto-chrome]')) return false;
      const target = ev.target.closest('[data-component]');
      if (!target) return false;
      ev.preventDefault(); ev.stopPropagation();
      const chain = describe(target).filter((d) => d.component);
      state.pinned = chain.map((d) => ({ component: d.component, primitive: d.primitive, variant: d.variant, state: d.state, size: d.size }));
      state.handoffPanel = true;
      NP.render();
      return true;
    },
    refresh() { /* tip follows the mouse; nothing to do */ },
  };

  /* Components panel: what is on the current view, built from the DOM after each render */
  const fillPanel = () => {
    const host = document.getElementById('np-hpanel');
    if (!host) return;
    const desk = document.querySelector('.np-desk');
    const els = desk ? desk.querySelectorAll('[data-component]') : [];
    const map = new Map();
    els.forEach((el) => {
      const id = el.getAttribute('data-component');
      const prim = el.getAttribute('data-primitive');
      const key = prim ? id + '::' + prim : id;
      if (!map.has(key)) map.set(key, { id, prim, count: 0, variants: new Set(), states: new Set() });
      const m = map.get(key); m.count++;
      const v = el.getAttribute('data-variant'); if (v) m.variants.add(v);
      const s = el.getAttribute('data-state'); if (s) m.states.add(s);
    });
    const rows = [...map.values()].sort((a, b) => {
      const rank = (x) => (x.id.includes('-shell-') ? 0 : x.id.includes('-screen-') ? 1 : x.prim ? 3 : 2);
      return rank(a) - rank(b) || a.id.localeCompare(b.id) || String(a.prim).localeCompare(String(b.prim));
    });
    const pinned = state.pinned ? `<section class="np-hp__pinned"><h3>Pinned element</h3>${state.pinned.map((d, i) => `<div class="np-hp__pin${i === 0 ? ' is-main' : ''}"><code>${NP.esc(d.component)}</code>${d.primitive ? `<div>data-primitive="${NP.esc(d.primitive)}"</div>` : ''}${d.variant ? `<div>data-variant="${NP.esc(d.variant)}"</div>` : ''}${d.size ? `<div>data-size="${NP.esc(d.size)}"</div>` : ''}${d.state ? `<div>data-state="${NP.esc(d.state)}"</div>` : ''}</div>`).join('')}<button type="button" class="np-hbar__btn" data-proto-action="proto.unpin">Clear</button></section>` : '';
    host.innerHTML = `${pinned}<h3>On this view · ${rows.length} kinds</h3><p class="np-hp__hint">Every element carries <code>data-component</code>; primitives add <code>data-primitive</code>. Click a row to highlight it.</p><ul class="np-hp__list">${rows.map((r) => `<li><button type="button" class="np-hp__row" data-hl="${NP.esc(r.id)}" data-hl-prim="${NP.esc(r.prim || '')}"><code>${NP.esc(r.id.replace('cpt-noter-component-', ''))}${r.prim ? ' · ' + NP.esc(r.prim) : ''}</code><span class="np-hp__count">${r.count}</span>${r.variants.size ? `<span class="np-hp__meta">variants: ${NP.esc([...r.variants].join(', '))}</span>` : ''}${r.states.size ? `<span class="np-hp__meta">states: ${NP.esc([...r.states].join(', '))}</span>` : ''}</button></li>`).join('')}</ul>`;
    host.querySelectorAll('[data-hl]').forEach((b) => b.addEventListener('click', () => {
      const id = b.getAttribute('data-hl'); const pr = b.getAttribute('data-hl-prim');
      const sel = '[data-component="' + id + '"]' + (pr ? '[data-primitive="' + pr + '"]' : '');
      const found = document.querySelectorAll('.np-desk ' + sel);
      found.forEach((e) => { e.classList.add('np-flash-hl'); setTimeout(() => e.classList.remove('np-flash-hl'), 1600); });
      if (found[0]) found[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
    }));
  };
  NP.onAfterRender(fillPanel);
  NP.on('proto.unpin', () => { state.pinned = null; });
})();

(function () {
  const { html, raw, attrs, act, comp, icon, P, data: D } = NP;
  const C = NP.C;

  /* ---------------- 1. Record prompt ----------------
     recordPrompt({variant: default|disk-low|system-audio-off|call-ended|new-meeting, state, app, key}) */
  C.recordPrompt = (o) => {
    o = o || {};
    const variant = o.variant || 'default';
    const app = o.app || 'Microsoft Teams';
    const L = NP.local('rp');
    if (variant === 'call-ended') {
      const paused = L.hover;
      const secs = L.countdown == null ? 10 : L.countdown;
      return comp('record-prompt', { variant, state: paused ? 'countdown-paused' : 'countdown-running', cls: 'rp-panel', attrs: { role: 'dialog', 'aria-label': 'The call seems to have ended', 'data-proto-rp': 'countdown' } },
        html`${NP.region('RP-R1', { tag: 'div', cls: 'rp-r1' }, html`
          <div class="rp-r1__text"><div class="rp-title">The call seems to have ended</div>
          <div class="rp-sub">${app} stopped using audio and the microphone 20 s ago. ${paused ? 'Paused while you\'re here' : html`Stopping in <span class="np-tnum">${secs}</span> s.`}</div>
          <div class="rp-countdown" aria-hidden="true"><span style="width:${secs * 10}%"></span></div></div>`)}
        ${NP.region('RP-R3', { tag: 'div', cls: 'rp-r3' }, html`${P.button('Stop Now', { action: ['rp.stopNow'] })}<span class="np-tb__spacer"></span>${P.button('Keep Recording', { variant: 'primary', action: ['rp.keep'] })}`)}`);
    }
    if (variant === 'new-meeting') {
      return comp('record-prompt', { variant, state: 'default', cls: 'rp-panel', attrs: { role: 'dialog', 'aria-label': 'A new meeting may have started' } },
        html`${NP.region('RP-R1', { tag: 'div', cls: 'rp-r1' }, html`<div class="rp-r1__text"><div class="rp-title">A new meeting may have started: <span lang="en">1:1 with Anna K.</span></div><div class="rp-sub">Planning: VHI 8.0 drawer redesign is still recording.</div></div>`)}
        ${NP.region('RP-R3', { tag: 'div', cls: 'rp-r3' }, html`${P.button('Keep in This Call', { action: ['rp.keepInCall'] })}<span class="np-tb__spacer"></span>${P.button('Start as New Call', { variant: 'primary', action: ['rp.newCall'] })}`)}`);
    }
    const safari = app === 'Safari';
    const notNowItems = [
      { label: 'Not Now', action: ['rp.notNow'] },
      { divider: true },
      { label: `Don't Ask for ${app}…`, action: ['rp.dontAskStart'] },
    ];
    const notNow = P.pulldown('Not Now', notNowItems, { anchorId: 'rp-notnow', variant: 'panel' });
    let actions;
    if (L.dontAsk) {
      actions = html`<div class="rp-inline" role="group" aria-label="Don't ask for ${app}">
        ${safari ? html`<p>Calls in Safari, such as Google Meet, won't be offered for recording either.</p>` : html`<p>${app} won't be offered for recording again.</p>`}
        <div class="rp-inline__btns">${P.button('Back', { action: ['rp.dontAskBack'] })}${P.button("Don't Ask", { variant: 'primary', action: ['rp.dontAsk'] })}</div></div>`;
    } else if (variant === 'disk-low') {
      actions = html`<div class="rp-reason">${icon('warning', { size: 13 })}<span>Not enough disk space to record (420 MB free)</span></div>
        <div class="rp-btnrow">${notNow}${P.button('Delete Old Audio…', { action: ['rp.deleteOldAudio'] })}<span class="np-tb__spacer"></span>${P.button('Record', { variant: 'primary', disabled: true, kbd: '⌃⌥⌘R' })}</div>`;
    } else if (variant === 'system-audio-off') {
      actions = html`<div class="rp-reason">${icon('warning', { size: 13 })}<span>System audio access is off</span></div>
        <div class="rp-btnrow">${notNow}<span class="np-tb__spacer"></span>${P.button('Open System Settings…', { variant: 'primary', action: ['rp.openSysSettings'] })}</div>`;
    } else {
      actions = html`<div class="rp-btnrow">${notNow}${P.button('Record as Sensitive', { action: ['rp.record', { sensitive: true }] })}<span class="np-tb__spacer"></span>${P.button('Record', { variant: 'primary', action: ['rp.record'], kbd: '⌃⌥⌘R' })}</div>`;
    }
    return comp('record-prompt', { variant, state: variant === 'disk-low' || variant === 'system-audio-off' ? 'disabled' : (L.dontAsk ? 'not-a-call' : 'default'), cls: 'rp-panel', attrs: { role: 'dialog', 'aria-label': 'Record this call?' } },
      html`${NP.region('RP-R1', { tag: 'div', cls: 'rp-r1' }, html`
        <span class="rp-appicon" aria-hidden="true">${icon(safari ? 'globe' : 'people', { size: 20 })}</span>
        <div class="rp-r1__text"><div class="rp-title">Record this call?</div><div class="rp-sub">${o.event ? html`<span lang="en">${o.event}</span>` : `${app} is using the microphone`}</div></div>
        ${P.iconButton('x', { label: 'Close', size: 'inline', action: ['rp.notNow'] })}`)}
      ${NP.region('RP-R3', { tag: 'div', cls: 'rp-r3 rp-r3--stack' }, actions)}`);
  };

  /* ---------------- 7. Status item ----------------
     Glyph + native menu. statusItem({state, glyph, hidden, open, title, menu: html}) */
  const GLYPH = {
    idle: '<rect x="4" y="2.5" width="10" height="13" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.6 6.5h4.8M6.6 9h4.8M6.6 11.5h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
    recording: '<rect x="4" y="2.5" width="10" height="13" rx="2.2" fill="currentColor"/><circle cx="9" cy="9" r="2.4" fill="var(--mb-bar)"/>',
    paused: '<rect x="4" y="2.5" width="10" height="13" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.4 6.5v5M10.6 6.5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
    muted: '<rect x="4" y="2.5" width="10" height="13" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.6 6.5h4.8M6.6 9h4.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M2.5 15.5l13-13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  };
  const EYE = '<g transform="translate(10.5 10.5) scale(.45)"><circle cx="8" cy="8" r="8" fill="var(--mb-bar)"/><path d="M2 8s2.2-4 6-4 6 4 6 4-2.2 4-6 4-6-4-6-4z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 13L13 3" stroke="currentColor" stroke-width="2"/></g>';
  C.statusGlyph = (glyph, o) => {
    o = o || {};
    const label = { idle: 'Noter, not recording', recording: 'Noter, recording', paused: 'Noter, paused', muted: 'Noter, copilot muted' }[glyph] + (o.hidden ? ', hidden for presenting' : '');
    return raw(`<svg class="mb-glyph" width="18" height="18" viewBox="0 0 18 18" role="img" aria-label="${NP.esc(label)}">${GLYPH[glyph] || GLYPH.idle}${o.hidden ? EYE : ''}</svg>`);
  };
  C.statusItem = (o) => {
    o = o || {};
    const glyph = o.glyph || 'idle';
    const variant = glyph + '-glyph' + (o.hidden ? '-hidden' : '');
    return comp('status-item', { variant, state: o.state || 'menu-open', cls: 'mb-item' + (o.open ? ' is-open' : ''), attrs: { 'data-region': 'MB-R1' } },
      html`<button type="button" class="mb-item__btn" aria-haspopup="menu" aria-expanded="${String(!!o.open)}" ${act('mb.toggle')}>${C.statusGlyph(glyph, o)}${o.title && !o.hidden ? html`<span class="mb-item__title np-tnum">${o.title}</span>` : ''}</button>
      ${o.open && o.menu ? o.menu : ''}`);
  };

  /* ---------------- 29. Upcoming call card ----------------
     upcomingCallCard(event, {variant: today|week|live|unmatched|nothing-open, key, expanded, rows, maxRows}) */
  C.upcomingCallCard = (ev, o) => {
    o = o || {};
    const variant = o.variant || 'today';
    const L = NP.local('today');
    const rec = NP.state.rec.status === 'recording' || NP.state.rec.status === 'paused';
    if (variant === 'unmatched') {
      return comp('upcoming-call-card', { variant, state: 'live', cls: 'td-card np-card is-live' },
        html`<div class="td-card__head"><div class="td-card__time">${C.recordingIndicator({ variant: 'dot', clock: false })}</div>
        <div class="td-card__title">Recording · Microsoft Teams · ${NP.clock(false)}</div>
        ${P.button('Open Call Screen', { variant: 'primary', size: 'small', action: ['call.show'] })}</div>`);
    }
    const items = (ev.items || []).map(D.item).filter((i) => i && (i.status !== 'done' || NP.flashed('row-' + i.id)));
    const qs = (ev.questions || []).map(D.item).filter(Boolean);
    const count = items.length + qs.length;
    if (variant === 'week') {
      const open = !!L.weekOpen && L.weekOpen[ev.id];
      return comp('upcoming-call-card', { variant, state: open ? 'expanded' : 'collapsed', cls: 'td-week' },
        html`<div class="td-week__line">${P.disclosure(html`<span class="td-week__day">${ev.day}</span> <span lang="en">${ev.title}</span>`, open, { variant: 'row', action: ['today.weekToggle', { id: ev.id }] })}${ev.summary === 'Local only' ? html`<span class="td-localtag">${icon('lock', { size: 11 })}Local only</span>` : html`<span class="td-week__sum">${ev.summary}</span>`}</div>
        ${open ? html`<div class="td-card__rows">${items.map((i) => NP.A.itemRow(i))}${!items.length ? C.emptyState({ variant: 'section', title: 'Nothing open' }) : ''}</div>` : ''}`);
    }
    const live = variant === 'live' || (rec && ev.callId === NP.state.rec.callId);
    const expanded = o.expanded !== false;
    const max = o.maxRows || 5;
    const showAll = L.showAll && L.showAll[ev.id];
    const rows = [...items.map((i) => ({ i, kind: 'item' })), ...qs.map((i) => ({ i, kind: 'q' }))];
    const visible = showAll ? rows : rows.slice(0, max);
    const moreAnchor = 'td-more-' + ev.id;
    NP._menus[moreAnchor] = [
      { label: 'Call Type', submenu: true, action: ['proto.flash', { key: 'proto', text: 'Call Type ▸ Planning · 1:1 · Backend sync · Vendor' }] },
      { label: 'Mark as Sensitive', action: ['today.sensitive', { id: ev.id }] },
      { label: 'Show Previous Call', action: ['nav.go', { screen: 'call-page', params: { callId: ev.lastCallId || 'c-backend', view: 'summary' } }] },
    ];
    const sensitive = L.sensitive && L.sensitive[ev.id];
    const state = live ? 'live' : sensitive ? 'sensitive' : (L.loadingItems ? 'loading-items' : (expanded ? 'expanded' : 'collapsed'));
    if (!expanded) {
      return comp('upcoming-call-card', { variant: 'today', state: 'collapsed', cls: 'td-card td-card--collapsed np-card' },
        html`<div class="td-card__head">${P.disclosure(html`<span class="td-card__time np-tnum">${ev.time}</span><span class="td-card__title" lang="en">${ev.title}</span>`, false, { variant: 'row', action: ['today.expand', { id: ev.id }] })}<span class="td-card__count">${count ? `${count} open item${count === 1 ? '' : 's'}` : 'Nothing open'}</span></div>`);
    }
    return comp('upcoming-call-card', { variant: live ? 'live' : (count ? 'today' : 'nothing-open'), state, cls: 'td-card np-card' + (live ? ' is-live' : '') },
      html`<div class="td-card__head" title="These items load into the copilot when the call starts.">
        <div class="td-card__time np-tnum">${live ? C.recordingIndicator({ variant: 'dot', clock: false }) : ''}${ev.time}</div>
        <div class="td-card__main">
          <div class="td-card__titlerow"><span class="td-card__title" lang="en" title="${ev.title}">${ev.title}</span>
            ${live ? P.button('Open Call Screen', { variant: 'primary', size: 'small', action: ['call.show'], kbd: '⌃⌥⌘N' }) : ''}
            ${P.pulldown('More', NP._menus[moreAnchor], { anchorId: moreAnchor, iconOnly: true, ariaLabel: 'More actions for ' + ev.title, help: 'More' })}
            ${o.collapsible ? P.iconButton('chevronUp', { label: 'Collapse', size: 'inline', action: ['today.expand', { id: ev.id }] }) : ''}</div>
          <div class="td-card__att">${(ev.people || []).map((p) => C.personChip(p))}<span class="td-card__platform">· ${ev.platform}</span>${sensitive ? html`<span class="td-localtag">${icon('lock', { size: 11 })}Local only</span>` : ''}</div>
          ${ev.lastTime ? html`<div class="td-card__last"><span>Last time:</span> ${C.provenanceChip({ kind: 'past-call', label: ev.lastTime, callId: ev.lastCallId, span: '00:00:00' }, { variant: 'inline' })}</div>` : ''}
        </div></div>
      <div class="td-card__rows">
        ${L.loadingItems ? html`<div class="td-skel"></div><div class="td-skel"></div>` : (!rows.length ? C.emptyState({ variant: 'section', title: 'Nothing open' }) : visible.map((r) => (r.kind === 'q' ? NP.A.questionRow(r.i) : NP.A.itemRow(r.i))))}
        ${!showAll && rows.length > max ? P.link(`Show ${rows.length - max} More`, { action: ['today.showAll', { id: ev.id }] }) : ''}
      </div>`);
  };

  /* ---------------- 49. Wizard stepper ----------------
     wizardStepper({steps:[{label, state, progress}], current, action}) */
  C.wizardStepper = (o) => {
    o = o || {};
    const steps = o.steps || [];
    return comp('wizard-stepper', { variant: o.variant || 'first-pass', state: 'step-' + ((o.current || 0) + 1), tag: 'ol', cls: 'fr-steps', attrs: { 'aria-label': 'Setup steps' } },
      steps.map((s, i) => {
        const st = i === o.current ? 'current' : s.state || 'upcoming';
        const clickable = st === 'done' || st === 'skipped' || st === 'error';
        const glyph = st === 'done' ? icon('check', { size: 12 }) : st === 'skipped' ? raw('<span aria-hidden="true">–</span>') : st === 'error' ? icon('warning', { size: 12 }) : String(i + 1);
        const inner = html`<span class="fr-step__mark">${glyph}</span><span class="fr-step__label">${s.label}</span>${s.running ? html`<span class="fr-ring" title="Downloading in the background · ${s.progress} %" style="--p:${s.progress}"></span>` : ''}${st === 'skipped' ? html`<span class="np-sr">Skipped</span>` : ''}`;
        return html`<li class="fr-step is-${st}" data-state="${st}"${st === 'current' ? raw(' aria-current="step"') : ''}>${clickable ? html`<button type="button" class="fr-step__btn" ${act(o.action || 'fr.step', { index: i })}>${inner}</button>` : html`<span class="fr-step__btn">${inner}</span>`}</li>`;
      }));
  };

  /* ---------------- 50. Permission check row ----------------
     permissionCheckRow(row, {variant: setup|status|test-only})
     row = {id, label, status: granted|missing|denied|checking|not-asked, detail, why, howto} */
  C.permissionCheckRow = (row, o) => {
    o = o || {};
    const variant = o.variant || 'setup';
    const st = row.status || 'not-asked';
    const word = { granted: 'Granted', missing: 'not allowed yet', 'not-asked': 'Not allowed yet', denied: 'not allowed', checking: 'Checking…' }[st];
    const ic = st === 'granted' ? icon('checkCircle', { size: 15 }) : st === 'checking' ? P.progress({ variant: 'spinner', label: 'Checking' }) : st === 'not-asked' ? icon('info', { size: 15 }) : icon('warning', { size: 15 });
    let action = '';
    if (variant !== 'status' || st !== 'granted') {
      if (st === 'not-asked' && row.id === 'mic') action = P.button('Allow…', { action: ['fr.permAllow', { id: row.id }] });
      else if (variant === 'test-only' && st === 'not-asked') action = P.button('Continue', { variant: 'primary', action: ['fr.permAllow', { id: row.id }] });
      else if (st !== 'granted' && st !== 'checking') action = P.button('Open System Settings…', { action: ['fr.permSettings', { id: row.id }] });
    }
    const mic = row.id === 'mic' && st === 'granted';
    return comp('permission-check-row', { variant, state: st, cls: 'fr-perm is-' + st },
      html`<span class="fr-perm__icon">${ic}</span>
      <div class="fr-perm__main">
        <div class="fr-perm__head"><span class="fr-perm__name">${row.label}</span>${row.detail && st === 'granted' ? html`<span class="np-dim"> · ${row.detail}</span>` : ''}<span class="fr-perm__word"> · ${word}</span></div>
        ${variant !== 'status' && row.why ? html`<div class="fr-perm__why">${row.why}</div>` : ''}
        ${variant !== 'status' && row.howto && st !== 'granted' ? html`<div class="fr-perm__how">${row.howto}</div>` : ''}
        ${mic && variant !== 'status' ? html`<span class="fr-perm__meter">${P.levelMeter({ level: 6, label: 'Microphone level' })}<span class="fr-perm__hear">Hearing you</span></span>` : ''}
      </div>
      ${action ? html`<span class="fr-perm__act">${action}</span>` : ''}`);
  };

  /* ---------------- 51. Self-test panel ----------------
     selfTestPanel({variant: wizard|sheet|settings, state, key})
     state: idle | waiting | clip | running | passed | failed | exclusion-off | exclusion-failed | permission-missing */
  C.selfTestPanel = (o) => {
    o = o || {};
    const key = o.key || 'default';
    const L = NP.local('selftest-' + key);
    const st = L.state || o.state || 'idle';
    const variant = o.variant === 'wizard' ? 'step' : (o.variant || 'step');
    const live = st === 'running' || st === 'clip';
    const passed = st === 'passed' || st === 'exclusion-off' || st === 'exclusion-failed';
    const you = st === 'permission-missing' ? 0 : live ? 7 : passed ? 5 : st === 'failed' ? 6 : 2;
    const others = st === 'permission-missing' ? 0 : st === 'clip' ? 8 : st === 'running' ? 4 : passed ? 3 : 0;
    const res = (ok, text, kind) => html`<li class="fr-st__res is-${kind || (ok ? 'ok' : 'pending')}">${icon(kind === 'info' ? 'info' : kind === 'warn' ? 'warning' : ok ? 'checkCircle' : 'ring', { size: 13 })}<span>${text}</span></li>`;
    let progressLine = '';
    if (st === 'waiting') progressLine = html`<div class="fr-st__prog">${P.progress({ value: 62, label: 'Speech model' })}<span>Waiting for the speech model · 62 %</span></div>`;
    if (st === 'clip') progressLine = html`<div class="fr-st__prog" title="Noter lets its own test clip into the capture for this test only.">${P.progress({ variant: 'spinner' })}<span>Listening for the clip…</span></div>`;
    if (st === 'running') progressLine = html`<div class="fr-st__prog">${P.progress({ variant: 'spinner' })}<span>Checking that Noter's own sounds stay out…</span></div>`;
    return comp('self-test-panel', { variant, state: st, cls: 'fr-st' },
      html`<div class="fr-st__head"><span class="fr-st__title">Self-test</span>${passed ? html`<span class="fr-st__passed" role="status">${icon('checkCircle', { size: 14 })}Self-test passed</span>` : ''}</div>
      <div class="fr-st__meters">
        <span class="fr-st__meter"><span class="fr-st__ml">You</span>${P.levelMeter({ level: you, label: 'Microphone level' })}</span>
        <span class="fr-st__meter"><span class="fr-st__ml">Others</span>${P.levelMeter({ level: others, label: 'System audio level' })}</span>
      </div>
      <div class="fr-st__live" aria-live="off">${st === 'clip' || passed ? html`<span lang="en">Noter test.</span> <span lang="ru">Привет.</span> <span lang="de">Hallo.</span> ${C.languageTag('EN')} ${C.languageTag('RU')} ${C.languageTag('DE')}` : html`<span class="np-dim">The live transcript line appears here while the test runs.</span>`}</div>
      ${progressLine}
      ${st === 'failed' ? html`<div class="fr-st__fail">${icon('warning', { size: 14 })}<span>We hear your microphone but not system audio. Play any sound in another app and try again.</span></div>` : ''}
      ${st === 'permission-missing' ? html`<div class="fr-st__fail">${icon('warning', { size: 14 })}<span>System audio recording is not allowed yet.</span>${P.button('Open System Settings…', { size: 'small', action: ['fr.permSettings', { id: 'sys' }] })}</div>` : ''}
      ${passed ? html`<ul class="fr-st__results">
        ${res(true, 'System audio arrives')}${res(true, 'Your microphone arrives')}${res(true, 'Both streams line up')}
        ${st === 'exclusion-off' ? res(false, "Noter's own sounds are recorded. Replay while recording stays off. Change this in Settings › Audio & Transcription.", 'info') : st === 'exclusion-failed' ? res(false, "Noter's own sounds reached the recording. Replay while recording stays off until this passes.", 'warn') : res(true, "Noter's own sounds stay out of the recording")}
      </ul>${P.disclosure('Details', !!L.details, { variant: 'row', action: ['fr.stDetails', { key }] })}${L.details ? html`<div class="fr-st__details np-tnum">Lag between streams 38 ms · alignment ±12 ms · clip heard after 420 ms</div>` : ''}` : ''}
      <div class="fr-st__actions">
        <div class="fr-st__clip">${P.button('Play Test Clip', { icon: 'play', action: ['fr.stClip', { key }], disabled: st === 'permission-missing' || st === 'waiting' })}<span class="fr-st__hint">Or play any sound in another app<br>Say a few words while the clip plays.</span></div>
        ${P.button('Run Test', { variant: variant === 'step' ? 'secondary' : 'primary', action: ['fr.stRun', { key }], loading: st === 'running', disabled: st === 'waiting' || st === 'permission-missing' })}
      </div>`);
  };

  /* ---------------- 52. Display picker ----------------
     displayPicker({value, variant: several|one|absent, key}) */
  C.displayPicker = (o) => {
    o = o || {};
    const key = o.key || 'default';
    const L = NP.local('dp-' + key);
    const variant = o.variant || 'several';
    const value = L.value || o.value || 'auto';
    const displays = [
      { id: 'builtin', name: 'Built-in Retina Display', res: '1512 × 982', x: 0, y: 46, w: 150, h: 98, callApp: true },
      { id: 'lg', name: 'LG UltraFine', res: '2560 × 1440', x: 160, y: 0, w: 220, h: 124 },
    ];
    const chosen = value === 'auto' ? 'lg' : value;
    if (variant === 'one') {
      return comp('display-picker', { variant: 'one-display', state: 'selected', cls: 'fr-dp' },
        html`<div class="fr-dp__one"><div class="fr-dp__screen is-sel"><span class="fr-dp__callapp">Call app</span><span class="fr-dp__float" aria-hidden="true"></span><span class="fr-dp__name">Built-in Retina Display</span><span class="fr-dp__res np-tnum">1512 × 982</span></div>
        <p class="fr-dp__note">With one display, the call opens as a floating panel beside the call app. Connect a second display and the call screen fills it.</p></div>
        ${P.radioGroup('dp-' + key, [{ value: 'auto', label: 'The display without the call app' }], 'auto', { label: 'Call screen display' })}`);
    }
    const opts = [{ value: 'auto', label: 'The display without the call app', note: 'Recommended' }, ...displays.map((d) => ({ value: d.id, label: d.name + (d.callApp ? ' · Call app is here' : '') }))];
    if (variant === 'absent') opts.push({ value: 'lg-old', label: 'LG UltraFine 5K (not connected)' });
    return comp('display-picker', { variant: variant === 'absent' ? 'remembered-absent' : 'several-displays', state: 'selected', cls: 'fr-dp' },
      html`<div class="fr-dp__draw" role="presentation">${displays.map((d) => html`<button type="button" class="fr-dp__screen${chosen === d.id ? ' is-sel' : ''}" style="left:${d.x}px;top:${d.y}px;width:${d.w}px;height:${d.h}px" ${act('fr.display', { key, value: d.id })} aria-label="${d.name}">
        ${chosen === d.id ? html`<span class="fr-dp__check">${icon('check', { size: 11 })}</span>` : ''}<span class="fr-dp__name">${d.name}</span><span class="fr-dp__res np-tnum">${d.res}</span>${d.callApp ? html`<span class="fr-dp__callapp">Call app is here</span>` : ''}</button>`)}</div>
      ${P.radioGroup('dp-' + key, opts.map((x) => Object.assign({}, x, { label: x.label })), value, { label: 'Call screen display', action: ['fr.display', { key }] })}`);
  };

  /* ---------------- 53. Hotkey recorder ----------------
