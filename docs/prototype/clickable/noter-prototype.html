<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noter Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* =====================================================================
   Noter prototype — foundations (DESIGN 3.2 › Primitives › Anatomy)
   Layout: a prototype harness bar on top; below it a "desk" that hosts
   one macOS surface at a time (main window, call window, panels).
   Tokens: Apple macOS 27 system colours and Liquid Glass materials, light and dark.
   ===================================================================== */
/* macOS 27 UI Kit layer: Apple system colours (labelColor 85 %, secondaryLabelColor 50 %, …,
   systemBlue/Red/Orange/Green), Liquid Glass materials, concentric radii. Values follow Apple's
   published macOS system colours by default (owner decision PM-57). DESIGN's AA-checked values apply
   under macOS Increase Contrast — see 02-contrast.css. */
:root {
  --win-bg: #F5F5F5; --side-bg: rgba(242,242,244,.62); --content-bg: #FFFFFF; --card-bg: #FFFFFF; --ctrl-bg: #FFFFFF;
  --label: rgba(0,0,0,.85); --label-2: rgba(0,0,0,.50); --label-3: rgba(0,0,0,.30); --label-dis: rgba(0,0,0,.25);
  --sep: rgba(0,0,0,.10); --ctrl-border: rgba(0,0,0,.20); --ctrl-border-soft: rgba(0,0,0,.10);
  --accent: #007AFF; --accent-fill: #007AFF; --accent-text: #0068DA; --on-accent: #FFFFFF;
  --sel-unemph: rgba(0,0,0,.06); --sel-accent: rgba(0,122,255,.16);
  --rec: #FF3B30; --error: #FF3B30; --warning: #FF9500; --success: #28CD41;
  --error-tint: rgba(255,59,48,.12); --warning-tint: rgba(255,149,0,.13); --success-tint: rgba(40,205,65,.13); --info-tint: rgba(0,122,255,.09);
  --match: rgba(255,204,0,.45); --evidence: rgba(0,122,255,.14);
  --diff-ins: rgba(40,205,65,.18); --diff-del: rgba(255,59,48,.16);
  --shadow-win: 0 0 0 .5px rgba(0,0,0,.14), 0 24px 70px rgba(0,0,0,.24), 0 6px 18px rgba(0,0,0,.10);
  --shadow-pop: 0 0 0 .5px rgba(0,0,0,.10), 0 12px 36px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.06);
  --glass-bg: rgba(255,255,255,.58); --glass-bg-strong: rgba(250,250,252,.82); --glass-tint: rgba(255,255,255,.22);
  --glass-edge: inset 0 .5px 0 rgba(255,255,255,.95), inset 0 0 0 .5px rgba(255,255,255,.45), 0 0 0 .5px rgba(0,0,0,.07), 0 3px 10px rgba(0,0,0,.07);
  --glass-blur: blur(22px) saturate(185%);
  --thumb-bg: #FFFFFF; --thumb-shadow: 0 .5px 0 rgba(0,0,0,.04), 0 2px 6px rgba(0,0,0,.16), 0 0 0 .5px rgba(0,0,0,.06);
  --focus-ring: 0 0 0 3.5px rgba(0,122,255,.5);
  --wall-1: #8EC5FF; --wall-2: #F7B5A0; --wall-3: #B8E2D4; --wall-base: #D7DEEA;
  --desk-bg: #D7DEEA; --desk-dot: transparent;
  --r-window: 26px; --r-panel: 20px; --r-sheet: 22px; --r-card: 14px; --r-row: 9px; --r-control: 8px; --r-tag: 6px; --r-capsule: 999px;
  --chrome-bg: #23262B; --chrome-fg: #E8EAED; --chrome-dim: #9AA0A8; --chrome-line: #3A3F46; --chrome-on: #4C8DFF;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --win-bg: #262626; --side-bg: rgba(38,38,40,.58); --content-bg: #1E1E1E; --card-bg: #2A2A2A; --ctrl-bg: rgba(255,255,255,.12);
    --label: rgba(255,255,255,.85); --label-2: rgba(255,255,255,.55); --label-3: rgba(255,255,255,.25); --label-dis: rgba(255,255,255,.25);
    --sep: rgba(255,255,255,.10); --ctrl-border: rgba(255,255,255,.22); --ctrl-border-soft: rgba(255,255,255,.10);
    --accent: #0A84FF; --accent-fill: #0A84FF; --accent-text: #419CFF; --on-accent: #FFFFFF;
    --sel-unemph: rgba(255,255,255,.08); --sel-accent: rgba(10,132,255,.30);
    --rec: #FF453A; --error: #FF453A; --warning: #FF9F0A; --success: #32D74B;
    --error-tint: rgba(255,69,58,.18); --warning-tint: rgba(255,159,10,.18); --success-tint: rgba(50,215,75,.16); --info-tint: rgba(10,132,255,.16);
    --match: rgba(255,214,10,.38); --evidence: rgba(10,132,255,.24);
    --diff-ins: rgba(50,215,75,.22); --diff-del: rgba(255,69,58,.22);
    --shadow-win: 0 0 0 .5px rgba(255,255,255,.12), 0 0 0 1px rgba(0,0,0,.6), 0 24px 70px rgba(0,0,0,.6), 0 6px 18px rgba(0,0,0,.35);
    --shadow-pop: 0 0 0 .5px rgba(255,255,255,.14), 0 12px 36px rgba(0,0,0,.55);
    --glass-bg: rgba(40,40,42,.55); --glass-bg-strong: rgba(36,36,38,.85); --glass-tint: rgba(255,255,255,.06);
    --glass-edge: inset 0 .5px 0 rgba(255,255,255,.22), inset 0 0 0 .5px rgba(255,255,255,.12), 0 0 0 .5px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.3);
    --thumb-bg: #6B6B70; --thumb-shadow: 0 .5px 0 rgba(255,255,255,.2) inset, 0 2px 6px rgba(0,0,0,.4);
    --focus-ring: 0 0 0 3.5px rgba(10,132,255,.6);
    --wall-1: #1F3A6B; --wall-2: #5B2A4A; --wall-3: #14524A; --wall-base: #12151C;
    --desk-bg: #12151C; --desk-dot: transparent;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --win-bg: #262626; --side-bg: rgba(38,38,40,.58); --content-bg: #1E1E1E; --card-bg: #2A2A2A; --ctrl-bg: rgba(255,255,255,.12);
  --label: rgba(255,255,255,.85); --label-2: rgba(255,255,255,.55); --label-3: rgba(255,255,255,.25); --label-dis: rgba(255,255,255,.25);
  --sep: rgba(255,255,255,.10); --ctrl-border: rgba(255,255,255,.22); --ctrl-border-soft: rgba(255,255,255,.10);
  --accent: #0A84FF; --accent-fill: #0A84FF; --accent-text: #419CFF; --on-accent: #FFFFFF;
  --sel-unemph: rgba(255,255,255,.08); --sel-accent: rgba(10,132,255,.30);
  --rec: #FF453A; --error: #FF453A; --warning: #FF9F0A; --success: #32D74B;
  --error-tint: rgba(255,69,58,.18); --warning-tint: rgba(255,159,10,.18); --success-tint: rgba(50,215,75,.16); --info-tint: rgba(10,132,255,.16);
  --match: rgba(255,214,10,.38); --evidence: rgba(10,132,255,.24);
  --diff-ins: rgba(50,215,75,.22); --diff-del: rgba(255,69,58,.22);
  --shadow-win: 0 0 0 .5px rgba(255,255,255,.12), 0 0 0 1px rgba(0,0,0,.6), 0 24px 70px rgba(0,0,0,.6), 0 6px 18px rgba(0,0,0,.35);
  --shadow-pop: 0 0 0 .5px rgba(255,255,255,.14), 0 12px 36px rgba(0,0,0,.55);
  --glass-bg: rgba(40,40,42,.55); --glass-bg-strong: rgba(36,36,38,.85); --glass-tint: rgba(255,255,255,.06);
  --glass-edge: inset 0 .5px 0 rgba(255,255,255,.22), inset 0 0 0 .5px rgba(255,255,255,.12), 0 0 0 .5px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.3);
  --thumb-bg: #6B6B70; --thumb-shadow: 0 .5px 0 rgba(255,255,255,.2) inset, 0 2px 6px rgba(0,0,0,.4);
  --focus-ring: 0 0 0 3.5px rgba(10,132,255,.6);
  --wall-1: #1F3A6B; --wall-2: #5B2A4A; --wall-3: #14524A; --wall-base: #12151C;
  --desk-bg: #12151C; --desk-dot: transparent;
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--desk-bg); color: var(--label); font: 13px/1.38 var(--font); -webkit-font-smoothing: antialiased; }
#np-root { height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
.np-tnum { font-variant-numeric: tabular-nums; }
.np-mono { font-family: var(--mono); font-size: 12px; line-height: 18px; }
.np-ic { flex: none; display: inline-block; vertical-align: -2px; }
.np-pad { padding: 16px; }
.np-err { color: var(--error); white-space: pre-wrap; font: 12px var(--mono); padding: 16px; }
.np-muted { color: var(--label-2); }
.np-dim { color: var(--label-3); }
.np-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* Type styles (DESIGN typography table) */
.t-large { font: 700 26px/32px var(--font-display); }
.t-title1 { font: 600 22px/28px var(--font-display); }
.t-title2 { font: 600 17px/22px var(--font-display); }
.t-title3 { font: 600 15px/20px var(--font); }
.t-headline { font: 600 13px/18px var(--font); }
.t-body { font: 400 13px/18px var(--font); }
.t-callout { font: 400 12px/16px var(--font); }
.t-sub { font: 600 11px/14px var(--font); }
.t-foot { font: 400 10px/13px var(--font); }

/* ---------------- Harness (prototype chrome, not product UI) ---------------- */
.np-harness { height: 100%; display: flex; flex-direction: column; }
.np-hbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--chrome-bg); color: var(--chrome-fg); padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 12px; border-bottom: 1px solid var(--chrome-line); position: relative; z-index: 30; }
.np-hbar__brand { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
.np-hbar__brand em { font-style: normal; font-weight: 400; color: var(--chrome-dim); }
.np-hbar__tabs { display: flex; flex-wrap: wrap; gap: 2px; background: #181A1E; border-radius: 7px; padding: 2px; }
.np-hbar__tab { border: 0; background: transparent; color: var(--chrome-dim); padding: 4px 9px; border-radius: 5px; cursor: pointer; }
.np-hbar__tab:hover { color: var(--chrome-fg); }
.np-hbar__tab.is-on { background: #3A3F46; color: #fff; }
.np-hbar__tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; }
.np-hbar__btn { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid var(--chrome-line); background: #2D3137; color: var(--chrome-fg); padding: 4px 9px; border-radius: 6px; cursor: pointer; }
.np-hbar__btn:hover { background: #363B42; }
.np-hbar__btn.is-on { background: var(--chrome-on); border-color: var(--chrome-on); color: #fff; }
.np-hbar__seg { display: inline-flex; border: 1px solid var(--chrome-line); border-radius: 6px; overflow: hidden; }
.np-hbar__seg button { border: 0; background: #2D3137; color: var(--chrome-dim); padding: 4px 8px; cursor: pointer; }
.np-hbar__seg button.is-on { background: #4A5059; color: #fff; }
.np-stage { flex: 1 1 auto; min-height: 0; display: flex; }
.np-desk { flex: 1 1 auto; min-width: 0; overflow: auto; position: relative; padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: radial-gradient(var(--desk-dot) 1px, transparent 1.2px) 0 0/18px 18px, var(--desk-bg); }
.np-cap { color: var(--label-2); font-size: 12px; margin: 0 0 8px 2px; font-weight: 600; }
.np-cap span { font-weight: 400; color: var(--label-3); }
.np-toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--chrome-bg); color: var(--chrome-fg); padding: 8px 14px; border-radius: 8px; font-size: 12px; z-index: 60; box-shadow: var(--shadow-pop); }
.np-hpanel { flex: none; width: 340px; max-width: 46vw; background: var(--chrome-bg); color: var(--chrome-fg); border-left: 1px solid var(--chrome-line); overflow: auto; font-size: 12px; }
.np-hpanel__inner { padding: 14px; }
.np-hpanel h3 { font-size: 12px; margin: 4px 0 6px; color: #fff; }
.np-hpanel code { font: 11px var(--mono); color: #CFE2FF; word-break: break-all; }
.np-hp__hint { color: var(--chrome-dim); margin: 0 0 8px; }
.np-hp__list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.np-hp__row { width: 100%; text-align: left; background: transparent; border: 0; color: inherit; padding: 6px 8px; border-radius: 6px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
.np-hp__row:hover { background: #2D3137; }
.np-hp__count { color: var(--chrome-dim); font-variant-numeric: tabular-nums; }
.np-hp__meta { grid-column: 1 / -1; color: var(--chrome-dim); font-size: 11px; }
.np-hp__pinned { border: 1px solid var(--chrome-line); border-radius: 8px; padding: 10px; margin-bottom: 14px; display: grid; gap: 8px; }
.np-hp__pin { color: var(--chrome-dim); font: 11px var(--mono); }
.np-hp__pin.is-main code { color: #fff; }
.np-inspect-tip { position: fixed; z-index: 80; max-width: 460px; background: #111317; color: #E8EAED; border: 1px solid #3A3F46; border-radius: 8px; padding: 6px 8px; font: 11px/1.4 var(--mono); pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.np-tip__row { opacity: .7; }
.np-tip__row.is-main { opacity: 1; }
.np-tip__row code { color: #9CC4FF; }
.np-tip__row span { color: #FFD580; }
.np-tip__row i { font-style: normal; color: #B9F3C4; }
.np-tip__row.is-region b { color: #F5A3FF; font-weight: 400; }
.is-inspecting .np-desk [data-component] { outline: 1px dashed rgba(76,141,255,.35); outline-offset: -1px; }
.is-inspecting .np-desk .np-inspect-hl { outline: 2px solid #4C8DFF !important; outline-offset: 0; background-image: linear-gradient(rgba(76,141,255,.08), rgba(76,141,255,.08)); }
.np-flash-hl { outline: 3px solid #FF4FD8 !important; outline-offset: 1px; }

/* ---------------- Window chrome ---------------- */
.np-win { position: relative; background: var(--content-bg); border-radius: 12px; box-shadow: var(--shadow-win); overflow: hidden; display: flex; flex-direction: column; margin: 0 auto; }
.np-win__titlebar { height: 38px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--win-bg); border-bottom: 1px solid var(--sep); }
.np-win__title { flex: 1 1 auto; text-align: center; font-weight: 600; font-size: 13px; color: var(--label); margin-right: 52px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-lights { display: inline-flex; gap: 8px; flex: none; }
.np-light { width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15); }
.np-light--min { background: #FEBC2E; }
.np-light--zoom { background: #28C840; }
.np-light--zoom[data-off] { background: var(--sep); }

/* ---------------- Shell — Main window ---------------- */
.np-win--main { flex-direction: row; width: 100%; min-width: 900px; max-width: 1600px; height: calc(100vh - 120px); min-height: 600px; }
.np-sidebar { width: 220px; flex: none; background: var(--side-bg); border-right: 1px solid var(--sep); display: flex; flex-direction: column; min-height: 0; }
.np-sidebar__top { height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 14px; }
.np-srclist { flex: 1 1 auto; overflow: auto; padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 1px; }
.np-srclist__live { margin: 0 0 8px; }
.np-srclist__group { font: 600 11px/14px var(--font); color: var(--label-3); padding: 12px 8px 4px; }
.np-srclist__item { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 6px; color: var(--label); text-decoration: none; }
.np-srclist__item .np-ic { color: var(--accent-text); }
.np-srclist__item:hover { background: var(--sel-unemph); }
.np-srclist__item.is-sel { background: var(--sel-accent); font-weight: 600; }
.np-srclist__item.is-missing { opacity: .55; }
.np-srclist__label { flex: 1 1 auto; white-space: nowrap; }
.np-srclist__badge { font: 600 11px/16px var(--font); color: var(--label-2); background: var(--sel-unemph); border-radius: 8px; padding: 0 6px; font-variant-numeric: tabular-nums; }
.np-srclist__warn, .np-srclist__item .np-srclist__warn .np-ic { color: var(--warning); display: inline-flex; }
.np-sidebar__footer { flex: none; border-top: 1px solid var(--sep); padding: 8px 10px; }
.np-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.np-toolbar { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--win-bg); border-bottom: 1px solid var(--sep); min-width: 0; }
.np-toolbar__nav { display: inline-flex; gap: 2px; }
.np-toolbar__titles { display: flex; flex-direction: column; min-width: 0; flex: 0 1 auto; }
.np-toolbar__title { font: 600 15px/20px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-toolbar__sub { font: 400 11px/14px var(--font); color: var(--label-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-toolbar__center { flex: none; margin-left: 12px; }
.np-toolbar__actions { display: flex; align-items: center; gap: 8px; flex: none; }
.np-toolbar__search { width: 260px; flex: 0 1 260px; }
.np-tb__spacer { flex: 1 1 auto; }
.np-bannerslot { flex: none; border-bottom: 1px solid var(--sep); display: grid; }
.np-bannerslot > .np-banner { border-radius: 0; border: 0; }
.np-body { flex: 1 1 auto; min-height: 0; display: flex; position: relative; }
.np-content { flex: 1 1 auto; min-width: 0; overflow: auto; padding: 20px 24px 40px; }
.np-inspector { flex: none; border-left: 1px solid var(--sep); background: var(--content-bg); overflow: auto; }
@media (max-width: 1180px) { .np-inspector { position: absolute; right: 0; top: 0; bottom: 0; box-shadow: var(--shadow-pop); z-index: 5; } }
.np-screen { max-width: 1180px; }

/* ---------------- Primitives ---------------- */
.np-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 64px; border-radius: 6px; border: 1px solid var(--ctrl-border-soft); background: var(--ctrl-bg); color: var(--label); padding: 0 12px; cursor: pointer; white-space: nowrap; box-shadow: 0 .5px 1px rgba(0,0,0,.12); transition: background-color 120ms, filter 120ms; flex: none; }
.np-btn:hover { filter: brightness(.97); }
.np-btn:active { filter: brightness(.92); }
.np-btn--small { height: 22px; font-size: 12px; padding: 0 9px; min-width: 0; }
.np-btn--regular { height: 28px; }
.np-btn--large { height: 32px; padding: 0 16px; }
.np-btn--primary { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
.np-btn--primary:focus-visible { outline-offset: 2px; }
.np-btn--quiet { background: transparent; border-color: transparent; box-shadow: none; color: var(--accent-text); min-width: 0; }
.np-btn--quiet:hover { background: var(--sel-unemph); filter: none; }
.np-btn--destructive { color: var(--error); }
.np-btn--destructive.np-btn--primary { background: var(--error); border-color: var(--error); color: #fff; }
.np-btn[disabled] { opacity: .45; cursor: default; filter: none; }
.np-btn .np-kbd { margin-left: 2px; }
.np-btn--primary .np-kbd { color: inherit; border-color: rgba(255,255,255,.5); }
.np-btn__flash { display: inline-flex; align-items: center; gap: 4px; color: var(--success); }
.np-btn--primary .np-btn__flash { color: inherit; }
.np-btn__chev { opacity: .7; }
.np-ibtn { display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; color: var(--label-2); border-radius: 6px; cursor: pointer; position: relative; flex: none; }
.np-ibtn--toolbar { width: 28px; height: 28px; }
.np-ibtn--inline { width: 22px; height: 22px; }
.np-ibtn:hover { background: var(--sel-unemph); color: var(--label); }
.np-ibtn.is-on, .np-ibtn[aria-pressed="true"] { color: var(--accent-text); background: var(--sel-accent); }
.np-ibtn[disabled] { opacity: .35; cursor: default; background: transparent; }
.np-ibtn__badge { position: absolute; top: 0; right: 0; font: 600 9px/12px var(--font); background: var(--error); color: #fff; border-radius: 6px; padding: 0 3px; }
.np-kbd { display: inline-flex; align-items: center; font: 400 10px/13px var(--font); color: var(--label-3); border: 1px solid var(--sep); border-radius: 4px; padding: 1px 4px; letter-spacing: .04em; white-space: nowrap; }
.np-seg { display: inline-flex; background: var(--sel-unemph); border-radius: 7px; padding: 2px; gap: 2px; flex: none; }
.np-seg__item { border: 0; background: transparent; height: 24px; padding: 0 10px; border-radius: 5px; cursor: pointer; color: var(--label); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
.np-seg__item.is-sel { background: var(--ctrl-bg); box-shadow: 0 .5px 2px rgba(0,0,0,.18); font-weight: 600; }
.np-seg__count { color: var(--label-3); font-weight: 400; }
.np-popup { position: relative; display: inline-flex; align-items: center; }
.np-popup select { appearance: none; -webkit-appearance: none; height: 26px; border: 1px solid var(--ctrl-border-soft); border-radius: 6px; background: var(--ctrl-bg); padding: 0 26px 0 9px; color: var(--label); cursor: pointer; max-width: 100%; box-shadow: 0 .5px 1px rgba(0,0,0,.1); }
.np-popup--inline select { border-color: transparent; background: transparent; box-shadow: none; }
.np-popup__chev { position: absolute; right: 7px; pointer-events: none; color: var(--label-2); }
.np-menu { min-width: 200px; max-width: 360px; background: var(--card-bg); border-radius: 8px; box-shadow: var(--shadow-pop); padding: 5px; display: grid; }
.np-menu__item { display: flex; align-items: center; gap: 6px; border: 0; background: transparent; text-align: left; padding: 4px 8px; border-radius: 5px; cursor: pointer; white-space: nowrap; color: var(--label); }
.np-menu__item:hover:not([disabled]) { background: var(--accent-fill); color: #fff; }
.np-menu__item:hover:not([disabled]) .np-menu__kbd { color: rgba(255,255,255,.8); }
.np-menu__item[disabled] { color: var(--label-dis); cursor: default; }
.np-menu__item.is-danger { color: var(--error); }
.np-menu__check { width: 14px; display: inline-flex; }
.np-menu__label { flex: 1 1 auto; }
.np-menu__kbd { color: var(--label-3); font-size: 12px; margin-left: 18px; }
.np-menu__sep { height: 1px; background: var(--sep); margin: 4px 6px; }
.np-menu__hdr { font: 600 11px/14px var(--font); color: var(--label-3); padding: 4px 8px 2px; }
.np-check { display: inline-flex; align-items: flex-start; gap: 6px; cursor: pointer; position: relative; min-height: 18px; }
.np-check input, .np-toggle input, .np-radio input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.np-check__box { flex: none; width: 15px; height: 15px; margin-top: 1px; border: 1px solid var(--ctrl-border); border-radius: 4px; background: var(--ctrl-bg); display: inline-flex; align-items: center; justify-content: center; color: #fff; }
.np-check input:checked + .np-check__box, .np-check[data-state="mixed"] .np-check__box { background: var(--accent-fill); border-color: var(--accent-fill); }
.np-check input:focus-visible + .np-check__box { outline: 2px solid var(--accent); outline-offset: 1px; }
.np-check.is-disabled { opacity: .45; cursor: default; }
.np-toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; position: relative; }
.np-toggle__track { width: 32px; height: 18px; border-radius: 9px; background: var(--sel-unemph); border: 1px solid var(--ctrl-border); position: relative; flex: none; transition: background 120ms; }
.np-toggle--small .np-toggle__track { width: 26px; height: 15px; }
.np-toggle__thumb { position: absolute; top: 1px; left: 1px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left 120ms; }
.np-toggle--small .np-toggle__thumb { width: 11px; height: 11px; }
.np-toggle input:checked + .np-toggle__track { background: var(--accent-fill); border-color: var(--accent-fill); }
.np-toggle input:checked + .np-toggle__track .np-toggle__thumb { left: 15px; }
.np-toggle--small input:checked + .np-toggle__track .np-toggle__thumb { left: 12px; }
.np-toggle input:focus-visible + .np-toggle__track { outline: 2px solid var(--accent); outline-offset: 2px; }
.np-radios { display: grid; gap: 8px; }
.np-radio { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; position: relative; }
.np-radio__dot { flex: none; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--ctrl-border); background: var(--ctrl-bg); margin-top: 1px; }
.np-radio input:checked + .np-radio__dot { border: 4.5px solid var(--accent-fill); }
.np-radio input:focus-visible + .np-radio__dot { outline: 2px solid var(--accent); outline-offset: 1px; }
.np-radio__label { display: block; }
.np-radio__note { display: block; color: var(--label-3); font-size: 12px; }
.np-field { display: inline-flex; flex-direction: column; gap: 4px; min-width: 0; }
.np-field__label { font-size: 12px; color: var(--label-2); }
.np-field__input { height: 28px; border: 1px solid var(--ctrl-border-soft); border-radius: 6px; background: var(--ctrl-bg); padding: 0 8px; color: var(--label); width: 100%; min-width: 0; }
textarea.np-field__input { height: auto; padding: 6px 8px; resize: vertical; line-height: 18px; }
.np-field__input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.np-field.is-invalid .np-field__input { border-color: var(--error); }
.np-field__msg { color: var(--error); font-size: 12px; display: inline-flex; gap: 4px; align-items: center; }
.np-search { display: inline-flex; align-items: center; gap: 4px; height: 28px; border-radius: 7px; background: var(--sel-unemph); padding: 0 8px; min-width: 0; flex-wrap: nowrap; overflow: hidden; }
.np-search input { border: 0; outline: 0; background: transparent; flex: 1 1 60px; min-width: 40px; height: 26px; color: var(--label); }
.np-search:focus-within { outline: 2px solid var(--accent); outline-offset: 0; }
.np-search__icon { color: var(--label-3); }
.np-search--token-field { background: var(--ctrl-bg); border: 1px solid var(--ctrl-border-soft); flex-wrap: wrap; height: auto; min-height: 28px; padding: 2px 6px; }
.np-token { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 3px 0 7px; border-radius: 5px; background: var(--sel-accent); color: var(--accent-text); font-size: 12px; white-space: nowrap; flex: none; }
.np-token__x { border: 0; background: transparent; color: inherit; padding: 0 2px; cursor: pointer; display: inline-flex; }
.np-slider { display: inline-flex; align-items: center; gap: 8px; }
.np-slider input[type=range] { width: 160px; accent-color: var(--accent-fill); }
.np-slider .np-field__input { width: 64px; }
.np-slider__unit { color: var(--label-3); }
.np-progress { display: inline-block; height: 6px; border-radius: 3px; background: var(--sel-unemph); overflow: hidden; width: 120px; vertical-align: middle; flex: none; }
.np-progress__fill { display: block; height: 100%; background: var(--accent-fill); border-radius: 3px; }
.np-progress.is-ind .np-progress__fill { animation: np-ind 1.4s ease-in-out infinite; }
@keyframes np-ind { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
.np-spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--sep); border-top-color: var(--label-2); display: inline-block; animation: np-spin .8s linear infinite; flex: none; }
@keyframes np-spin { to { transform: rotate(360deg); } }
.np-meter { display: inline-flex; gap: 2px; }
.np-meter__seg { width: 8px; height: 10px; border-radius: 2px; background: var(--sel-unemph); }
.np-meter__seg.is-on { background: var(--success); }
.np-meter__seg.is-clip { background: var(--warning); }
.np-badge { display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 6px; border-radius: 5px; font: 600 11px/14px var(--font); white-space: nowrap; border: 1px solid transparent; flex: none; }
.np-badge--count { border-radius: 9px; background: var(--sel-unemph); color: var(--label-2); font-variant-numeric: tabular-nums; }
.np-badge--kind { border-color: var(--ctrl-border-soft); color: var(--label-2); }
.np-badge--neutral { background: var(--sel-unemph); color: var(--label-2); }
.np-badge--info, .np-badge--accent { background: var(--info-tint); color: var(--accent-text); }
.np-badge--warning { background: var(--warning-tint); color: var(--warning); }
.np-badge--error { background: var(--error-tint); color: var(--error); }
.np-badge--success { background: var(--success-tint); color: var(--success); }
.np-badge--kind.np-badge--neutral { background: transparent; }
.np-disc { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 2px 0; cursor: pointer; color: var(--label); font-weight: 600; }
.np-disc__tri { transition: transform 150ms; color: var(--label-2); }
.np-disc.is-open .np-disc__tri { transform: rotate(90deg); }
.np-disc--row { font-weight: 400; }
.np-link { color: var(--accent-text); text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }
.np-link:hover { text-decoration: underline; }
.np-link__ext { font-size: 11px; }
.np-table-wrap { overflow-x: auto; border: 1px solid var(--sep); border-radius: 8px; background: var(--card-bg); }
.np-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.np-table th { text-align: left; font-weight: 600; font-size: 12px; color: var(--label-2); padding: 6px 10px; border-bottom: 1px solid var(--sep); white-space: nowrap; position: sticky; top: 0; background: var(--card-bg); cursor: default; }
.np-table td { padding: 5px 10px; height: 28px; border-bottom: 1px solid var(--sep); vertical-align: middle; }
.np-table tbody tr:last-child td { border-bottom: 0; }
.np-table tbody tr { cursor: default; }
.np-table tbody tr:hover { background: var(--sel-unemph); }
.np-table tbody tr.is-sel { background: var(--sel-accent); }
.np-th__sort { margin-left: 4px; }
.np-split { width: 1px; background: var(--sep); align-self: stretch; flex: none; cursor: col-resize; }
.np-sidebar { border-right: 0; }

/* Popovers, menus, sheets, alerts */
.np-pop { position: absolute; z-index: 40; visibility: hidden; background: var(--card-bg); border-radius: 10px; box-shadow: var(--shadow-pop); min-width: 240px; max-width: 380px; }
.np-pop__body { padding: 12px 14px; display: grid; gap: 8px; }
.np-pop__title { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.np-pop__text { color: var(--label-2); }
.np-pop__actions { display: flex; flex-wrap: wrap; gap: 8px; }
.np-float-menu { position: absolute; z-index: 45; visibility: hidden; }
.np-sheet-layer, .np-alert-layer { position: absolute; inset: 0; z-index: 20; display: flex; justify-content: center; align-items: flex-start; background: rgba(0,0,0,.18); padding-top: 52px; overflow: auto; }
.np-alert-layer { align-items: center; padding-top: 0; z-index: 25; }
.np-sheet { width: 520px; max-width: calc(100% - 32px); background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow-win); margin-bottom: 24px; }
.np-sheet-layer.is-new .np-sheet { animation: np-sheet 200ms ease-out; }
@keyframes np-sheet { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
.np-sheet__head { padding: 18px 20px 6px; }
.np-sheet__title { font: 600 15px/20px var(--font); }
.np-sheet__sub { color: var(--label-2); margin-top: 4px; }
.np-sheet__body { padding: 10px 20px 14px; display: grid; gap: 12px; }
.np-sheet__foot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--sep); }
.np-sheet__foot .np-tb__spacer { flex: 1 1 auto; }
.np-alert { width: 280px; background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow-win); padding: 18px 16px 14px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.np-alert__icon { color: var(--accent-text); }
.np-alert__title { font-weight: 700; }
.np-alert__body { font-size: 12px; color: var(--label); }
.np-alert__btns { display: grid; gap: 6px; width: 100%; margin-top: 6px; }
.np-alert__btns .np-btn { width: 100%; }

/* ---------------- Shared components ---------------- */
.np-recdot { width: 9px; height: 9px; border-radius: 50%; background: var(--rec); display: inline-flex; align-items: center; justify-content: center; flex: none; color: #fff; }
.np-recdot.is-paused { background: transparent; border: 2px solid var(--rec); }
.np-recind { display: inline-flex; align-items: center; gap: 6px; }
.np-recind__word.is-rec { color: var(--rec); font-weight: 600; }
.np-recind--row { width: 100%; border: 0; background: var(--error-tint); border-radius: 6px; height: 30px; padding: 0 8px; cursor: pointer; color: var(--label); font-weight: 600; }
.np-recind--row:hover { filter: brightness(.97); }
.np-recind__title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.np-recind__sep { color: var(--label-3); }
.np-recind--button { font-variant-numeric: tabular-nums; }
.np-mode { display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; color: var(--label-2); padding: 2px 6px; border-radius: 5px; cursor: pointer; font-size: 12px; max-width: 100%; }
.np-mode:hover { background: var(--sel-unemph); }
.np-mode.is-warn { color: var(--warning); }
.np-mode__word { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-mode--sidebar { width: 100%; justify-content: flex-start; text-align: left; }
.np-mode--sidebar .np-mode__word { white-space: normal; }
.np-mode--line { cursor: default; padding: 0; }
.np-spk { font-weight: 600; color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-spk.is-secondary { color: var(--label-2); }
.np-spk--btn { border: 0; background: transparent; padding: 0; cursor: pointer; text-align: left; max-width: 100%; }
.np-spk--btn:hover { text-decoration: underline; }
.np-lang { display: inline-flex; align-items: center; height: 16px; padding: 0 4px; border: 1px solid var(--ctrl-border-soft); border-radius: 4px; font: 600 10px/14px var(--font); color: var(--label-2); letter-spacing: .03em; flex: none; }
.np-lang.is-low { border-style: dashed; }
.np-agent { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border: 1px solid var(--ctrl-border-soft); border-radius: 5px; font: 600 11px/14px var(--font); color: var(--label-2); background: transparent; white-space: nowrap; flex: none; }
.np-agent--btn { cursor: pointer; }
.np-agent--btn:hover { background: var(--sel-unemph); }
.np-agent__merged { color: var(--label-3); font-size: 11px; margin-left: 4px; }
.np-prov { display: inline-flex; align-items: center; gap: 4px; color: var(--accent-text); text-decoration: none; font-size: 12px; min-width: 0; max-width: 100%; }
.np-prov:hover .np-prov__text { text-decoration: underline; }
.np-prov__text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-prov--chip { border: 1px solid var(--sep); border-radius: 5px; padding: 1px 6px; color: var(--label-2); }
.np-prov--chip .np-ic { color: var(--label-3); }
.np-prov--timestamp { font-variant-numeric: tabular-nums; }
.np-prov--guess { color: var(--warning); background: var(--warning-tint); border-radius: 5px; padding: 1px 6px; font-weight: 600; }
.np-prov.is-loading, .np-prov.is-disabled { color: var(--label-3); }
.np-person { display: inline-flex; align-items: center; gap: 5px; color: var(--label); text-decoration: none; white-space: nowrap; max-width: 100%; border: 0; background: transparent; padding: 0; font: inherit; cursor: default; }
.np-person__ini { width: 18px; height: 18px; border-radius: 50%; background: var(--sel-unemph); color: var(--label-2); font: 600 9px/18px var(--font); text-align: center; flex: none; }
.np-person__name { overflow: hidden; text-overflow: ellipsis; }
.np-person--link, .np-person--text, .np-person--picker, button.np-person { cursor: pointer; }
.np-person--link:hover .np-person__name, .np-person--text:hover { text-decoration: underline; }
.np-person.is-secondary { color: var(--label-2); }
.np-person--picker { border: 1px solid var(--ctrl-border-soft); border-radius: 6px; padding: 2px 6px 2px 3px; background: var(--ctrl-bg); }
.np-topic { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--sel-unemph); color: var(--label); text-decoration: none; font-size: 12px; max-width: 100%; }
.np-topic:hover .np-topic__name { text-decoration: underline; }
.np-topic__name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-topic__counts { color: var(--label-3); white-space: nowrap; }
.np-topic--suggestion { height: auto; min-height: 28px; padding: 4px 10px; flex-wrap: wrap; }
.np-undo { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; border-radius: 8px; background: var(--card-bg); border: 1px solid var(--sep); box-shadow: var(--shadow-pop); }
.np-undo.is-sticky { position: sticky; top: 0; z-index: 3; }
.np-undo__text { flex: 1 1 auto; min-width: 0; }
.np-undo__msg { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-undo__ctx { font-size: 12px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-empty { display: grid; justify-items: center; text-align: center; gap: 6px; padding: 28px 16px; color: var(--label-2); }
.np-empty__glyph { color: var(--label-3); }
.np-empty__title { font: 600 13px/18px var(--font); color: var(--label); text-wrap: balance; }
.np-empty--large .np-empty__title { font: 600 22px/28px var(--font-display); }
.np-empty__body { max-width: 46ch; }
.np-empty__act { margin-top: 6px; }
.np-empty--section { padding: 6px 0; color: var(--label-2); display: block; text-align: left; }
.np-empty--filtered { padding: 20px 16px; }
.np-banner { display: flex; align-items: flex-start; gap: 10px; padding: 9px 14px; background: var(--info-tint); border: 1px solid var(--sep); border-radius: 8px; }
.np-banner--warning, .np-banner--degraded { background: var(--warning-tint); }
.np-banner--error { background: var(--error-tint); }
.np-banner--success { background: var(--success-tint); }
.np-banner__icon { color: var(--accent-text); padding-top: 1px; display: inline-flex; }
.np-banner--warning .np-banner__icon, .np-banner--degraded .np-banner__icon { color: var(--warning); }
.np-banner--error .np-banner__icon { color: var(--error); }
.np-banner--success .np-banner__icon { color: var(--success); }
.np-banner__main { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
.np-banner__title { font-weight: 600; }
.np-banner__prog { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--label-2); }
.np-banner__actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
.np-banner.is-compact { flex-wrap: wrap; }
.np-banner.is-compact .np-banner__main { flex: 1 1 0; }
.np-banner.is-compact .np-banner__actions { width: 100%; justify-content: flex-start; padding-left: 25px; }
.np-istatus { display: inline-flex; align-items: center; gap: 5px; color: var(--success); font-size: 12px; white-space: nowrap; max-width: 100%; }
.np-istatus--notice { color: var(--label-2); }
.np-istatus__text { overflow: hidden; text-overflow: ellipsis; }

/* Common content blocks screens can reuse */
.np-card { background: var(--card-bg); border: 1px solid var(--sep); border-radius: 10px; }
.np-section-h { font: 600 13px/18px var(--font); display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
.np-section-h .np-dim { font-weight: 400; }
.np-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.np-stack { display: grid; gap: 12px; }
.np-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 1100px) { .np-grid2 { grid-template-columns: minmax(0, 1fr); } }
.np-kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; align-items: baseline; }
.np-kv dt { color: var(--label-2); font-size: 12px; }
.np-kv dd { margin: 0; min-width: 0; }
.np-hl-match { background: var(--match); border-radius: 2px; }
.np-hl-evidence { background: var(--evidence); box-shadow: inset 3px 0 0 var(--accent); }
.np-ins { background: var(--diff-ins); text-decoration: underline; }
.np-del { background: var(--diff-del); text-decoration: line-through; }

.np-stub { border: 1px dashed var(--ctrl-border-soft); border-radius: 6px; padding: 4px 8px; color: var(--label-3); font: 11px var(--mono); }

/* =====================================================================
   macOS 27 UI Kit layer (Liquid Glass)
   Applied on top of the foundations. Source: Apple's macOS 27 design
   language as published (Liquid Glass materials, edge-to-edge sidebar,
   unified toolbar with grouped glass controls, capsule push buttons,
   concentric corner radii, colour-tinted sidebar icons, glass menus,
   left-aligned alerts). Numbers are the prototype's best match; the
   Apple Figma/Sketch kit could not be read directly.
   Nothing here changes data-* attributes or behaviour.
   ===================================================================== */

/* ---------- desktop wallpaper, so materials have something to refract ---------- */
.np-desk {
  background:
    radial-gradient(1100px 700px at 8% 0%, var(--wall-1), transparent 62%),
    radial-gradient(900px 640px at 96% 14%, var(--wall-2), transparent 62%),
    radial-gradient(1100px 800px at 55% 108%, var(--wall-3), transparent 64%),
    var(--wall-base);
}
.np-cap { display: inline-flex; gap: 4px; align-items: baseline; padding: 3px 10px; border-radius: var(--r-capsule); background: var(--glass-bg); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-edge); color: var(--label); }
.np-cap span { color: var(--label-2); }

/* ---------- focus ring: macOS accent halo ---------- */
:focus-visible { outline: 3.5px solid var(--sel-accent); outline-offset: 0; }
.np-btn:focus-visible, .np-ibtn:focus-visible, .np-seg__item:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* ---------- glass material helper ---------- */
.np-glass { background: var(--glass-bg); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-edge); }

/* ---------- windows: concentric corners, soft macOS 27 shadow ---------- */
.np-win { border-radius: var(--r-panel); box-shadow: var(--shadow-win); }
.np-win--main { border-radius: var(--r-window); background: transparent; }
.np-win__titlebar { height: 40px; background: var(--win-bg); border-bottom: 1px solid var(--sep); padding: 0 16px; }
.np-win__title { font-weight: 600; }
.np-lights { gap: 9px; }
.np-light { width: 13px; height: 13px; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }

/* ---------- Shell — Main window: edge-to-edge glass sidebar (macOS 27) ---------- */
.np-sidebar { background: var(--side-bg); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border-right: 0; }
.np-sidebar__top { height: 52px; padding: 0 12px 0 20px; }
.np-split { background: var(--sep); }
.np-srclist { padding: 2px 10px 10px; gap: 2px; }
.np-srclist__group { font: 600 11px/14px var(--font); color: var(--label-2); padding: 14px 10px 5px; }
.np-srclist__item { height: 30px; padding: 0 10px; border-radius: var(--r-row); color: var(--label); font-weight: 400; }
.np-srclist__item .np-ic { color: var(--accent); }
.np-srclist__item:hover { background: var(--sel-unemph); }
.np-srclist__item.is-sel { background: var(--sel-unemph); font-weight: 500; box-shadow: inset 0 0 0 .5px var(--ctrl-border-soft); }
.np-srclist__badge { background: transparent; color: var(--label-2); font-weight: 500; }
.np-srclist__live { margin: 0 0 10px; }
.np-recind--row { border-radius: var(--r-capsule); height: 30px; padding: 0 12px; background: var(--error-tint); }
.np-sidebar__footer { border-top: 0; padding: 10px 12px 14px; }
.np-main { background: var(--content-bg); }

/* unified toolbar: content-coloured bar with a hairline, controls grouped in glass capsules */
.np-toolbar { height: 56px; background: var(--content-bg); border-bottom: 1px solid var(--sep); padding: 0 14px 0 12px; gap: 10px; }
.np-toolbar__nav { display: inline-flex; gap: 0; padding: 2px; border-radius: var(--r-capsule); background: var(--glass-bg); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-edge); }
.np-toolbar__nav .np-ibtn { width: 32px; height: 30px; border-radius: var(--r-capsule); }
.np-toolbar__title { font: 600 15px/20px var(--font-display); }
.np-toolbar__sub { font-size: 11px; color: var(--label-2); }
.np-toolbar .np-btn { height: 32px; padding: 0 14px; background: var(--glass-bg); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-edge); border: 0; }
.np-toolbar .np-btn--primary { background: var(--accent-fill); color: var(--on-accent); }
.np-toolbar .np-btn--quiet { background: transparent; box-shadow: none; }
.np-toolbar .np-ibtn--toolbar { width: 32px; height: 32px; border-radius: var(--r-capsule); background: var(--glass-bg); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-edge); }
.np-toolbar .np-ibtn--toolbar[aria-pressed="true"], .np-toolbar .np-ibtn--toolbar.is-on { background: var(--accent-fill); color: var(--on-accent); }
.np-toolbar .np-seg { height: 32px; align-items: center; background: var(--glass-bg); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-edge); padding: 3px; }
.np-toolbar .np-seg__item { height: 26px; }
.np-toolbar .np-search { height: 32px; background: var(--glass-bg); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-edge); }
.np-toolbar .np-popup select { height: 32px; border-radius: var(--r-capsule); background: var(--glass-bg); box-shadow: var(--glass-edge); padding: 0 30px 0 14px; }
.np-sidebar .np-ibtn { border-radius: var(--r-capsule); }
.np-bannerslot { border-bottom: 1px solid var(--sep); background: var(--content-bg); }
.np-inspector { background: var(--content-bg); border-left: 1px solid var(--sep); }

/* ---------- push buttons: capsules; mini 16 · small 20 · regular 24 · large 28 ---------- */
.np-btn { border-radius: var(--r-capsule); border: 0; background: var(--ctrl-bg); color: var(--label); box-shadow: 0 0 0 .5px var(--ctrl-border), 0 1px 1.5px rgba(0,0,0,.07); font-weight: 400; padding: 0 12px; min-width: 56px; }
.np-btn:hover { filter: none; background-image: linear-gradient(var(--sel-unemph), var(--sel-unemph)); }
.np-btn:active { filter: brightness(.94); }
.np-btn--small { height: 20px; font-size: 11px; padding: 0 9px; }
.np-btn--regular { height: 24px; }
.np-btn--large { height: 28px; padding: 0 16px; }
.np-btn--primary { background: var(--accent-fill); color: var(--on-accent); box-shadow: 0 1px 2px rgba(0,0,0,.14), inset 0 .5px 0 rgba(255,255,255,.25); }
.np-btn--primary:hover { background-image: linear-gradient(rgba(255,255,255,.08), rgba(255,255,255,.08)); }
.np-btn--quiet { background: transparent; box-shadow: none; color: var(--accent-text); }
.np-btn--quiet:hover { background-image: none; background-color: var(--sel-unemph); }
.np-btn--destructive { color: var(--error); }
.np-btn--destructive.np-btn--primary { background: var(--error); color: #fff; }
.np-btn .np-kbd { border: 0; background: var(--sel-unemph); }
.np-btn--primary .np-kbd { background: rgba(255,255,255,.2); }

/* icon buttons */
.np-ibtn { border-radius: var(--r-capsule); color: var(--label-2); }
.np-ibtn--toolbar { width: 30px; height: 30px; }
.np-ibtn--inline { width: 22px; height: 22px; }
.np-ibtn:hover { background: var(--sel-unemph); }

/* key caps */
.np-kbd { border: 0; background: var(--sel-unemph); border-radius: 5px; color: var(--label-2); }

/* segmented control: capsule track, glass thumb */
.np-seg { border-radius: var(--r-capsule); background: var(--sel-unemph); padding: 2px; gap: 0; }
.np-seg__item { height: 22px; padding: 0 12px; border-radius: var(--r-capsule); }
.np-seg__item.is-sel { background: var(--thumb-bg); box-shadow: var(--thumb-shadow); font-weight: 500; }

/* pop-up button */
.np-popup select { height: 24px; border: 0; border-radius: var(--r-control); background: var(--ctrl-bg); box-shadow: 0 0 0 .5px var(--ctrl-border), 0 1px 1.5px rgba(0,0,0,.07); padding: 0 26px 0 10px; }
.np-popup--inline select { box-shadow: none; background: transparent; }

/* text fields and search */
.np-field__input { height: 26px; border: 0; border-radius: var(--r-control); background: var(--ctrl-bg); box-shadow: inset 0 0 0 .5px var(--ctrl-border), inset 0 1px 1px rgba(0,0,0,.04); padding: 0 9px; }
textarea.np-field__input { border-radius: var(--r-row); padding: 7px 9px; }
.np-field__input:focus { outline: none; box-shadow: inset 0 0 0 .5px var(--accent), var(--focus-ring); }
.np-field.is-invalid .np-field__input { box-shadow: inset 0 0 0 1px var(--error); }
.np-search { height: 28px; border-radius: var(--r-capsule); background: var(--sel-unemph); padding: 0 10px; }
.np-search:focus-within { outline: none; box-shadow: var(--focus-ring); }
.np-search--token-field { border: 0; border-radius: var(--r-control); background: var(--ctrl-bg); box-shadow: inset 0 0 0 .5px var(--ctrl-border); }
.np-token { border-radius: var(--r-capsule); padding: 0 4px 0 9px; }

/* checkbox, radio, switch */
.np-check__box { width: 14px; height: 14px; border: 0; border-radius: 4px; background: var(--ctrl-bg); box-shadow: inset 0 0 0 .5px var(--ctrl-border), 0 .5px 1px rgba(0,0,0,.08); }
.np-check input:checked + .np-check__box, .np-check[data-state="mixed"] .np-check__box { background: var(--accent-fill); box-shadow: none; }
.np-check input:focus-visible + .np-check__box { outline: none; box-shadow: var(--focus-ring); }
.np-radio__dot { width: 14px; height: 14px; border: 0; background: var(--ctrl-bg); box-shadow: inset 0 0 0 .5px var(--ctrl-border), 0 .5px 1px rgba(0,0,0,.08); }
.np-radio input:checked + .np-radio__dot { border: 0; background: radial-gradient(circle, #fff 0 3px, var(--accent-fill) 3.5px); box-shadow: none; }
.np-toggle__track { width: 34px; height: 20px; border: 0; border-radius: var(--r-capsule); background: var(--sel-unemph); box-shadow: inset 0 0 0 .5px var(--ctrl-border-soft); }
.np-toggle__thumb { top: 2px; left: 2px; width: 20px; height: 16px; border-radius: var(--r-capsule); background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25), 0 0 0 .5px rgba(0,0,0,.06); transition: left 160ms cubic-bezier(.3,1.4,.5,1); }
.np-toggle input:checked + .np-toggle__track { background: var(--accent-fill); box-shadow: none; }
.np-toggle input:checked + .np-toggle__track .np-toggle__thumb { left: 12px; }
.np-toggle--small .np-toggle__track { width: 28px; height: 16px; }
.np-toggle--small .np-toggle__thumb { width: 16px; height: 12px; }
.np-toggle--small input:checked + .np-toggle__track .np-toggle__thumb { left: 10px; }
.np-toggle input:focus-visible + .np-toggle__track { outline: none; box-shadow: var(--focus-ring); }

/* progress, meter, badges, disclosure */
.np-progress { height: 5px; border-radius: var(--r-capsule); }
.np-progress__fill { border-radius: var(--r-capsule); background: var(--accent-fill); }
.np-meter__seg { border-radius: 2px; }
.np-badge { border-radius: var(--r-tag); border: 0; font-weight: 500; }
.np-badge--count { border-radius: var(--r-capsule); }
.np-badge--kind { box-shadow: inset 0 0 0 .5px var(--ctrl-border); }

/* tables: inset list style */
.np-table-wrap { border: 0; border-radius: var(--r-card); box-shadow: 0 0 0 .5px var(--sep); }
.np-table th { font-weight: 500; color: var(--label-2); border-bottom: 1px solid var(--sep); }
.np-table td { border-bottom: 0; }
.np-table tbody tr:nth-child(even) td { background: rgba(127,127,127,.04); }
.np-table tbody tr.is-sel td { background: var(--accent-fill); color: var(--on-accent); }
.np-table tbody tr.is-sel td * { color: inherit; }

/* menus, popovers: Liquid Glass */
.np-menu, .np-pop, .mb-menu { background: var(--glass-bg-strong); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--shadow-pop), inset 0 .5px 0 rgba(255,255,255,.35); }
.np-menu { border-radius: 12px; padding: 5px; }
.np-menu__item { height: 24px; padding: 0 10px 0 6px; border-radius: 7px; }
.np-menu__item:hover:not([disabled]) { background: var(--accent-fill); }
.np-menu__sep { margin: 4px 10px; }
.np-pop { border-radius: 18px; }
.np-pop__body { padding: 14px 16px; }

/* sheets and alerts */
.np-sheet-layer, .np-alert-layer { background: rgba(0,0,0,.12); }
.np-sheet { border-radius: var(--r-sheet); background: var(--win-bg); box-shadow: var(--shadow-win); }
.np-sheet__head { padding: 20px 22px 6px; }
.np-sheet__body { padding: 10px 22px 16px; }
.np-sheet__foot { border-top: 0; padding: 6px 22px 20px; }
.np-alert { width: 268px; border-radius: var(--r-sheet); background: var(--glass-bg-strong); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--shadow-win); padding: 20px 18px 16px; text-align: left; justify-items: start; gap: 6px; }
.np-alert__icon { margin-bottom: 4px; }
.np-alert__title { font-weight: 700; font-size: 13px; }
.np-alert__body { font-size: 11px; line-height: 15px; color: var(--label); }
.np-alert__btns { display: flex; flex-direction: row; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.np-alert__btns .np-btn { flex: 1 1 0; width: auto; height: 28px; min-width: 0; }

/* shared content components */
.np-card { border: 0; border-radius: var(--r-card); box-shadow: 0 0 0 .5px var(--sep), 0 1px 2px rgba(0,0,0,.04); }
.np-banner { border: 0; border-radius: var(--r-card); }
.np-bannerslot > .np-banner { border-radius: 0; }
.np-undo { border: 0; border-radius: var(--r-card); background: var(--glass-bg-strong); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--shadow-pop); }
.np-lang { border: 0; box-shadow: inset 0 0 0 .5px var(--ctrl-border); border-radius: 5px; }
.np-agent { border: 0; box-shadow: inset 0 0 0 .5px var(--ctrl-border); border-radius: var(--r-capsule); padding: 0 9px; }
.np-prov--chip { border: 0; box-shadow: inset 0 0 0 .5px var(--sep); border-radius: var(--r-capsule); padding: 1px 8px; }
.np-prov--guess { border-radius: var(--r-capsule); padding: 1px 8px; }
.np-person--picker { border: 0; border-radius: var(--r-capsule); box-shadow: 0 0 0 .5px var(--ctrl-border); padding: 2px 8px 2px 3px; }
.np-mode { border-radius: var(--r-capsule); }
.np-empty__glyph { color: var(--label-3); }
.np-recdot { box-shadow: 0 0 0 2px var(--error-tint); }

/* ---------- group surfaces that draw their own panels: Liquid Glass panels ---------- */
.rp-panel, .nt-banner { background: var(--glass-bg-strong); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--shadow-pop); }
.cw-win--floating { background: var(--glass-bg-strong); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }

/* fake macOS menu bar on the record prompt / menu bar / notification desks: transparent like macOS 26+ */
.np-desk .a-mbar { background: transparent; border-bottom: 0; text-shadow: 0 0 8px var(--glass-tint); }
.a-mbar__app { font-weight: 600; }

/* =====================================================================
   Increase Contrast (AC5 resolution, owner decision 17 Oct, PM-57)
   Default look: Apple system colours (00-base.css). With macOS Increase
   Contrast on (prefers-contrast: more), or the prototype's "Increase
   contrast" toggle (data-contrast="more"), the WCAG 2.2 AA-checked values
   of DESIGN v0.5 apply: tertiary maps to secondary, separators 25 %,
   control borders 60 %, a solid 3-pt focus ring, solid tag outlines and
   opaque materials. data-contrast="normal" opts out of the system setting.
   ===================================================================== */
:root[data-contrast="more"] {
    --label: #1D1D1F; --label-2: #616161; --label-3: #616161; --label-dis: rgba(0,0,0,.40);
    --sep: rgba(0,0,0,.25); --ctrl-border: rgba(0,0,0,.60); --ctrl-border-soft: rgba(0,0,0,.35);
    --accent: #0064D1; --accent-fill: #0064D1; --accent-text: #0064D1;
    --sel-accent: rgba(0,100,209,.18);
    --rec: #C4281C; --error: #C4281C; --warning: #A85A00; --success: #1E7E34;
    --side-bg: #F3F3F3; --glass-bg: rgba(255,255,255,.94); --glass-bg-strong: #FFFFFF;
    --focus-ring: 0 0 0 3px #0064D1;
}
@media (prefers-contrast: more) {
  :root:not([data-contrast="normal"]) {
    --label: #1D1D1F; --label-2: #616161; --label-3: #616161; --label-dis: rgba(0,0,0,.40);
    --sep: rgba(0,0,0,.25); --ctrl-border: rgba(0,0,0,.60); --ctrl-border-soft: rgba(0,0,0,.35);
    --accent: #0064D1; --accent-fill: #0064D1; --accent-text: #0064D1;
    --sel-accent: rgba(0,100,209,.18);
    --rec: #C4281C; --error: #C4281C; --warning: #A85A00; --success: #1E7E34;
    --side-bg: #F3F3F3; --glass-bg: rgba(255,255,255,.94); --glass-bg-strong: #FFFFFF;
    --focus-ring: 0 0 0 3px #0064D1;
  }
}
/* dark + increase contrast (higher specificity, so it wins over the light block above) */
:root[data-contrast="more"][data-theme="dark"] {
    --label: #F2F2F2; --label-2: #AAAAAA; --label-3: #AAAAAA; --label-dis: rgba(255,255,255,.40);
    --sep: rgba(255,255,255,.25); --ctrl-border: rgba(255,255,255,.60); --ctrl-border-soft: rgba(255,255,255,.35);
    --accent: #0A84FF; --accent-fill: #0A6FE0; --accent-text: #4DA3FF;
    --sel-accent: rgba(10,132,255,.30);
    --rec: #FF6961; --error: #FF6961; --warning: #FF9F0A; --success: #30D158;
    --side-bg: #232323; --glass-bg: rgba(38,38,40,.96); --glass-bg-strong: #2A2A2A;
    --focus-ring: 0 0 0 3px #4DA3FF;
}
@media (prefers-color-scheme: dark) {
  :root[data-contrast="more"]:not([data-theme="light"]) {
    --label: #F2F2F2; --label-2: #AAAAAA; --label-3: #AAAAAA; --label-dis: rgba(255,255,255,.40);
    --sep: rgba(255,255,255,.25); --ctrl-border: rgba(255,255,255,.60); --ctrl-border-soft: rgba(255,255,255,.35);
    --accent: #0A84FF; --accent-fill: #0A6FE0; --accent-text: #4DA3FF;
    --sel-accent: rgba(10,132,255,.30);
    --rec: #FF6961; --error: #FF6961; --warning: #FF9F0A; --success: #30D158;
    --side-bg: #232323; --glass-bg: rgba(38,38,40,.96); --glass-bg-strong: #2A2A2A;
    --focus-ring: 0 0 0 3px #4DA3FF;
  }
}
@media (prefers-contrast: more) {
  :root[data-theme="dark"]:not([data-contrast="normal"]) {
    --label: #F2F2F2; --label-2: #AAAAAA; --label-3: #AAAAAA; --label-dis: rgba(255,255,255,.40);
    --sep: rgba(255,255,255,.25); --ctrl-border: rgba(255,255,255,.60); --ctrl-border-soft: rgba(255,255,255,.35);
    --accent: #0A84FF; --accent-fill: #0A6FE0; --accent-text: #4DA3FF;
    --sel-accent: rgba(10,132,255,.30);
    --rec: #FF6961; --error: #FF6961; --warning: #FF9F0A; --success: #30D158;
    --side-bg: #232323; --glass-bg: rgba(38,38,40,.96); --glass-bg-strong: #2A2A2A;
    --focus-ring: 0 0 0 3px #4DA3FF;
  }
}
@media (prefers-contrast: more) and (prefers-color-scheme: dark) {
  :root:not([data-contrast="normal"]):not([data-theme="light"]) {
    --label: #F2F2F2; --label-2: #AAAAAA; --label-3: #AAAAAA; --label-dis: rgba(255,255,255,.40);
    --sep: rgba(255,255,255,.25); --ctrl-border: rgba(255,255,255,.60); --ctrl-border-soft: rgba(255,255,255,.35);
    --accent: #0A84FF; --accent-fill: #0A6FE0; --accent-text: #4DA3FF;
    --sel-accent: rgba(10,132,255,.30);
    --rec: #FF6961; --error: #FF6961; --warning: #FF9F0A; --success: #30D158;
    --side-bg: #232323; --glass-bg: rgba(38,38,40,.96); --glass-bg-strong: #2A2A2A;
    --focus-ring: 0 0 0 3px #4DA3FF;
  }
}

/* component treatments under Increase Contrast */
:root[data-contrast="more"] .np-badge, :root[data-contrast="more"] .np-lang, :root[data-contrast="more"] .np-agent,
:root[data-contrast="more"] .np-prov--chip, :root[data-contrast="more"] .np-token { box-shadow: inset 0 0 0 1px currentColor; }
:root[data-contrast="more"] :focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
:root[data-contrast="more"] .np-btn, :root[data-contrast="more"] .np-popup select,
:root[data-contrast="more"] .np-field__input, :root[data-contrast="more"] .np-check__box,
:root[data-contrast="more"] .np-radio__dot, :root[data-contrast="more"] .np-toggle__track { box-shadow: inset 0 0 0 1px var(--ctrl-border); }
:root[data-contrast="more"] .np-btn--primary { box-shadow: none; }
:root[data-contrast="more"] .np-sidebar, :root[data-contrast="more"] .np-menu, :root[data-contrast="more"] .np-pop,
:root[data-contrast="more"] .np-toolbar .np-btn, :root[data-contrast="more"] .np-toolbar__nav,
:root[data-contrast="more"] .np-toolbar .np-search { -webkit-backdrop-filter: none; backdrop-filter: none; }
@media (prefers-contrast: more) {
  :root:not([data-contrast="normal"]) .np-badge, :root:not([data-contrast="normal"]) .np-lang, :root:not([data-contrast="normal"]) .np-agent,
  :root:not([data-contrast="normal"]) .np-prov--chip, :root:not([data-contrast="normal"]) .np-token { box-shadow: inset 0 0 0 1px currentColor; }
  :root:not([data-contrast="normal"]) :focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  :root:not([data-contrast="normal"]) .np-sidebar, :root:not([data-contrast="normal"]) .np-menu, :root:not([data-contrast="normal"]) .np-pop { -webkit-backdrop-filter: none; backdrop-filter: none; }
}

/* ===== Group A: Today, Record prompt, Menu bar, First run, Notifications ===== */

/* ---------- Today ---------- */
.td { display: grid; gap: 24px; max-width: 1180px; }
.td-review { display: grid; gap: 6px; padding: 10px 14px; border-radius: var(--r-row); background: var(--info-tint); border: 1px solid var(--sep); }
.td-review__links { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.td-cards { display: grid; gap: 10px; }
.td-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 1250px) { .td-cols { grid-template-columns: minmax(0, 1fr); } .td-cols .td-col:last-child { order: -1; } }
.td-col { display: grid; gap: 22px; min-width: 0; }
.td-card { padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.td-card.is-live { border-color: var(--rec); box-shadow: inset 3px 0 0 var(--rec); }
.td-card__head { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.td-card__head:hover { background: transparent; }
.td-card__time { width: 52px; flex: none; display: inline-flex; align-items: center; gap: 6px; color: var(--label-2); font-variant-numeric: tabular-nums; padding-top: 1px; }
.td-card__main { flex: 1 1 auto; min-width: 0; display: grid; gap: 5px; }
.td-card__titlerow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.td-card__title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
.td-card__att { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; color: var(--label-2); font-size: 12px; }
.td-card__platform { color: var(--label-3); }
.td-card__last { font-size: 12px; color: var(--label-2); display: flex; gap: 4px; align-items: baseline; min-width: 0; }
.td-card__rows { display: grid; gap: 0; padding-left: 64px; min-width: 0; }
.td-card__rows > .np-link { margin-top: 6px; justify-self: start; }
.td-card--collapsed { padding: 6px 14px; }
.td-card--collapsed .td-card__head { align-items: center; }
.td-card--collapsed .np-disc { gap: 10px; font-weight: 400; min-width: 0; }
.td-card--collapsed .td-card__time { width: 52px; display: inline-block; }
.td-card--collapsed .td-card__title { font-weight: 600; }
.td-card__count { color: var(--label-3); font-size: 12px; margin-left: auto; white-space: nowrap; }
.td-localtag { display: inline-flex; align-items: center; gap: 3px; font: 600 11px/16px var(--font); color: var(--label-2); border: 1px solid var(--ctrl-border-soft); border-radius: var(--r-tag); padding: 0 5px; }
.td-row { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 3px 0; border-top: 1px solid var(--sep); min-width: 0; }
.td-card__rows > .td-row:first-child, .td-list > .td-row:first-child { border-top: 0; }
.td-row__text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 40px; flex: 0 1 auto; }
.td-row__meta { color: var(--label-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; display: inline-flex; gap: 4px; align-items: center; }
.td-row.is-done .td-row__text { text-decoration: line-through; color: var(--label-2); }
.td-row__qmark { width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--ctrl-border-soft); font: 600 10px/13px var(--font); text-align: center; color: var(--label-2); flex: none; }
.td-rownote { display: flex; gap: 6px; align-items: center; color: var(--warning); font-size: 12px; padding: 0 0 6px 24px; }
.td-handoffask { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; margin: 2px 0 6px 24px; border-radius: var(--r-row); background: var(--info-tint); }
.td-handoffask > span { font-weight: 600; margin-right: 4px; }
.td-list { padding: 4px 12px; }
.td-weeklist { padding: 4px 12px; }
.td-week { border-top: 1px solid var(--sep); padding: 4px 0; }
.td-week:first-child { border-top: 0; }
.td-week__line { display: flex; align-items: center; gap: 10px; min-height: 30px; min-width: 0; }
.td-week__day { color: var(--label-2); width: 32px; display: inline-block; }
.td-week__sum { color: var(--label-3); font-size: 12px; }
.td-week .td-card__rows { padding-left: 22px; }
.td-props { padding: 4px 12px; }
.td-prop { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--sep); }
.td-prop:first-child { border-top: 0; }
.td-prop__text { flex: 1 1 auto; min-width: 0; }
.td-prop__title { font-weight: 600; }
.td-prop__why { color: var(--label-2); font-size: 12px; }
.td-prop__btns { display: flex; gap: 16px; }
.td-r6 { display: grid; gap: 8px; }
.td-r6 > .np-section-h { margin: 0; }
.td-r6 > .np-link { justify-self: start; }
.td-r7 .td-list { margin-top: 8px; }
.td-errline { display: flex; align-items: center; gap: 8px; color: var(--error); padding: 10px 14px; border-radius: var(--r-row); background: var(--error-tint); }
.td-errline span { flex: 1 1 auto; color: var(--label); }
.td-skelcard { padding: 14px; display: grid; gap: 10px; }
.td-skel { height: 12px; border-radius: var(--r-control); background: var(--sel-unemph); }
.td-skel.w60 { width: 60%; }
.td-r3 .np-empty { border: 1px dashed var(--sep); border-radius: var(--r-card); }
.td-r3 .np-empty--section { border: 0; }

/* ---------- desktop scene (prototype chrome) ---------- */
.a-desk { position: relative; max-width: 1180px; margin: 0 auto; border-radius: var(--r-panel); overflow: hidden; background: linear-gradient(160deg, var(--sel-accent), transparent 60%), var(--win-bg); box-shadow: var(--shadow-win); --mb-bar: var(--side-bg); }
.a-mbar { height: 26px; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--side-bg); border-bottom: 1px solid var(--sep); font-size: 13px; color: var(--label); position: relative; z-index: 4; }
.a-mbar__app { font-weight: 700; }
.a-mbar__m { color: var(--label); }
.a-mbar__sys { color: var(--label-2); display: inline-flex; }
.a-mbar__clock { font-size: 12px; }
.a-desk__body { position: relative; padding: 24px; min-height: inherit; }
.a-callapp { width: min(620px, 72%); border-radius: var(--r-card); background: var(--card-bg); box-shadow: var(--shadow-pop); overflow: hidden; opacity: .9; }
.a-callapp__bar { height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 10px; background: var(--win-bg); font-size: 12px; color: var(--label-2); border-bottom: 1px solid var(--sep); }
.a-callapp__grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 8px; }
.a-callapp__tile { height: 108px; border-radius: var(--r-control); background: var(--sel-unemph); display: flex; align-items: flex-end; padding: 6px 8px; font-size: 12px; color: var(--label-2); }
.a-note { position: absolute; right: 24px; top: 24px; width: min(380px, calc(100% - 48px)); background: var(--chrome-bg); color: var(--chrome-fg); border-radius: var(--r-card); padding: 14px; display: grid; gap: 10px; font-size: 12px; z-index: 3; }
.a-note p { margin: 0; line-height: 1.45; }
.a-note__btns { display: flex; flex-wrap: wrap; gap: 6px; }
.a-note .np-banner { color: var(--label); }

/* ---------- Record prompt ---------- */
.rp-pos { position: absolute; top: 12px; right: 12px; z-index: 3; }
.rp-pos.is-lower { top: 84px; }
.rp-panel { width: 400px; min-width: 360px; max-width: 440px; background: var(--card-bg); border-radius: var(--r-panel); box-shadow: var(--shadow-win); padding: 12px 14px; display: grid; gap: 10px; }
.rp-r1 { display: flex; align-items: flex-start; gap: 10px; }
.rp-r1__text { flex: 1 1 auto; min-width: 0; display: grid; gap: 3px; }
.rp-appicon { width: 32px; height: 32px; border-radius: var(--r-row); background: var(--sel-accent); color: var(--accent-text); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.rp-title { font: 600 13px/18px var(--font); }
.rp-sub { color: var(--label-2); font-size: 12px; line-height: 16px; }
.rp-r3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rp-r3--stack { display: grid; gap: 8px; }
.rp-btnrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rp-reason { display: flex; gap: 6px; align-items: center; color: var(--warning); font-size: 12px; }
.rp-reason span { color: var(--label); }
.rp-inline { display: grid; gap: 8px; padding: 8px 10px; border-radius: var(--r-row); background: var(--sel-unemph); }
.rp-inline p { margin: 0; font-size: 12px; }
.rp-inline__btns { display: flex; justify-content: flex-end; gap: 8px; }
.rp-countdown { height: 3px; border-radius: 2px; background: var(--sel-unemph); margin-top: 6px; overflow: hidden; }
.rp-countdown span { display: block; height: 100%; background: var(--label-3); transition: width 1s linear; }
@media (prefers-reduced-motion: reduce) { .rp-countdown { display: none; } }

/* ---------- Menu bar extra ---------- */
.mb-item { position: relative; display: inline-flex; }
.mb-item__btn { border: 0; background: transparent; color: var(--label); height: 22px; padding: 0 6px; border-radius: var(--r-tag); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-size: 13px; }
.mb-item.is-open .mb-item__btn { background: var(--sel-unemph); }
.mb-glyph { color: var(--label); display: block; }
.mb-menuwrap { position: absolute; top: 25px; right: -120px; display: flex; flex-direction: row-reverse; align-items: flex-start; gap: 2px; z-index: 10; }
.mb-menu { min-width: 300px; max-width: 460px; background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow-pop); padding: 5px; display: grid; font-size: 13px; }
.mb-menu--sub { min-width: 220px; margin-top: 230px; }
.mb-group { display: grid; padding: 3px 0; border-top: 1px solid var(--sep); }
.mb-group:first-child { border-top: 0; }
.mb-mi { display: flex; align-items: center; gap: 4px; border: 0; background: transparent; text-align: left; padding: 3px 8px 3px 4px; border-radius: var(--r-tag); color: var(--label); cursor: default; white-space: nowrap; font: inherit; min-height: 22px; }
button.mb-mi { cursor: pointer; }
button.mb-mi:hover { background: var(--accent-fill); color: #fff; }
button.mb-mi:hover .mb-mi__kbd { color: rgba(255,255,255,.85); }
.mb-mi.is-info { color: var(--label-2); padding-left: 22px; overflow: hidden; text-overflow: ellipsis; display: block; }
.mb-mi__check { width: 14px; flex: none; text-align: center; font-size: 12px; }
.mb-mi__label { flex: 1 1 auto; }
.mb-mi__kbd { color: var(--label-3); margin-left: 24px; letter-spacing: .03em; }
.mb-mi__sub { color: var(--label-3); margin-left: 24px; }
.mb-warnline { color: var(--warning); font-weight: 600; }
.mb-scene .a-desk__body { min-height: 600px; }
.mb-legend { max-width: 1180px; margin: 14px auto 0; background: var(--card-bg); border: 1px solid var(--sep); border-radius: var(--r-card); padding: 12px 14px; display: grid; gap: 10px; color: var(--label); --mb-bar: var(--card-bg); }
.mb-legend__h { font-weight: 600; font-size: 12px; }
.mb-legend__row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 12px; }
.mb-legend__cell { display: inline-flex; align-items: center; gap: 6px; }
.mb-legend__g, .mb-legend__t { display: inline-flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: var(--r-tag); background: var(--side-bg); border: 1px solid var(--sep); --mb-bar: var(--side-bg); }

/* ---------- First-run wizard ---------- */
.fr-win { max-width: 100%; }
.fr { display: flex; height: 100%; min-height: 0; }
.fr-r1 { width: 210px; flex: none; background: var(--side-bg); border-right: 1px solid var(--sep); padding: 14px 14px 18px; display: flex; flex-direction: column; gap: 14px; }
.fr-r1__lights { height: 14px; }
.fr-r1__h { font: 600 15px/20px var(--font); margin-top: 8px; }
.fr-r1__note { margin-top: auto; color: var(--label-2); font-size: 12px; line-height: 16px; }
.fr-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.fr-step__btn { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 5px 6px; border-radius: var(--r-control); text-align: left; color: var(--label-2); font: inherit; }
button.fr-step__btn { cursor: pointer; }
button.fr-step__btn:hover { background: var(--sel-unemph); }
.fr-step__mark { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--ctrl-border-soft); display: inline-flex; align-items: center; justify-content: center; font: 600 11px/1 var(--font); flex: none; color: var(--label-2); }
.fr-step.is-current .fr-step__btn { color: var(--label); font-weight: 600; }
.fr-step.is-current .fr-step__mark { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; }
.fr-step.is-done .fr-step__mark { color: var(--success); border-color: var(--success); }
.fr-step.is-done .fr-step__btn, .fr-step.is-skipped .fr-step__btn { color: var(--label); }
.fr-step.is-error .fr-step__mark { color: var(--error); border-color: var(--error); }
.fr-step__label { flex: 1 1 auto; overflow-wrap: anywhere; }
.fr-ring { width: 14px; height: 14px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--sel-unemph) 0); flex: none; -webkit-mask: radial-gradient(circle, transparent 3.5px, #000 4px); mask: radial-gradient(circle, transparent 3.5px, #000 4px); }
.fr-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.fr-r2 { flex: 1 1 auto; overflow: auto; padding: 28px 28px 20px; display: grid; gap: 14px; align-content: start; }
.fr-title { font: 600 22px/28px var(--font-display); }
.fr-title.t-large { font: 700 26px/32px var(--font-display); }
.fr-title:focus { outline: none; }
.fr-p { color: var(--label-2); max-width: 62ch; }
.fr-hint { color: var(--label-3); font-size: 12px; }
.fr-list { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 10px; }
.fr-list li { display: flex; gap: 10px; align-items: center; }
.fr-list .np-ic { color: var(--accent-text); }
.fr-r3 { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-top: 1px solid var(--sep); background: var(--win-bg); flex-wrap: wrap; }
.fr-r3__env { color: var(--label-3); font-size: 12px; }
.fr-models { padding: 4px 14px; }
.fr-model { padding: 8px 0; border-top: 1px solid var(--sep); display: grid; gap: 4px; }
.fr-model:first-child { border-top: 0; }
.fr-model__bar { display: flex; align-items: center; gap: 10px; }
.fr-model__bar .np-progress { width: auto; flex: 1 1 auto; }
.fr-model[data-state="failed"] .np-progress__fill { background: var(--error); }
.fr-model__pct { width: 86px; color: var(--label-2); font-size: 12px; }
.fr-models__foot { display: flex; align-items: center; padding: 8px 0; border-top: 1px solid var(--sep); color: var(--label-2); }
.fr-waitline { display: flex; gap: 6px; align-items: center; color: var(--label-2); }
.fr-perms { display: grid; gap: 8px; }
.fr-perm { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--sep); border-radius: var(--r-row); background: var(--card-bg); flex-wrap: wrap; }
.fr-perm__icon { padding-top: 1px; color: var(--label-3); display: inline-flex; }
.fr-perm.is-granted .fr-perm__icon { color: var(--success); }
.fr-perm.is-denied .fr-perm__icon, .fr-perm.is-missing .fr-perm__icon { color: var(--warning); }
.fr-perm__main { flex: 1 1 220px; min-width: 0; display: grid; gap: 2px; }
.fr-perm__name { font-weight: 600; }
.fr-perm__word { color: var(--label-2); }
.fr-perm__why { color: var(--label-2); font-size: 12px; }
.fr-perm__how { color: var(--label-3); font-size: 12px; }
.fr-perm__meter { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--success); }
.fr-perm__act { flex: none; }
.fr-st { border: 1px solid var(--sep); border-radius: var(--r-card); padding: 12px 14px; display: grid; gap: 10px; background: var(--card-bg); }
.fr-st__head { display: flex; align-items: center; gap: 10px; }
.fr-st__title { font-weight: 600; }
.fr-st__passed { display: inline-flex; gap: 5px; align-items: center; color: var(--success); font-weight: 600; }
.fr-st__meters { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.fr-st__meter { display: inline-flex; align-items: center; gap: 8px; }
.fr-st__ml { width: 48px; color: var(--label-2); font-size: 12px; }
.fr-st__live { font-size: 13px; min-height: 18px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.fr-st__prog { display: flex; align-items: center; gap: 8px; color: var(--label-2); font-size: 12px; }
.fr-st__fail { display: flex; align-items: center; gap: 8px; color: var(--warning); font-size: 12px; flex-wrap: wrap; }
.fr-st__fail span { color: var(--label); }
.fr-st__results { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.fr-st__res { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; }
.fr-st__res.is-ok .np-ic { color: var(--success); }
.fr-st__res.is-info .np-ic { color: var(--accent-text); }
.fr-st__res.is-warn .np-ic { color: var(--warning); }
.fr-st__details { font-size: 12px; color: var(--label-2); }
.fr-st__actions { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.fr-st__clip { display: flex; align-items: center; gap: 10px; }
.fr-st__hint { font-size: 11px; color: var(--label-3); line-height: 14px; }
.fr-row { display: flex; align-items: center; gap: 10px; }
.fr-dp { display: grid; gap: 14px; }
.fr-dp__draw { position: relative; height: 132px; width: 384px; max-width: 100%; }
.fr-dp__screen { position: absolute; border: 1px solid var(--ctrl-border-soft); border-radius: var(--r-control); background: var(--sel-unemph); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--label-2); cursor: pointer; padding: 4px; }
.fr-dp__screen:hover { border-color: var(--ctrl-border); }
.fr-dp__screen.is-sel { border: 2px solid var(--accent); color: var(--label); }
.fr-dp__name { font-weight: 600; text-align: center; overflow: hidden; text-overflow: ellipsis; max-width: 100%; white-space: nowrap; }
.fr-dp__check { position: absolute; top: 4px; right: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-fill); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
.fr-dp__callapp { font-size: 10px; color: var(--label-3); }
.fr-dp__one { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.fr-dp__one .fr-dp__screen { position: relative; width: 180px; height: 116px; cursor: default; }
.fr-dp__float { position: absolute; right: 8px; top: 10px; width: 34px; height: 64px; border-radius: var(--r-tag); background: var(--card-bg); border: 1px solid var(--accent); }
.fr-dp__note { color: var(--label-2); max-width: 40ch; font-size: 12px; }
.fr-creds { padding: 4px 14px; }
.fr-cred { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--sep); flex-wrap: wrap; }
.fr-cred:first-child { border-top: 0; }
.fr-cred__label { width: 130px; flex: none; }
.fr-cred__ctl { display: flex; align-items: flex-start; gap: 8px; flex: 1 1 260px; min-width: 0; }
.fr-cred__field { flex: 1 1 auto; }
