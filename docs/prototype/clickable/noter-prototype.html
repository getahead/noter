      html`<div class="cw-cstrip__state" data-region="FP-C1">${paused ? html`${C.recordingIndicator({ variant: 'dot', status: 'paused', clock: false })}<span class="np-tnum">Paused 3 min</span>` : C.recordingIndicator({ variant: 'dot' })}${C.modeIndicator({ variant: 'glyph', key: 'strip' })}</div>
      ${off ? '' : html`<div class="cw-cstrip__card" data-region="FP-C2">${L.muted ? html`<span class="np-muted">Copilot muted</span>` : top ? html`${C.copilotCard(top, { variant: 'peek' })}<span class="cw-cstrip__hover">${P.iconButton('pin', { label: 'Pin', size: 'inline', action: ['cw.pin', { id: top.id }] })}${P.iconButton('x', { label: 'Dismiss', size: 'inline', action: ['cw.cardDismiss', { id: top.id }] })}</span>` : html`<span class="np-muted cw-peek__text">Listening. Cards appear when there is something worth asking</span>`}</div>`}
      <div class="cw-cstrip__ctl" data-region="FP-C3">${off ? '' : P.badge(String(L.cards.length), { kind: 'count' })}${P.iconButton('chevronDown', { label: 'Expand Panel', size: 'toolbar', action: ['cw.layout', { layout: 'floating' }] })}</div>`);
  };

  /* ---------- 35. Person picker ----------
     opts: {key, value, variant: inline|popover|merge, exclude, callId, confirmLabel, confirmAction, scope} */
  const pickerGroups = (q, exclude) => {
    const call = D.call('c-live');
    const fold = (s) => String(s).toLowerCase().replace(/ё/g, 'е').replace(/ß/g, 'ss');
    const match = (p) => !q || [p.name, p.short].concat(p.aliases || []).some((n) => fold(n).includes(fold(q)));
    const people = D.people.filter((p) => !p.you && !(exclude || []).includes(p.id) && match(p));
    const inCall = people.filter((p) => call.people.includes(p.id));
    const others = people.filter((p) => !call.people.includes(p.id));
    return [{ header: 'In this call', list: inCall, src: 'from the invite' }, { header: 'Recent people', list: others, src: 'recent calls' }].filter((g) => g.list.length);
  };
  C.personPicker = (o) => {
    o = o || {};
    const key = o.key || 'pp';
    const S = NP.local('pp-' + key, { q: '', sel: null, newMode: false, name: '', email: '', role: '', err: null });
    const variant = o.variant || 'popover';
    if (S.newMode) {
      const dup = /^lena/i.test(S.name.trim()) ? D.people.find((p) => p.id === 'p-lena') : null;
      return comp('person-picker', { variant, state: S.err ? 'name-missing' : dup ? 'duplicate-found' : 'new-person-form', cls: 'cw-pp cw-pp--form' },
        html`<div class="cw-pp__formtitle t-headline">New person</div>
        <label class="cw-pp__lbl">Name ${P.textField({ id: 'pp-' + key + '-name', value: S.name, bind: 'local.pp-' + key + '.name', live: true, invalid: !!S.err, message: S.err, ariaLabel: 'Name' })}</label>
        <label class="cw-pp__lbl">Email ${P.textField({ id: 'pp-' + key + '-email', value: S.email, bind: 'local.pp-' + key + '.email', placeholder: 'name@company.com', ariaLabel: 'Email' })}</label>
        <label class="cw-pp__lbl">Role ${P.textField({ id: 'pp-' + key + '-role', value: S.role, bind: 'local.pp-' + key + '.role', placeholder: 'Designer', ariaLabel: 'Role' })}</label>
        ${dup ? html`<div class="cw-pp__dup">${icon('info', { size: 13 })}<span>${dup.short} (${dup.role}) is already in your people.</span><span class="cw-pp__dupacts">${P.button('Use ' + dup.short, { size: 'small', action: ['cw.ppPick', Object.assign({}, o.pickArgs || {}, { key, id: dup.id })] })}${P.button('Create Anyway', { size: 'small', variant: 'quiet', action: ['cw.ppCreate', Object.assign({}, o.pickArgs || {}, { key, force: true })] })}</span></div>` : ''}
        <div class="cw-pp__foot">${P.button('Back', { action: ['cw.ppBack', { key }] })}<span class="np-tb__spacer"></span>${P.button(o.createLabel || 'Create and Name', { variant: 'primary', action: ['cw.ppCreate', Object.assign({}, o.pickArgs || {}, { key })] })}</div>`);
    }
    const groups = pickerGroups(S.q, o.exclude);
    const none = S.q && !groups.length;
    if (variant === 'field' || o.as === 'field') {
      /* Field variant: a plain field; suggestions open only while typing; a pick runs o.onPick with o.args + {value} */
      const cur = o.value ? D.person(o.value) : null;
      return comp('person-picker', { variant, state: none ? 'no-match' : S.q ? 'suggestions-open' : cur ? 'chosen' : 'empty', cls: 'cw-pp cw-pp--field' },
        html`${P.textField({ id: 'pp-' + key + '-q', placeholder: cur ? cur.short : (o.placeholder || 'Name…'), value: S.q, bind: 'local.pp-' + key + '.q', live: true, ariaLabel: 'Person', attrs: { role: 'combobox', 'aria-expanded': String(!!S.q) } })}
        ${S.q ? html`<div class="cw-pp__list cw-pp__list--drop" role="listbox" aria-label="People">${none ? html`<div class="cw-pp__none">No one called “${S.q}”</div>` : groups.map((g) => html`<div class="cw-pp__hdr">${g.header}</div>${g.list.slice(0, 5).map((p) => html`<button type="button" role="option" class="cw-pp__opt" ${act('cw.ppFieldPick', { key, onPick: o.onPick || null, args: Object.assign({}, o.args || {}, { value: p.id }), person: p.id })}><span class="np-person__ini">${p.initials}</span><span class="cw-pp__optmain"><span class="cw-pp__name" lang="${p.lang || 'en'}">${p.short}</span><span class="cw-pp__role">${p.role} · ${g.src}</span></span></button>`)}`)}</div>` : ''}`);
    }
    return comp('person-picker', { variant, state: none ? 'no-match' : S.q ? 'typing' : 'empty', cls: 'cw-pp' },
      html`${P.textField({ id: 'pp-' + key + '-q', placeholder: 'Name…', value: S.q, bind: 'local.pp-' + key + '.q', live: true, ariaLabel: 'Person', attrs: { role: 'combobox', 'aria-expanded': 'true' } })}
      <div class="cw-pp__list" role="listbox" aria-label="People">
        ${none ? html`<div class="cw-pp__none">No one called “${S.q}”</div>` : groups.map((g) => html`<div class="cw-pp__hdr">${g.header}</div>${g.list.slice(0, 8).map((p) => html`<button type="button" role="option" class="cw-pp__opt${S.sel === p.id ? ' is-sel' : ''}" aria-selected="${String(S.sel === p.id)}" ${act('cw.ppSelect', { key, id: p.id })}><span class="np-person__ini">${p.initials}</span><span class="cw-pp__optmain"><span class="cw-pp__name" lang="${p.lang || 'en'}">${p.short}</span><span class="cw-pp__role">${p.role} · ${g.src}</span></span></button>`)}`)}
        ${variant === 'merge' ? '' : html`<button type="button" class="cw-pp__opt cw-pp__new" ${act('cw.ppNew', { key })}>${icon('plus', { size: 12 })}${S.q ? `New Person “${S.q}”…` : 'New Person…'}</button>`}
      </div>`);
  };

  NP.on('cw.ppFieldPick', (a) => {
    const S = NP.local('pp-' + a.key); S.q = ''; S.sel = a.person;
    if (a.onPick && NP.actions[a.onPick]) NP.actions[a.onPick](a.args || {});
  });

  /* ---------- popover overlays ---------- */
  NP.overlay('speaker-rename', {
    width: 320,
    render: (p) => {
      const key = 'rename';
      const S = NP.local('pp-' + key, { q: '', sel: null, newMode: false, name: '', email: '', role: '', err: null });
      const L = NP.local('cw');
      const scope = L.renameScope || 'whole';
      const sel = S.sel ? D.person(S.sel) : null;
      return html`<div class="np-pop__body">
        <div class="np-pop__title">Rename ${p.name}</div>
        ${C.personPicker({ key, variant: 'popover', pickArgs: { speaker: p.speaker, where: p.where } })}
        ${S.newMode ? '' : html`${P.radioGroup('cw-scope', [{ value: 'whole', label: 'Whole call' }, { value: 'line', label: 'Only this line' }], scope, { bind: 'local.cw.renameScope', label: 'Scope' })}
        ${sel && sel.voiceProfile ? P.checkbox('Also update the voice profile', true, {}) : ''}
        <div class="np-pop__actions" style="justify-content:flex-end">${P.button('Rename', { variant: 'primary', disabled: !sel, action: ['cw.ppPick', { key, id: S.sel, speaker: p.speaker, where: p.where }] })}</div>`}
      </div>`;
    },
  });
  NP.overlay('person-picker', {
    width: 320,
    render: (p) => {
      const key = 'pick';
      const S = NP.local('pp-' + key, { q: '', sel: null, newMode: false, name: '', email: '', role: '', err: null });
      const owner = !!p.itemId;
      return html`<div class="np-pop__body">
        <div class="np-pop__title">${owner ? 'Owner' : 'Name ' + (p.speaker || 'speaker')}</div>
        ${C.personPicker({ key, variant: 'popover', pickArgs: { speaker: p.speaker, itemId: p.itemId, where: 'main' } })}
        ${S.newMode ? '' : html`<div class="np-pop__actions" style="justify-content:flex-end">${P.button(owner ? 'Set Owner' : 'Name', { variant: 'primary', disabled: !S.sel, action: ['cw.ppPick', { key, id: S.sel, speaker: p.speaker, itemId: p.itemId, where: 'main' }] })}</div>`}
      </div>`;
    },
  });
  /* 12. Term fix popover */
  NP.overlay('term-fix', {
    width: 320,
    render: (p) => {
      const L = NP.local('cw');
      const v = L.termValue != null ? L.termValue : (p.word || '');
      const langName = { EN: 'English', RU: 'Russian', DE: 'German' }[p.lang] || 'English';
      return comp('term-fix-popover', { variant: p.where === 'main' ? 'stored' : 'live', state: v.trim() ? 'default' : 'invalid', cls: 'np-pop__body' },
        html`<div class="np-pop__title">Fix term</div>
        <div class="np-muted" lang="${(p.lang || 'en').toLowerCase()}">“${p.orig || p.word}”</div>
        <label class="cw-pp__lbl">Correct term ${P.textField({ id: 'cw-term-field', value: v, bind: 'local.cw.termValue', live: true, ariaLabel: 'Correct term' })}</label>
        ${/notif/i.test(v) ? html`<div class="cw-term__sugg np-dim">${icon('doc', { size: 11 })} Glossary: notification service · нотификейшн сервис · “notifikeyshn servis”</div>` : ''}
        <label class="cw-pp__lbl">Language ${P.popup(['English', 'Russian', 'German'], langName, { label: 'Language' })}</label>
        ${P.checkbox('Add to glossary', true, {})}
        <div class="np-dim">${icon('info', { size: 11 })} Older calls get a proposal in Activity</div>
        <div class="np-pop__actions" style="justify-content:flex-end">${P.button('Fix', { variant: 'primary', disabled: !v.trim(), action: ['cw.termApply', { t: p.t, value: v }] })}</div>`);
    },
  });
  NP.overlay('span-preview', {
    width: 340,
    render: (p) => html`<div class="np-pop__body">
      <div class="np-pop__title">${icon('history', { size: 13 })} ${p.label}</div>
      <div class="cw-span">
        <div class="cw-span__row"><span class="np-tnum np-dim">00:41:02</span> <b>Dmitri S.</b> <span lang="ru">Давайте все события drawer пускать через notification service.</span></div>
        <div class="cw-span__row np-hl-evidence"><span class="np-tnum np-dim">00:41:10</span> <b>You</b> Agreed, drawer events go through the notification service.</div>
      </div>
      <div class="np-pop__actions">${P.button('Open in Noter', { size: 'small', action: ['nav.go', { screen: p.screen || 'call-page', params: p.params || {} }] })}</div>
    </div>`,
  });
})();

;
/* =====================================================================
   Group B — Shell — Call window (cpt-noter-component-shell-call-window)
   with Call screen (dedicated layout) and Floating panel (floating
   layout + collapsed strip). Surface key: 'call'.
   ===================================================================== */
(function () {
  const { html, raw, attrs, act, comp, region, icon, P, data: D, state } = NP;
  const C = NP.C;
  const clone = (x) => JSON.parse(JSON.stringify(x));

  const init = () => ({
    cards: clone(D.cards),
    earlier: clone(D.earlierCards).concat(clone(D.cwMoreEarlier)),
    earlierOpen: false,
    pinned: clone(D.cwPinned),
    held: [],
    extraRows: [],
    expanded: {},
    askOpen: false, askText: '',
    notice: null, discardConfirm: false, countdown: 10, countdownPaused: false,
    closing: null, closed: null, hidden: null,
    banner: null,               // audio-lost | stalled | disk | second-source
    copilotBanner: null,        // switched-local | budget | muted | sensitive-off
    copilot: 'council',         // council | single | off
    muted: false, budget: 'normal', keyTaken: false, keyTakenSeen: false, dismissKeys: false, panelKey: false,
    micOnly: false,
    route: 'headphones', playback: null,
    detached: false, newLines: 12,
    newCall: false, waiting: false,
    firstFloat: true, showTranscript: false, fpHeight: 560, showAllCards: false,
    lastCardAction: null, latency: true,
    droppedChips: {}, pinnedChips: {},
  });
  const L = () => NP.local('cw', init);

  const layout = () => state.rec.layout || 'dedicated';
  const segments = () => {
    const l = L();
    if (l.newCall) return [];
    const base = D.segments;
    const hyp = base.filter((s) => s.hypothesis);
    const rest = base.filter((s) => !s.hypothesis);
    return rest.concat(l.extraRows).concat(state.rec.status === 'paused' || l.closing ? [] : hyp);
  };
  const title = () => (L().newCall ? '1:1 with Anna K.' : D.call(state.rec.callId).title);
  const participants = () => (L().newCall ? ['p-anna', 'p-you'] : ['p-anna', 'p-pavel', 'p-dmitri', 'Speaker 3', 'p-you'].filter((p) => !(p === 'Speaker 3' && !D.segments.some((s) => s.speaker === 'Speaker 3'))));
  const clockNow = () => NP.fmtClock(NP.elapsedMs(), false);

  /* ---------------- shared header pieces ---------------- */
  const shareGlyph = () => html`<span class="cw-shield"${attrs({ 'data-component': P.PRIM, 'data-primitive': 'icon-button', 'data-variant': 'glyph', title: 'Hidden from Teams, Meet and window-filtered Zoom shares. Share a window, not a display.', role: 'img', 'aria-label': 'Hidden from window shares' })}>${icon('shield', { size: 15 })}</span>`;
  const moreMenu = (anchor) => P.pulldown('More', [
    { label: 'Make This Call Sensitive', action: ['call.makeSensitive'], disabled: state.rec.mode === 'Sensitive · local' },
    { divider: true },
    { label: 'Open in Noter', action: ['cw.openInNoter'] },
    { label: layout() === 'dedicated' ? 'Use Floating Panel' : 'Open Call Screen on Display 2', action: ['cw.layout', { layout: layout() === 'dedicated' ? 'floating' : 'dedicated' }] },
  ], { iconOnly: true, anchorId: anchor, ariaLabel: 'More', size: 'toolbar', help: 'More' });
  const muteMenu = (anchor, floating) => {

      { label: L().muted ? 'Unmute Copilot' : 'Mute Copilot for 10 Minutes', kbd: '⌃⌥⌘K', action: ['cw.mute'] },
      { label: 'Mute Copilot for This Call', action: ['cw.mute'] },
      { label: 'Mute Copilot for All Planning Calls', action: ['cw.mute'] },
      { divider: true },
      { header: 'Agents' },
    ].concat(D.agents.filter((a) => a.enabled).map((a) => ({ label: a.name, checked: !(L().mutedAgents || {})[a.id], action: ['cw.muteAgent', { id: a.id, name: a.name }] })));
    if (floating) items.push({ divider: true }, { label: L().showTranscript ? 'Hide Transcript' : 'Show Transcript', checked: L().showTranscript, action: ['cw.toggleTranscript'] });
    return floating
      ? P.pulldown('Mute', items, { iconOnly: true, icon: 'mute', anchorId: anchor, ariaLabel: 'Mute', size: 'inline', help: 'Mute' })
      : P.pulldown('Mute', items, { anchorId: anchor, size: 'small' });
  };

  const transcriptBanner = (compact) => {
    const b = L().banner;
    if (!b) return '';
    const map = {
      'audio-lost': { severity: 'error', text: 'System audio lost', actions: [{ label: 'Open System Settings…', action: ['proto.flash', { key: 'proto', text: 'Opens System Settings › Privacy & Security › Screen & System Audio Recording' }] }] },
      stalled: { severity: 'error', text: 'Transcription stalled · restarting', actions: [] },
      disk: { severity: 'warning', text: '2 GB free on this Mac. Recording continues.', actions: [{ label: 'Delete Old Audio…', action: ['cw.deleteOldAudio'] }] },
      'second-source': { severity: 'warning', text: 'Slack is also playing audio', actions: [{ label: 'Exclude Slack', action: ['cw.bannerClose'] }, { label: 'Keep', action: ['cw.bannerClose'] }] },
    };
    return C.inlineBanner(Object.assign({ compact, region: compact ? 'FP-R3' : 'CS-R3', dismissible: false }, map[b]));
  };
  const copilotBanner = (compact) => {
    const l = L();
    const b = l.muted ? 'muted' : l.copilotBanner;
    if (!b) return '';
    const map = {
      'switched-local': { severity: 'degraded', text: 'Switched to local · trying Claude again in 10 min', actions: [] },
      budget: { severity: 'degraded', text: 'Copilot paused: budget', actions: [{ label: 'Raise Cap to $2', action: ['cw.raiseCap'] }] },
      muted: { severity: 'info', text: 'Copilot muted for 10 min', actions: [{ label: 'Unmute', action: ['cw.mute'] }], dismissible: false },
      'sensitive-off': { severity: 'warning', text: 'Copilot off for this sensitive call (no local model)', actions: [] },
    };
    return C.inlineBanner(Object.assign({ compact, region: compact ? 'FP-R3' : 'CS-R4d', dismissible: false }, map[b]));
  };

  /* ---------------- dedicated layout: Call screen ---------------- */
  const callScreen = () => {
    const l = L();
    const off = l.copilot === 'off';
    const single = l.copilot === 'single';
    const segs = segments();
    const paused = state.rec.status === 'paused';
    const recStatus = l.closing ? 'stopped' : paused ? 'paused' : l.micOnly ? 'mic-only' : 'recording';
    const langs = l.newCall ? ['EN'] : ['EN', 'RU', 'DE'];
    const header = region('CS-R1', { cls: 'cs-r1', tag: 'header', label: 'Call header' }, html`
      <div class="cs-r1__line">
        ${C.recordingIndicator({ variant: 'dot', status: recStatus, clock: false })}
        <h2 class="cs-title t-title2" title="${title()}">${title()}</h2>
        <span class="np-tb__spacer"></span>
        ${shareGlyph()}
        ${P.iconButton('eyeSlash', { label: 'Hide Noter for Presenting', help: 'Hide Noter for Presenting (⌃⌥⌘0)', action: ['cw.hide', { how: 'presenting' }] })}
        ${moreMenu('cs-more')}
      </div>
      <div class="cs-r1__line cs-r1__people">
        ${participants().map((p) => C.personChip(p, { variant: 'call-window' }))}
        <span class="np-tb__spacer"></span>
        ${langs.map((c) => C.languageTag(c, { variant: 'call' }))}
      </div>
      ${l.latency && !l.newCall ? html`<div class="cs-latency np-dim np-tnum">Hypothesis 1.4 s · confirmed 3.1 s</div>` : ''}`);
    const transcript = html`<div class="cs-left">
      ${header}
      ${transcriptBanner(false) ? region('CS-R3', { cls: 'cs-r3' }, transcriptBanner(false)) : ''}
      ${region('CS-R2', { cls: 'cs-r2', label: 'Transcript' }, C.transcriptView({ variant: 'live', key: 'cw-live', callId: state.rec.callId, segments: segs, waiting: l.newCall || l.waiting, detached: l.detached, newLines: l.newLines, route: l.route, playingAt: l.playback && l.playback.t }))}
      ${l.playback ? region('CS-R2b', { cls: 'cs-r2b' }, C.playbackBar({ variant: 'live-headphones', at: l.playback.t, speaker: l.playback.speaker, key: 'cw', stopped: l.playback.stopped })) : ''}
    </div>`;
    const right = off ? '' : html`<div class="cs-right">
      ${region('CS-R4a', { cls: 'cs-r4a', tag: 'header', label: 'Council header' }, html`
        <div class="cs-r1__line"><h2 class="t-headline">${single ? 'Copilot' : 'Council · ' + D.agents.filter((a) => a.enabled).length + ' agents'}</h2><span class="np-tb__spacer"></span>${C.modeIndicator({ variant: 'call-header' })}</div>
        <div class="cs-r1__line">${C.cardLegend()}<span class="np-tb__spacer"></span>${P.button('Ask…', { size: 'small', kbd: '⌃⌥⌘A', action: ['cw.ask'] })}${muteMenu('cs-mute', false)}</div>`)}
      ${l.askOpen ? region('CS-R4b', { cls: 'cs-r4b' }, P.textField({ id: 'cw-ask', placeholder: 'Ask about this call…', bind: 'local.cw.askText', value: l.askText, enter: 'cw.askSend', ariaLabel: 'Ask about this call' })) : ''}
      ${copilotBanner(false) ? region('CS-R4d', { cls: 'cs-r4d' }, copilotBanner(false)) : ''}
      ${region('CS-R4c', { cls: 'cs-r4c', label: 'Cards', attrs: { 'data-proto-scroll': 'cw-cards' } }, C.copilotCardStack({ variant: single ? 'single-agent' : 'dedicated', cards: l.muted ? [] : l.cards, held: l.held.length, single, muted: l.muted, off: l.copilotBanner === 'sensitive-off', showMode: true }))}
      ${region('CS-R4e', { cls: 'cs-r4e', label: 'In context' }, html`
        <div class="cs-r4e__chips"><span class="np-dim">In context:</span>${D.contextChips.map((c) => C.contextChip(c))}</div>
        ${comp('copilot-card-stack', { variant: 'earlier-cards', state: l.earlierOpen ? 'expanded' : 'collapsed', cls: 'cs-earlier' }, html`${P.disclosure('Earlier cards (' + l.earlier.length + ')', l.earlierOpen, { action: ['cw.earlier'] })}
          ${l.earlierOpen ? html`<div class="cs-earlier__list">${l.earlier.map((c) => html`<div class="cs-earlier__row">${C.copilotCard(c, { variant: 'read-only', single })}${P.button('Pin', { size: 'small', action: ['cw.pinEarlier', { id: c.id }] })}</div>`)}</div>` : ''}`)}`)}
    </div>`;
    return comp('cpt-noter-component-screen-call-screen', { cls: 'cs' + (off ? ' is-copilot-off' : ''), state: l.closing ? 'closing' : paused ? 'paused' : 'recording', variant: off ? 'copilot-off' : single ? 'single-agent' : 'council' },
      html`${l.notice ? region('CS-R0', { cls: 'cs-r0' }, C.captureNotice({ variant: l.notice, layout: 'dedicated' })) : ''}
      <div class="cs-cols">${transcript}${right}</div>
      ${C.callStatusStrip({ variant: off ? 'copilot-off' : 'dedicated' })}`);
  };

  /* ---------------- floating layout ---------------- */
  const floatingPanel = () => {
    const l = L();
    const off = l.copilot === 'off';
    const single = l.copilot === 'single';
    const h = l.fpHeight;
    const maxCards = h < 380 ? 1 : h < 600 ? 2 : 3;
    const tail = !off && (h >= 680 || l.showTranscript);
    const paused = state.rec.status === 'paused';
    const header = region('FP-R1', { cls: 'fp-r1', tag: 'header', label: 'Panel header' }, html`
      ${C.recordingIndicator({ variant: 'dot', status: paused ? 'paused' : l.micOnly ? 'mic-only' : 'recording', clock: false })}
      <span class="fp-title" title="${title()}">${title()}</span>
      <span class="np-tnum fp-clock">${NP.clock(false)}</span>
      ${shareGlyph()}
      ${l.secondDisplay !== false ? P.iconButton('displays', { label: 'Move to Display 2', size: 'inline', action: ['cw.layout', { layout: 'dedicated' }] }) : ''}
      ${P.iconButton('eyeSlash', { label: 'Hide Noter for Presenting', size: 'inline', help: 'Hide Noter for Presenting (⌃⌥⌘0)', action: ['cw.hide', { how: 'presenting' }] })}
      ${moreMenu('fp-more')}
      ${P.iconButton('chevronUp', { label: 'Collapse Panel', size: 'inline', action: ['cw.layout', { layout: 'collapsed' }] })}
      ${P.iconButton('x', { label: 'Hide', size: 'inline', help: 'Hide to the menu bar', action: ['cw.hide', { how: 'hide' }] })}`);
    const notice = l.notice ? region('FP-R0', { cls: 'fp-r0' }, C.captureNotice({ variant: l.notice, layout: 'floating' })) : '';
    const modeLine = off || l.notice ? '' : region('FP-R2', { cls: 'fp-r2' }, html`<div class="fp-r2__line"><b>${single ? 'Copilot' : 'Council'}</b>${C.modeIndicator({ variant: 'floating' })}<span class="np-tb__spacer"></span>${muteMenu('fp-mute', true)}</div><div class="fp-r2__legend">${C.cardLegend()}</div>`);
    const firstInfo = l.firstFloat && !l.notice ? C.inlineBanner({ id: 'fp-share', severity: 'info', compact: true, region: 'FP-R3', text: raw('Hidden from window shares only. Before sharing your whole screen, press ' + P.kbd('⌃⌥⌘0') + '.'), actions: [{ label: 'Got It', action: ['cw.gotIt'] }], dismissible: false }) : '';
    const banners = l.notice ? '' : html`${transcriptBanner(true)}${copilotBanner(true)}${firstInfo}`;
    const cards = off ? '' : region('FP-R4', { cls: 'fp-r4', label: 'Cards', attrs: { 'data-proto-scroll': 'fp-cards' } }, html`
      ${l.askOpen ? html`<div class="fp-ask">${P.textField({ id: 'cw-ask', placeholder: 'Ask about this call…', bind: 'local.cw.askText', value: l.askText, enter: 'cw.askSend', ariaLabel: 'Ask about this call' })}</div>` : ''}
      ${C.copilotCardStack({ variant: single ? 'single-agent' : 'compact', cards: l.muted ? [] : l.cards, held: l.held.length, maxVisible: maxCards, showAll: l.showAllCards, single, muted: l.muted })}`);
    const tailRegion = tail ? region('FP-R5', { cls: 'fp-r5' }, l.playback ? C.playbackBar({ variant: 'live-headphones', at: l.playback.t, speaker: l.playback.speaker, key: 'cw' }) : C.transcriptView({ variant: 'tail', key: 'cw-tail', segments: segments(), tailLines: 3 })) : '';
    const offBody = off ? region('FP-R5', { cls: 'fp-r5 fp-r5--full' }, C.transcriptView({ variant: 'tail', key: 'cw-tail', segments: segments(), tailLines: 8 })) : '';
    return comp('cpt-noter-component-screen-floating-panel', { cls: 'fp', state: paused ? 'paused' : l.notice ? 'notice' : 'recording', variant: off ? 'copilot-off' : single ? 'single-agent' : 'council', attrs: { style: `height:${h}px` } },
      html`${header}${notice}${modeLine}${banners ? html`<div class="fp-r3" data-region="FP-R3">${banners}</div>` : ''}${cards}${tailRegion}${offBody}
      ${region('FP-R6', { cls: 'fp-r6', tag: 'footer' }, C.callStatusStrip({ variant: off ? 'copilot-off' : 'compact' }))}`);
  };

  /* ---------------- closing state (whole window) ---------------- */
  const closingView = (fl) => {
    const l = L();
    return html`<div class="cw-closing${fl ? ' is-floating' : ''}">
      ${C.captureNotice({ variant: l.closing === 'auto' ? 'stopped-automatically' : 'stopped-by-you', layout: fl ? 'floating' : 'dedicated' })}
      <p class="np-dim cw-closing__hint">The panel closes in 10 s. Continue Recording works for 5 minutes, also from the menu bar.</p>
    </div>`;
  };

  /* ---------------- desk: prototype controls + surface ---------------- */
  const protoBar = () => {
    const l = L();
    const lay = layout();
    const btn = (label, on, action, args) => html`<button type="button" class="cw-proto__btn${on ? ' is-on' : ''}" aria-pressed="${String(!!on)}" ${act(action, args)}>${label}</button>`;
    return html`<div class="cw-proto" data-proto-chrome>
      <span class="cw-proto__lbl">Layout</span>
      ${btn('Call screen · display 2', lay === 'dedicated', 'cw.layout', { layout: 'dedicated' })}${btn('Floating panel', lay === 'floating', 'cw.layout', { layout: 'floating' })}${btn('Collapsed strip', lay === 'collapsed', 'cw.layout', { layout: 'collapsed' })}
      ${lay === 'floating' ? html`<span class="cw-proto__lbl">Panel height</span>${btn('360', l.fpHeight === 360, 'cw.fpHeight', { h: 360 })}${btn('560', l.fpHeight === 560, 'cw.fpHeight', { h: 560 })}${btn('720', l.fpHeight === 720, 'cw.fpHeight', { h: 720 })}` : ''}
      <span class="cw-proto__lbl">Output</span>${btn('Headphones', l.route === 'headphones', 'cw.route', { route: 'headphones' })}${btn('Speakers', l.route === 'speakers', 'cw.route', { route: 'speakers' })}
      <span class="cw-proto__lbl">Simulate</span>${btn('New card', false, 'cw.simCard')}${btn('Card keys ⌃⌥⌘1–3', false, 'cw.simKey')}${btn('Panel becomes key', l.panelKey, 'cw.panelKey')}
    </div>`;
  };

  const hiddenView = () => {
    const l = L();
    const pres = l.hidden === 'presenting';
    return html`<div class="cw-hidden" data-proto-chrome>
      ${icon(pres ? 'eyeSlash' : 'menubar', { size: 28 })}
      <div class="t-headline">${pres ? 'Noter is hidden for presenting' : 'The panel is hidden to the menu bar'}</div>
      <div class="np-muted">${pres ? 'Every Noter surface is hidden. Capture, transcript and copilot keep running; the card keys are released.' : 'Capture continues. The menu bar keeps the recording state.'}</div>
      <div class="cw-hidden__btns">${P.button(pres ? 'Show Noter Again (⌃⌥⌘0)' : 'Open Call Screen (⌃⌥⌘N)', { variant: 'primary', action: ['cw.unhide'] })}${P.button('Menu Bar', { action: ['surface.show', { surface: 'menubar' }] })}</div>
    </div>`;
  };

  const closedView = () => html`<div class="cw-hidden" data-proto-chrome>
    ${icon('checkCircle', { size: 28 })}
    <div class="t-headline">${L().closed === 'discarded' ? 'Recording discarded' : 'The call window closed'}</div>
    <div class="np-muted">${L().closed === 'discarded' ? 'Nothing was kept.' : 'Outputs are being written; a notification says when the summary is ready.'}</div>
    <div class="cw-hidden__btns">${P.button('Open Main Window', { variant: 'primary', action: ['cw.closedGo'] })}${P.button('Start a New Recording', { action: ['cw.restart'] })}</div>
  </div>`;

  NP.surface('call', {
    label: 'Call window',
    states: [
      { id: 'default', label: 'Recording, three cards' },
      { id: 'listening', label: 'No card yet (listening)' },
      { id: 'held', label: 'Cards held (1 new card)' },
      { id: 'carry', label: 'Carry-forward card' },
      { id: 'single', label: 'Single-agent copilot' },
      { id: 'copilot-off', label: 'Copilot flag off' },
      { id: 'muted', label: 'Copilot muted' },
      { id: 'call-ended', label: 'Call seems to have ended' },
      { id: 'new-meeting', label: 'New meeting started' },
      { id: 'nothing-heard', label: 'Nothing heard yet' },
      { id: 'closing-manual', label: 'Closing after Stop Recording' },
      { id: 'closing-auto', label: 'Closing after automatic stop' },
      { id: 'mic-only', label: 'System audio lost (mic only)' },
      { id: 'stalled', label: 'Transcription stalled' },
      { id: 'disk', label: 'Disk nearly full' },
      { id: 'second-source', label: 'Second audio source' },
      { id: 'switched-local', label: 'Switched to local' },
      { id: 'budget', label: 'Budget near cap, then paused' },
      { id: 'sensitive-off', label: 'Sensitive call, no local model' },
      { id: 'key-taken', label: 'Card key used by another app' },
      { id: 'detached', label: 'Scrolled up (Jump to Live)' },
      { id: 'replay', label: 'Replaying on headphones' },
      { id: 'speakers', label: 'Recording on speakers (replay off)' },
      { id: 'paused', label: 'Paused' },
      { id: 'presenting', label: 'Hidden for presenting' },
      { id: 'unplugged', label: 'Display unplugged → floating' },
      { id: 'collapsed', label: 'Floating, collapsed strip' },
    ],
    onDemo: (id) => {
      const keepLayout = state.rec.layout;
      state.local.cw = init();
      const l = L();
      if (state.rec.status === 'idle' || state.rec.status === 'closing') NP.startRecording();
      if (state.rec.status === 'paused') { state.rec.startedAt += Date.now() - state.rec.pausedAt; state.rec.status = 'recording'; }
      state.rec.mode = 'Cloud, redacted';
      state.rec.layout = keepLayout;
      switch (id) {
        case 'listening': l.cards = []; break;
        case 'held': l.held = clone(D.cwHeldCards); break;
        case 'carry': l.cards = [Object.assign(clone(D.cwCarryForward), { num: 1 }), Object.assign(clone(D.cards[1]), { num: 2 })]; break;
        case 'single': l.copilot = 'single'; break;
        case 'copilot-off': l.copilot = 'off'; break;
        case 'muted': l.muted = true; break;
        case 'call-ended': l.notice = 'call-ended'; l.countdown = 10; break;
        case 'new-meeting': l.notice = 'new-meeting'; break;
        case 'nothing-heard': l.notice = 'nothing-heard'; l.waiting = true; l.cards = []; break;
        case 'closing-manual': l.closing = 'manual'; state.rec.status = 'closing'; break;
        case 'closing-auto': l.closing = 'auto'; state.rec.status = 'closing'; break;
        case 'mic-only': l.micOnly = true; l.banner = 'audio-lost'; l.extraRows.push({ gap: true, t: '00:30:02', text: 'System audio lost 00:30:02–00:30:40' }); break;
        case 'stalled': l.banner = 'stalled'; break;
        case 'disk': l.banner = 'disk'; break;
        case 'second-source': l.banner = 'second-source'; break;
        case 'switched-local': l.copilotBanner = 'switched-local'; state.rec.mode = 'Switched to local'; break;
        case 'budget': l.budget = 'near'; setTimeout(() => { const x = L(); if (x.budget === 'near') { x.budget = 'cap'; x.copilotBanner = 'budget'; NP.render(); } }, 4000); break;
        case 'sensitive-off': state.rec.mode = 'Sensitive · local'; l.copilotBanner = 'sensitive-off'; l.cards = []; break;
        case 'key-taken': l.keyTaken = true; break;
        case 'detached': l.detached = true; break;
        case 'replay': l.playback = { t: '00:19:58', speaker: 'p-anna' }; break;
        case 'speakers': l.route = 'speakers'; break;
        case 'paused': state.rec.status = 'paused'; state.rec.pausedAt = Date.now(); break;
        case 'presenting': l.hidden = 'presenting'; break;
        case 'unplugged': state.rec.layout = 'floating'; NP.flash('cw-proto', 'Display 2 was unplugged: the same window switched to the floating layout. Cards, pins and the transcript position are kept.', 6000); break;
        case 'collapsed': state.rec.layout = 'collapsed'; break;
        default: break;
      }
    },
    render: (ctx) => {
      if (state.rec.status === 'idle' && !L().closed) { NP.startRecording(); }
      const l = L();
      const lay = layout();
      const note = NP.flashed('cw-proto');
      let body;
      if (l.closed) body = closedView();
      else if (l.hidden) body = hiddenView();
      else if (lay === 'dedicated') {
        body = html`<div class="cw-frame cw-frame--dedicated">${NP.shell.window({ component: 'cpt-noter-component-shell-call-window', variant: 'dedicated', state: l.closing ? 'closing' : l.panelKey ? 'key' : 'not-key', titlebar: false, cls: 'cw-win cw-win--dedicated', body: l.closing ? html`<div class="cs cs--closing">${closingView(false)}</div>` : callScreen() })}</div>`;
      } else {
        const collapsed = lay === 'collapsed' && !l.notice;
        const panel = NP.shell.window({ component: 'cpt-noter-component-shell-call-window', variant: collapsed ? 'collapsed' : 'floating', state: l.closing ? 'closing' : l.panelKey ? 'key' : 'not-key', titlebar: false, cls: 'cw-win cw-win--floating' + (collapsed ? ' is-collapsed' : ''), body: l.closing ? closingView(true) : collapsed ? C.collapsedCallStrip() : floatingPanel() });
        body = html`<div class="cw-desktop">
          <div class="cw-callapp" data-proto-chrome aria-hidden="true"><div class="cw-callapp__bar">Microsoft Teams · keeps focus</div><div class="cw-callapp__grid"><span>Anna K.</span><span>Pavel</span><span>Dmitri S.</span><span>Speaker 3</span></div></div>
          <div class="cw-floatwrap${collapsed ? ' is-collapsed' : ''}">${panel}</div>
        </div>`;
      }
      const cap = lay === 'dedicated' ? ' · borderless, fills the visible frame of display 2 (shown scaled), non-activating panel' : lay === 'collapsed' ? ' · collapsed strip, 56 pt high' : ` · floating layout, 420 × ${l.fpHeight} pt, non-activating panel`;
      return html`${NP.shell.caption('Call window', cap)}${protoBar()}${note ? html`<div class="cw-proto-note" data-proto-chrome>${icon('info', { size: 13 })} ${note}</div>` : ''}${body}`;
    },
  });

  /* ---------------- actions ---------------- */
  const pushRow = (row) => { L().extraRows.push(row); };
  const cardById = (id) => L().cards.find((c) => c.id === id);
  const freeNum = () => { const used = L().cards.map((c) => c.num); return [1, 2, 3].find((n) => !used.includes(n)) || 3; };
  const addCard = (card) => {
    const l = L();
    while (l.cards.length > 2) { const old = l.cards.pop(); old.outcome = 'Expired'; l.earlier.unshift(old); }
    card.num = freeNum();
    card.isNew = Date.now();
    l.cards.unshift(card);
  };

  NP.onMany({
    'cw.layout': (a) => { state.rec.layout = a.layout; if (a.layout !== 'floating') L().showAllCards = false; },
    'cw.fpHeight': (a) => { L().fpHeight = a.h; },
    'cw.route': (a) => { const l = L(); l.route = a.route; if (a.route === 'speakers' && l.playback) { l.playback.stopped = true; setTimeout(() => { L().playback = null; NP.render(); }, 3000); } },
    'cw.panelKey': () => { L().panelKey = !L().panelKey; },
    'cw.simCard': () => {
      const l = L();
      const pool = clone(D.cwHeldCards).concat([{ id: 'k5', kind: 'Answer', agent: 'Architect', merged: ['QA lead'], age: 'now', text: 'VSTOR-9912 is open and unassigned; the replay buffer has no estimate yet.', prov: { kind: 'jira', label: 'Jira · looked up ' + new Date().toTimeString().slice(0, 5) } }]);
      const c = pool[(l.simN = (l.simN || 0) + 1) % pool.length]; c.id = c.id + '-' + l.simN;
      l.cards.forEach((x) => { x.age = x.age === 'now' ? '30 s' : x.age === '30 s' || x.age === '45 s' ? '1 min' : x.age; });
      addCard(c);
      if (layout() === 'collapsed') NP.flash('cw-proto', 'The strip cross-fades to the new card.', 2500);
    },
    'cw.simKey': () => {
      const l = L();
      const card = l.cards.find((c) => c.num === 2);
      if (card) NP.actions['cw.pin']({ id: card.id, byKey: true });
      else { NP.flash('call-status', 'No card 2', 2000); l.lastCardAction = null; }
    },
    'cw.pin': (a) => {
      const l = L();
      const c = cardById(a.id) || l.held.find((x) => x.id === a.id);
      if (!c) { NP.flash('call-status', 'No card ' + (a.num || ''), 2000); return; }
      l.cards = l.cards.filter((x) => x.id !== c.id);
      l.pinned.push({ id: 'pin-' + c.id, text: c.text.replace(/\.$/, ''), owner: 'p-you' });
      l.lastCardAction = { kind: 'pin', card: c };
      const short = c.text.length > 40 ? c.text.slice(0, 38) + '…' : c.text;
      NP.flash('call-status', 'Pinned card ' + c.num + ': ' + short, 3000);
      if (layout() === 'collapsed') l.layoutBeforeTemp = null;
    },
    'cw.cardDismiss': (a) => {
      const l = L();
      const c = cardById(a.id); if (!c) return;
      l.cards = l.cards.filter((x) => x.id !== c.id);
      c.outcome = 'Dismissed'; l.earlier.unshift(c);
      l.lastCardAction = { kind: 'dismiss', card: c };
      NP.flash('call-status', (a.text || 'Dismissed card ' + c.num), 3000);
      if (l.tempExpanded) { l.tempExpanded = false; state.rec.layout = 'collapsed'; }
    },
    'cw.undoCard': () => {
      const l = L(); const la = l.lastCardAction; if (!la) return;
      if (la.kind === 'pin') l.pinned = l.pinned.filter((p) => p.id !== 'pin-' + la.card.id);
      if (la.kind === 'dismiss') l.earlier = l.earlier.filter((x) => x.id !== la.card.id);
      l.cards.unshift(la.card); l.cards.sort((x, y) => x.num - y.num);
      l.lastCardAction = null;
      NP.flash('call-status', 'Undone', 2000);
    },
    'cw.cardExpand': (a) => { const l = L(); l.expanded[a.id] = !l.expanded[a.id]; },

    return comp('action-item-row', { variant, state, cls: 'it-row it-row--full' + (done ? ' is-done' : '') + (NP.local('call-page').focus === it.id ? ' is-focus' : ''), attrs: { lang: it.lang, tabindex: '-1', id: 'row-' + it.id } },
      html`<div class="it-row__check">${check}</div>
      <div class="it-row__main">
        <div class="it-row__line1">${owner_}<span class="it-row__text">${it.text}</span></div>
        <div class="it-row__line2">${evidence}${dueText}${tags}${callLink}</div>
        ${landed}
      </div>
      <div class="it-row__actions">${outcome || review}${handoffBtn}${info}</div>`);
  };

  const editRow = (it, variant) => {
    const e = L().edit[it.id] || (L().edit[it.id] = { text: it.text, owner: it.owner || 'p-you', due: it.due || '', engineering: !!it.engineering });
    const people = D.people.map((p) => ({ value: p.id, label: p.short }));
    return comp('action-item-row', { variant, state: 'editing', cls: 'it-row it-row--full it-row--editing', attrs: { lang: it.lang } },
      html`<div class="it-row__edit">
        ${P.textField({ id: 'edit-text-' + it.id, value: e.text, bind: 'local.c-items.edit.' + it.id + '.text', ariaLabel: 'Item text', cls: 'it-row__edit-text' })}
        <div class="it-row__edit-fields">
          <label class="it-field"><span>Owner</span>${P.popup(people, e.owner, { label: 'Owner', bind: 'local.c-items.edit.' + it.id + '.owner', id: 'edit-owner-' + it.id })}</label>
          <label class="it-field"><span>Due</span>${P.textField({ id: 'edit-due-' + it.id, value: e.due, bind: 'local.c-items.edit.' + it.id + '.due', ariaLabel: 'Due', cls: 'it-field__due' })}</label>
          ${P.checkbox('Engineering', e.engineering, { bind: 'local.c-items.edit.' + it.id + '.engineering', id: 'edit-eng-' + it.id })}
          <span class="np-tb__spacer"></span>
          ${P.button('Cancel', { size: 'small', variant: 'quiet', action: ['item.editCancel', { id: it.id }] })}
          ${P.button('Save', { size: 'small', variant: 'primary', action: ['item.save', { id: it.id }], kbd: '⌘↩' })}
        </div>
      </div>`);
  };

  /* ---------------- 21. Output item row ---------------- */
  C.outputItemRow = (it, o) => {
    o = o || {};
    if (!it) return '';
    const variant = o.variant || 'full';
    const kindVariant = it.kind === 'decision' ? 'decision' : it.kind === 'question' ? 'open-question' : it.kind === 'risk' ? 'risk' : 'extra';
    const flash = NP.flashed('row-' + it.id);
    const suggested = it.review === 'suggested';
    if (flash && it.review === 'rejected') {
      return comp('output-item-row', { variant: kindVariant + '-' + variant, state: 'outcome', cls: 'it-row it-row--' + variant + ' is-outcome', attrs: { lang: it.lang, id: 'row-' + it.id } },
        html`${C.inlineStatus(flash, { variant: 'row-outcome', actionLabel: 'Undo', action: ['item.undoRow', { id: it.id }] })}<span class="it-row__ghost">${it.text}</span>`);
    }
    const state = suggested ? 'suggested' : it.answered ? 'answered' : it.carried ? 'carried' : 'open';
    const speakers = it.owner ? C.personChip(it.owner, { variant: it.owner === 'p-you' ? 'you' : 'link' }) : '';
    const evidence = it.span ? C.provenanceChip({ kind: 'this-call', label: it.span, span: it.span, callId: it.callId }, { variant: 'timestamp' }) : '';
    const relation = it.reaffirms ? html`<span class="it-row__meta">reaffirms ${C.provenanceChip({ kind: 'past-call', label: it.reaffirms, callId: 'c-backend' }, { variant: 'inline' })}</span>`
      : it.parked ? html`<span class="it-row__meta">parked on ${it.parked}</span>`
      : it.kind === 'question' && variant === 'full' ? html`<span class="it-row__meta">carried to the next call with these people</span>` : '';
    const answered = it.answered ? html`<span class="it-row__meta">Answered in ${P.link(it.answered, { external: true })}</span>` : '';
    const riskStatus = it.kind === 'risk' ? P.badge(it.resolved ? 'Resolved' : 'Unresolved', { kind: 'status', tone: it.resolved ? 'success' : 'warning' }) : '';
    const review = variant === 'full' && suggested ? html`<div class="it-row__review">
        ${P.button('Accept', { size: 'small', action: ['item.accept', { id: it.id }], kbd: 'A' })}
        ${P.button('Edit', { size: 'small', variant: 'quiet', action: ['item.inspect', { id: it.id }], kbd: 'E' })}
        ${P.button('Reject', { size: 'small', variant: 'quiet', action: ['item.reject', { id: it.id }], kbd: 'R' })}</div>` : '';
    const outcome = flash ? C.inlineStatus(flash, { variant: 'row-outcome', actionLabel: 'Undo', action: ['item.undoRow', { id: it.id }] }) : '';
    const label = (KIND_LABEL[it.kind] || 'Item') + ': ';
    if (variant !== 'full') {
      return comp('output-item-row', { variant: kindVariant + '-' + variant, state, cls: 'it-row it-row--compact', attrs: { lang: it.lang, title: it.text } },
        html`<div class="it-row__line"><span class="it-row__glyph">${icon(KIND_ICON[it.kind] || 'info', { size: 13, label: KIND_LABEL[it.kind] })}</span><span class="it-row__text">${it.text}</span>${relation}${evidence}${suggested ? P.badge('Suggested', { kind: 'status', tone: 'neutral' }) : ''}${it.topic && variant !== 'read-only' ? C.topicChip(it.topic, { variant: 'name', showMerge: false }) : ''}</div>`);
    }
    return comp('output-item-row', { variant: kindVariant, state, cls: 'it-row it-row--full', attrs: { lang: it.lang, id: 'row-' + it.id, tabindex: '-1' } },
      html`<div class="it-row__check it-row__glyph">${icon(KIND_ICON[it.kind] || 'info', { size: 14, label: KIND_LABEL[it.kind] })}</div>
      <div class="it-row__main">
        <div class="it-row__line1"><span class="np-sr">${label}</span><span class="it-row__text">${it.text}</span></div>
        <div class="it-row__line2">${speakers}${evidence}${relation}${answered}${riskStatus}${suggested ? P.badge('Suggested', { kind: 'status', tone: 'neutral' }) : ''}${it.topic ? C.topicChip(it.topic, { variant: 'name', showMerge: false }) : ''}</div>
      </div>
      <div class="it-row__actions">${outcome || review}${P.iconButton('info', { label: 'Show in Item inspector', size: 'inline', action: ['item.inspect', { id: it.id }] })}</div>`);
  };

  /* ---------------- 19. Output section ----------------
     {title, count, toReview, kind:'summary'|'items'|'participants'|'agent-review'|'moments', meta, notice, body, actions, state, key, rejected:[items], badge, lang} */
  C.outputSection = (o) => {
    o = o || {};
    const kind = o.kind || 'items';
    const variant = { summary: 'summary', items: 'item-section', participants: 'per-participant', 'agent-review': 'agent-review', moments: 'marked-moments' }[kind] || kind;
    const state = o.state || 'ready';
    const head = html`<header class="pc-sec__head">
      <h2 class="pc-sec__title">${o.badge || ''}${o.hideTitle ? html`<span class="np-sr">${o.title}</span>` : o.title}${o.count != null ? html`<span class="pc-sec__count"> · ${o.count}</span>` : ''}${o.toReview ? html`<span class="pc-sec__count"> · ${o.toReview} to review</span>` : ''}${o.edited ? P.badge('Edited', { kind: 'status', tone: 'neutral' }) : ''}</h2>
      <div class="pc-sec__actions">${o.actions || ''}</div>
    </header>`;
    const meta = o.meta ? html`<div class="pc-sec__meta">${o.meta}</div>` : '';
    const notice = o.notice ? html`<div class="pc-sec__notice">${o.notice}</div>` : '';
    let body = o.body;
    if (state === 'writing') {
      body = html`<div class="pc-skel" aria-busy="true"><div class="pc-skel__line" style="width:92%"></div><div class="pc-skel__line" style="width:84%"></div><div class="pc-skel__line" style="width:60%"></div></div>`;
    }
    const rej = (o.rejected || []);
    const rejKey = 'rej-' + (o.key || o.title);
    const rejOpen = L().rejectedOpen[rejKey];
    const rejected = rej.length ? html`<div class="pc-sec__rejected">${P.disclosure('Rejected (' + rej.length + ')', rejOpen, { variant: 'row', action: ['item.toggleRejected', { key: rejKey }] })}
      ${rejOpen ? html`<ul class="pc-sec__rejlist">${rej.map((it) => html`<li lang="${it.lang}"><span class="it-row__ghost is-rej">${it.text}</span>${P.button('Restore', { size: 'small', action: ['item.restore', { id: it.id }] })}</li>`)}</ul>` : ''}</div>` : '';
    return comp('output-section', { variant, state, tag: 'section', cls: 'pc-sec pc-sec--' + kind, attrs: { 'aria-label': o.title, lang: o.lang } },
      html`${head}${meta}${notice}<div class="pc-sec__body">${body || ''}</div>${rejected}`);
  };

  /* ---------------- 23. Share menu ----------------
     {variant:'toolbar'|'section'|'inspector'|'row'|'list', scope, key, unreviewed, sensitive, nothing} */
  C.shareMenu = (o) => {
    o = o || {};
    const variant = o.variant || 'toolbar';
    const anchor = 'share-' + (o.key || variant);
    const disabled = !!o.nothing;
    const fk = 'share-' + (o.key || variant);
    const items = [
      { header: o.scope || 'Whole call' },
      o.nothing ? { header: 'Nothing to share yet: outputs are being written' } : null,
      o.unreviewed ? { header: `Includes ${o.unreviewed} suggested item${o.unreviewed === 1 ? '' : 's'} not reviewed yet` } : null,
      o.sensitive ? { header: 'Sensitive call · copying puts the text on your clipboard' } : null,
      variant === 'list' ? null : { label: 'Copy for Slack', kbd: '⌘⇧C', disabled, action: ['share.copy', { fk, text: o.sensitive ? 'Copied' : 'Copied for Slack' }] },
      variant === 'list' ? null : { label: 'Copy for Jira', kbd: '⌥⌘C', disabled, action: ['share.copy', { fk, text: o.sensitive ? 'Copied' : 'Copied for Jira' }] },
      variant === 'list' ? null : { label: 'Copy as Markdown', kbd: '⌥⇧⌘C', disabled, action: ['share.copy', { fk, text: 'Copied as Markdown' }] },
      variant === 'list' ? null : { divider: true },
      { label: 'Export…', kbd: '⌘E', action: ['dlg.export', { scope: o.scope || 'Whole call', fk }] },
    ].filter(Boolean);
    NP._menus[anchor] = items;
    const open = NP.state.menu && NP.state.menu.anchor === anchor;
    const flash = NP.flashed(fk);
    const exported = NP.flashed(fk + '-export');
    if (variant === 'toolbar') {
      return comp('share-menu', { variant, state: exported || flash ? 'done' : open ? 'open' : 'default', tag: 'span', cls: 'pc-share' },
        html`${P.button('Share', { icon: 'export', chevron: true, flashKey: fk, action: ['proto.menu', { anchor }], anchor, expanded: open, attrs: { 'data-primitive': 'pull-down-button', 'aria-haspopup': 'menu', 'data-variant': 'toolbar' } })}${exported ? C.inlineStatus(exported, { variant: 'trailing', actionLabel: 'Show in Finder', action: ['proto.flash', { key: fk, text: 'Opened Finder' }] }) : ''}`);
    }
    return comp('share-menu', { variant, state: flash ? 'done' : open ? 'open' : 'default', tag: 'span', cls: 'pc-share' },
      html`${flash ? C.inlineStatus(flash, { variant: 'on-label' }) : ''}${P.iconButton('export', { label: variant === 'section' ? 'Share ' + (o.scope || '') : 'Share', size: 'inline', action: ['proto.menu', { anchor }], anchor, attrs: { 'data-primitive': 'pull-down-button', 'aria-haspopup': 'menu' } })}`);
  };
  NP.on('share.copy', (a) => {
    try { navigator.clipboard && navigator.clipboard.writeText('Noter prototype: sample outputs of “Planning: VHI 8.0 drawer redesign”').catch(() => {}); } catch (e) { /* */ }
    NP.flash(a.fk, a.text, 2000);
  });

  /* ---------------- 26. Version switcher ----------------
     {versions:[{id,label}], current, key, variant:'section'|'caption'} */
  C.versionSwitcher = (o) => {
    o = o || {};
    const versions = o.versions || [];
    if (versions.length < 2) return '';
    const variant = o.variant || 'section';
    const opts = versions.map((v) => ({ value: v.id, label: variant === 'caption' ? (v.short || v.label) : v.label })).concat([{ value: '__compare', label: 'Compare…' }]);
    return comp('version-switcher', { variant, state: o.current === 'edit' ? 'edited-current' : 'several-versions', tag: 'span', cls: 'pc-ver' },
      P.popup(opts, o.current, { variant: 'inline', label: 'Version', id: 'ver-' + (o.key || 'x'), action: ['ver.pick', { key: o.key }] }));
  };
  NP.on('ver.pick', (a) => {
    const l = L();
    l.versions = l.versions || {};
    if (a.value === '__compare') { l.compare = l.compare || {}; l.compare[a.key] = !l.compare[a.key]; return; }
    l.versions[a.key] = a.value;
  });
  C.versionOf = (key, dflt) => ((L().versions || {})[key] || dflt);
  C.compareOn = (key) => !!((L().compare || {})[key]);

  /* ---------------- 27. Diff view ----------------
     {before, after, variant:'inline'|'side-by-side'|'transcript-marks', title} */
  const diffWords = (a, b) => {
    const A = String(a || '').split(/(\s+)/), B = String(b || '').split(/(\s+)/);
    const n = A.length, m = B.length;
    const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const out = []; let i = 0, j = 0;
    while (i < n && j < m) {
      if (A[i] === B[j]) { out.push({ t: 'eq', s: A[i] }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push({ t: 'del', s: A[i] }); i++; }
      else { out.push({ t: 'ins', s: B[j] }); j++; }
    }
    while (i < n) out.push({ t: 'del', s: A[i++] });
    while (j < m) out.push({ t: 'ins', s: B[j++] });
    return out;
  };
  C.diffView = (o) => {
    o = o || {};
    const variant = o.variant || 'inline';
    const parts = diffWords(o.before, o.after);
    const changed = parts.filter((p) => p.t !== 'eq' && p.s.trim()).length;
    const head = html`<div class="pc-diff__head">${icon('history', { size: 12 })}${changed ? plural(changed, 'word') + ' changed' : 'No differences'}${o.title ? html` · <span class="np-dim">${o.title}</span>` : ''}</div>`;
    const seg = (p) => (p.t === 'eq' ? p.s : p.t === 'ins' ? html`<ins class="np-ins">${p.s}</ins>` : html`<del class="np-del">${p.s}</del>`);
    if (variant === 'side-by-side') {
      return comp('diff-view', { variant, state: changed ? 'changes' : 'no-changes', cls: 'pc-diff pc-diff--side', attrs: { lang: o.lang } },
        html`${head}<div class="pc-diff__cols"><div><div class="pc-diff__colh">Before</div><p>${parts.filter((p) => p.t !== 'ins').map(seg)}</p></div><div><div class="pc-diff__colh">After</div><p>${parts.filter((p) => p.t !== 'del').map(seg)}</p></div></div>`);
    }
    return comp('diff-view', { variant, state: changed ? 'changes' : 'no-changes', cls: 'pc-diff' + (o.mono ? ' np-mono' : ''), attrs: { lang: o.lang } }, html`${head}<p class="pc-diff__text">${parts.map(seg)}</p>`);
  };

  /* ---------------- 25. Prompt editor ----------------
     {value, variant:'editable'|'read-only', key, caption, edited, diffWith, bind} */
  C.promptEditor = (o) => {
    o = o || {};
    const variant = o.variant || 'editable';
    const key = o.key || 'prompt';
    const diffOn = !!((L().promptDiff || {})[key]);
    const state = o.state || (diffOn ? 'diff-mode' : o.edited ? 'edited' : variant === 'read-only' ? 'read-only' : 'editing');
    const head = html`<div class="pc-prompt__head"><span class="np-mono pc-prompt__cap">${o.caption || 'prompt.md'}</span>${o.edited ? P.badge('Edited', { kind: 'status', tone: 'neutral' }) : ''}${o.versionSwitcher || ''}<span class="np-tb__spacer"></span>${o.diffWith != null ? P.button(diffOn ? 'Hide Diff' : 'Diff', { size: 'small', variant: 'quiet', action: ['prompt.diff', { key }], attrs: { 'aria-pressed': String(diffOn) } }) : ''}</div>`;
    let body;
    if (state === 'generating') body = html`<div class="pc-skel pc-prompt__area"><div class="pc-skel__line" style="width:70%"></div><div class="pc-skel__line" style="width:88%"></div><div class="pc-skel__line" style="width:52%"></div></div>`;
    else if (diffOn) body = html`<div class="pc-prompt__area is-diff"><div class="pc-prompt__diffnote">Showing changes</div>${C.diffView({ before: o.diffWith, after: o.value, mono: true })}</div>`;
    else if (variant === 'read-only') body = html`<pre class="np-mono pc-prompt__area is-ro" tabindex="0">${o.value}</pre>`;
    else body = html`<textarea class="np-mono pc-prompt__area" spellcheck="false" id="${'prompt-' + key}" aria-label="Prompt"${attrs({ 'data-proto-bind': o.bind, 'data-proto-live': o.live ? true : null, 'data-component': P.PRIM, 'data-primitive': 'text-field', 'data-variant': 'multi' })}>${o.value}</textarea>`;
    return comp('prompt-editor', { variant, state, cls: 'pc-prompt' }, html`${head}${body}`);
  };
  NP.on('prompt.diff', (a) => { const l = L(); l.promptDiff = l.promptDiff || {}; l.promptDiff[a.key] = !l.promptDiff[a.key]; });

  /* ---------------- 39. Change row ---------------- */
  const ACTOR_LABEL = (c) => (c.actor === 'You' ? 'you' : /job/i.test(c.actor) ? 'job: ' + c.actor.replace(/ job$/i, '').toLowerCase() : c.actor === 'Noter' ? 'model: Claude Code' : c.actor);
  C.changeRow = (c, o) => {
    o = o || {};
    const l = L();
    l.undone = l.undone || {}; l.expanded = l.expanded || {}; l.diffOpen = l.diffOpen || {};
    const undone = l.undone[c.id];
    const isBatch = !!c.batch;
    const isModel = c.kind === 'outputs' || c.kind === 'model';
    const failed = c.kind === 'failed';
    const variant = o.variant || (undone ? 'undone' : failed ? 'failed-run' : isBatch ? 'batch' : isModel ? 'model-run' : 'single');
    const open = l.expanded[c.id];
    const diffOpen = l.diffOpen[c.id];
    const busy = NP.flashed('undoing-' + c.id);
    return comp('change-row', { variant, state: busy ? 'undoing' : undone ? 'undone' : open ? 'expanded' : isBatch ? 'collapsed' : 'default', tag: 'li', cls: 'pc-chg' + (undone ? ' is-undone' : '') },
      html`<span class="pc-chg__time np-tnum">${c.at}</span>
      <div class="pc-chg__main">
        <div class="pc-chg__line"><span class="pc-chg__actor">${ACTOR_LABEL(c)}</span>${failed ? icon('error', { size: 12, cls: 'pc-chg__err' }) : ''}<span class="pc-chg__what">${c.what}</span>${isBatch ? P.badge('batch · ' + c.batch, { kind: 'kind', tone: 'neutral' }) : ''}</div>
        ${c.target ? html`<div class="pc-chg__meta">${c.target}${isModel ? ' · skill summary.md v3 · $0.31' : ''}</div>` : ''}
        ${undone ? html`<div class="pc-chg__meta">Undone by you at 10:53 · ${P.link('Redo', { action: ['chg.redo', { id: c.id }] })}</div>` : ''}
        ${diffOpen && c.before ? C.diffView({ before: c.before, after: c.after }) : ''}
        ${isBatch ? html`<div>${P.disclosure(open ? 'Hide changes' : 'Show ' + Math.min(50, c.batch) + ' changes', open, { variant: 'row', action: ['chg.toggle', { id: c.id }] })}</div>` : ''}
        ${isBatch && open ? html`<ul class="pc-chg__recs">${[['Planning: VHI 8.0 drawer redesign', '00:21:12', 'шаман', 'shaman'], ['Backend sync', '00:12:40', 'Shaman', 'shaman'], ['Backend sync', '00:31:02', 'шамана', 'shaman'], ['Cross-team QA sync', '00:05:51', 'sha man', 'shaman']].map((r) => html`<li><span class="np-dim np-tnum">${r[1]}</span> ${r[0]} · ${C.diffView({ before: r[2], after: r[3] })}</li>`)}${c.batch > 4 ? html`<li>${P.button('Show 50 More', { size: 'small', variant: 'quiet', action: ['proto.flash', { key: 'proto', text: 'Prototype shows the first rows only' }] })}</li>` : ''}</ul>` : ''}
      </div>
      <div class="pc-chg__actions">
        ${c.before ? P.button('Diff', { size: 'small', variant: 'quiet', action: ['chg.diff', { id: c.id }] }) : ''}
        ${undone ? P.button('Redo', { size: 'small', action: ['chg.redo', { id: c.id }] }) : P.button('Undo', { size: 'small', action: ['chg.undo', { id: c.id }], loading: !!busy })}
        ${c.open ? P.button('Open', { size: 'small', variant: 'quiet', action: c.open }) : ''}
      </div>`);
  };
  NP.onMany({
    'chg.toggle': (a) => { const l = L(); l.expanded[a.id] = !l.expanded[a.id]; },
    'chg.diff': (a) => { const l = L(); l.diffOpen[a.id] = !l.diffOpen[a.id]; },
    'chg.undo': (a) => {
      const l = L(); const c = D.changes.concat(NP.data.callChanges || []).find((x) => x.id === a.id);
      if (c && c.batch) { NP.flash('undoing-' + a.id, 'Undoing', 700); setTimeout(() => { l.undone[a.id] = true; NP.undo('Undone ' + plural(c.batch, 'change'), { context: c.what, label: 'Redo', where: 'any', action: 'chg.redo', args: { id: a.id } }); NP.render(); }, 700); return; }
      l.undone[a.id] = true;
      NP.undo('Undone: ' + (c ? c.what : 'change'), { label: 'Redo', where: 'any', action: 'chg.redo', args: { id: a.id } });
    },
    'chg.redo': (a) => { const l = L(); l.undone[a.id] = false; },
  });

  /* ---------------- 40. History timeline ----------------
     {entries, variant:'call'|'person'|'item', key, state:'ready'|'empty'|'loading'|'error', callTitle} */
  C.historyTimeline = (o) => {
    o = o || {};
    const variant = o.variant || 'call';
    const key = 'hist-' + (o.key || variant);
    const f = (L().histFilter = L().histFilter || {})[key] || 'all';
    const job = ((L().histJob = L().histJob || {})[key]) || 'all';
    let entries = o.entries || [];
    const isJob = (c) => /job/i.test(c.actor);
    const isModel = (c) => c.actor === 'Noter' || c.kind === 'outputs' || c.kind === 'model';

    const list = empty ? (kind === 'action' ? (l.added || []).map(D.item).filter(Boolean) : []) : all.filter((i) => i.review !== 'rejected' || NP.flashed('row-' + i.id));

    const toReview = list.filter((i) => i.review === 'suggested').length;
    const key = 'sec-' + kind;
    const writing = step < idx;
    let body;
    if (failed) {
      body = C.inlineBanner({ severity: 'error', text: 'Couldn’t write the action items (Claude Code timed out)', actions: [{ label: 'Try Again', action: ['pc.retry', { how: 'retry' }], loading: !!NP.flashed('retrying') }, { label: 'Use Local Model', action: ['pc.retry', { how: 'local' }] }] });
    } else if (!list.length) {
      const emptyText = { decision: 'No decisions in this call', action: 'No action items in this call', question: 'No open questions in this call', risk: 'No risks in this call' }[kind];
      body = html`${C.emptyState({ variant: 'section', title: emptyText })}${kind === 'action' ? (l.adding ? html`<div class="pc-add">${P.textField({ id: 'add-item', placeholder: 'What needs doing, and who does it?', bind: 'local.call-page.addText', enter: 'pc.addItem', ariaLabel: 'New action item' })}${P.button('Add', { size: 'small', variant: 'primary', action: ['pc.addItem', { callId: call.id }] })}</div>` : P.button('Add Action Item', { size: 'small', icon: 'plus', action: ['pc.addStart'] })) : ''}`;
    } else {
      body = html`<div class="pc-rows">${list.map((it) => (kind === 'action' ? C.actionItemRow(it, { variant: 'full', key: 'pc' }) : C.outputItemRow(it, { variant: 'full' })))}</div>`;
    }
    let notice = '';
    if (ctx.demo === 'regenerated' && kind === 'action') notice = '1 item not suggested again because you rejected it';
    if (failed === false && l.retried === 'local' && kind === 'action' && ctx.demo === 'section-failed') notice = 'Written by the local model after Claude Code timed out';
    const actions = writing || failed ? '' : html`
      ${toReview ? P.button('Accept All', { size: 'small', kbd: '⇧A', action: ['item.acceptMany', { ids: list.filter((i) => i.review === 'suggested').map((i) => i.id), message: 'Accepted ' + plural(toReview, kind === 'action' ? 'action item' : kind === 'decision' ? 'decision' : kind === 'question' ? 'open question' : 'risk'), where: 'call-page' }] }) : ''}
      ${C.shareMenu({ variant: 'section', scope: title, key: key, unreviewed: toReview || null, sensitive: isSensitive(call, ctx) })}`;
    return C.outputSection({ kind: 'items', title, count: writing || failed ? null : empty ? 0 : list.length, toReview: writing || failed ? null : toReview || null, key, rejected, state: writing ? 'writing' : failed ? 'failed' : !list.length ? 'empty' : toReview ? 'review-pending' : 'ready', meta: writing ? html`${P.progress({ value: null, label: 'Writing ' + title })} Waiting for the summary` : '', notice, actions, body });
  };

  const participantsSection = (call, ctx) => {
    const l = L(); l.pp = l.pp || {};
    const said = { 'p-anna': ['Committed to the drawer redesign spec by Friday', 'Offered to own the reconnect criteria during crosstalk'], 'p-pavel': ['Asked who writes the reconnect acceptance criteria', 'Pushed back on changing the drawer width'], 'p-dmitri': ['Committed to a replay buffer, VSTOR-9912', 'Restated the 2 Oct decision on the notification service'], 'p-you': ['Committed to hand off the table virtualisation today'] };
    const body = html`<div class="pc-pp">${call.people.map((p) => {
      const open = !!l.pp[p];
      return html`<div class="pc-pp__p">${P.disclosure(D.person(p).short, open, { variant: 'row', action: ['pc.pp', { p }] })}${open ? html`<ul class="pc-pp__list">${(said[p] || ['Spoke briefly; nothing assigned']).map((s) => html`<li>${s}</li>`)}</ul>` : ''}</div>`;
    })}</div>`;
    return C.outputSection({ kind: 'participants', title: 'Per participant', body, key: 'pp' });
  };

  const momentsSection = (call) => C.outputSection({ kind: 'moments', title: 'Marked moments', count: 1, key: 'mm', body: html`<div class="pc-mark">${icon('flag', { size: 13 })}${C.provenanceChip({ kind: 'this-call', label: '00:21:00', span: '00:21:00', callId: call.id }, { variant: 'timestamp' })}<span>Marked during the call, while Speaker 2 spoke about the reconnect</span></div>` });

  const summaryView = (call, ctx) => {
    const l = L();
    return html`
      ${C.undoStrip({ where: 'call-page' })}
      ${call.unnamed && call.unnamed.length || D.unnamedSpeakers[call.id] ? C.speakerNamingPanel({ callId: call.id, audioGone: ctx.demo === 'audio-gone' }) : ''}
      ${region('PC-R3', { cls: 'pc-col', label: 'Outputs' }, html`
        ${summarySection(call, ctx)}
        ${itemSection(call, ctx, 'decision', 'Decisions', 2)}
        ${itemSection(call, ctx, 'action', 'Action items', 3)}
        ${itemSection(call, ctx, 'question', 'Open questions', 4)}
        ${itemsOf(call, 'risk').length ? itemSection(call, ctx, 'risk', 'Risks', 5) : ''}
        ${writingStep(ctx) >= 5 ? participantsSection(call, ctx) : ''}
        ${writingStep(ctx) >= 5 ? momentsSection(call) : ''}
      `)}`;
  };

  const transcriptView = (call, ctx) => {
    const l = L();
    const audioGone = ctx.demo === 'audio-gone';
    const segs = D.segments.filter((s) => !s.hypothesis);
    const loading = ctx.demo === 'transcript-loading';
    return region('PC-R5', { cls: 'pc-tr', label: 'Transcript' }, html`
      ${C.speakerNamingPanel({ callId: call.id, audioGone })}
      <div class="pc-tr__head">
        <span class="t-headline">Transcript</span>${call.languages.map((c) => C.languageTag(c, { variant: 'call' }))}
        <span class="np-dim">${audioGone ? 'Audio deleted on 15 Nov (kept 30 days) · transcript kept' : call.length + ' · audio kept until 15 Nov'}</span>
        <span class="np-tb__spacer"></span>
        ${audioGone ? '' : P.button(l.playing ? 'Stop' : 'Play from Start', { size: 'small', icon: l.playing ? 'stop' : 'play', action: ['pc.play'] })}
        ${P.button(l.archive ? 'Hide Archive Changes' : 'Show Archive Changes', { size: 'small', variant: 'quiet', action: ['pc.archive'] })}
      </div>
      ${l.archive ? C.diffView({ variant: 'transcript-marks', before: 'Websocket уведомления идут через нотификейшн сервис, как решили второго октября. Fast, ja.', after: 'Websocket уведомления идут через notification service, как решили второго октября. Fast, ja, der Kanal ist da.', title: 'archive pass, 41 words and 2 speaker labels in the whole call', lang: 'ru' }) : ''}
      ${loading ? html`<div class="pc-skel">${[1, 2, 3, 4, 5].map(() => raw('<div class="pc-skel__line" style="width:94%"></div>'))}</div>`
        : NP.c('transcriptView', { callId: call.id, segments: segs, variant: 'post-call', key: 'pc', highlightSpan: ctx.params.span, audioGone })}
      ${l.playing && !audioGone ? region('PC-R6', { cls: 'pc-play', label: 'Playback' }, NP.c('playbackBar', { variant: 'post-call', callId: call.id, at: ctx.params.span || '00:19:40' })) : ''}`);
  };

  const reviewsView = (call, ctx) => {
    const l = L(); l.thumbs = l.thumbs || {};
    const agents = D.agents.filter((a) => a.enabled);
    const step = writingStep(ctx);
    return region('PC-R7', { cls: 'pc-col', label: 'Agent reviews' }, html`
      ${agents.map((a, i) => {
        const t = l.thumbs[a.id];
        const writing = step < 6 || (ctx.demo === 'local-model' && i > 1);
        return C.outputSection({
          kind: 'agent-review', title: a.name + ' review', hideTitle: true, key: 'ar-' + a.id, badge: C.agentBadge(a.name, { variant: 'static' }),
          state: writing ? 'writing' : 'ready',
          meta: writing ? 'Role reviews follow in the background' : `${a.runtime} · ${a.model} · skill ${a.skill} v2 · 10:51`,
          actions: writing ? '' : html`${C.versionSwitcher({ versions: [{ id: 'v1', label: 'v1 · 10:51' }, { id: 'v2', label: 'v2 · 11:02' }], current: C.versionOf('ar-' + a.id, 'v2'), key: 'ar-' + a.id })}${P.iconButton('thumbUp', { label: 'Useful', size: 'inline', pressed: t === 'up', action: ['pc.thumb', { id: a.id, v: 'up' }] })}${P.iconButton('thumbDown', { label: 'Not useful', size: 'inline', pressed: t === 'down', action: ['pc.thumb', { id: a.id, v: 'down' }] })}`,
          body: html`<p class="pc-prose" lang="en">${AGENT_REVIEWS[a.name] || 'No concerns from this role in this call.'}</p>`,
        });
      })}
      ${C.outputSection({ kind: 'items', title: 'Cards from this call', count: D.cards.length + D.earlierCards.length, key: 'cards', body: html`<div class="pc-cards">${D.cards.concat(D.earlierCards).map((k, i) => html`<div class="pc-cards__c">${NP.c('copilotCard', Object.assign({ outcome: k.outcome || ['Pinned', 'Dismissed', 'Expired'][i % 3] }, k), { variant: 'read-only', key: 'pc' })}<span class="pc-cards__out">${k.outcome || ['Pinned', 'Dismissed', 'Expired'][i % 3]}</span></div>`)}</div>` })}`);
  };

  const historyView = (call, ctx) => region('PC-R8', { cls: 'pc-col', label: 'History' },
    C.historyTimeline({ variant: 'call', key: 'call-' + call.id, callTitle: call.title, entries: ctx.demo === 'history-empty' ? [] : D.callChanges.filter((c) => c.callId === call.id || call.id === 'c-live') }));

  /* ---------- screen ---------- */
  const VIEWS = [{ value: 'summary', label: 'Summary' }, { value: 'transcript', label: 'Transcript' }, { value: 'reviews', label: 'Agent Reviews' }, { value: 'history', label: 'History' }];
  const viewOf = (ctx) => (ctx.params && ctx.params.view) || 'summary';

  NP.screen('call-page', {

    toolbarCenter: (ctx) => P.segmented(VIEWS, viewOf(ctx), { variant: 'view', label: 'Call page view', action: ['pc.view'] }),
    toolbarActions: (ctx) => {

      const insOpen = !!NP.state.inspector || !ctx.local.hideInspector;
      const more = [
        { label: 'Rename…', action: ['proto.flash', { key: 'proto', text: 'Rename edits the title in place' }] },

        { label: isSensitive(call, ctx) ? 'Sensitive' : 'Mark as Sensitive', checked: !!isSensitive(call, ctx), action: ['pc.sensitive', { callId: call.id }] },

        { label: 'Show in Finder', action: ['proto.flash', { key: 'proto', text: 'Opens the call folder in Finder' }] },

        { label: 'Delete Call…', destructive: true, kbd: '⌘⌫', action: ['dlg.deleteCall', { callId: call.id }] },
