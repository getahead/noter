# algo, state and dod IDs have to_code = true, so the code that implements them carries markers.
# Traceability is FULL for every artifact (owner, 17 Oct 2026): `cfs validate` checks
# that each @cpt-* marker in the code below names an ID these artifacts define.
# DESIGN and ADR IDs have to_code = false, so markers are not required yet; FEATURE
# IDs (to_code = true) will require them. `just trace` (scripts/harness/trace_gate.py)
# reports how many design elements have a marker and fails if that ever goes down.
